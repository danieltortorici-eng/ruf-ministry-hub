name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.17.0
          package-manager-cache: false

      - name: Run full test and boundary suite
        shell: bash
        run: |
          mkdir -p artifacts/ci
          set -o pipefail
          npm test 2>&1 | tee artifacts/ci/npm-test.log

      - name: Run convergence preflight regression
        shell: bash
        run: node tests/convergence-preflight-regression.js

      - name: Retain failure log
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/ci/npm-test.log
          if-no-files-found: warn
          retention-days: 7
