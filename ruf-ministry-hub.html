          detail: "Typed drafts are not currently being saved while you work.",
          reason: "Phone interruptions are common. Autosave protects half-written notes and processing forms.",
          primaryLabel: "Turn On Autosave"
        });
      }

      if (!settings.localEncryptionEnabled && (sensitiveCount > 0 || totalRecords > 12)) {
        addCoachSuggestion(suggestions, {
          id: "enable-vault",
          kind: "Privacy",
          title: "Set up Device Vault",
          detail: sensitiveCount ? `${sensitiveCount} sensitive item${sensitiveCount === 1 ? "" : "s"} found.` : "You have enough local ministry history that encryption is worth considering.",
          reason: "The vault adds app-level encryption for data saved on this device.",
          primaryLabel: "Set Up Vault"
        });
      }

      if (sensitiveCount > 0 && (!settings.maskSensitivePreviews || settings.includeSensitiveInSearch)) {
        addCoachSuggestion(suggestions, {
          id: "tighten-sensitive-privacy",
          kind: "Privacy",
          title: "Tighten sensitive item privacy",
          detail: "Sensitive previews or sensitive search results are currently more visible.",
          reason: "Masking sensitive previews keeps shoulder-glance moments safer on a phone.",
          primaryLabel: "Tighten Privacy"
        });
      }

      if (openItems.length >= thresholds.openGrabs || promptItems.length >= thresholds.promptItems) {
        addCoachSuggestion(suggestions, {
          id: "gentle-review-flow",
          kind: "Focus",
          title: "Switch cleanup into a one-card review flow",
          detail: `${openItems.length} open Quick Grab${openItems.length === 1 ? "" : "s"} and ${promptItems.length} asking for attention.`,
          reason: "A single-card queue is easier to use on an iPhone when the backlog gets noisy.",
          primaryLabel: "Make Review Gentler"
        });
      }

      if (answeredPrayer.length >= thresholds.answeredPrayer && settings.autoArchiveAnsweredDays === "never") {
        addCoachSuggestion(suggestions, {
          id: "auto-archive-answered",
          kind: "Prayer",
          title: "Auto-archive answered prayer after 30 days",
          detail: `${answeredPrayer.length} answered prayer request${answeredPrayer.length === 1 ? "" : "s"} are still outside the archive.`,
          reason: "This keeps answered prayer visible for a little while, then clears the active lists automatically.",
          primaryLabel: "Use 30-Day Archive"
        });
      }

      if (duplicatePairs.length >= thresholds.duplicates) {
        addCoachSuggestion(suggestions, {
          id: "review-duplicates",
          kind: "People",
          title: "Review possible duplicate people",
          detail: `${duplicatePairs.length} possible duplicate pair${duplicatePairs.length === 1 ? "" : "s"} found.`,
          reason: "Merging duplicates keeps notes, prayers, and follow-ups attached to one clear profile.",
          primaryLabel: "Review Duplicates"
        });
      }

      if (dueTasks.length >= thresholds.dueTasks && settings.launchScreen !== "today") {
        addCoachSuggestion(suggestions, {
          id: "launch-today",
          kind: "Focus",
          title: "Open to Today when follow-ups are stacking up",
          detail: `${dueTasks.length} follow-up task${dueTasks.length === 1 ? "" : "s"} are due soon.`,
          reason: "Today is the best first screen when you need the app to tell you what matters next.",
          primaryLabel: "Open To Today"
        });
      }

      if (settings.pinnedPersonIds.length < 2 && pinCandidates.length) {
        addCoachSuggestion(suggestions, {
          id: "pin-care-people",
          kind: "People",
          title: "Pin a few important people",
          detail: pinCandidates.map(person => person.name).join(", "),
          reason: "Pinned people stay one tap away on Today, which is better for phone use than searching every time.",
          primaryLabel: "Pin These People"
        });
      }

      if (!settings.notificationsEnabled && typeof Notification !== "undefined" && (dueTasks.length || promptItems.length || prayerFollowUps.length)) {
        addCoachSuggestion(suggestions, {
          id: "enable-reminders",
          kind: "Reminders",
          title: "Allow one gentle reminder",
          detail: "Notifications are off while there are items waiting.",
          reason: "A generic reminder can bring you back without showing sensitive details on the lock screen.",
          primaryLabel: "Allow Reminders"
        });
      }

      return suggestions.slice(0, 10);
    }

    function renderAppCoachNudge() {
      if (!settings.appCoachEnabled || !settings.appCoachShowOnToday) return "";
      const suggestion = appCoachSuggestions()[0];
      if (!suggestion) return "";
      return `
        <section class="section">
          <div class="notice secure">
            <div class="row wrap">
              <div>
                <strong>App Coach suggestion</strong>
                <div class="meta">${escapeHtml(suggestion.title)} - ${escapeHtml(suggestion.reason)}</div>
              </div>
              <button class="button small primary" data-action="nav" data-screen="coach">Review</button>
              <button class="button small" data-action="coach-dismiss" data-suggestion="${escapeHtml(suggestion.id)}">Hide</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderCoachSuggestionCard(suggestion) {
      return `
        <article class="item">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(suggestion.title)}</div>
              <div class="meta">${escapeHtml(suggestion.detail)}</div>
            </div>
            <span class="pill green">${escapeHtml(suggestion.kind)}</span>
          </div>
          <p class="item-preview">${escapeHtml(suggestion.reason)}</p>
          <div class="action-row">
            <button class="button primary" data-action="coach-apply" data-suggestion="${escapeHtml(suggestion.id)}">${escapeHtml(suggestion.primaryLabel)}</button>
            <button class="button" data-action="coach-dismiss" data-suggestion="${escapeHtml(suggestion.id)}">Dismiss for now</button>
          </div>
        </article>
      `;
    }

    function renderAppCoach() {
      const suggestions = appCoachSuggestions();
      const dismissedCount = Object.keys(settings.appCoachDismissed || {}).length;
      return `
        ${renderTopbar("App Coach", "Local suggestions that help the hub tune itself without changing anything until you approve.", false)}
        <section class="section">
          <div class="surface">
            <div class="action-row">
              <button class="button" data-action="nav" data-screen="settings">Back to Settings</button>
              <button class="button" data-action="coach-refresh">Refresh Audit</button>
              ${dismissedCount ? `<button class="button" data-action="coach-clear-dismissed">Show Hidden Suggestions</button>` : ""}
            </div>
          </div>
        </section>
        <section class="section">
          <div class="surface quick-box">
            <div>
              <h2 class="section-title">How It Works</h2>
              <p class="page-kicker">The coach checks local patterns like stale Quick Grabs, backups, privacy settings, duplicate people, answered prayer, and iPhone readiness. It does not send ministry data anywhere.</p>
            </div>
            <div class="settings-list">
              ${settingToggle("appCoachEnabled", "App Coach Suggestions", "Let the app look for helpful local improvements.")}
              ${settingToggle("appCoachShowOnToday", "Show One Suggestion On Today", "Show the highest-value coach suggestion on the Today screen.")}
              ${settingSelect("appCoachSensitivity", "Suggestion Style", [["gentle", "Gentle"], ["balanced", "Balanced"], ["proactive", "Proactive"]], "Choose how quickly the coach points out optimization ideas.")}
            </div>
          </div>
        </section>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Suggested Adjustments</h2>
          </div>
          ${suggestions.length ? suggestions.map(renderCoachSuggestionCard).join("") : emptyState(settings.appCoachEnabled ? "No helpful adjustments are waiting right now." : "App Coach is turned off.")}
        </section>
      `;
    }

    function renderQuickGrab() {
      const recent = db.quickGrabs.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 8);
      const promptItems = promptQuickGrabs();
      return `
        ${renderTopbar("Quick Grab", "Grab it and keep moving. Sort it when you have a little more room.", false)}
        <div class="grid two">
          <section class="section">
            <div class="surface quick-box">
              <div class="field">
                <label for="quick-text">Quick Grab</label>
                <textarea class="textarea" id="quick-text" placeholder="Dump it here...">${escapeHtml(view.quickGrabDraftText || "")}</textarea>
              </div>
              <div class="field">
                <label>Quick buttons</label>
                <div class="chip-row" id="quick-tags">
                  ${["People", "Prayer", "Donors", "Teaching", "Events", "Admin", "Personal"].map(tag => `<button class="chip" data-tag="${tag}">${tag}</button>`).join("")}
                </div>
              </div>
              <div class="field">
                <label>Urgency</label>
                <div class="chip-row" id="urgency-tags">
                  ${["Today", "Soon", "Important"].map(tag => `<button class="chip urgent" data-urgency="${tag}">${tag}</button>`).join("")}
                </div>
              </div>
              <div class="action-row">
                <button class="button primary full" data-action="grab-create">Grab It</button>
                ${settings.enableVoiceCapture ? `<button class="button full" data-action="voice-capture">Dictate</button>` : ""}
              </div>
            </div>
          </section>
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Prompt Me</h2>
              <div class="action-row">
                <span class="pill green">${promptItems.length} ready</span>
                <button class="button small" data-action="nav" data-screen="review">Review Queue</button>
              </div>
            </div>
            ${promptItems.length ? promptItems.map(renderQuickGrabCard).join("") : emptyState("You're clear for now. Grab something when it pops into your head.")}
          </section>
        </div>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Recent Grabs</h2>
          </div>
          ${recent.length ? recent.map(renderQuickGrabCard).join("") : emptyState("No Quick Grabs yet.")}
        </section>
      `;
    }

    function renderReviewQueue() {
      const batchSize = Number(settings.reviewBatchSize || 3);
      const items = promptQuickGrabs().slice(0, batchSize);
      if (!items.length) {
        return `
          ${renderTopbar("Quick Review", "One loose reminder at a time, with no pile staring back at you.")}
          <section class="section">
            ${emptyState("Nothing needs review right now. Quick Grab is ready when a thought pops up.")}
          </section>
        `;
      }
      const index = Math.min(Math.max(view.reviewIndex || 0, 0), items.length - 1);
      const grab = items[index];
      return `
        ${renderTopbar("Quick Review", "One loose reminder at a time, with no pile staring back at you.")}
        <section class="section">
          <div class="surface review-card">
            <div class="review-progress">
              <span>Card ${index + 1} of ${items.length}</span>
              <span>${promptQuickGrabs().length} total waiting</span>
            </div>
            ${renderQuickGrabCard(grab, "summary")}
            <div class="action-row">
              <button class="button" data-action="review-prev" ${index === 0 ? "disabled" : ""}>Previous</button>
              <button class="button" data-action="review-next" ${index >= items.length - 1 ? "disabled" : ""}>Next</button>
              <button class="button primary" data-action="qg-process" data-id="${grab.id}">Process This</button>
              <button class="button" data-action="snooze-screen" data-id="${grab.id}">Snooze</button>
              <button class="button" data-action="qg-done" data-id="${grab.id}">Done</button>
              <button class="button danger" data-action="qg-archive" data-id="${grab.id}">Archive</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderQuickGrabCard(grab, mode = "full") {
      const person = personById(grab.relatedPersonId);
      const sensitivePreview = maskedText(grab.sensitiveFlag, "Sensitive grabbed item - tap to view.", grab.rawContent);
      const expanded = view.expandedQuickGrabIds.includes(grab.id);
      const showActions = mode !== "summary";
      return `
        <article class="item compact focus-card ${grab.urgency === "Important" ? "important" : grab.urgency === "Today" ? "today" : ""}">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(grab.category)} Quick Grab</div>
            <span class="pill ${grab.urgency === "Important" ? "gold" : grab.urgency === "Today" ? "terra" : "gray"}">${escapeHtml(grab.urgency)}</span>
          </div>
          <p class="item-preview">${escapeHtml(sensitivePreview)}</p>
          <div class="row wrap">
            <span class="meta">${escapeHtml(grab.status)}${person ? " - " + escapeHtml(person.name) : ""}</span>
            ${grab.remindAt ? `<span class="meta">Prompt: ${dateLabel(grab.remindAt)}</span>` : ""}
          </div>
          ${timestampLine(grab, "Captured", grab.createdAt)}
          <div class="next-step-line">
            <span class="pill green">Next</span>
            <strong>${escapeHtml(quickGrabNextStep(grab))}</strong>
          </div>
          ${showActions ? `
            <div class="action-row focus-actions">
              <button class="button small primary" data-action="qg-process" data-id="${grab.id}">Process</button>
              <button class="button small" data-action="snooze-screen" data-id="${grab.id}">Snooze</button>
              <button class="button small" data-action="qg-done" data-id="${grab.id}">Done</button>
              ${settings.showAdvancedActions ? "" : `<button class="button small" data-action="qg-toggle-more" data-id="${grab.id}">${expanded ? "Less" : "More"}</button>`}
            </div>
            <div class="action-row extra-actions ${expanded ? "is-open" : ""}">
              <button class="button small" data-action="qg-preset" data-type="note" data-id="${grab.id}">Turn into Note</button>
              <button class="button small" data-action="qg-preset" data-type="followup" data-id="${grab.id}">Turn into Task</button>
              <button class="button small" data-action="qg-preset" data-type="followup" data-id="${grab.id}">Turn into Follow-Up</button>
              <button class="button small" data-action="qg-preset" data-type="prayer" data-id="${grab.id}">Turn into Prayer Request</button>
              <button class="button small" data-action="qg-preset" data-type="meeting" data-id="${grab.id}">Turn into Meeting Note</button>
              <button class="button small" data-action="qg-preset" data-type="teaching" data-id="${grab.id}">Turn into Teaching Idea</button>
              <button class="button small" data-action="qg-preset" data-type="donor" data-id="${grab.id}">Turn into Donor Update Idea</button>
              ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="quickGrabs" data-field="rawContent" data-label="Quick Grab" data-id="${grab.id}">Edit Grab</button>` : ""}
              <button class="button small" data-action="qg-archive" data-id="${grab.id}">Archive</button>
            </div>
          ` : ""}
        </article>
      `;
    }

    function quickGrabNextStep(grab) {
      if (grab.detectedMeetingSummary && grab.detectedPrayerRequest) return "Review and turn this into linked meeting and prayer records.";
      if (grab.detectedMeetingSummary) return "Review this as a meeting note.";
      if (grab.detectedPrayerRequest) return "Review this as a prayer request.";
      if (grab.detectedFollowUp) return "Review this as a follow-up task.";
      return "Decide what this should become.";
    }

    function renderSearch() {
      const query = view.globalSearch.trim();
      const results = query ? buildSearchResults(query) : [];
      const total = results.reduce((sum, group) => sum + group.items.length, 0);
      return `
        ${renderTopbar("Search", "Find the person, note, prayer request, meeting, task, or loose reminder you half-remember.")}
        <section class="section">
          <div class="surface quick-box">
            <div class="field">
              <label for="global-search">Search anything</label>
              <input class="input" id="global-search" value="${escapeHtml(view.globalSearch)}" placeholder="Try a name, SAE, surgery, summer plans, Large Group...">
            </div>
            <div class="meta">${query ? `${total} result${total === 1 ? "" : "s"} found` : "Type whatever fragment you remember. One word is enough to start."}</div>
          </div>
        </section>
        ${query ? renderSearchResults(results) : renderSearchSuggestions()}
      `;
    }

    function renderSearchSuggestions() {
      return `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Good Things To Search</h2>
          </div>
          <div class="grid three">
            <div class="item compact"><div class="item-title">A person</div><p class="item-preview">Name, fraternity, class year, major, hometown, or donor status.</p></div>
            <div class="item compact"><div class="item-title">A care detail</div><p class="item-preview">Something like surgery, anxiety, wisdom, summer plans, or family.</p></div>
            <div class="item compact"><div class="item-title">A ministry thing</div><p class="item-preview">Large Group, cups, teaching ideas, meetings, follow-ups, or prayer.</p></div>
          </div>
        </section>
      `;
    }

    function renderSearchResults(results) {
      const visibleGroups = results.filter(group => group.items.length);
      if (!visibleGroups.length) {
        return `<section class="section">${emptyState("Nothing matched that search. Try one smaller word, a first name, or a phrase you remember.")}</section>`;
      }
      return visibleGroups.map(group => `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${escapeHtml(group.label)}</h2>
            <span class="pill gray">${group.items.length}</span>
          </div>
          ${group.items.map(renderSearchResultCard).join("")}
        </section>
      `).join("");
    }

    function buildSearchResults(query) {
      const q = query.toLowerCase();
      const matches = fields => fields.filter(Boolean).join(" ").toLowerCase().includes(q);
      const people = db.people
        .filter(person => matches([person.name, person.personType, person.status, person.careLevel, person.preferredContactMethod, person.phone, person.email, person.classYear, person.fraternitySorority, person.major, person.hometown, person.rufInvolvement, person.donorStatus, person.followUpReason]))
        .map(person => ({
          kind: "Person",
          title: person.name,
          meta: `${person.personType} - ${person.careLevel}`,
          preview: person.followUpReason || person.rufInvolvement || "Open the profile for the whole ministry history.",
          personId: person.id,
          createdAt: person.createdAt,
          updatedAt: person.updatedAt
        }));
      const quickGrabs = db.quickGrabs
        .filter(grab => (settings.includeArchivedInSearch || grab.status !== "Archived") && (settings.includeSensitiveInSearch || !grab.sensitiveFlag) && matches([grab.rawContent, grab.detectedPersonName, grab.detectedPrayerRequest, grab.detectedFollowUp, grab.detectedMeetingSummary, grab.category, grab.status, grab.urgency]))
        .map(grab => ({
          kind: "Quick Grab",
          title: `${grab.category} Quick Grab`,
          meta: `${grab.status} - ${grab.urgency}`,
          preview: maskedText(grab.sensitiveFlag, "Sensitive grabbed item - open to process.", grab.rawContent),
          quickGrabId: grab.id,
          createdAt: grab.createdAt,
          updatedAt: grab.updatedAt
        }));
      const prayers = db.prayerRequests
        .filter(prayer => {
          if (!settings.includeArchivedInSearch && prayer.status === "Archived") return false;
          if (!settings.includeSensitiveInSearch && prayer.sensitivityLevel === "Sensitive") return false;
          const person = personById(prayer.relatedPersonId);
          return matches([person?.name, prayer.request, prayer.status, prayer.sensitivityLevel, prayer.shareableStatus, prayer.answeredNote]);
        })
        .map(prayer => {
          const person = personById(prayer.relatedPersonId);
          return {
            kind: "Prayer Request",
            title: person ? person.name : "Unlinked person",
            meta: `${prayer.status} - ${dateLabel(prayer.dateAdded)}`,
            preview: maskedText(prayer.sensitivityLevel === "Sensitive", "Sensitive prayer request - open related profile.", prayer.request),
            personId: prayer.relatedPersonId,
            prayerStatus: prayer.status,
            createdAt: prayer.createdAt,
            updatedAt: prayer.updatedAt,
            primaryLabel: "Added",
            primaryValue: prayer.dateAdded
          };
        });
      const meetings = db.meetingNotes
        .filter(meeting => {
          if (!settings.includeSensitiveInSearch && meeting.sensitiveFlag) return false;
          const person = personById(meeting.relatedPersonId);
          return matches([person?.name, meeting.meetingType, meeting.location, meeting.whatWeTalkedAbout, meeting.whatToRemember, meeting.prayerRequestText, meeting.nextFaithfulStep]);
        })
        .map(meeting => {
          const person = personById(meeting.relatedPersonId);
          return {
            kind: "Meeting Note",
            title: `${meeting.meetingType} meeting${person ? " with " + person.name : ""}`,
            meta: dateLabel(meeting.meetingDate),
            preview: maskedText(meeting.sensitiveFlag, "Sensitive meeting note - open related profile.", meeting.whatWeTalkedAbout),
            personId: meeting.relatedPersonId,
            createdAt: meeting.createdAt,
            updatedAt: meeting.updatedAt,
            primaryLabel: "Meeting",
            primaryValue: meeting.meetingDate
          };
        });
      const notes = db.notes
        .filter(note => {
          if (!settings.includeSensitiveInSearch && note.sensitiveFlag) return false;
          const person = personById(note.relatedPersonId);
          return matches([person?.name, note.noteType, note.content]);
        })
        .map(note => {
          const person = personById(note.relatedPersonId);
          return {
            kind: "Note",
            title: `${note.noteType}${person ? " - " + person.name : ""}`,
            meta: dateLabel(note.noteDate),
            preview: maskedText(note.sensitiveFlag, "Sensitive note - open related profile.", note.content),
            personId: note.relatedPersonId,
            createdAt: note.createdAt,
            updatedAt: note.updatedAt,
            primaryLabel: "Note",
            primaryValue: note.noteDate
          };
        });
      const tasks = db.tasks
        .filter(task => {
          const person = personById(task.relatedPersonId);
          return matches([person?.name, task.title, task.status, task.sourceType]);
        })
        .map(task => {
          const person = personById(task.relatedPersonId);
          return {
            kind: "Follow-Up Task",
            title: task.title,
            meta: `${task.status} - ${dateLabel(task.dueDate)}`,
            preview: person ? `Connected to ${person.name}` : task.sourceType || "Follow-up task",
            personId: task.relatedPersonId,
            createdAt: task.createdAt,
            updatedAt: task.updatedAt,
            primaryLabel: "Due",
            primaryValue: task.dueDate
          };
        });
      return [
        { label: "People", items: people },
        { label: "Quick Grabs", items: quickGrabs },
        { label: "Prayer Requests", items: prayers },
        { label: "Meeting Notes", items: meetings },
        { label: "Notes", items: notes },
        { label: "Follow-Up Tasks", items: tasks }
      ];
    }

    function renderSearchResultCard(result) {
      return `
        <article class="item compact focus-card">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(result.title)}</div>
              <div class="meta">${escapeHtml(result.meta)}</div>
            </div>
            <span class="pill violet">${escapeHtml(result.kind)}</span>
          </div>
          <p class="item-preview">${escapeHtml(result.preview)}</p>
          ${timestampLine(result, result.primaryLabel, result.primaryValue)}
          <div class="action-row">
            ${result.personId ? `<button class="button small primary" data-action="person-open" data-id="${result.personId}">Open Profile</button>` : ""}
            ${result.quickGrabId ? `<button class="button small primary" data-action="qg-process" data-id="${result.quickGrabId}">Process Quick Grab</button>` : ""}
            ${result.kind === "Prayer Request" ? `<button class="button small" data-action="open-prayer-filter" data-filter="${escapeHtml(prayerFilterForStatus(result.prayerStatus))}">Open Prayer List</button>` : ""}
          </div>
        </article>
      `;
    }

    function prayerFilterForStatus(status) {
      if (status === "Follow-Up Needed") return "Follow-Up Needed";
      if (status === "Answered") return "Answered Prayer";
      if (status === "Archived") return "Archived Prayer Requests";
      return "Active";
    }

    function renderProcessQuickGrab() {
      const grab = db.quickGrabs.find(item => item.id === view.quickGrabId);
      if (!grab) return `${renderTopbar("Quick Grab", "That item could not be found.")}${emptyState("Choose another grabbed item to process.")}`;
      const presets = view.processPreset.length ? view.processPreset : inferActions(grab);
      const personOptions = db.people
        .slice()
        .sort((a, b) => a.name.localeCompare(b.name))
        .map(person => `<option value="${person.id}" ${person.id === grab.relatedPersonId ? "selected" : ""}>${escapeHtml(person.name)} - ${escapeHtml(person.personType)}</option>`)
        .join("");
      return `
        ${renderTopbar("What should this become?", "Review before anything gets attached to a person. This keeps the app careful and useful.", false)}
        <div class="grid two">
          <section class="section">
            <div class="item">
              <div class="item-title">Original Quick Grab</div>
              <p class="item-preview">${escapeHtml(grab.rawContent)}</p>
              <div class="row wrap">
                <span class="pill green">${escapeHtml(grab.category)}</span>
                <span class="pill gold">${escapeHtml(grab.urgency)}</span>
                ${grab.detectedPersonName ? `<span class="pill violet">Possible person: ${escapeHtml(grab.detectedPersonName)}</span>` : ""}
              </div>
              ${timestampLine(grab, "Captured", grab.createdAt)}
            </div>
            <div class="notice sensitive">Keep sensitive details minimal. Record enough to care faithfully, not everything.</div>
            <div class="surface">
              <div class="field">
                <label>What should this become?</label>
                <div class="check-grid">
                  ${checkbox("action-note", "Add to person profile as note", presets.includes("note"))}
                  ${checkbox("action-meeting", "Add as meeting note", presets.includes("meeting"))}
                  ${checkbox("action-prayer", "Add prayer request", presets.includes("prayer"))}
                  ${checkbox("action-followup", "Create follow-up task", presets.includes("followup"))}
                  ${checkbox("action-person", "Create new person", false)}
                  ${checkbox("action-donor", "Add donor update idea", presets.includes("donor"))}
                  ${checkbox("action-teaching", "Add teaching idea", presets.includes("teaching"))}
                  ${checkbox("action-keep", "Keep as Quick Grab", false)}
                  ${checkbox("action-sensitive", "Mark sensitive/private", grab.sensitiveFlag)}
                </div>
              </div>
            </div>
          </section>
          <section class="section">
            <div class="surface">
              <div class="form-grid">
                <div class="field wide">
                  <label for="person-select">Related person</label>
                  <select class="select" id="person-select">
                    <option value="">Choose a person</option>
                    ${personOptions}
                    <option value="new">Create new person after checking matches</option>
                  </select>
                </div>
                <div class="field wide" id="new-person-fields" style="display:none;">
                  <label for="new-person-name">New person name</label>
                  <input class="input" id="new-person-name" value="${escapeHtml(grab.detectedPersonName)}" placeholder="First and last name">
                  <label for="new-person-phone">Phone number</label>
                  <input class="input" id="new-person-phone" inputmode="tel" autocomplete="tel" placeholder="Optional phone number">
                  <div class="meta" id="duplicate-warning"></div>
                  <label class="check"><input type="checkbox" id="duplicate-confirm"> Create a new person even if a similar person exists.</label>
                </div>
                <div class="field">
                  <label for="meeting-date">Meeting date</label>
                  <input class="input" id="meeting-date" type="date" value="${grab.detectedDate || todayISO()}">
                </div>
                <div class="field">
                  <label for="meeting-type">Meeting type</label>
                  <select class="select" id="meeting-type">
                    ${["Student", "Donor", "Staff", "Pastoral", "Event Planning", "Admin", "Other"].map(type => `<option>${type}</option>`).join("")}
                  </select>
                </div>
                <div class="field wide">
                  <label for="meeting-summary">Meeting note summary</label>
                  <textarea class="textarea small" id="meeting-summary">${escapeHtml(grab.detectedMeetingSummary || grab.rawContent)}</textarea>
                </div>
                <div class="field wide">
                  <label for="what-to-remember">What to remember</label>
                  <textarea class="textarea small" id="what-to-remember">${escapeHtml(grab.rawContent)}</textarea>
                </div>
                <div class="field wide">
                  <label for="prayer-text">Prayer request text</label>
                  <textarea class="textarea small" id="prayer-text">${escapeHtml(grab.detectedPrayerRequest || "")}</textarea>
                </div>
                <div class="field wide">
                  <label for="followup-task">Follow-up task</label>
                  <input class="input" id="followup-task" value="${escapeHtml(grab.detectedFollowUp || "")}" placeholder="Ask about...">
                </div>
                <div class="field">
                  <label for="followup-date">Follow-up date</label>
                  <input class="input" id="followup-date" type="date" value="${grab.detectedFollowUpDate || ""}">
                </div>
                <div class="field">
                  <label for="shareable-status">Shareable status</label>
                  <select class="select" id="shareable-status">
                    ${["Private", "Anonymous Only", "Ask Permission", "Okay to Share"].map(status => `<option ${status === settings.defaultShareableStatus ? "selected" : ""}>${status}</option>`).join("")}
                  </select>
                </div>
                <div class="field wide">
                  <label class="check"><input type="checkbox" id="update-last" checked> Update the person's last meaningful interaction.</label>
                  <label class="check"><input type="checkbox" id="update-next" checked> Update the person's next follow-up date.</label>
                </div>
              </div>
              <div class="action-row" style="margin-top:14px;">
                <button class="button primary" data-action="process-save" data-id="${grab.id}">Save Structured Records</button>
                <button class="button" data-action="nav" data-screen="quick">Back to Quick Grab</button>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function checkbox(id, label, checked) {
      return `<label class="check"><input type="checkbox" id="${id}" ${checked ? "checked" : ""}> ${escapeHtml(label)}</label>`;
    }

    function inferActions(grab) {
      const actions = [];
      if (grab.detectedMeetingSummary) actions.push("meeting");
      if (grab.detectedPrayerRequest) actions.push("prayer");
      if (grab.detectedFollowUp || grab.detectedFollowUpDate) actions.push("followup");
      if (grab.category === "Teaching") actions.push("teaching");
      if (grab.category === "Donors") actions.push("donor");
      if (!actions.length && grab.category === "People") actions.push("note");
      return actions;
    }

    function renderSnooze() {
      const grab = db.quickGrabs.find(item => item.id === view.quickGrabId);
      if (!grab) return `${renderTopbar("Snooze", "That grabbed item could not be found.")}${emptyState("Choose another item.")}`;
      return `
        ${renderTopbar("Snooze", "Move this loose end to a gentler time.", false)}
        <section class="section">
          <article class="item">
            <div class="item-title">${escapeHtml(grab.category)} Quick Grab</div>
            <p class="item-preview">${escapeHtml(grab.rawContent)}</p>
          </article>
          <div class="surface">
            <div class="action-row">
              <button class="button" data-action="snooze-set" data-id="${grab.id}" data-when="later">Later Today</button>
              <button class="button" data-action="snooze-set" data-id="${grab.id}" data-when="tomorrow">Tomorrow</button>
              <button class="button" data-action="snooze-set" data-id="${grab.id}" data-when="weekend">This Weekend</button>
              <button class="button" data-action="snooze-set" data-id="${grab.id}" data-when="nextweek">Next Week</button>
            </div>
            <div class="field" style="margin-top:14px;">
              <label for="pick-snooze">Pick Date</label>
              <input class="input" type="date" id="pick-snooze" value="${daysFromNow(2)}">
            </div>
            <div class="action-row" style="margin-top:14px;">
              <button class="button primary" data-action="snooze-pick" data-id="${grab.id}">Save Picked Date</button>
              <button class="button" data-action="nav" data-screen="quick">Back</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderPeople() {
      const q = view.search.toLowerCase();
      const people = db.people
        .filter(person => !q || [person.name, person.personType, person.careLevel, person.rufInvolvement, person.phone, person.email].join(" ").toLowerCase().includes(q))
        .sort((a, b) => Number(isPinnedPerson(b.id)) - Number(isPinnedPerson(a.id)) || a.name.localeCompare(b.name));
      return `
        ${renderTopbar("People", "Each profile gathers notes, meetings, prayer requests, follow-ups, and the story of care over time.")}
        <div class="section">
          <div class="surface">
            <div class="form-grid">
              <div class="field">
                <label for="people-search">Search people</label>
                <input class="input" id="people-search" value="${escapeHtml(view.search)}" placeholder="Name, phone, group, care level">
              </div>
              <div class="field">
                <label>Add a person</label>
                <button class="button" data-action="person-create">Create New Person</button>
              </div>
            </div>
          </div>
        </div>
        <section class="section">
          ${people.length ? people.map(renderPersonListCard).join("") : emptyState("No people match that search.")}
        </section>
      `;
    }

    function renderPersonListCard(person) {
      const pinned = isPinnedPerson(person.id);
      return `
        <article class="item">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(person.name)}</div>
              <div class="meta">${escapeHtml(person.personType)} - ${escapeHtml(person.rufInvolvement || person.status)}</div>
            </div>
            <div class="action-row">
              ${pinned ? `<span class="pill gold">Pinned</span>` : ""}
              <span class="pill green">${escapeHtml(person.careLevel)}</span>
            </div>
          </div>
          <div class="stat-grid">
            ${miniStat("Last interaction", dateLabel(person.lastMeaningfulInteraction))}
            ${miniStat("Next follow-up", dateLabel(person.nextFollowUpDate))}
            ${miniStat("Preferred contact", person.preferredContactMethod || "Not set")}
            ${miniStat("Reason", person.followUpReason || "Not set")}
          </div>
          ${timestampLine(person)}
          <div class="action-row">
            <button class="button primary small" data-action="person-open" data-id="${person.id}">Open Profile</button>
            <button class="button small" data-action="person-pin" data-id="${person.id}">${pinned ? "Unpin" : "Pin"}</button>
            <button class="button small" data-action="person-followed-up" data-id="${person.id}">Mark Followed Up</button>
          </div>
        </article>
      `;
    }

    function renderPersonProfile() {
      const person = personById(view.personId);
      if (!person) return `${renderTopbar("Person Profile", "That profile could not be found.")}${emptyState("Open a person from the People screen.")}`;
      const notes = db.notes.filter(note => note.relatedPersonId === person.id).sort((a, b) => b.noteDate.localeCompare(a.noteDate));
      const meetings = db.meetingNotes.filter(meeting => meeting.relatedPersonId === person.id).sort((a, b) => b.meetingDate.localeCompare(a.meetingDate));
      const prayers = db.prayerRequests
        .filter(prayer => prayer.relatedPersonId === person.id)
        .filter(prayer => settings.showArchivedOnProfiles || prayer.status !== "Archived")
        .sort((a, b) => b.dateAdded.localeCompare(a.dateAdded));
      const tasks = db.tasks.filter(task => task.relatedPersonId === person.id).sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || ""));
      const timeline = buildTimeline(person.id);
      const pinned = isPinnedPerson(person.id);
      return `
        <div class="profile-head">
          <div class="profile-identity">
            ${renderPersonPhoto(person)}
            <div>
              <h1 class="profile-name">${escapeHtml(person.name)}</h1>
              <p class="page-kicker">${escapeHtml(person.personType)} - ${escapeHtml(person.status)} - ${escapeHtml(person.rufInvolvement || "RUF contact")}</p>
            </div>
          </div>
          <button class="button" data-action="nav" data-screen="people">Back to People</button>
        </div>
        <section class="section">
          <div class="stat-grid">
            ${miniStat("Care level", person.careLevel)}
            ${miniStat("Last meaningful interaction", dateLabel(person.lastMeaningfulInteraction))}
            ${miniStat("Next follow-up", dateLabel(person.nextFollowUpDate))}
            ${miniStat("Phone number", person.phone || "Not set")}
          </div>
          ${timestampLine(person)}
          <div class="surface">
            <div class="form-grid">
              ${profileField("Person type", person.personType)}
              ${profileField("Preferred contact", person.preferredContactMethod)}
              ${profileField("Phone number", person.phone || "Not set")}
              ${profileField("Email", person.email || "Not set")}
              ${profileField("Class year", person.classYear || "Not applicable")}
              ${profileField("Fraternity/sorority", person.fraternitySorority || "Not applicable")}
              ${profileField("Major", person.major || "Not set")}
              ${profileField("Hometown", person.hometown || "Not set")}
              ${profileField("RUF involvement", person.rufInvolvement || "Not set")}
              ${profileField("Donor status", person.donorStatus || "Not applicable")}
              ${profileField("Follow-up reason", person.followUpReason || "Not set")}
              <div class="field wide">
                <label for="profile-photo-input">Profile picture</label>
                <input class="input" id="profile-photo-input" type="file" accept="image/*" data-person-id="${person.id}">
                <div class="meta">Choose a photo from your phone. The app shrinks it before saving it locally.</div>
                <div class="action-row" style="margin-top:8px;">
                  ${person.photoDataUrl ? `<button class="button small danger" data-action="person-remove-photo" data-id="${person.id}">Remove Photo</button>` : ""}
                </div>
              </div>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Quick Actions</h2>
          </div>
          <div class="action-row">
            <button class="button primary" data-action="person-add-note" data-id="${person.id}">Add Note</button>
            <button class="button" data-action="person-add-meeting" data-id="${person.id}">Add Meeting Note</button>
	            <button class="button" data-action="person-add-prayer" data-id="${person.id}">Add Prayer Request</button>
	            <button class="button" data-action="person-add-followup" data-id="${person.id}">Add Follow-Up Task</button>
	            <button class="button" data-action="person-pin" data-id="${person.id}">${pinned ? "Unpin Person" : "Pin Person"}</button>
	            <button class="button" data-action="person-followed-up" data-id="${person.id}">Mark Followed Up</button>
            <button class="button" data-action="person-briefing" data-id="${person.id}">Copy Local Briefing</button>
            ${settings.inlineEditing ? `<button class="button" data-action="person-edit-field" data-id="${person.id}" data-field="name" data-label="Name">Edit Name</button>` : ""}
            <button class="button terra" data-action="person-copy-draft" data-id="${person.id}">Copy Text Drafts</button>
          </div>
        </section>
        <div class="grid two">
          <section class="section">
            <div class="section-header"><h2 class="section-title">Notes</h2></div>
            ${notes.length ? notes.map(renderNoteCard).join("") : emptyState("No notes yet for this person.")}
          </section>
          <section class="section">
            <div class="section-header"><h2 class="section-title">Meeting Notes</h2></div>
            ${meetings.length ? meetings.map(renderMeetingCard).join("") : emptyState("No meeting notes yet for this person.")}
          </section>
        </div>
        <div class="grid two">
          <section class="section">
            <div class="section-header"><h2 class="section-title">Prayer Requests</h2></div>
            ${renderPrayerGroups(prayers)}
          </section>
          <section class="section">
            <div class="section-header"><h2 class="section-title">Follow-Up Tasks</h2></div>
            ${renderTaskGroups(tasks)}
          </section>
        </div>
        <section class="section">
          <div class="section-header"><h2 class="section-title">Person Timeline</h2></div>
          <div class="timeline">
            ${timeline.length ? timeline.map(renderTimelineItem).join("") : emptyState("This timeline will fill in as you add notes, meetings, prayer requests, and follow-ups.")}
          </div>
        </section>
      `;
    }

    function personInitials(person) {
      return String(person?.name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join("")
        .toUpperCase() || "?";
    }

    function renderPersonPhoto(person) {
      return `
        <div class="profile-photo" aria-label="${escapeHtml(person.name)} profile picture">
          ${person.photoDataUrl ? `<img src="${escapeHtml(person.photoDataUrl)}" alt="${escapeHtml(person.name)}">` : `<span>${escapeHtml(personInitials(person))}</span>`}
        </div>
      `;
    }

    function profileField(label, value) {
      const fieldMap = {
        "Person type": "personType",
        "Preferred contact": "preferredContactMethod",
        "Phone number": "phone",
        "Email": "email",
        "Class year": "classYear",
        "Fraternity/sorority": "fraternitySorority",
        "Major": "major",
        "Hometown": "hometown",
        "RUF involvement": "rufInvolvement",
        "Donor status": "donorStatus",
        "Follow-up reason": "followUpReason"
      };
      const field = fieldMap[label];
      const edit = settings.inlineEditing && field && view.personId
        ? `<button class="button small" data-action="person-edit-field" data-id="${view.personId}" data-field="${field}" data-label="${escapeHtml(label)}">Edit</button>`
        : "";
      return `<div class="field"><label>${escapeHtml(label)}</label><div class="row wrap"><div class="meta">${escapeHtml(value)}</div>${edit}</div></div>`;
    }

    function miniStat(label, value) {
      return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(value || "Not set")}</div></div>`;
    }

    function renderNoteCard(note) {
      return `
        <article class="item compact">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(note.noteType)}</div>
            <span class="meta">${dateLabel(note.noteDate)}</span>
          </div>
          <p class="item-preview">${escapeHtml(maskedText(note.sensitiveFlag, "Sensitive note - tap to view.", note.content))}</p>
          ${timestampLine(note, "Note date", note.noteDate)}
          ${note.sensitiveFlag ? `<span class="pill rose">Sensitive</span>` : ""}
          ${settings.inlineEditing ? `<div class="action-row"><button class="button small" data-action="edit-record-field" data-collection="notes" data-field="content" data-label="Note" data-id="${note.id}">Edit Note</button></div>` : ""}
        </article>
      `;
    }

    function renderMeetingCard(meeting) {
      return `
        <article class="item compact">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(meeting.meetingType)} meeting</div>
            <span class="meta">${dateLabel(meeting.meetingDate)}</span>
          </div>
          <p class="item-preview"><strong>Talked about:</strong> ${escapeHtml(maskedText(meeting.sensitiveFlag, "Sensitive meeting note - tap to view.", meeting.whatWeTalkedAbout))}</p>
          <p class="item-preview"><strong>Remember:</strong> ${escapeHtml(maskedText(meeting.sensitiveFlag, "Sensitive details hidden.", meeting.whatToRemember))}</p>
          <p class="item-preview"><strong>Next faithful step:</strong> ${escapeHtml(meeting.nextFaithfulStep || "Not set")}</p>
          ${timestampLine(meeting, "Meeting date", meeting.meetingDate)}
          <div class="row wrap">
            <span class="meta">${escapeHtml(meeting.location || "No location")}</span>
            ${meeting.followUpDate ? `<span class="pill gold">Follow up ${dateLabel(meeting.followUpDate)}</span>` : ""}
            ${meeting.sensitiveFlag ? `<span class="pill rose">Sensitive</span>` : ""}
          </div>
          <div class="action-row">
            <button class="button small" data-action="meeting-add-prayer" data-id="${meeting.id}">Add Prayer Request from this Meeting</button>
            ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="meetingNotes" data-field="whatWeTalkedAbout" data-label="Meeting summary" data-id="${meeting.id}">Edit Summary</button>` : ""}
          </div>
        </article>
      `;
    }

    function renderPrayerGroups(prayers) {
      if (!prayers.length) return emptyState("No active prayer requests yet. Add one from Quick Grab, a meeting note, or this profile.");
      const groups = ["Active", "Follow-Up Needed", "Answered", "Archived"];
      return groups.map(group => {
        const items = prayers.filter(prayer => prayer.status === group);
        if (!items.length) return "";
        return `
          <div class="section">
            <div class="section-header"><h3 class="section-title">${escapeHtml(group)}</h3></div>
            ${items.map(renderPrayerCard).join("")}
          </div>
        `;
      }).join("");
    }

    function renderTaskGroups(tasks) {
      if (!tasks.length) return emptyState("No follow-up tasks yet for this person.");
      const groups = ["Today / Soon", "Waiting", "Done / Archived"];
      return groups.map(group => {
        const items = tasks.filter(task => task.status === group);
        if (!items.length) return "";
        return `
          <div class="section">
            <div class="section-header"><h3 class="section-title">${escapeHtml(group)}</h3></div>
            ${items.map(renderTaskCard).join("")}
          </div>
        `;
      }).join("");
    }

    function buildTimeline(personId) {
      const items = [];
      db.meetingNotes.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.meetingDate, type: "Meeting Note", title: item.meetingType + " meeting", preview: item.whatWeTalkedAbout, status: item.followUpNeeded ? "Follow-up planned" : "", sensitive: item.sensitiveFlag, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.notes.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.noteDate, type: "Note", title: item.noteType, preview: item.content, status: "", sensitive: item.sensitiveFlag, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.prayerRequests.filter(item => item.relatedPersonId === personId).filter(item => settings.showArchivedOnProfiles || item.status !== "Archived").forEach(item => {
        items.push({ date: item.dateAdded, type: item.status === "Answered" ? "Answered Prayer" : "Prayer Request", title: item.status, preview: item.request, status: item.shareableStatus, sensitive: item.sensitivityLevel === "Sensitive", createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.tasks.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.dueDate || item.createdAt.slice(0, 10), type: "Follow-Up Task", title: item.title, preview: item.sourceType, status: item.status, sensitive: false, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      return items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    }

    function renderTimelineItem(item) {
      return `
        <article class="timeline-item">
          <div class="meta">${dateLabel(item.date)}</div>
          <div>
            <div class="row wrap">
              <span class="pill violet">${escapeHtml(item.type)}</span>
              ${item.status ? `<span class="pill gray">${escapeHtml(item.status)}</span>` : ""}
              ${item.sensitive ? `<span class="pill rose">Sensitive</span>` : ""}
            </div>
            <div class="item-title" style="margin-top:8px;">${escapeHtml(item.title)}</div>
            <p class="item-preview">${escapeHtml(maskedText(item.sensitive, "Sensitive item - tap its section to view.", item.preview))}</p>
            ${timestampLine(item, "Timeline date", item.date)}
          </div>
        </article>
      `;
    }

    function renderPrayerRequests() {
      const filters = ["Active", "Follow-Up Needed", "Prayer Walk", "Answered Prayer", "Archived Prayer Requests", "Sensitive Prayer Requests", "Recently Added", "By Person"];
      const filtered = getFilteredPrayers();
      const answeredReady = db.prayerRequests.filter(prayer => prayer.status === "Answered").length;
      const archivedCount = db.prayerRequests.filter(prayer => prayer.status === "Archived").length;
      return `
        ${renderTopbar("Prayer Requests", "Prayer requests only, with meeting notes and tasks linked as context.")}
        <section class="section">
          <div class="surface">
            <div class="row wrap">
              <div>
                <div class="item-title">Answered and archived prayer</div>
                <div class="meta">Answered requests can stay visible until you are ready, then move into the archive without losing the story.</div>
              </div>
              <span class="pill green">${answeredReady} answered</span>
              <span class="pill gray">${archivedCount} archived</span>
              <button class="button small" data-action="prayer-steward">Copy Prayer Steward Audit</button>
            </div>
          </div>
        </section>
        <div class="tabs">
          ${filters.map(filter => `<button class="tab ${view.prayerFilter === filter ? "active" : ""}" data-action="prayer-filter" data-filter="${filter}">${escapeHtml(filter)}</button>`).join("")}
        </div>
        <section class="section">
          ${filtered.length ? filtered.map(renderPrayerCard).join("") : emptyState(prayerEmptyState())}
        </section>
      `;
    }

    function getFilteredPrayers() {
      const prayers = db.prayerRequests.slice();
      if (view.prayerFilter === "Active") return prayers.filter(prayer => prayer.status === "Active");
      if (view.prayerFilter === "Follow-Up Needed") return prayers.filter(prayer => prayer.status === "Follow-Up Needed");
      if (view.prayerFilter === "Prayer Walk") return prayers.filter(prayer => {
        if (prayer.status === "Archived") return false;
        if (!settings.prayerWalkIncludeAnswered && prayer.status === "Answered") return false;
        if (!settings.prayerWalkIncludeSensitive && prayer.sensitivityLevel === "Sensitive") return false;
        return true;
      });
      if (view.prayerFilter === "Answered Prayer") return prayers.filter(prayer => prayer.status === "Answered");
      if (view.prayerFilter === "Archived Prayer Requests") return prayers.filter(prayer => prayer.status === "Archived").sort((a, b) => (b.archivedAt || b.updatedAt || "").localeCompare(a.archivedAt || a.updatedAt || ""));
      if (view.prayerFilter === "Sensitive Prayer Requests") return prayers.filter(prayer => prayer.sensitivityLevel === "Sensitive");
      if (view.prayerFilter === "Recently Added") return prayers.sort((a, b) => b.dateAdded.localeCompare(a.dateAdded)).slice(0, 12);
      if (view.prayerFilter === "By Person") return prayers.sort((a, b) => (personById(a.relatedPersonId)?.name || "").localeCompare(personById(b.relatedPersonId)?.name || ""));
      return prayers;
    }

      if (view.prayerFilter === "Archived Prayer Requests") return "No archived prayer requests yet. Answered requests can move here when you are ready to tuck them away.";

      if (view.prayerFilter === "Follow-Up Needed") return "No prayer requests need a follow-up right now.";
      if (view.prayerFilter === "Prayer Walk") return "No prayer requests are ready for Prayer Walk right now.";
      return "No active prayer requests yet. Add one from Quick Grab, a meeting note, or a person profile.";
    }

      return `

            <span class="pill ${prayer.status === "Follow-Up Needed" ? "gold" : prayer.status === "Answered" ? "green" : prayer.status === "Archived" ? "gray" : "violet"}">${escapeHtml(prayer.status)}</span>

          <p class="item-preview">${escapeHtml(maskedText(sensitive, "Sensitive prayer request - tap to view.", prayer.request))}</p>
          <div class="row wrap">
            <span class="pill ${sensitive ? "rose" : "gray"}">${escapeHtml(prayer.sensitivityLevel)}</span>

    function bindScreen() {
      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", handleAction);
      });
      document.querySelectorAll("[data-setting-toggle]").forEach(input => {
        input.addEventListener("change", event => {
          updateSetting(event.target.dataset.settingToggle, event.target.checked);
        });
      });
      document.querySelectorAll("[data-setting-select]").forEach(select => {
        select.addEventListener("change", event => {
          updateSetting(event.target.dataset.settingSelect, event.target.value);
        });
      });
      document.querySelectorAll("[data-copy-key]").forEach(el => {
        el.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          editCopyText(el.dataset.copyKey, el.dataset.copyFallback || el.textContent.trim());
        });
      });
      restoreAutosaveDraft();
      document.querySelectorAll("input, textarea, select").forEach(el => {
        if (!isAutosaveField(el)) return;
        el.addEventListener("input", scheduleAutosave);
        el.addEventListener("change", scheduleAutosave);
      });
      document.querySelectorAll("#quick-tags .chip").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          button.classList.toggle("active");
          scheduleAutosave();
        });
      });
      document.querySelectorAll("#urgency-tags .chip").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          document.querySelectorAll("#urgency-tags .chip").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          scheduleAutosave();
        });
      });
      const peopleSearch = document.getElementById("people-search");
      if (peopleSearch) {
        peopleSearch.addEventListener("input", event => {
          view.search = event.target.value;
          saveCurrentDraftNow();
          render();
        });
      }
      const globalSearch = document.getElementById("global-search");
      if (globalSearch) {
        globalSearch.addEventListener("input", event => {
          view.globalSearch = event.target.value;
          saveCurrentDraftNow();
          render();
        });
        if (document.activeElement !== globalSearch) globalSearch.focus();
      }
      const personSelect = document.getElementById("person-select");
      if (personSelect) {
        personSelect.addEventListener("change", updateNewPersonFields);
        updateNewPersonFields();
      }
      const newPerson = document.getElementById("new-person-name");
      if (newPerson) {
        newPerson.addEventListener("input", updateDuplicateWarning);
        updateDuplicateWarning();
      }
      const quickText = document.getElementById("quick-text");
      if (quickText) {
        view.quickGrabDraftText = quickText.value;
        quickText.addEventListener("input", event => {
          view.quickGrabDraftText = event.target.value;
        });
      }
      const profilePhotoInput = document.getElementById("profile-photo-input");
      if (profilePhotoInput) {
        profilePhotoInput.addEventListener("change", event => {
          handleProfilePhotoUpload(event.target);
        });
      }
      const pinInput = document.getElementById("pin-input");
      if (pinInput) {
        pinInput.focus();
        pinInput.addEventListener("keydown", event => {
          if (event.key === "Enter") unlockApp();
        });
      }
      const vaultInput = document.getElementById("vault-passphrase");
      if (vaultInput) {
        vaultInput.focus();
        vaultInput.addEventListener("keydown", event => {
          if (event.key === "Enter") unlockVault();
        });
      }
    }

    function handleAction(event) {
	      const button = event.currentTarget;
	      const action = button.dataset.action;
	      const id = button.dataset.id;
	      if (!["unlock-vault", "unlock-app"].includes(action)) saveCurrentDraftNow();

	      if (action === "unlock-vault") unlockVault();
      if (action === "nav") {
        view.screen = button.dataset.screen;
        view.quickGrabId = null;
        view.processPreset = [];
        if (view.screen === "review") view.reviewIndex = 0;
        render();
      }
      if (action === "unlock-app") unlockApp();
      if (action === "app-update") applyAppUpdate();
      if (action === "check-update") checkForAppUpdate();
      if (action === "copy-shortcut-url") copyShortcutUrl();
      if (action === "undo-last") undoLast();
      if (action === "lock-app") lockApp();
      if (action === "toggle-focus") toggleFocusMode();
      if (action === "grab-create") createQuickGrab();
      if (action === "voice-capture") startDictation();
      if (action === "qg-process") openProcessing(id, []);
      if (action === "qg-preset") openProcessing(id, [button.dataset.type]);
      if (action === "qg-toggle-more") toggleExpanded("expandedQuickGrabIds", id);
      if (action === "qg-done") updateQuickGrab(id, { status: "Done" }, "Marked done.");
      if (action === "qg-archive") updateQuickGrab(id, { status: "Archived" }, "Archived.");
      if (action === "review-prev") {
        view.reviewIndex = Math.max(0, (view.reviewIndex || 0) - 1);
        render();
      }
      if (action === "review-next") {
        view.reviewIndex = (view.reviewIndex || 0) + 1;
        render();
      }
      if (action === "snooze-screen") {
        view.screen = "snooze";
        view.quickGrabId = id;
        render();
      }
      if (action === "snooze-set") setSnooze(id, button.dataset.when);
      if (action === "snooze-pick") setSnooze(id, "pick");
      if (action === "process-save") saveProcessedQuickGrab(id);
      if (action === "person-open") {
        recordRecentPerson(id);
        view.screen = "person";
        view.personId = id;
        render();
      }
      if (action === "person-pin") togglePinnedPerson(id);
      if (action === "person-create") createPersonFromPrompt();
      if (action === "person-followed-up") markFollowedUp(id);
      if (action === "person-add-note") quickAddNote(id);
      if (action === "person-add-meeting") quickAddMeeting(id);
      if (action === "person-add-prayer") quickAddPrayer(id);
      if (action === "person-add-followup") quickAddFollowUp(id);
      if (action === "person-briefing") copyPersonBriefing(id);
      if (action === "person-copy-draft") copyTextDraft(id);
      if (action === "person-remove-photo") removePersonPhoto(id);
      if (action === "meeting-add-prayer") addPrayerFromMeeting(id);
      if (action === "person-edit-field") editPersonField(id, button.dataset.field, button.dataset.label);
      if (action === "edit-record-field") editRecordField(button.dataset.collection, id, button.dataset.field, button.dataset.label);
      if (action === "prayer-filter") {
        view.prayerFilter = button.dataset.filter;
        render();
      }
      if (action === "open-prayer-filter") {
        view.screen = "prayer";
        view.prayerFilter = button.dataset.filter;
        render();
      }
      if (action === "prayer-steward") copyPrayerStewardAudit();
      if (action === "prayer-toggle-more") toggleExpanded("expandedPrayerIds", id);
      if (action === "prayer-answered") markPrayerAnswered(id);
      if (action === "prayer-note") addAnsweredNote(id);
      if (action === "prayer-follow-date") setPrayerFollowDate(id);
      if (action === "prayer-task") createTaskFromPrayer(id);
      if (action === "prayer-archive") archivePrayer(id);
      if (action === "prayer-archive-answered") archivePrayer(id);
      if (action === "prayer-restore") restorePrayer(id);
      if (action === "task-done") updateTask(id, { status: "Done / Archived" }, "Task marked done.");
      if (action === "request-notifications") requestNotifications();
      if (action === "coach-apply") applyCoachSuggestion(button.dataset.suggestion);
      if (action === "coach-dismiss") dismissCoachSuggestion(button.dataset.suggestion);
      if (action === "coach-clear-dismissed") clearDismissedCoachSuggestions();
      if (action === "coach-refresh") {
        showToast("App Coach audit refreshed.");
        render();
      }
      if (action === "set-pin") {
        setAppPin();
        render();
      }
      if (action === "clear-pin") clearAppPin();
      if (action === "merge-person") mergePeople(button.dataset.from, button.dataset.to);
      if (action === "export-json") exportJson();
      if (action === "export-encrypted-json") exportEncryptedJson();
      if (action === "import-json") importJsonBackup();
      if (action === "reset-demo") resetDemoData();
      if (action === "reset-copy") resetCustomCopy();
    }

    function updateSetting(key, value) {
      if (key === "notificationsEnabled" && value) {
        requestNotifications();
        return;
      }
      if (key === "appLockEnabled" && value && !settings.pinHash) {
        if (!setAppPin()) {
          settings.appLockEnabled = false;
          saveSettings();
          render();
        } else {
          render();
        }
        return;
      }
      if (key === "appLockEnabled" && !value && settings.pinHash) {
        clearAppPin();
        return;
      }
      if (key === "localEncryptionEnabled" && value) {
        enableLocalEncryption();
        return;
      }
      if (key === "localEncryptionEnabled" && !value) {
        disableLocalEncryption();
        return;
      }
      settings[key] = value;
	      if (key === "calmMode") {
	        view.focusMode = Boolean(value);
	        if (view.focusMode) {
	          view.expandedQuickGrabIds = [];
	          view.expandedPrayerIds = [];
	        }
	      }
	      if (key === "enableAutoSave" && !value) clearAllAutosaveDrafts();
      saveSettings();
	      render();
	    }

    function applyCoachSettings(patch, message) {
      recordUndo("App Coach adjustment");
      Object.assign(settings, patch);
      if ("calmMode" in patch) view.focusMode = Boolean(settings.calmMode);
      saveSettings();
      showToast(message || "App Coach adjustment applied.");
      render();
    }

    function applyCoachSuggestion(id) {
      if (!id) return;
      if (id === "finish-iphone-deploy") {
        view.screen = "readiness";
        render();
        return;
      }
      if (id === "backup-now") {
        exportJson();
        render();
        return;
      }
      if (id === "backup-rhythm") {
        applyCoachSettings({ backupReminderDays: "7" }, "Weekly backup reminders turned on.");
        return;
      }
      if (id === "enable-autosave") {
        applyCoachSettings({ enableAutoSave: true }, "Auto Save Drafts turned on.");
        return;
      }
      if (id === "enable-vault") {
        enableLocalEncryption();
        return;
      }
      if (id === "tighten-sensitive-privacy") {
        applyCoachSettings({ maskSensitivePreviews: true, includeSensitiveInSearch: false }, "Sensitive item privacy tightened.");
        return;
      }
      if (id === "gentle-review-flow") {
        applyCoachSettings({ reviewBatchSize: "1", launchScreen: "review", showStartHere: true }, "Quick Review is now a one-card flow.");
        return;
      }
      if (id === "auto-archive-answered") {
        applyCoachSettings({ autoArchiveAnsweredDays: "30" }, "Answered prayer will auto-archive after 30 days.");
        return;
      }
      if (id === "review-duplicates") {
        view.screen = "duplicates";
        render();
        return;
      }
      if (id === "launch-today") {
        applyCoachSettings({ launchScreen: "today", showStartHere: true }, "The app will open to Today.");
        return;
      }
      if (id === "pin-care-people") {
        const nextPinned = new Set(settings.pinnedPersonIds);
        coachPinCandidates().forEach(person => nextPinned.add(person.id));
        applyCoachSettings({ pinnedPersonIds: Array.from(nextPinned).slice(0, 8) }, "People shortcuts updated.");
        return;
      }
      if (id === "enable-reminders") {
        requestNotifications();
        return;
      }
      showToast("That suggestion is no longer available.");
      render();
    }

    function dismissCoachSuggestion(id) {
      if (!id) return;
      settings.appCoachDismissed = {
        ...(settings.appCoachDismissed || {}),
        [id]: nowISO()
      };
      saveSettings();
      showToast("Suggestion hidden for now.");
      render();
    }

    function clearDismissedCoachSuggestions() {
      settings.appCoachDismissed = {};
      saveSettings();
      showToast("Hidden suggestions restored.");
      render();
    }

    function editCopyText(key, fallback) {
      const current = copyText(key, fallback);
      const next = window.prompt("Edit this wording:", current);
      if (next === null) return;
      const trimmed = next.trim();
      if (!trimmed) return;
      recordUndo("wording edit");
      customCopy[key] = trimmed;
      saveCustomCopy();
      showToast("Wording updated.");
      render();
    }

    function resetCustomCopy() {
      if (!window.confirm("Reset edited wording back to the app defaults?")) return;
      recordUndo("wording reset");
      customCopy = {};
      saveCustomCopy();
      showToast("Edited wording reset.");
      render();
    }

    function toggleFocusMode() {
      settings.calmMode = !settings.calmMode;
      view.focusMode = settings.calmMode;
      saveSettings();
      if (view.focusMode) {
        view.expandedQuickGrabIds = [];
        view.expandedPrayerIds = [];
      }
      render();
    }

    function toggleExpanded(key, id) {
      const set = new Set(view[key]);
      if (set.has(id)) set.delete(id);
      else set.add(id);
      view[key] = Array.from(set);
      render();
    }

    function createQuickGrab() {
      const text = document.getElementById("quick-text").value.trim();
      if (!text) {
        showToast("Add a note first.");
        return;
      }
      const tags = Array.from(document.querySelectorAll("#quick-tags .chip.active")).map(el => el.dataset.tag);
      const urgencyButton = document.querySelector("#urgency-tags .chip.active");
      const urgency = urgencyButton ? urgencyButton.dataset.urgency : "Whenever";
      const grab = makeQuickGrab(text, tags, urgency);
	      recordUndo("Quick Grab");
	      db.quickGrabs.unshift(grab);
	      saveData();
	      clearAutosaveDraft("screen:quick");
	      view.quickGrabDraftText = "";
	      if (settings.autoOpenQuickGrabReview) {
        view.screen = "process";
        view.quickGrabId = grab.id;
        view.processPreset = inferActions(grab);
      } else {
        view.screen = "quick";
        view.quickGrabId = null;
        view.processPreset = [];
        showToast("Grabbed. You can process it later.");
      }
      render();
    }

    function openProcessing(id, preset) {
      view.screen = "process";
      view.quickGrabId = id;
      view.processPreset = preset;
      render();
    }

    function updateQuickGrab(id, patch, message) {
      const grab = db.quickGrabs.find(item => item.id === id);
      if (!grab) return;
	      recordUndo("Quick Grab update");
	      Object.assign(grab, patch, { updatedAt: nowISO() });
	      saveData();
	      if (["Done", "Archived", "Converted"].includes(patch.status)) clearAutosaveDraft("process:" + id);
	      showToast(message);
      render();
    }

    function setSnooze(id, when) {
      const grab = db.quickGrabs.find(item => item.id === id);
      if (!grab) return;
      let date = daysFromNow(1);
      if (when === "later") date = todayISO();
      if (when === "tomorrow") date = daysFromNow(1);
      if (when === "weekend") date = nextWeekend();
      if (when === "nextweek") date = daysFromNow(7);
      if (when === "pick") date = document.getElementById("pick-snooze").value || daysFromNow(2);
	      recordUndo("Quick Grab snooze");
	      Object.assign(grab, { status: "Snoozed", snoozedUntil: date, remindAt: date, updatedAt: nowISO() });
	      saveData();
	      clearAutosaveDraft("snooze:" + id);
	      showToast("Snoozed until " + dateLabel(date) + ".");
      view.screen = "quick";
      render();
    }

    function nextWeekend() {
      const d = new Date();
      const diff = (6 + 7 - d.getDay()) % 7 || 7;
      d.setDate(d.getDate() + diff);
      return d.toISOString().slice(0, 10);
    }

    function updateNewPersonFields() {
      const select = document.getElementById("person-select");
      const fields = document.getElementById("new-person-fields");
      if (!select || !fields) return;
      fields.style.display = select.value === "new" ? "grid" : "none";
      const actionPerson = document.getElementById("action-person");
      if (actionPerson) actionPerson.checked = select.value === "new";
      updateDuplicateWarning();
    }

    function updateDuplicateWarning() {
      const input = document.getElementById("new-person-name");
      const warning = document.getElementById("duplicate-warning");
      if (!input || !warning) return;
      const matches = similarPeople(input.value);
      warning.innerHTML = matches.length
        ? `A similar person already exists: ${matches.map(person => escapeHtml(person.name)).join(", ")}. Use existing person or create new?`
        : "No close match found yet.";
    }

    function similarPeople(name) {
      const cleaned = name.trim().toLowerCase();
      if (!cleaned) return [];
      return db.people.filter(person => {
        const candidate = person.name.toLowerCase();
        return candidate.includes(cleaned) || cleaned.includes(candidate) || levenshtein(candidate, cleaned) <= 3 || candidate.split(" ")[0] === cleaned.split(" ")[0];
      });
    }

    function levenshtein(a, b) {
      const matrix = Array.from({ length: a.length + 1 }, () => []);
      for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
      for (let j = 0; j <= b.length; j++) matrix[0][j] = j;
      for (let i = 1; i <= a.length; i++) {
        for (let j = 1; j <= b.length; j++) {
          matrix[i][j] = a[i - 1] === b[j - 1]
            ? matrix[i - 1][j - 1]
            : Math.min(matrix[i - 1][j - 1] + 1, matrix[i][j - 1] + 1, matrix[i - 1][j] + 1);
        }
      }
      return matrix[a.length][b.length];
    }

    function resizeProfilePhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith("image/")) {
          reject(new Error("Choose an image file."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read that image."));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("Could not load that image."));
          image.onload = () => {
            const maxSide = 360;
            const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            const width = Math.max(1, Math.round(image.width * scale));
            const height = Math.max(1, Math.round(image.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("Image resizing is unavailable."));
              return;
            }
            context.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }
