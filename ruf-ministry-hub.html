    function copyPrayerStewardAudit() {
      const today = startOfToday();
      const staleCutoff = new Date(today.getTime() - 30 * 86400000);
      const overdue = db.prayerRequests.filter(prayer => prayer.status !== "Archived" && prayer.followUpDate && new Date(prayer.followUpDate + "T00:00:00") < today);
      const stale = db.prayerRequests.filter(prayer => prayer.status === "Active" && prayer.dateAdded && new Date(prayer.dateAdded + "T00:00:00") < staleCutoff);
      const answered = db.prayerRequests.filter(prayer => prayer.status === "Answered");
      const sensitive = db.prayerRequests.filter(prayer => prayer.status !== "Archived" && prayer.sensitivityLevel === "Sensitive");
      const unlinked = db.prayerRequests.filter(prayer => prayer.status !== "Archived" && !personById(prayer.relatedPersonId));
      const personName = prayer => personById(prayer.relatedPersonId)?.name || "Unlinked person";
      const group = (label, items, renderItem) => [
        `${label} (${items.length})`,
        ...(items.length ? items.slice(0, 12).map(renderItem) : ["- None"])
      ].join("\n");
      const audit = [
        "RUF Ministry Hub — Prayer Steward Audit",
        `Generated: ${dateTimeLabel(nowISO())}`,
        "",
        group("Overdue follow-ups", overdue, prayer => `- ${personName(prayer)} — follow up was ${dateLabel(prayer.followUpDate)}: ${safeLine(prayer.request).slice(0, 150)}`),
        "",
        group("Active requests older than 30 days", stale, prayer => `- ${personName(prayer)} — added ${dateLabel(prayer.dateAdded)}: ${safeLine(prayer.request).slice(0, 150)}`),
        "",
        group("Answered requests ready to review/archive", answered, prayer => `- ${personName(prayer)} — answered ${dateLabel(prayer.answeredAt || prayer.updatedAt?.slice(0, 10))}: ${safeLine(prayer.request).slice(0, 150)}`),
        "",
        group("Sensitive open requests", sensitive, prayer => `- ${personName(prayer)} — ${prayer.shareableStatus}: ${safeLine(prayer.request).slice(0, 150)}`),
        "",
        group("Unlinked open requests", unlinked, prayer => `- Added ${dateLabel(prayer.dateAdded)}: ${safeLine(prayer.request).slice(0, 150)}`),
        "",
        "Next faithful step: review overdue follow-ups first, then archive answered requests when appropriate."
      ].join("\n");
      copyTextToClipboardOrPrompt("Prayer Steward Audit:", audit, "Prayer Steward audit copied.");
    }

    function addPrayerFromMeeting(meetingId) {
      const meeting = db.meetingNotes.find(item => item.id === meetingId);
      if (!meeting) return;
      const request = window.prompt("Prayer request from this meeting:", meeting.prayerRequestText || "");
      if (!request || !request.trim()) return;
      recordUndo("meeting prayer request");
      const prayer = {
        id: uid("prayer"),
        relatedPersonId: meeting.relatedPersonId,
        request: request.trim(),
        dateAdded: todayISO(),
        status: "Active",
        sensitivityLevel: meeting.sensitiveFlag ? "Sensitive" : "Normal",
        followUpDate: meeting.followUpDate || "",
        shareableStatus: meeting.sensitiveFlag ? "Private" : settings.defaultShareableStatus,
        answeredNote: "",
        createdFromMeetingNoteId: meeting.id,
        createdFromQuickGrabId: meeting.createdFromQuickGrabId,
        createdFollowUpTaskIds: [],
        createdAt: nowISO(),
        updatedAt: nowISO()
      };
      db.prayerRequests.unshift(prayer);
      meeting.createdPrayerRequestIds.push(prayer.id);
      meeting.updatedAt = nowISO();
      saveData();
      showToast("Prayer request added from meeting.");
      render();
    }

    function markPrayerAnswered(id) {
      updatePrayer(id, { status: "Answered", answeredAt: todayISO(), followUpDate: "" }, "Marked answered. It can stay here or move to the archive when you are ready.");
    }

    function addAnsweredNote(id) {
      const note = window.prompt("Answered prayer note:");
      if (!note || !note.trim()) return;
      updatePrayer(id, { answeredNote: note.trim(), status: "Answered", answeredAt: todayISO(), followUpDate: "" }, "Answered note added.");
    }

    function setPrayerFollowDate(id) {
      const prayer = db.prayerRequests.find(item => item.id === id);
      if (!prayer) return;
      const date = window.prompt("Follow-up date (YYYY-MM-DD):", prayer.followUpDate || daysFromNow(3));
      if (!date) return;
      updatePrayer(id, { followUpDate: date, status: "Follow-Up Needed" }, "Follow-up date set.");
    }

    function createTaskFromPrayer(id) {
      const prayer = db.prayerRequests.find(item => item.id === id);
      if (!prayer) return;
      const person = personById(prayer.relatedPersonId);
      const defaultTitle = "Ask about " + prayer.request.replace(/[.?!]+$/, "").slice(0, 58).toLowerCase() + ".";
      const title = window.prompt("Follow-up task:", defaultTitle);
      if (!title || !title.trim()) return;
      const due = window.prompt("Due date (YYYY-MM-DD):", prayer.followUpDate || daysFromNow(3)) || prayer.followUpDate || daysFromNow(3);
      recordUndo("prayer follow-up task");
      const task = {
        id: uid("task"),
        relatedPersonId: prayer.relatedPersonId,
        title: title.trim(),
        dueDate: due,
        status: "Today / Soon",
        sourceType: "Prayer Request",
        relatedPrayerRequestId: prayer.id,
        relatedMeetingNoteId: prayer.createdFromMeetingNoteId,
        createdFromQuickGrabId: prayer.createdFromQuickGrabId,
        createdAt: nowISO(),
        updatedAt: nowISO()
      };
      db.tasks.unshift(task);
      prayer.createdFollowUpTaskIds.push(task.id);
      prayer.status = "Follow-Up Needed";
      prayer.followUpDate = due;
      prayer.updatedAt = nowISO();
      if (person) {
        person.nextFollowUpDate = due;
        person.followUpReason = title.trim();
        person.updatedAt = nowISO();
      }
      saveData();
      showToast("Follow-up task created.");
      render();
    }

    function archivePrayer(id) {
      const prayer = db.prayerRequests.find(item => item.id === id);
      if (!prayer) return;
      const archivedFromStatus = prayer.status === "Archived" ? prayer.archivedFromStatus || "Active" : prayer.status;
      updatePrayer(id, {
        status: "Archived",
        archivedAt: todayISO(),
        archivedFromStatus
      }, prayer.status === "Answered" ? "Moved to Archived Prayer Requests." : "Prayer request archived.");
    }

    function restorePrayer(id) {
      const prayer = db.prayerRequests.find(item => item.id === id);
      if (!prayer) return;
      const restoredStatus = prayer.archivedFromStatus && prayer.archivedFromStatus !== "Archived" ? prayer.archivedFromStatus : "Active";
      updatePrayer(id, {
        status: restoredStatus,
        archivedAt: "",
        archivedFromStatus: ""
      }, "Prayer request restored.");
    }

    function updatePrayer(id, patch, message) {
      const prayer = db.prayerRequests.find(item => item.id === id);
      if (!prayer) return;
      recordUndo("prayer update");
      Object.assign(prayer, patch, { updatedAt: nowISO() });
      saveData();
      showToast(message);
      render();
    }

    function updateTask(id, patch, message) {
      const task = db.tasks.find(item => item.id === id);
      if (!task) return;
      recordUndo("task update");
      Object.assign(task, patch, { updatedAt: nowISO() });
      saveData();
      showToast(message);
      render();
    }

    function exportJson() {
      const exportedAt = nowISO();
      settings.lastBackupAt = exportedAt;
      saveSettings();
      const payload = currentPortablePayload();
      payload.exportedAt = exportedAt;
      downloadJson(payload, "ruf-ministry-hub-export-" + todayISO() + ".json");
      showToast("JSON export started.");
    }

    async function exportEncryptedJson() {
      try {
        if (!canUseWebCrypto()) {
          showToast("Encrypted backups are not available in this browser.");
          return;
        }
        const passphrase = window.prompt("Choose a passphrase for this backup file:");
        if (!passphrase || passphrase.length < 8) {
          showToast("Use at least 8 characters.");
          return;
        }
        const confirmPassphrase = window.prompt("Confirm the backup passphrase:");
        if (confirmPassphrase !== passphrase) {
          showToast("Passphrases did not match.");
          return;
        }
        const exportedAt = nowISO();
        settings.lastBackupAt = exportedAt;
        saveSettings();
        const envelope = await encryptPayload({ ...currentPortablePayload(), exportedAt }, passphrase, "ruf-ministry-hub-encrypted-backup");
        downloadJson(envelope, "ruf-ministry-hub-encrypted-backup-" + todayISO() + ".json");
        showToast("Encrypted backup export started.");
      } catch (error) {
        console.warn("Encrypted export failed", error);
        showToast("Encrypted export failed.");
      }
    }

    async function decodeBackupPayload(parsed) {
      if (parsed?.kind === "ruf-ministry-hub-encrypted-backup" || parsed?.kind === "ruf-ministry-hub-encrypted") {
        const passphrase = window.prompt("Enter the backup passphrase:");
        if (!passphrase) throw new Error("No backup passphrase entered.");
        return decryptPayload(parsed, passphrase);
      }
      return parsed;
    }

    function importJsonBackup() {
      const input = document.getElementById("import-backup-file");
      const file = input && input.files ? input.files[0] : null;
      if (!file) {
        showToast("Choose a backup file first.");
        return;
      }
      const reader = new FileReader();
      reader.onload = async event => {
        try {
          const parsed = JSON.parse(event.target.result);
          const payload = await decodeBackupPayload(parsed);
          normalizeData(payload.data || payload.db);
          if (!window.confirm("Restore this backup and replace current local app data?")) return;
          applyRestoredPayload(payload);
        } catch (error) {
          console.warn("Backup import failed", error);
          showToast("That backup could not be imported.");
        }
      };
      reader.onerror = () => showToast("Could not read that backup file.");
      reader.readAsText(file);
    }

    function resetDemoData() {
      if (settings.resetProtection) {
        const typed = window.prompt("This replaces local app data with fictional demo data. Type RESET to continue:");
        if (typed !== "RESET") return;
      } else if (!window.confirm("Reset the app to fictional demo data?")) {
        return;
      }
	      recordUndo("demo data reset");
	      db = demoData();
	      clearAllAutosaveDrafts();
	      saveData();
      view = {
        screen: settings.launchScreen || "today",
        personId: null,
        quickGrabId: null,
        processPreset: [],
        prayerFilter: "Active",
        search: "",
	        quickGrabDraftText: "",
	        globalSearch: "",
	        focusMode: settings.calmMode,
	        locked: Boolean(settings.appLockEnabled && settings.pinHash),
	        encryptionLocked: false,
	        reviewIndex: 0,
        expandedQuickGrabIds: [],
        expandedPrayerIds: []
      };
      showToast("Demo data reset.");
      render();
    }

    function showToast(message) {
      const toast = document.getElementById("toast");
      toast.textContent = message;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1800);
    }

    registerServiceWorker();
    captureQuickGrabFromUrl();
    render();
    hydrateFromIndexedDb();
    if (typeof window !== "undefined") {
      window.addEventListener("pageshow", importQuickGrabFromCurrentUrl);
      window.addEventListener("focus", importQuickGrabFromCurrentUrl);
    }
  </script>
</body>
</html>
