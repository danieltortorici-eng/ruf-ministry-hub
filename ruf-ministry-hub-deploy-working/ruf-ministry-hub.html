<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#214f46">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Calm OS">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="ruf-ministry-hub.webmanifest">
  <link rel="icon" href="ruf-ministry-hub-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="ruf-ministry-hub-icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="ruf-ministry-hub-icon-192.png">
  <title>Calm OS · RUF Ministry Hub</title>
  <style>
    :root {
      --ink: #17231f;
      --soft-ink: #394942;
      --muted: #63706a;
      --paper: #f4f5f0;
      --surface: #fffefa;
      --surface-muted: #f8f9f5;
      --line: #dce3dc;
      --control-line: #6f8077;
      --accent: #2f6c5e;
      --accent-strong: #214f46;
      --accent-soft: #e9f3ee;
      --terra: #a65f3e;
      --gold: #a76f18;
      --violet: #6554b3;
      --rose: #b34b6d;
      --ok: #287d4f;
      --warning: #9a6a00;
      --danger: #a23f3f;
      --shadow: 0 10px 30px rgba(28, 49, 42, 0.06);
      --shadow-raised: 0 16px 42px rgba(28, 49, 42, 0.1);
      --radius-sm: 10px;
      --radius: 16px;
      --radius-lg: 22px;
      --space-1: 4px;
      --space-2: 8px;
      --space-3: 12px;
      --space-4: 16px;
      --space-6: 24px;
      --space-8: 32px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-padding-bottom: 120px;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
    }

    .skip-link {
      position: fixed;
      top: calc(8px + env(safe-area-inset-top));
      left: calc(8px + env(safe-area-inset-left));
      z-index: 50;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--ink);
      color: #fff;
      font-weight: 780;
    }

    .skip-link[hidden] {
      display: none;
    }

    .skip-link:focus {
      width: auto;
      height: auto;
      padding: 10px 14px;
      overflow: visible;
      clip-path: none;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      background: #1f332d;
      color: #f5f7fa;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      display: grid;
      gap: 4px;
      padding: 0 6px;
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: #c8d1dc;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav button {
      min-height: 44px;
      border-radius: var(--radius);
      color: #edf2f7;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      font-weight: 650;
    }

    .nav button:hover,
    .nav button.active {
      background: rgba(255,255,255,0.1);
    }

    .sidebar-note {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.14);
      padding: 14px 6px 0;
      color: #d5dde6;
      line-height: 1.45;
      font-size: 0.88rem;
    }

    .content {
      min-width: 0;
      padding: 32px clamp(20px, 4vw, 56px);
    }

    .app-frame.focus-mode .content {
      max-width: 1180px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: var(--space-8);
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.7rem, 2.4vw, 2.45rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .page-kicker {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.45;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      align-items: start;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
    }

    .section {
      display: grid;
      gap: 12px;
      margin-bottom: var(--space-8);
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
    }

    .section-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-3);
      margin-top: var(--space-4);
      padding: 2px;
    }

    .section-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .item.compact {
      padding: 12px;
      gap: 8px;
    }

    .item-title-row,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row.wrap {
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .item-title {
      font-weight: 760;
      line-height: 1.25;
    }

    .item-preview {
      margin: 0;
      color: var(--soft-ink);
      line-height: 1.45;
    }

    .preserve-lines {
      white-space: pre-line;
    }

    .meta {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef1f5;
      color: #344052;
      border: 1px solid #dce2ea;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { background: #e8f4ef; color: #24594b; border-color: #c9e6db; }
    .pill.gold { background: #fff4d8; color: #7a5600; border-color: #f0d18a; }
    .pill.violet { background: #eeeafd; color: #4d3e97; border-color: #d9d0fa; }
    .pill.rose { background: #f8e9ef; color: #873552; border-color: #ecc2d1; }
    .pill.gray { background: #f1f3f6; color: #4c5665; border-color: #dfe4ec; }

    .button {
      min-height: 44px;
      border-radius: var(--radius-sm);
      padding: 9px 13px;
      background: #eef2f6;
      color: var(--ink);
      font-weight: 760;
      border: 1px solid #d9e1eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.2;
    }

    .button:hover {
      filter: brightness(0.98);
    }

    .button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button.danger {
      background: #f8e9e9;
      color: var(--danger);
      border-color: #e8c6c6;
    }

    .button.plain {
      background: transparent;
      border-color: transparent;
      color: var(--accent-strong);
      padding-left: 4px;
      padding-right: 4px;
    }

    .button.small {
      min-height: 44px;
      padding: 8px 11px;
      font-size: 0.86rem;
    }

    .button.full {
      width: 100%;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .focus-hero {
      display: grid;
      gap: 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .focus-hero h2 {
      margin: 0;
      font-size: 1.22rem;
      letter-spacing: 0;
    }

    .focus-step {
      display: grid;
      gap: 4px;
      padding: 13px;
      border-radius: var(--radius);
      background: var(--accent-soft);
      border: 1px solid #cde7dd;
    }

    .focus-step-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .focus-step strong {
      color: var(--accent-strong);
      line-height: 1.35;
    }

    .focus-card {
      border-left: 4px solid #dce6ef;
    }

    .focus-card.important {
      border-left-color: var(--gold);
    }

    .focus-card.today {
      border-left-color: var(--terra);
    }

    .next-step-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--soft-ink);
      font-size: 0.9rem;
    }

    .next-step-line strong {
      color: var(--ink);
    }

    .extra-actions {
      display: none;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .extra-actions.is-open {
      display: flex;
    }

    .app-frame:not(.focus-mode) .extra-actions {
      display: flex;
    }

    .app-frame.advanced-actions .extra-actions {
      display: flex;
    }

    .editable-copy {
      display: inline-block;
      border: 0;
      padding: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      border-radius: 6px;
      outline: 2px dashed #9ccdbd;
      outline-offset: 3px;
      cursor: text;
    }

    .editable-copy:hover {
      background: #eef7f3;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fff;
    }

    .setting-row .item-title {
      margin-bottom: 3px;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      min-width: 52px;
      min-height: 44px;
      border-radius: 999px;
      background: var(--control-line);
      padding: 10px 3px;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch span {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(23, 32, 42, 0.24);
      transition: transform 140ms ease;
    }

    .switch input:checked + span {
      transform: translateX(22px);
      background: #ffffff;
    }

    .switch.is-on {
      background: var(--accent);
    }

    .switch:focus-within {
      outline: 3px solid #b56d00;
      outline-offset: 3px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label,
    .field-label {
      font-size: 0.86rem;
      color: var(--soft-ink);
      font-weight: 760;
    }

    .field-group {
      min-width: 0;
      margin: 0;
      padding: 0;
      border: 0;
      display: grid;
      gap: 8px;
    }

    .field-group legend {
      padding: 0;
      margin-bottom: 7px;
      color: var(--soft-ink);
      font-size: 0.86rem;
      font-weight: 760;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--control-line);
      border-radius: var(--radius);
      background: white;
      color: var(--ink);
      padding: 10px 11px;
      min-height: 44px;
      outline: none;
    }

    .textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.45;
    }

    .textarea.small {
      min-height: 92px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 111, 99, 0.16);
    }

    .quick-box {
      display: grid;
      gap: 14px;
    }

    .quick-box .textarea {
      min-height: 210px;
      font-size: 1.05rem;
    }

    .empty {
      border: 1px dashed #cbd4df;
      border-radius: var(--radius);
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.65);
      line-height: 1.45;
    }

    .notice {
      border-radius: var(--radius);
      border: 1px solid #dfe4ec;
      background: #f4f7fa;
      color: var(--soft-ink);
      padding: 12px;
      line-height: 1.45;
    }

    .notice.sensitive {
      border-color: #ecc2d1;
      background: #fff5f8;
      color: #753248;
    }

    .notice.backup {
      border-color: #f0d18a;
      background: #fff8e7;
      color: #6f4d00;
    }

    .update-notice {
      margin: 0 0 var(--space-3);
      padding: 8px 12px;
    }

    .notice.secure {
      border-color: #cbe7dc;
      background: #eef7f3;
      color: #23544b;
    }

    .notice.danger {
      border-color: #efc8c8;
      background: #fff3f3;
      color: #7c2f2f;
    }

    .lock-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #202731;
    }

    .lock-panel {
      width: min(100%, 420px);
      display: grid;
      gap: 16px;
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid #d8dee8;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
    }

    .manual-list {
      display: grid;
      gap: 10px;
    }

    .manual-list details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 12px;
    }

    .manual-list summary {
      display: flex;
      align-items: center;
      min-height: 44px;
      padding: 6px 4px;
      cursor: pointer;
      font-weight: 800;
      color: var(--ink);
    }

    .manual-list ol,
    .manual-list ul {
      margin: 10px 0 0;
      padding-left: 22px;
      color: var(--soft-ink);
      line-height: 1.45;
    }

    .lock-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .review-card {
      display: grid;
      gap: 14px;
      min-height: 340px;
      align-content: start;
    }

    .review-progress {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 760;
      font-size: 0.9rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #ffffff;
      color: var(--soft-ink);
      line-height: 1.35;
      min-height: 44px;
    }

    .check input {
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .profile-photo {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 2px solid #d8dee8;
      background: #eef2f6;
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 1.45rem;
      font-weight: 850;
      flex: 0 0 auto;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .people-toolbar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: var(--space-3);
      align-items: end;
      max-width: 760px;
    }

    .person-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr));
      gap: var(--space-3);
    }

    .person-card {
      min-width: 0;
    }

    .person-card-open {
      width: 100%;
      min-height: 108px;
      display: grid;
      grid-template-columns: 48px minmax(0, 1fr);
      gap: var(--space-3);
      align-items: start;
      padding: var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      box-shadow: 0 4px 16px rgba(28, 49, 42, 0.035);
    }

    .person-card-open:hover {
      border-color: #b9ccc2;
      background: var(--surface-muted);
    }

    .person-thumbnail {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      overflow: hidden;
      display: grid;
      place-items: center;
      flex: 0 0 48px;
      background: var(--accent-soft);
      color: var(--accent-strong);
      font-weight: 850;
      line-height: 1;
    }

    .person-thumbnail img {
      display: block;
      width: 48px;
      height: 48px;
      object-fit: cover;
    }

    .person-card-copy {
      min-width: 0;
      display: grid;
      gap: var(--space-1);
    }

    .person-card-name {
      display: block;
      overflow-wrap: anywhere;
      font-size: 1.02rem;
      font-weight: 820;
      line-height: 1.2;
    }

    .person-card-identity,
    .person-card-care,
    .person-card-reason {
      display: block;
      color: var(--muted);
      line-height: 1.35;
    }

    .person-card-identity {
      font-size: 0.88rem;
    }

    .person-card-care {
      color: var(--soft-ink);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .person-card-followup {
      display: grid;
      gap: 2px;
      margin-top: var(--space-1);
    }

    .person-card-date {
      display: block;
      color: var(--accent-strong);
      font-size: 0.9rem;
      font-weight: 800;
      line-height: 1.3;
    }

    .person-card-reason {
      display: -webkit-box;
      overflow: hidden;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 2;
      font-size: 0.84rem;
    }

    .profile-name {
      margin: 0;
      font-size: clamp(1.7rem, 2.5vw, 2.6rem);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .profile-back {
      margin-bottom: var(--space-3);
    }

    .profile-essential {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: var(--space-4);
      align-items: center;
      padding: var(--space-6);
      border-radius: var(--radius-lg);
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .profile-essential-copy {
      min-width: 0;
      display: grid;
      gap: var(--space-2);
    }

    .profile-identity-line {
      margin: 0;
      color: var(--muted);
      line-height: 1.35;
    }

    .profile-meta-line {
      display: flex;
      flex-wrap: wrap;
      gap: 6px var(--space-3);
      color: var(--soft-ink);
      font-size: 0.9rem;
      line-height: 1.4;
    }

    .profile-meta-line span + span::before {
      content: "·";
      margin-right: var(--space-3);
      color: var(--muted);
    }

    .profile-followup-reason {
      margin: 0;
      color: var(--soft-ink);
      line-height: 1.4;
    }

    .right-now {
      display: grid;
      gap: 0;
      padding: 0 var(--space-4);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .right-now-row {
      display: grid;
      grid-template-columns: 88px minmax(0, 1fr);
      gap: var(--space-3);
      padding: var(--space-3) 0;
      align-items: start;
    }

    .right-now-row + .right-now-row {
      border-top: 1px solid var(--line);
    }

    .right-now-label {
      color: var(--accent-strong);
      font-weight: 820;
    }

    .right-now-value {
      min-width: 0;
      color: var(--soft-ink);
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .profile-secondary-actions {
      display: flex;
      flex-wrap: wrap;

      const d = new Date(date);

    function daysFromNow(days) {

    function addCalendarDaysISO(value, days) {
      const parts = calendarDateParts(value);
      const amount = Number(days);
      if (!parts || !Number.isInteger(amount)) return "";
      return localISODate(new Date(parts.year, parts.month - 1, parts.day + amount, 12));
    }

    function addCalendarMonthsISO(value, months) {
      const parts = calendarDateParts(value);
      const amount = Number(months);
      if (!parts || !Number.isInteger(amount)) return "";
      const targetMonthStart = new Date(parts.year, parts.month - 1 + amount, 1, 12);
      const lastDay = new Date(targetMonthStart.getFullYear(), targetMonthStart.getMonth() + 1, 0, 12).getDate();
      return localISODate(new Date(targetMonthStart.getFullYear(), targetMonthStart.getMonth(), Math.min(parts.day, lastDay), 12));
    }

    function isISODateString(value) {
      const raw = String(value || "");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return false;
      const [year, month, day] = raw.split("-").map(Number);
      const d = new Date(year, month - 1, day);
      return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
    }

    function startOfToday() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function calendarDateParts(value) {
      if (value instanceof Date) {
        if (Number.isNaN(value.getTime())) return null;
        return { year: value.getFullYear(), month: value.getMonth() + 1, day: value.getDate() };
      }
      const raw = String(value || "").trim();
      const dateOnly = raw.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (dateOnly) {
        const year = Number(dateOnly[1]);
        const month = Number(dateOnly[2]);
        const day = Number(dateOnly[3]);
        const check = new Date(year, month - 1, day, 12);
        if (check.getFullYear() !== year || check.getMonth() + 1 !== month || check.getDate() !== day) return null;
        return { year, month, day };
      }
      const timestamp = new Date(raw);
      if (Number.isNaN(timestamp.getTime())) return null;
      return { year: timestamp.getFullYear(), month: timestamp.getMonth() + 1, day: timestamp.getDate() };
    }

    function calendarDateFromParts(parts) {
      return parts ? new Date(parts.year, parts.month - 1, parts.day, 12) : null;
    }

    function calendarDayNumber(value) {
      const parts = calendarDateParts(value);
      return parts ? Math.floor(Date.UTC(parts.year, parts.month - 1, parts.day) / 86400000) : null;
    }

    function calendarDayDelta(value, reference = new Date()) {
      const target = calendarDayNumber(value);
      const origin = calendarDayNumber(reference);
      return target === null || origin === null ? null : target - origin;
    }

    function formatCalendarDay(value, reference = new Date()) {
      const parts = calendarDateParts(value);
      const referenceParts = calendarDateParts(reference);
      if (!parts || !referenceParts) return "";
      const options = { month: "short", day: "numeric" };
      if (parts.year !== referenceParts.year) options.year = "numeric";
      return new Intl.DateTimeFormat("en-US", options).format(calendarDateFromParts(parts));
    }

    function formatWeekday(value) {
      const parts = calendarDateParts(value);
      return parts ? new Intl.DateTimeFormat("en-US", { weekday: "long" }).format(calendarDateFromParts(parts)) : "";
    }

    function formatInteractionDate(value, reference = new Date()) {
      const delta = calendarDayDelta(value, reference);
      if (delta === null) return "No interaction recorded";
      if (delta === 0) return "Met today";
      if (delta === -1) return "Met yesterday";
      if (delta < -1 && delta > -7) return `Met ${Math.abs(delta)} days ago`;
      if (delta <= -7 && delta > -49) {
        const weeks = Math.max(1, Math.round(Math.abs(delta) / 7));
        return `Met ${weeks} week${weeks === 1 ? "" : "s"} ago`;
      }
      return `Met ${formatCalendarDay(value, reference)}`;
    }

    function formatFollowUpDate(value, reference = new Date()) {

      if (delta === null) return "No follow-up planned";
      if (delta < 0) return `Follow-up overdue by ${Math.abs(delta)} day${delta === -1 ? "" : "s"}`;
      if (delta === 0) return "Follow up today";
      if (delta === 1) return "Follow up tomorrow";
      if (delta < 7) return `Follow up ${formatWeekday(value)}`;
      if (delta < 14) return "Follow up next week";
      return `Follow up ${formatCalendarDay(value, reference)}`;
