    function quickGrabMockSensitivityWarnings(grab) {
      const raw = String(grab?.rawContent || "");
      const warnings = [];
      if (recordIsSensitive(grab, "quickGrabs")) warnings.push("This Quick Grab is already marked sensitive.");
      if (/\b(confidential|private|do not share|pastoral|abuse|trauma|suicid|self[- ]?harm|addiction|porn|pregnan|divorce|affair)\b/i.test(raw)) {
        warnings.push("This text appears pastoral or private. Review carefully before saving anything.");
      }
      if (/\b(anxiety|depression|mental health|hospital|surgery|family crisis|grief|death|counseling)\b/i.test(raw)) {
        warnings.push("This may include sensitive care details. Keep only what is needed for faithful follow-up.");
      }
      return Array.from(new Set(warnings));
    }

    function quickGrabMockFlags(grab) {
      const raw = String(grab?.rawContent || "");
      const lower = raw.toLowerCase();
      const parsed = parseQuickGrab(raw, grab?.category ? [grab.category] : [], grab?.urgency || "Whenever", db.people);
      const possiblePeople = parsed.detectedPersonName ? similarPeople(parsed.detectedPersonName) : [];
      const personMatchAmbiguous = possiblePeople.length > 1;
      const matchedPerson = !personMatchAmbiguous && parsed.relatedPersonId ? personById(parsed.relatedPersonId) : null;
      const hasMeeting = Boolean(parsed.detectedMeetingSummary) || /\b(met|meeting|coffee|lunch|called|talked|sat down|conversation)\b/i.test(raw);
      const hasPrayer = Boolean(parsed.detectedPrayerRequest) || /\b(pray|prayer|wisdom|sick|surgery|anxiety|hard|grief)\b/i.test(raw);
      const hasFollowUp = Boolean(parsed.detectedFollowUp || parsed.detectedFollowUpDate) || /\b(follow up|check in|ask .* about|send .* text|remind me|reach out)\b/i.test(raw);
      const hasDonor = grab?.category === "Donors" || /\b(donor|supporter|alumni|gift|pledge|thank[- ]?you|support)\b/i.test(raw);
      const hasTeaching = grab?.category === "Teaching" || /\b(sermon|lesson|teaching|bible study|illustration|john|romans|psalm)\b/i.test(raw);
      const hasPersonContext = grab?.category === "People" || Boolean(matchedPerson || parsed.detectedPersonName) || hasMeeting || hasPrayer || hasFollowUp;
      const noGoodPersonMatch = Boolean(parsed.detectedPersonName && !matchedPerson);
      const ambiguousPerson = noGoodPersonMatch || (!parsed.detectedPersonName && hasPersonContext && !matchedPerson);
      const ambiguousFollowUp = hasFollowUp && !parsed.detectedFollowUpDate;
      return {
        raw,
        lower,
        parsed,
        possiblePeople,
        personMatchAmbiguous,
        matchedPerson,
        hasMeeting,
        hasPrayer,
        hasFollowUp,
        hasDonor,
        hasTeaching,
        hasPersonContext,
        noGoodPersonMatch,
        ambiguousPerson,
        ambiguousFollowUp,
        warnings: quickGrabMockSensitivityWarnings(grab)
      };
    }

    function quickGrabMockProposedActions(grab, flags) {
      const actions = [];
      const personLabel = flags.matchedPerson ? flags.matchedPerson.name : flags.parsed.detectedPersonName || "Unlinked person";
      if (flags.hasMeeting) {
        actions.push({
          actionType: "createMeetingNote",
          label: `Draft meeting note for ${personLabel}`,
          meetingDate: flags.parsed.detectedDate || todayISO(),
          summary: flags.parsed.detectedMeetingSummary || grab.rawContent
        });
      }
      if (flags.hasPrayer) {
        actions.push({
          actionType: "createPrayerRequest",
          label: `Draft prayer request for ${personLabel}`,
          request: flags.parsed.detectedPrayerRequest || extractPrayer(grab.rawContent)
        });
      }
      if (flags.hasFollowUp) {
        actions.push({
          actionType: "createFollowUpTask",
          label: `Draft follow-up for ${personLabel}`,
          title: flags.parsed.detectedFollowUp || extractFollowUp(grab.rawContent) || "Check in",
          dueDate: flags.parsed.detectedFollowUpDate || ""
        });
      }
      if (flags.hasPersonContext && !flags.hasMeeting) {
        actions.push({
          actionType: "createNote",
          label: `Draft profile note for ${personLabel}`,
          content: grab.rawContent
        });
      }
      if (flags.hasDonor) {
        actions.push({
          actionType: "draftDonorUpdate",
          label: "Draft donor update idea",
          draft: grab.rawContent
        });
      }
      if (flags.hasTeaching) {
        actions.push({
          actionType: "createNote",
          label: "Draft teaching idea note",
          noteType: "Teaching Idea",
          content: grab.rawContent
        });
      }
      if (flags.warnings.length) {
        actions.push({
          actionType: "markSensitive",
          label: "Mark this item sensitive before saving real records"
        });
      }
      if (flags.noGoodPersonMatch) {
        actions.push({
          actionType: "createPerson",
          label: `Create a new person candidate for ${flags.parsed.detectedPersonName}`,
          name: flags.parsed.detectedPersonName
        });
      }
      if (!actions.length) {
        actions.push({
          actionType: "noAction",
          label: "Keep as Quick Grab until more context is available"
        });
      }
      return actions;
    }

    function quickGrabMockConfidence(flags, actions) {
      if (flags.noGoodPersonMatch || flags.possiblePeople.length > 1 || (flags.ambiguousPerson && flags.ambiguousFollowUp)) return "low";
      if (flags.ambiguousPerson || flags.ambiguousFollowUp || actions.some(action => action.actionType === "noAction")) return "medium";
      return "high";
    }

    function quickGrabBackendModeEnabled() {
      return settings.quickGrabAiMode === "backendQuickGrab";
    }

    function quickGrabAiModeLabel() {
      return quickGrabBackendModeEnabled() ? "Backend Quick Grab" : "Local Mock Only";
    }

    function quickGrabAiGateTitle(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled() ? "Use Backend Quick Grab?" : "Use Mock AI?";
    }

    function quickGrabAiGateKicker(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) {
        return "Backend Quick Grab may send only this reviewed Quick Grab payload to the app server route after approval. No API keys are stored in the browser.";
      }
      return "No external data is sent yet. This gate is here now so the same review step can protect future real AI calls.";
    }

    function quickGrabAiGateConfirmLabel(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) {
        return "I reviewed the context and approve using only this Quick Grab with the backend Quick Grab route.";
      }
      return "I reviewed the context and understand no real AI call will be made in this build.";
    }

    function quickGrabAiGateContinueLabel(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled() ? "Continue with Backend Quick Grab" : "Continue with Mock AI";
    }

    function aiGateModeLabel(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" ? quickGrabAiModeLabel() : "Local Mock Only";
    }

    function aiGateAllowsContinue(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) return true;
      return settings.aiMockMode;
    }

    function quickGrabCandidatePeopleForBackend(grab) {
      const candidates = quickGrabCandidateRecordsForBackend(grab)
        .filter(person => aiRecordAllowedInContext(person, "people"))
        .map(person => ({ id: person.id, name: person.name }));
      const seen = new Set();
      return candidates.filter(person => {
        if (seen.has(person.id)) return false;
        seen.add(person.id);
        return true;
      }).slice(0, 8);
    }

    function quickGrabCandidateRecordsForBackend(grab) {
      const flags = quickGrabMockFlags(grab);
      const linkedPerson = grab?.relatedPersonId ? personById(grab.relatedPersonId) : null;
      return [linkedPerson, flags.matchedPerson, ...flags.possiblePeople]
        .filter(Boolean)
        .map(person => personById(person.id) || person)
        .filter(person => person.id && person.name);
    }

    function quickGrabBlockedPeopleForBackend(grab) {
      return quickGrabCandidateRecordsForBackend(grab)
        .filter(person => !aiRecordAllowedInContext(person, "people"));
    }

    function buildQuickGrabBackendPayload(grab) {
      const privacyTier = aiPrivacyTierForRecord(grab, "quickGrabs");
      return {
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalType: "quickGrabParse",
        rawQuickGrab: String(grab.rawContent || "").slice(0, 4000),
        today: todayISO(),
        tags: grab.category && grab.category !== "Unsure" ? [grab.category] : [],
        urgency: grab.urgency || "Whenever",
        privacyTier,
        sensitivityLevel: grab.sensitivityLevel || "",
        sensitiveFlag: grab.sensitiveFlag === true,
        sendToAiApproved: true,
        candidatePeople: quickGrabCandidatePeopleForBackend(grab)
      };
    }

    function normalizeBackendQuickGrabAction(raw = {}, index = 0) {
      const action = normalizeAiProposedAction(raw, index);
      const body = String(action.body || "");
      return {
        ...action,
        content: action.content || body,
        summary: action.summary || body,
        request: action.request || body,
        whatToRemember: action.whatToRemember || body,
        meetingDate: action.meetingDate || action.date || "",
        dueDate: action.dueDate || action.followUpDate || action.date || ""
      };
    }

    function normalizeBackendQuickGrabProposal(responseBody, grab) {
      const source = responseBody && responseBody.proposal && typeof responseBody.proposal === "object" ? responseBody.proposal : {};
      const proposal = normalizeAiProposal({
        ...source,
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalKey: captureProposalKey(grab),
        sourceCaptureRevision: grab.captureRevision,
        processorVersion: CAPTURE_PROCESSOR_VERSION,
        proposalType: "quickGrabParse",
        status: "pending",
        requiresReview: true,
        sendToAiApproved: false,
        model: source.model || (responseBody?.mode === "real" ? "backend-openai" : "backend-mock"),
        warnings: Array.from(new Set([
          ...(Array.isArray(source.warnings) ? source.warnings : []),
          responseBody?.mode === "real"
            ? "Backend Quick Grab response. Review before saving anything to ministry records."
            : "Backend Quick Grab returned mock output. Review before saving anything to ministry records."
        ])),
        result: {
          ...(source.result && typeof source.result === "object" ? source.result : {}),
          possiblePersonId: source.relatedPersonIdSuggestion || source.result?.possiblePersonId || "",
          possiblePersonName: source.detectedPersonName || source.result?.possiblePersonName || "",
          backendRoute: responseBody?.route || "/api/ai/quick-grab",
          backendMode: responseBody?.mode || "unknown",
          proposalOnly: true
        }
      });
      proposal.proposedActions = proposal.proposedActions.map(normalizeBackendQuickGrabAction);
      if (!proposal.title) proposal.title = "Quick Grab backend proposal";
      if (!proposal.summary) proposal.summary = "Review these Quick Grab suggestions before changing ministry records.";
      if (!proposal.contextPreview) proposal.contextPreview = "One Quick Grab, today's date, privacy flags, selected tags/urgency, and candidate people names/ids only.";
      if (!proposal.rawInputPreview) proposal.rawInputPreview = "Backend Quick Grab did not return raw ministry content.";
      return proposal;
    }

    function saveQuickGrabAiProposal(proposal, undoLabel, toastMessage) {
      if (recoveryMutationBlocked()) return false;
      const grab = db.quickGrabs.find(item => item.id === proposal?.sourceId);
      if (grab) {
        proposal.proposalKey = proposal.proposalKey || captureProposalKey(grab);
        proposal.sourceCaptureRevision = grab.captureRevision;
        proposal.processorVersion = CAPTURE_PROCESSOR_VERSION;
      }
      const existing = proposal?.proposalKey
        ? (db.aiProposals || []).find(item => item.proposalKey === proposal.proposalKey)
        : null;
      if (existing) {
        if (grab) {
          grab.proposalKey = existing.proposalKey;
          grab.processingState = "review";
          grab.processingError = "";
          grab.updatedAt = nowISO();
          saveData();
        }
        showToast("Suggested updates already exist for this capture.");
        openCaptureProposal(existing);
        return existing;
      }
      recordUndo(undoLabel);
      proposal = prepareAiProposalForStorage(proposal);
      db.aiProposals.unshift(proposal);
      if (grab) {
        grab.proposalKey = proposal.proposalKey;
        grab.processingState = "review";
        grab.processingError = "";
        grab.updatedAt = nowISO();
      }
      saveData();
      view.sheet = null;
      view.screen = "aiReview";
      view.aiReviewFilter = ["approved", "partiallyApproved"].includes(proposal.status)
        ? "Approved"
        : proposal.status === "rejected" ? "Rejected" : proposal.status === "archived" ? "Archived" : "Pending";
      view.aiReviewFocusId = proposal.id;
      showToast(toastMessage);
      render();
      return proposal;
    }

    function backendQuickGrabSafeErrorMessage() {
      return "Backend Quick Grab is not available. No records were changed.";
    }

    async function restoreCancelledQuickGrabMutation(grabId, beforeGrab, beforeAutoMemoryVault, beforeAutoMemoryLocal) {
      const restoredDb = cloneJson(db);
      const currentIndex = restoredDb.quickGrabs.findIndex(item => item.id === grabId);
      if (currentIndex >= 0) restoredDb.quickGrabs[currentIndex] = cloneJson(beforeGrab);
      if (settings.localEncryptionEnabled && vaultPassphrase) {
        const recoverySettlement = {
          recoveryEpoch,
          passphrase: vaultPassphrase,
          targetRevision: vaultSaveRequestedRevision,
          payloadGeneration: vaultPayloadGeneration,
          initialLeaseId: activeVaultFlushLease?.id ?? null,
          leaseSequenceAtStart: vaultFlushLeaseSequence
        };
        if (!(await settleRecoveryOperationWithinDeadline(
          () => settleVaultBeforeRecovery(),
          "Device Vault cancellation settlement",
          { onTimeout: () => revokeVaultFlushLeaseForRecoverySettlement(recoverySettlement) }
        ))) return false;
        const ownedEpoch = recoveryEpoch;
        const ownedPassphrase = vaultPassphrase;
        const ownedRevision = vaultSaveRequestedRevision;
        if (vaultSaveCompletedRevision !== ownedRevision) return false;
        const restoredMemory = cloneJson(beforeAutoMemoryVault);
        const stagedPayload = cloneJson({
          data: restoredDb,
          customCopy,
          autosaveDrafts: loadAutosaveDrafts(),
          autoMemoryVault: restoredMemory
        });
        const envelope = await settleRecoveryOperationWithinDeadline(
          () => encryptPayload(stagedPayload, ownedPassphrase),
          "Device Vault cancellation encryption"
        );
        const ownershipIsCurrent = () => recoveryTransactionPending
          && recoveryEpoch === ownedEpoch
          && vaultPassphrase === ownedPassphrase
          && vaultSaveRequestedRevision === ownedRevision
          && vaultSaveCompletedRevision === ownedRevision;
        if (!ownershipIsCurrent()) return false;
        const nextSettings = { ...settings, localEncryptionUpdatedAt: envelope.encryptedAt };
        const encryptedKeys = [ENCRYPTED_STORAGE_KEY, SETTINGS_KEY, STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, AUTO_MEMORY_KEY];
        const indexedDbSnapshot = canUseIndexedDb() ? await readIndexedDbSnapshot(encryptedKeys) : null;
        if (!ownershipIsCurrent()) return false;
        const localEntries = [
          [ENCRYPTED_STORAGE_KEY, JSON.stringify(envelope)],
          [STORAGE_KEY, null],
          [COPY_KEY, null],
          [AUTOSAVE_KEY, null],
          [AUTO_MEMORY_KEY, null],
          [SETTINGS_KEY, JSON.stringify(nextSettings)]
        ];
        const localSnapshot = writeLocalStorageBatch(localEntries);
        let indexedDbCommitted = false;
        try {
          if (canUseIndexedDb()) {
            await commitEncryptedVaultToIndexedDb(envelope, nextSettings);
            indexedDbCommitted = true;
          }
          if (!ownershipIsCurrent()) throw new Error("Device Vault cancellation ownership changed before publication.");
        } catch (error) {
          restoreLocalStorageSnapshot(localSnapshot);
          if (indexedDbCommitted && indexedDbSnapshot) {
            try { await restoreIndexedDbSnapshot(indexedDbSnapshot); } catch (restoreError) {
              console.warn("Could not restore Device Vault cancellation persistence", restoreError);
            }
          }
          throw error;
        }
        db = restoredDb;
        memoryVaultCache = restoredMemory;
        settings.localEncryptionUpdatedAt = nextSettings.localEncryptionUpdatedAt;
        vaultSaveRequestedRevision = ownedRevision + 1;
        vaultSaveCompletedRevision = ownedRevision + 1;
        return true;
      }
      const localSnapshot = writeLocalStorageBatch([
        [STORAGE_KEY, JSON.stringify(restoredDb)],
        [AUTO_MEMORY_KEY, beforeAutoMemoryLocal]
      ]);
      try {
        if (canUseIndexedDb()) {
          const autoMemoryValue = beforeAutoMemoryLocal === null ? undefined : JSON.parse(beforeAutoMemoryLocal);
          await writeIndexedDbBatch([
            [STORAGE_KEY, restoredDb],
            [AUTO_MEMORY_KEY, autoMemoryValue]
          ]);
        }
      } catch (error) {
        restoreLocalStorageSnapshot(localSnapshot);
        throw error;
      }
      db = restoredDb;
      return true;
    }

    async function createQuickGrabBackendAiProposal(grabId) {
      if (recoveryMutationBlocked()) return false;
      const grab = db.quickGrabs.find(item => item.id === grabId);
      if (!grab) {
        showToast("That Quick Grab is no longer available.");
        return;
      }
      const privacyTier = aiPrivacyTierForRecord(grab, "quickGrabs");
      if (privacyTier === "Do Not Send to AI") {
        markCaptureProcessingFailure(grabId, "This Quick Grab is marked Do Not Send to AI.");
        showToast("This Quick Grab is marked Do Not Send to AI.");
        return;
      }
      if (!aiRecordAllowedInContext(grab, "quickGrabs")) {
        markCaptureProcessingFailure(grabId, `${privacyTier} context is blocked by AI privacy settings.`);
        showToast(`${privacyTier} context is blocked by AI privacy settings.`);
        return;
      }
      if (quickGrabBlockedPeopleForBackend(grab).length) {
        markCaptureProcessingFailure(grabId, "A linked or candidate person is blocked by AI privacy settings. Your capture is safe and stays local.");
        showToast("A linked or candidate person is blocked by AI privacy settings.");
        return;
      }
      if (grab.processingState === "processing") {
        showToast("This capture is already processing. Your text is safe.");
        return false;
      }
      const payload = buildQuickGrabBackendPayload(grab);
      const beforeGrab = cloneJson(grab);
      const beforeAutoMemoryVault = cloneJson(loadAutoMemoryVault());
      const beforeAutoMemoryLocal = settings.localEncryptionEnabled ? null : localStorage.getItem(AUTO_MEMORY_KEY);
      const abortController = typeof AbortController !== "undefined" ? new AbortController() : null;
      const mutation = registerActiveMutation("backend-quick-grab", { blocking: false });
      mutation.cancel = async () => {
        try { abortController?.abort(); } catch (error) {}
        return restoreCancelledQuickGrabMutation(grabId, beforeGrab, beforeAutoMemoryVault, beforeAutoMemoryLocal);
      };
      grab.processingState = "processing";
      grab.processingError = "";
      grab.lastProcessingAttemptAt = nowISO();
      saveData();
      try {
        const response = await fetch("/api/ai/quick-grab", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
          ...(abortController ? { signal: abortController.signal } : {})
        });
        if (!activeMutationIsCurrent(mutation)) return false;
        const body = await response.json().catch(() => ({}));
        if (!activeMutationIsCurrent(mutation)) return false;
        if (!response.ok || body?.ok !== true || !body.proposal) {
          throw new Error("safe_backend_quick_grab_unavailable");
        }
        const proposal = normalizeBackendQuickGrabProposal(body, grab);
        saveQuickGrabAiProposal(proposal, "backend Quick Grab AI proposal", "Backend Quick Grab proposal created. Review before saving anything.");
        return true;
      } catch {
        if (!activeMutationIsCurrent(mutation)) return false;
        if (settings.aiMockMode) {
          markCaptureProcessingFailure(grabId, "Backend processing was unavailable. Your capture is safe.");
          showToast("Backend Quick Grab was unavailable. Creating a local mock proposal instead.");
          createQuickGrabMockAiProposal(grabId);
          return true;
        }
        markCaptureProcessingFailure(grabId, "Processing is unavailable. Your capture is saved and can be retried.");
        showToast(backendQuickGrabSafeErrorMessage());
        return false;
      } finally {
        finishActiveMutation(mutation);
      }
    }

    function createQuickGrabAiProposal(grabId) {
      if (recoveryMutationBlocked()) return false;
      if (quickGrabBackendModeEnabled()) {
        return createQuickGrabBackendAiProposal(grabId);
      }
      return createQuickGrabMockAiProposal(grabId);
    }

    function createQuickGrabMockAiProposal(grabId) {
      if (recoveryMutationBlocked()) return false;
      const grab = db.quickGrabs.find(item => item.id === grabId);
      if (!grab) {
        showToast("That Quick Grab is no longer available.");
        return;
      }
      if (aiPrivacyTierForRecord(grab, "quickGrabs") === "Do Not Send to AI") {
        markCaptureProcessingFailure(grabId, "This capture is marked Do Not Send to AI.");
        showToast("This Quick Grab is marked Do Not Send to AI.");
        return;
      }
      const existing = existingCaptureProposal(grab);
      if (existing) {
        showToast("Suggested updates already exist for this capture.");
        openCaptureProposal(existing);
        return existing;
      }
      grab.processingState = "processing";
      grab.processingError = "";
      grab.lastProcessingAttemptAt = nowISO();
      const flags = quickGrabMockFlags(grab);
      const proposedActions = quickGrabMockProposedActions(grab, flags);
      const confidence = quickGrabMockConfidence(flags, proposedActions);
      const sensitivityRisk = flags.warnings.length
        ? flags.warnings.some(warning => /private|pastoral|sensitive/i.test(warning)) ? "high" : "medium"
        : recordIsSensitive(grab, "quickGrabs") ? "medium" : "low";
      const personText = flags.matchedPerson
        ? `Matched ${flags.matchedPerson.name}.`
        : flags.personMatchAmbiguous
          ? `Multiple people may match ${flags.parsed.detectedPersonName}. Choose the person before saving.`
        : flags.parsed.detectedPersonName
          ? `Possible new or unmatched person: ${flags.parsed.detectedPersonName}.`
          : "No clear person match.";
      const typeText = proposedActions.map(action => labelFromCamel(action.actionType)).join(", ");
      const warnings = [
        ...flags.warnings,
        ...(flags.personMatchAmbiguous ? ["Multiple people match this capture. Choose the person explicitly before saving."] : []),
        ...(flags.noGoodPersonMatch ? ["No good person match was found. Review before creating a person."] : []),
        ...(flags.ambiguousFollowUp ? ["Follow-up timing is ambiguous. Choose a real due date before saving."] : [])
      ];
      const proposal = emptyAiProposal({
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalKey: captureProposalKey(grab),
        sourceCaptureRevision: grab.captureRevision,
        processorVersion: CAPTURE_PROCESSOR_VERSION,
        proposalType: "quickGrabParse",
        status: "pending",
        title: `Mock parse: ${grab.category || "Quick Grab"}`,
        summary: `${personText} Suggested actions: ${typeText}.`,
        confidence,
        sensitivityRisk,
        contextPreview: grab.rawContent.slice(0, 240),
        proposedActions,
        warnings: Array.from(new Set(warnings)),
        rawInputPreview: grab.rawContent.slice(0, 360),
        result: {
          possiblePersonId: flags.matchedPerson ? flags.matchedPerson.id : "",
          possiblePersonName: flags.matchedPerson ? flags.matchedPerson.name : flags.parsed.detectedPersonName,
          possiblePersonIds: flags.possiblePeople.map(person => person.id),
          personMatchAmbiguous: flags.personMatchAmbiguous,
          recordTypes: proposedActions.map(action => action.actionType),
          detectedDate: flags.parsed.detectedDate,
          detectedFollowUpDate: flags.parsed.detectedFollowUpDate,
          mockOnly: true
        }
      });
      return saveQuickGrabAiProposal(proposal, "mock AI capture proposal", "Suggested updates created. Review before saving anything.");
    }

    function followUpDraftPromptFromContext(context, contextReview) {
      const person = context.person;
      const source = context.source;
      const firstName = person?.name ? person.name.split(" ")[0] : "there";
      const sourceType = context.sourceType;
      const sourceIsSensitivePrayer = sourceType === "prayerRequest" && recordIsSensitive(source, "prayerRequests");
      const hasSensitiveWarning = sourceIsSensitivePrayer || (contextReview.warnings || []).some(warning => /sensitive/i.test(warning));
      const dueText = source?.followUpDate || source?.dueDate || person?.nextFollowUpDate || "";
      const gentleReference = sourceType === "meetingNote"
          ? "our conversation"
          : sourceType === "followUpTask"
            ? "what we had planned to follow up on"
            : sourceType === "prayerRequest"
            ? "how I can support you"
              : "life";
      return { firstName, sourceIsSensitivePrayer, hasSensitiveWarning, dueText, gentleReference };
    }

    function buildFollowUpDraftOptions(context, contextReview) {
      const prompt = followUpDraftPromptFromContext(context, contextReview);
      return [
        {
          tone: "Short",
          text: `Hey ${prompt.firstName}, just wanted to check in. How are you doing today?`
        },
        {
          tone: "Casual",
          text: `Hey ${prompt.firstName}, I was thinking of you today. How has ${prompt.gentleReference} been going?`
        },
        {
          tone: "Pastoral",
          text: `Hey ${prompt.firstName}, I wanted to follow up gently and see how you are doing. No pressure to share more than you want, but I am glad to pray and listen.`
        }
      ];
    }

    function createFollowUpDraftMockAiProposal(sourceType, sourceId) {
      const contextReview = buildFollowUpDraftContextReview(sourceType, sourceId);
      const context = followUpDraftAllowedContext(sourceType, sourceId);
      if (!context.source || contextReview.blocked) {
        showToast("This source cannot be used for AI context.");
        return;
      }
      const drafts = buildFollowUpDraftOptions(context, contextReview);
      const sourceLabel = followUpDraftSourceLabel(sourceType);
      const personName = context.person?.name || "Unlinked person";
      const sensitivePrayerWarning = sourceType === "prayerRequest" && recordIsSensitive(context.source, "prayerRequests")
        ? "This draft references a sensitive prayer request. Keep details vague unless the person clearly expects that privacy."
        : "";
      const proposal = emptyAiProposal({
        sourceType,
        sourceId,
        proposalType: "followUpDraft",
        status: "pending",
        title: `Follow-up drafts for ${personName}`,
        summary: `Three local mock text draft options from ${sourceLabel}. Copy only; nothing is sent automatically.`,
        confidence: context.person ? "medium" : "low",
        sensitivityRisk: contextReview.warnings.some(warning => /sensitive|private|highly/i.test(warning)) ? "medium" : "low",
        contextPreview: contextReview.used.map(item => `${item.label}: ${item.summary}`).join(" | "),
        proposedActions: [
          { actionType: "draftTextMessage", label: "Review and copy one follow-up text draft" }
        ],
        warnings: Array.from(new Set([...(contextReview.warnings || []), sensitivePrayerWarning].filter(Boolean))),
        rawInputPreview: contextReview.used.map(item => `${item.label}: ${item.summary}`).join("\n").slice(0, 600),
        result: {
          drafts,
          mockOnly: true,
          copyOnly: true,
          messagingIntegration: false,
          sourceLabel,
          sensitivePrayerWarning: Boolean(sensitivePrayerWarning)
        }
      });
      recordUndo("mock AI follow-up draft proposal");
      db.aiProposals.unshift(prepareAiProposalForStorage(proposal));
      saveData();
      view.sheet = null;
      view.screen = "aiReview";

      findings.sensitiveShareWarnings.slice(0, 5).forEach(prayer => {

      return actions;
    }

    function conciseText(value, maxLength = 88) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      if (text.length <= maxLength) return text;
      return `${text.slice(0, Math.max(1, maxLength - 1)).trimEnd()}…`;
    }

    function usefulIdentityValue(value) {
      const text = String(value || "").replace(/\s+/g, " ").trim();
      return /^(active|new|not set|not applicable|n\/?a|ruf contact)$/i.test(text) ? "" : text;
    }

    function personIdentityLine(person) {
      const primary = usefulIdentityValue(person?.personType) || "Person";
      const involvement = usefulIdentityValue(person?.rufInvolvement);
      const involvementPiece = /leadership/i.test(involvement)
        ? "Leadership team"
        : involvement.split(",").map(part => part.trim()).filter(Boolean)[0] || "";
      const personType = primary.toLowerCase();
      const student = /student|freshman|first-year|sophomore|junior|senior/.test(personType);
      const formerOrAlumni = /former|alumni/.test(personType);
      const donor = /donor|supporter/.test(personType);
      const candidates = donor
        ? [person?.donorStatus, involvementPiece, person?.hometown]
        : formerOrAlumni
          ? [person?.hometown, involvementPiece, person?.classYear]
          : student
            ? [involvementPiece === "Leadership team" ? involvementPiece : "", person?.fraternitySorority, involvementPiece, person?.classYear, person?.major]
            : [involvementPiece, person?.hometown, person?.donorStatus, person?.status];
      const secondary = candidates.map(usefulIdentityValue).find(Boolean) || "";
      return [primary, conciseText(secondary, 42)]
        .filter((part, index, values) => part && values.findIndex(value => value.toLowerCase() === part.toLowerCase()) === index)
        .slice(0, 2)
        .join(" · ");
    }

    function usefulFollowUpReason(person) {
      if (!calendarDateParts(person?.nextFollowUpDate)) return "";
      const reason = conciseText(person?.followUpReason, 88);
      if (/^(not set|none|n\/?a)$/i.test(reason)) return "";
      const privacyTier = aiPrivacyTierForRecord(person, "people");
      const sensitive = ["Private", "Sensitive", "Highly Sensitive", "Do Not Send to AI"].includes(privacyTier);
      return maskedText(sensitive, "Sensitive follow-up detail hidden.", reason);
    }

    function profileRecordIsSensitive(record, collection = "") {
      const linkedPerson = record?.relatedPersonId ? personById(record.relatedPersonId) : null;
      return recordIsSensitive(record, collection) || recordIsSensitive(linkedPerson, "people");
    }

    function profileDateSort(items, fields = []) {
      return [...items].sort((a, b) => {
        const aValue = fields.map(field => a?.[field]).find(calendarDateParts) || "";
        const bValue = fields.map(field => b?.[field]).find(calendarDateParts) || "";
        const aDay = calendarDayNumber(aValue);
        const bDay = calendarDayNumber(bValue);
        if (aDay === null && bDay === null) return String(b?.updatedAt || "").localeCompare(String(a?.updatedAt || ""));
        if (aDay === null) return 1;
        if (bDay === null) return -1;
        return bDay - aDay;
      });
    }

    function profileRightNowEntry(text, sourceType = "", sourceId = "", sensitive = false, empty = false) {
      return { text: String(text || ""), sourceType, sourceId, sensitive: Boolean(sensitive), empty: Boolean(empty) };
    }

    function buildProfileRightNow(personId, reference = new Date(), data = db) {
      const person = data.people.find(item => item.id === personId);
      if (!person) return null;
      const prayers = [];
      data.prayerRequests
        .filter(item => item.relatedPersonId === personId && ["Follow-Up Needed", "Active"].includes(item.status) && recordSnoozeIsDue(item, reference))
        .forEach(item => {
          prayers.push(item);
          prayers.sort((a, b) => Number(b.status === "Follow-Up Needed") - Number(a.status === "Follow-Up Needed")
            || profileDateSort([a, b], ["dateAdded", "updatedAt"]).indexOf(a) - profileDateSort([a, b], ["dateAdded", "updatedAt"]).indexOf(b));
          if (prayers.length > 8) prayers.length = 8;
        });
      const tasks = [];
      data.tasks
        .filter(item => item.relatedPersonId === personId && taskIsActive(item, reference) && !taskIsWaiting(item))
        .forEach(item => {
          tasks.push(item);
          tasks.sort((a, b) => {
          const aDue = calendarDayNumber(a.dueDate);
          const bDue = calendarDayNumber(b.dueDate);
          if (aDue === null && bDue === null) return String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || ""));
          if (aDue === null) return 1;
          if (bDue === null) return -1;
          return aDue - bDue;
          });
          if (tasks.length > 8) tasks.length = 8;
        });
      const meetings = profileRecordsForPerson(data.meetingNotes, personId, ["meetingDate", "updatedAt"], "__right-now-meetings");
      const notes = profileRecordsForPerson(data.notes, personId, ["noteDate", "updatedAt"], "__right-now-notes");
      const prayer = prayers[0];
      const nextTask = tasks[0];
      const rememberedMeeting = meetings.find(item => String(item.whatToRemember || "").trim());
      const rememberedNote = notes.find(item => String(item.content || "").trim());
      const nextMeeting = meetings.find(item => String(item.nextFaithfulStep || "").trim());
      const prayerReminder = prayers.find(item => calendarDateParts(item.followUpDate));
      const personSensitive = profileRecordIsSensitive(person, "people");

      const pray = prayer
        ? profileRightNowEntry(prayer.request, "prayerRequests", prayer.id, profileRecordIsSensitive(prayer, "prayerRequests"))
        : profileRightNowEntry("No active prayer concern saved.", "", "", false, true);
      const nextThing = nextTask
        ? profileRightNowEntry(nextTask.title, "tasks", nextTask.id, profileRecordIsSensitive(nextTask, "tasks"))
        : calendarDateParts(person.nextFollowUpDate) && String(person.followUpReason || "").trim()
          ? profileRightNowEntry(person.followUpReason, "people", person.id, personSensitive)
          : nextMeeting
            ? profileRightNowEntry(nextMeeting.nextFaithfulStep, "meetingNotes", nextMeeting.id, profileRecordIsSensitive(nextMeeting, "meetingNotes"))
            : profileRightNowEntry("No current action saved.", "", "", false, true);
      const remember = rememberedMeeting
        ? profileRightNowEntry(rememberedMeeting.whatToRemember, "meetingNotes", rememberedMeeting.id, profileRecordIsSensitive(rememberedMeeting, "meetingNotes"))
        : rememberedNote
          ? profileRightNowEntry(rememberedNote.content, "notes", rememberedNote.id, profileRecordIsSensitive(rememberedNote, "notes"))
          : profileRightNowEntry("No current detail saved.", "", "", false, true);
      const reminder = calendarDateParts(person.nextFollowUpDate)
        ? profileRightNowEntry(formatFollowUpDate(person.nextFollowUpDate, reference), "people", person.id, personSensitive)
        : prayerReminder
          ? profileRightNowEntry(`Prayer: ${formatFollowUpDate(prayerReminder.followUpDate, reference)}`, "prayerRequests", prayerReminder.id, profileRecordIsSensitive(prayerReminder, "prayerRequests"))
          : profileRightNowEntry("No reminder saved.", "", "", false, true);
      return { pray, nextThing, remember, reminder };
    }

    function renderProfileRightNowValue(entry, hiddenText) {
      if (!entry) return "";
      return escapeHtml(conciseText(maskedText(entry.sensitive, hiddenText, entry.text), 180));
    }

    function renderProfileRightNow(summary) {
      if (!summary) return "";
      const rows = [
        ["Pray", summary.pray, "Sensitive prayer concern hidden."],
        ["Next thing", summary.nextThing, "Sensitive action detail hidden."],
        ["Remember", summary.remember, "Sensitive saved detail hidden."],
        ["Reminder", summary.reminder, "Sensitive reminder hidden."]
      ];
      return `
        <div class="right-now" data-profile-right-now>
          ${rows.map(([label, entry, hiddenText]) => `
            <div class="right-now-row" data-right-now-key="${escapeHtml(label.toLowerCase().replace(/\s+/g, "-"))}">
              <span class="right-now-label">${escapeHtml(label)}:</span>
              <span class="right-now-value">${renderProfileRightNowValue(entry, hiddenText)}</span>
            </div>
          `).join("")}
        </div>
      `;
    }

    function profilePreviewBody(kind, record, expanded = false) {
      if (kind === "notes") return record.content || "";
      if (kind === "meetings") {
        const values = expanded
          ? [record.whatWeTalkedAbout && `Talked about: ${record.whatWeTalkedAbout}`, record.whatToRemember && `Remember: ${record.whatToRemember}`, record.nextFaithfulStep && `Next: ${record.nextFaithfulStep}`]
          : [record.whatToRemember || record.whatWeTalkedAbout || record.nextFaithfulStep];
        return values.filter(Boolean).join(" · ");
      }
      if (kind === "prayers") return record.request || "";
      if (kind === "tasks") return record.title || "";
      if (kind === "timeline") return record.text || "";
      return "";
    }

    function profilePreviewMeta(kind, record) {
      if (kind === "notes") return formatHistoryDate(record.noteDate, "Note added") || "Note";
      if (kind === "meetings") return formatHistoryDate(record.meetingDate, "Met") || "Meeting";
      if (kind === "prayers") return formatHistoryDate(record.dateAdded, "Prayer added") || "Prayer";
      if (kind === "tasks") return ["Done / Archived", "Done", "Archived"].includes(record.status)
        ? formatHistoryDate(record.updatedAt || record.dueDate, "Completed") || "Completed"
        : taskIsWaiting(record) ? waitingReviewDateText(record) : formatDueDate(record.dueDate);
      if (kind === "timeline") return record.dateLabel || "Saved care history";
      return "";
    }

    function profilePreviewTitle(kind, record) {
      if (kind === "notes") return record.noteType || "Note";
      if (kind === "meetings") return `${record.meetingType || "Ministry"} meeting`;
      if (kind === "prayers") return record.status === "Answered" ? "Answered prayer" : record.status || "Prayer request";
      if (kind === "tasks") return taskIsWaiting(record) ? "Waiting on them" : record.status || "Follow-up";
      if (kind === "timeline") return record.title || "Care update";
      return "Saved item";
    }

    function profilePreviewSensitive(kind, record) {
      if (kind === "timeline") return Boolean(record.sensitive);
      const collection = { notes: "notes", meetings: "meetingNotes", prayers: "prayerRequests", tasks: "tasks" }[kind] || "";
      return profileRecordIsSensitive(record, collection);
    }

    function renderProfilePreview(kind, record, expanded = false) {
      const body = profilePreviewBody(kind, record, expanded);
      const hidden = kind === "prayers" ? "Sensitive prayer concern hidden." : "Sensitive saved detail hidden.";
      const visibleBody = expanded ? body : conciseText(body, 180);
      return `
        <article class="profile-preview-row" data-profile-preview="${escapeHtml(kind)}">
          <div class="profile-preview-head">
            <span class="profile-preview-title">${escapeHtml(profilePreviewTitle(kind, record))}</span>
            <span>${escapeHtml(profilePreviewMeta(kind, record))}</span>
          </div>
          ${visibleBody ? `<p class="profile-preview-text">${escapeHtml(maskedText(profilePreviewSensitive(kind, record), hidden, visibleBody))}</p>` : ""}
        </article>
      `;
    }

    function buildProfileTimeline(personId, limit = null) {
      const items = [];
      const addItem = item => {
        items.push(item);
        if (Number.isFinite(limit) && limit > 0 && items.length > limit) {
          const sorted = profileDateSort(items, ["date"]);
          items.length = 0;
          items.push(...sorted.slice(0, limit));
        }
      };
      db.meetingNotes.filter(item => item.relatedPersonId === personId).forEach(item => addItem({
        id: item.id, kind: "meeting", date: item.meetingDate, dateLabel: formatHistoryDate(item.meetingDate, "Met"),
        title: `${item.meetingType || "Ministry"} meeting`, text: item.whatToRemember || item.whatWeTalkedAbout || item.nextFaithfulStep || "", sensitive: profileRecordIsSensitive(item, "meetingNotes")
      }));
      db.notes.filter(item => item.relatedPersonId === personId).forEach(item => addItem({
        id: item.id, kind: "note", date: item.noteDate, dateLabel: formatHistoryDate(item.noteDate, "Note added"),
        title: item.noteType || "Note", text: item.content || "", sensitive: profileRecordIsSensitive(item, "notes")
      }));
      db.prayerRequests.filter(item => item.relatedPersonId === personId).filter(item => settings.showArchivedOnProfiles || item.status !== "Archived").forEach(item => addItem({
        id: item.id, kind: "prayer", date: item.dateAdded, dateLabel: formatHistoryDate(item.dateAdded, item.status === "Answered" ? "Prayer answered" : "Prayer added"),
        title: item.status === "Answered" ? "Answered prayer" : item.status || "Prayer request", text: item.request || "", sensitive: profileRecordIsSensitive(item, "prayerRequests")
      }));
      db.tasks.filter(item => item.relatedPersonId === personId).forEach(item => {
        const createdDate = String(item.createdAt || "").slice(0, 10);
        const date = calendarDateParts(createdDate) ? createdDate : item.dueDate;
        addItem({
          id: item.id, kind: "task", date, dateLabel: formatHistoryDate(date, "Follow-up planned"),
          title: item.status === "Done / Archived" ? "Follow-up completed" : "Follow-up planned", text: item.title || "", sensitive: profileRecordIsSensitive(item, "tasks")
        });
      });
      return profileDateSort(items, ["date"]).slice(0, Number.isFinite(limit) && limit > 0 ? limit : items.length);
    }

    function profileRecordsForPerson(collection, personId, sortFields, key) {
      const expanded = Array.isArray(view.profileHistoryExpanded) && view.profileHistoryExpanded.includes(key);
      if (expanded) return profileDateSort(collection.filter(item => item.relatedPersonId === personId), sortFields);
      const preview = [];
      collection.forEach(item => {
        if (item.relatedPersonId !== personId) return;
        preview.push(item);
        if (preview.length > 3) {
          const sorted = profileDateSort(preview, sortFields);
          preview.length = 0;
          preview.push(...sorted.slice(0, 3));
        }
      });
      return profileDateSort(preview, sortFields);
    }

    function renderProfileHistorySection(key, title, items, options = {}) {
      if (!items.length) return "";
      const expanded = Array.isArray(view.profileHistoryExpanded) && view.profileHistoryExpanded.includes(key);
      const expandedLimit = Math.max(PROFILE_HISTORY_BATCH_SIZE, Number(view.profileHistoryVisibleLimits?.[key]) || PROFILE_HISTORY_BATCH_SIZE);
      const visibleItems = expanded ? items.slice(0, expandedLimit) : items.slice(0, 3);
      const remaining = Math.max(0, items.length - visibleItems.length);
      return `
        <section class="profile-history-section ${options.fullWidth ? "full-width" : ""}" data-profile-history="${escapeHtml(key)}" data-visible-count="${visibleItems.length}">
          <div class="section-header">
            <h2 class="section-title">${escapeHtml(title)}</h2>
            <button class="button quiet small" data-action="profile-history-toggle" data-id="${escapeHtml(key)}" aria-expanded="${expanded}">${expanded ? "Show recent" : "View all"}</button>
          </div>
          <div class="profile-preview-list">${visibleItems.map(item => renderProfilePreview(options.kind || key, item, expanded)).join("")}</div>
          ${expanded && remaining ? `
            <div class="section-footer" role="status" aria-live="polite">
              <span class="meta">Showing ${visibleItems.length} of ${items.length} ${escapeHtml(title.toLowerCase())}.</span>
              <button class="button quiet small" data-action="profile-history-more" data-id="${escapeHtml(key)}">Show ${Math.min(PROFILE_HISTORY_BATCH_SIZE, remaining)} more</button>
            </div>
          ` : ""}
        </section>
      `;
    }

    function renderProfileCareCadence(person) {
      if (!personIsActive(person)) return "";
      const cadence = followUpCadenceLabel(person);
      const nextPlan = person.nextFollowUpDate ? formatFollowUpDate(person.nextFollowUpDate) : "No next date planned";
      return `
        <section class="section" aria-labelledby="profile-care-cadence-title">
          <div class="surface">
            <div class="section-header">
              <div>
                <h2 class="section-title" id="profile-care-cadence-title">Follow-up rhythm</h2>
                <p class="page-kicker">A local reminder plan. Nothing is scheduled or sent outside this device.</p>
              </div>
            </div>
            <div class="grid two">
              <div class="stat"><span>Cadence</span><strong>${escapeHtml(cadence)}</strong></div>
              <div class="stat"><span>Next plan</span><strong>${escapeHtml(nextPlan)}</strong></div>
            </div>
            <div class="action-row" style="margin-top:var(--space-3);">
              <button class="button quiet" data-action="care-cadence-open" data-id="${escapeHtml(person.id)}">Set rhythm</button>
              <button class="button quiet" data-action="person-followed-up" data-id="${escapeHtml(person.id)}">Mark followed up</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderProfileDetails(person) {
      const pinned = isPinnedPerson(person.id);
      return `
        <details class="profile-details" data-profile-details>
          <summary>Profile Details</summary>
          <div class="profile-details-content">
            <div class="form-grid">
              ${profileField("Person type", person.personType || "Not set")}
              ${profileField("Phone number", person.phone || "Not set")}
              ${profileField("Email", person.email || "Not set")}
              ${profileField("Class year", person.classYear || "Not applicable")}
              ${profileField("Fraternity/sorority", person.fraternitySorority || "Not applicable")}
              ${profileField("Major", person.major || "Not set")}
              ${profileField("Hometown", person.hometown || "Not set")}
              ${profileField("RUF involvement", person.rufInvolvement || "Not set")}
              ${profileField("Donor status", person.donorStatus || "Not applicable")}
              ${profileField("Follow-up reason", person.followUpReason || "Not set")}
              <div class="field wide">
                <label for="profile-photo-input">Profile picture</label>
                <input class="input" id="profile-photo-input" type="file" accept="image/*" data-person-id="${escapeHtml(person.id)}">
                <div class="meta">Photos stay on this device and are resized before local storage.</div>
                ${person.photoDataUrl ? `<button class="button quiet small danger" data-action="person-remove-photo" data-id="${escapeHtml(person.id)}">Remove photo</button>` : ""}
              </div>
            </div>
            <details class="disclosure">
              <summary>More actions</summary>
              <div class="action-row">
                <button class="button quiet" data-action="person-pin" data-id="${escapeHtml(person.id)}">${pinned ? "Unpin person" : "Pin person"}</button>
                ${settings.inlineEditing ? `<button class="button quiet" data-action="person-edit-field" data-id="${escapeHtml(person.id)}" data-field="name" data-label="Name">Edit name</button>` : ""}
              </div>
              ${timestampLine(person)}
            </details>
          </div>
        </details>
      `;
    }

    function renderCalmPersonProfile(person) {
      if (view.profileCaptureOwnerId !== person.id) {
        view.profileCaptureOwnerId = person.id;
        view.profileCapturePersonId = savedProfileCaptureTarget(person.id) || person.id;
        view.profileCaptureDraftText = "";
        view.profileCaptureDraftTargetId = "";
        view.profileHistoryExpanded = [];
        view.profileHistoryVisibleLimits = {};
      }
      const capturePerson = personById(view.profileCapturePersonId) || person;
      view.profileCapturePersonId = capturePerson.id;
      const notes = profileRecordsForPerson(db.notes, person.id, ["noteDate", "updatedAt"], "notes");
      const meetings = profileRecordsForPerson(db.meetingNotes, person.id, ["meetingDate", "updatedAt"], "meetings");
      const prayers = profileRecordsForPerson(db.prayerRequests.filter(item => settings.showArchivedOnProfiles || item.status !== "Archived"), person.id, ["dateAdded", "updatedAt"], "prayers");
      const tasks = profileRecordsForPerson(db.tasks, person.id, ["dueDate", "updatedAt"], "tasks");
      const timelineExpanded = Array.isArray(view.profileHistoryExpanded) && view.profileHistoryExpanded.includes("timeline");
      const timeline = buildProfileTimeline(person.id, timelineExpanded ? null : 3);
      const followUpReason = usefulFollowUpReason(person);
      const phone = String(person.phone || "").trim();
      return `
        <button class="button quiet small profile-back" data-action="nav" data-screen="people">Back to People</button>
        <header class="profile-essential" data-profile-essential>
          ${renderPersonPhoto(person)}
          <div class="profile-essential-copy">
            <h1 class="profile-name">${escapeHtml(person.name || "Unnamed person")}</h1>
            <p class="profile-identity-line">${escapeHtml(personIdentityLine(person))}</p>
            <div class="profile-meta-line">
              <span>${escapeHtml(person.careLevel || "Care level not set")}</span>
              <span>${escapeHtml(formatInteractionDate(person.lastMeaningfulInteraction))}</span>
              <span>${escapeHtml(formatFollowUpDate(person.nextFollowUpDate))}</span>
              ${phone ? `<span>Phone ${escapeHtml(phone)}</span>` : ""}
            </div>
            ${followUpReason ? `<p class="profile-followup-reason">${escapeHtml(followUpReason)}</p>` : ""}
          </div>
        </header>
        <section class="section" aria-labelledby="right-now-title">
          <div class="section-header"><h2 class="section-title" id="right-now-title">Right Now</h2></div>
          ${renderProfileRightNow(buildProfileRightNow(person.id))}
        </section>
        ${renderProfileCareCadence(person)}
        <section class="section" aria-label="Add something about this person">
          ${renderCaptureComposer({ source: "profile", personId: capturePerson.id })}
          <div class="profile-secondary-actions" style="margin-top:var(--space-3);">
            <button class="button quiet" data-action="profile-brief-open" data-id="${escapeHtml(person.id)}">Brief Me</button>
            <button class="button quiet" data-action="profile-followup-open" data-id="${escapeHtml(person.id)}">Follow Up</button>
          </div>
        </section>
        <section class="section">${renderProfileDetails(person)}</section>
        <div class="profile-history-grid">
          ${renderProfileHistorySection("notes", "Notes", notes)}
          ${renderProfileHistorySection("meetings", "Meetings", meetings)}
          ${renderProfileHistorySection("prayers", "Prayer Requests", prayers)}
          ${renderProfileHistorySection("tasks", "Follow-Ups", tasks)}
          ${renderProfileHistorySection("timeline", "Timeline", timeline, { fullWidth: true, kind: "timeline" })}
        </div>
      `;
    }

    function renderPersonProfile() {
      const person = personById(view.personId);
      if (!person) return `${renderTopbar("Person Profile", "That profile could not be found.")}${emptyState("Open a person from the People screen.")}`;
      return renderCalmPersonProfile(person);
    }

    function personInitials(person) {
      return String(person?.name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join("")
        .toUpperCase() || "?";
    }

    function renderPersonPhoto(person) {
      return `
        <div class="profile-photo" aria-label="${escapeHtml(person.name)} profile picture">
          ${person.photoDataUrl ? `<img src="${escapeHtml(person.photoDataUrl)}" alt="${escapeHtml(person.name)}">` : `<span>${escapeHtml(personInitials(person))}</span>`}
        </div>
      `;
    }

    function profileField(label, value) {
      const fieldMap = {
        "Person type": "personType",
        "Phone number": "phone",
        "Email": "email",
        "Class year": "classYear",
        "Fraternity/sorority": "fraternitySorority",
        "Major": "major",
        "Hometown": "hometown",
        "RUF involvement": "rufInvolvement",
        "Donor status": "donorStatus",
        "Follow-up reason": "followUpReason"
      };
      const field = fieldMap[label];
      const edit = settings.inlineEditing && field && view.personId
        ? `<button class="button small" data-action="person-edit-field" data-id="${escapeHtml(view.personId)}" data-field="${field}" data-label="${escapeHtml(label)}">Edit</button>`
        : "";
      return `<div class="field"><div class="field-label">${escapeHtml(label)}</div><div class="row wrap"><div class="meta">${escapeHtml(value)}</div>${edit}</div></div>`;
    }

    function renderPrayerRequests() {
      const filters = ["Active", "Follow-Up Needed", "Prayer Walk"];
      const filtered = getFilteredPrayers();
      const visibleLimit = Math.max(12, Number(view.prayerVisibleLimit) || 12);
      const visible = filtered.slice(0, visibleLimit);
      const remaining = Math.max(0, filtered.length - visible.length);
      return `
        ${renderTopbar("Prayer", "Who or what should I pray for?")}
        <div class="tabs" role="group" aria-label="Prayer filters">
          ${filters.map(filter => `<button class="tab ${view.prayerFilter === filter ? "active" : ""}" data-action="prayer-filter" data-filter="${filter}" aria-pressed="${view.prayerFilter === filter}">${escapeHtml(filter)}</button>`).join("")}
        </div>
        <section class="section">
          ${visible.length ? visible.map(renderPrayerCard).join("") : emptyState(prayerEmptyState())}
          ${remaining ? `<div class="section-footer" role="status" aria-live="polite"><span class="meta">Showing ${visible.length} of ${filtered.length} prayer requests.</span><button class="button quiet small" data-action="prayer-show-more">Show ${Math.min(12, remaining)} more</button></div>` : ""}
        </section>
      `;
    }

    function getFilteredPrayers() {
      const prayers = db.prayerRequests.slice();
      if (view.prayerFilter === "Active") return prayers.filter(prayer => prayer.status === "Active");
      if (view.prayerFilter === "Follow-Up Needed") return prayers.filter(prayer => prayer.status === "Follow-Up Needed");
      if (view.prayerFilter === "Prayer Walk") return prayers.filter(prayer => {
        if (prayer.status === "Archived") return false;
        if (!settings.prayerWalkIncludeAnswered && prayer.status === "Answered") return false;
        if (!settings.prayerWalkIncludeSensitive && recordIsSensitive(prayer, "prayerRequests")) return false;
        return true;
      });
      if (view.prayerFilter === "Answered Prayer") return prayers.filter(prayer => prayer.status === "Answered");
      if (view.prayerFilter === "Archived Prayer Requests") return prayers.filter(prayer => prayer.status === "Archived").sort((a, b) => String(b.archivedAt || b.updatedAt || "").localeCompare(String(a.archivedAt || a.updatedAt || "")));
      if (view.prayerFilter === "Sensitive Prayer Requests") return prayers.filter(prayer => recordIsSensitive(prayer, "prayerRequests"));
      if (view.prayerFilter === "Recently Added") return prayers.sort((a, b) => String(b.dateAdded || b.createdAt || "").localeCompare(String(a.dateAdded || a.createdAt || ""))).slice(0, 12);
      if (view.prayerFilter === "By Person") return prayers.sort((a, b) => String(personById(a.relatedPersonId)?.name || "").localeCompare(String(personById(b.relatedPersonId)?.name || "")));
      return prayers;
    }

    function prayerEmptyState() {
      if (view.prayerFilter === "Archived Prayer Requests") return "No archived prayer requests yet. Answered requests can move here when you are ready to tuck them away.";
      if (view.prayerFilter === "Answered Prayer") return "No answered prayer requests are waiting here yet.";
      if (view.prayerFilter === "Follow-Up Needed") return "No prayer requests need a follow-up right now.";
      if (view.prayerFilter === "Prayer Walk") return "No prayer requests are ready for Prayer Walk right now.";
      return "No active prayer requests yet. Add one from Quick Grab, a meeting note, or a person profile.";
    }

    function renderPrayerCard(prayer) {
      const person = personById(prayer.relatedPersonId);
      const sensitive = recordIsSensitive(prayer, "prayerRequests");
      const personSensitive = person && recordIsSensitive(person, "people");
      const personLabel = sensitive || personSensitive ? "Private person" : (person ? person.name : "Unlinked person");
      const expanded = view.expandedPrayerIds.includes(prayer.id);
      return `
        <article class="item compact focus-card ${prayer.status === "Follow-Up Needed" ? "important" : ""}">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(personLabel)}</div>
              <div class="meta">Added ${dateLabel(prayer.dateAdded)}${prayer.followUpDate ? " - " + formatFollowUpDate(prayer.followUpDate) : ""}</div>
            </div>
            <span class="pill ${prayer.status === "Follow-Up Needed" ? "gold" : prayer.status === "Answered" ? "green" : prayer.status === "Archived" ? "gray" : "violet"}">${escapeHtml(prayer.status)}</span>
          </div>
          <p class="item-preview">${escapeHtml(maskedText(sensitive, "Sensitive prayer request - tap to view.", prayer.request))}</p>
          ${timestampLine(prayer, "Added", prayer.dateAdded)}
          <div class="next-step-line">
            <span class="meta">Next:</span>
            <strong>${escapeHtml(prayerNextStep(prayer))}</strong>
          </div>
          <div class="action-row focus-actions">
            ${renderPrayerPrimaryActions(prayer, person)}
            ${settings.showAdvancedActions ? "" : `<button class="button small" data-action="prayer-toggle-more" data-id="${escapeHtml(prayer.id)}">${expanded ? "Less" : "More"}</button>`}
          </div>
          <div class="action-row extra-actions ${expanded ? "is-open" : ""}">
            ${prayer.status !== "Archived" ? `<button class="button small" data-action="followup-draft" data-source-type="prayerRequest" data-id="${escapeHtml(prayer.id)}">Draft Follow-Up</button>` : ""}
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-note" data-id="${escapeHtml(prayer.id)}">Add Answered Note</button>` : ""}
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-follow-date" data-id="${escapeHtml(prayer.id)}">Set Follow-Up Date</button>` : ""}
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-archive" data-id="${escapeHtml(prayer.id)}">Archive</button>` : ""}
            ${settings.inlineEditing && prayer.status !== "Archived" ? `<button class="button small" data-action="edit-record-field" data-collection="prayerRequests" data-field="request" data-label="Prayer request" data-id="${escapeHtml(prayer.id)}">Edit Request</button>` : ""}
            ${person && !sensitive && !personSensitive && prayer.status !== "Archived" ? `<button class="button small" data-action="person-open" data-id="${escapeHtml(person.id)}">Open Person Profile</button>` : ""}
          </div>
        </article>
      `;
    }

    function prayerNextStep(prayer) {
      if (prayer.status === "Archived") return "This is tucked away. Restore it if it needs attention again.";
      if (prayer.status === "Answered") return "Add a short answered note, or archive it when you are ready.";
      if (prayer.status === "Follow-Up Needed") return "Create or take the follow-up when you can.";
      return "Pray, then mark answered or set a follow-up if needed.";
    }

    function renderPrayerPrimaryActions(prayer, person) {
      if (prayer.status === "Archived") {
        return `<button class="button small primary" data-action="prayer-restore" data-id="${escapeHtml(prayer.id)}">Restore</button>`;
      }
      if (prayer.status === "Answered") {
        return `<button class="button small primary" data-action="prayer-archive-answered" data-id="${escapeHtml(prayer.id)}">Archive Answered</button>`;
      }
      return `<button class="button small primary" data-action="prayer-answered" data-id="${escapeHtml(prayer.id)}">Mark Answered</button>`;
    }

    function renderTaskCard(task) {

      const relatedPrayer = db.prayerRequests.find(item => item.id === task.relatedPrayerRequestId);
      const sensitive = recordIsSensitive(task, "tasks") || recordIsSensitive(relatedPrayer, "prayerRequests");
      const personSensitive = person && recordIsSensitive(person, "people");
      const personLabel = sensitive || personSensitive ? "Private person" : person?.name;
      return `
        <article class="item compact">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(maskedText(sensitive, "Sensitive follow-up task", conciseText(task.title, 120)))}</div>
              <div class="meta">${personLabel ? escapeHtml(personLabel) + " - " : ""}${escapeHtml(task.sourceType || "Follow-up")}</div>
            </div>
            <span class="pill ${task.status === "Done / Archived" ? "gray" : task.status === "Waiting" ? "violet" : "gold"}">${escapeHtml(task.status)}</span>
          </div>
          <div class="row wrap">
            <span class="meta">${formatDueDate(task.dueDate)}</span>
          </div>
          ${timestampLine(task, "Due", task.dueDate)}
          <div class="action-row">
            <button class="button small" data-action="task-done" data-id="${escapeHtml(task.id)}">Done</button>
            <button class="button small" data-action="followup-draft" data-source-type="followUpTask" data-id="${escapeHtml(task.id)}">Draft Follow-Up</button>
            ${person && !sensitive && !personSensitive ? `<button class="button small primary" data-action="person-open" data-id="${escapeHtml(person.id)}">Open Person Profile</button>` : ""}

          </div>
        </article>
      `;
    }

      const titles = {
        list: "Auto Memory Vault",
        restore: "Restore Local Memory",
        delete: "Delete Restore Point",

        list: "Local restore points are created automatically after saved changes.",

        list: `
          <div class="notice">Auto Memory is ${settings.autoMemoryVaultEnabled ? "on" : "off"}. These restore points are local to this browser and are not cloud sync.</div>

        `,
        restore: snapshot ? `
          <div class="notice danger">This replaces current local app data, settings, edited wording, and saved drafts with the restore point from ${escapeHtml(dateTimeLabel(snapshot.savedAt))}.</div>
          <div class="notice">${escapeHtml(snapshot.summary || "No summary available.")}</div>

          ${checkbox("sheet-auto-memory-confirm", "Delete this restore point.", false)}

          ? `<textarea class="textarea small" id="${id}">${value}</textarea>`
          : `<input class="input" id="${id}" type="${spec.kind === "date" ? "date" : "text"}" value="${value}">`;

      const sheet = view.sheet;
      if (!sheet || sheet.type !== "capture-person") return;
      const oldId = personById(sheet.currentPersonId) ? sheet.currentPersonId : view.profileCapturePersonId || view.personId;
      const nextId = document.getElementById("sheet-capture-person")?.value || "";
      const ownerId = personById(view.profileCaptureOwnerId) ? view.profileCaptureOwnerId : view.personId;
      if (!personById(nextId)) {
        sheet.error = "Choose an available person.";
        render();
        return;
      }
      if (nextId === oldId) {
        view.sheet = null;
        render();
        return;
      }
      const drafts = loadAutosaveDrafts();
      const oldKey = captureDraftKey("profile", oldId);
      const nextKey = captureDraftKey("profile", nextId);
      const pendingText = String(view.profileCaptureDraftText || captureDraftText(drafts[oldKey]) || "");
      const existingText = captureDraftText(drafts[nextKey]);
      if (pendingText.trim() && existingText.trim() && pendingText !== existingText) {
        sheet.error = "That person already has a different saved draft. Process or clear one draft before moving this text.";
        render();
        return;
      }
      if (settings.enableAutoSave) {
        if (pendingText.trim()) {
          const moved = cloneJson(drafts[oldKey] || {
            key: nextKey,
            fields: { "profile-capture-text": pendingText },
            screen: "person",
            updatedAt: nowISO()
          });
          moved.key = nextKey;
          moved.fields = { ...(moved.fields || {}), "profile-capture-text": pendingText };
          moved.updatedAt = nowISO();
          drafts[nextKey] = moved;
        }
        delete drafts[oldKey];
        drafts[profileCaptureOwnerKey(ownerId)] = {
          key: profileCaptureOwnerKey(ownerId),
          targetPersonId: nextId,
          screen: "person",
          updatedAt: nowISO()
        };
        saveAutosaveDrafts(drafts);
      }
      view.profileCapturePersonId = nextId;
      view.profileCaptureDraftText = pendingText || existingText;
      view.profileCaptureDraftTargetId = nextId;
      view.sheet = null;
      showToast(`Capture linked to ${personById(nextId).name}. No profile records changed.`);
      render();
    }

    function buildLocalPersonBriefing(personId) {
      const person = personById(personId);
      if (!person) return null;
      const contextReview = buildPersonBriefingContextReview(personId);
      const context = contextReview.blocked
        ? { person: null, notes: [], meetings: [], prayers: [], tasks: [] }
        : personBriefingAllowedContext(personId);
      const meeting = context.meetings[0];
      const prayer = context.prayers[0];
      const task = context.tasks[0];
      const recentInteraction = contextReview.blocked
        ? profileRightNowEntry("This profile is excluded from briefing context by its privacy setting.", "", "", false, true)
        : meeting
        ? profileRightNowEntry(`${formatInteractionDate(meeting.meetingDate)} · ${meeting.whatToRemember || meeting.whatWeTalkedAbout || "Saved meeting"}`, "meetingNotes", meeting.id, profileRecordIsSensitive(meeting, "meetingNotes"))
        : profileRightNowEntry(formatInteractionDate(person.lastMeaningfulInteraction), "people", person.id, profileRecordIsSensitive(person, "people"));
      const activePrayer = prayer
        ? profileRightNowEntry(prayer.request, "prayerRequests", prayer.id, profileRecordIsSensitive(prayer, "prayerRequests"))
        : profileRightNowEntry("No active prayer request is available in the approved local context.", "", "", false, true);
      const currentFollowUp = contextReview.blocked
        ? profileRightNowEntry("No follow-up detail is included in this briefing context.", "", "", false, true)
        : task
        ? profileRightNowEntry(`${task.title}${calendarDateParts(task.dueDate) ? ` · ${formatDueDate(task.dueDate)}` : ""}`, "tasks", task.id, profileRecordIsSensitive(task, "tasks"))
        : calendarDateParts(person.nextFollowUpDate)
          ? profileRightNowEntry(`${formatFollowUpDate(person.nextFollowUpDate)}${usefulFollowUpReason(person) ? ` · ${usefulFollowUpReason(person)}` : ""}`, "people", person.id, profileRecordIsSensitive(person, "people"))
          : profileRightNowEntry("No current follow-up is saved.", "", "", false, true);
      const informationCount = context.notes.length + context.meetings.length + context.prayers.length + context.tasks.length;
      return {
        person,
        recentInteraction,
        activePrayer,
        currentFollowUp,
        usefulQuestions: [
          "What feels most important to talk about today?",
          prayer ? "How would you like me to keep praying about this?" : "How can I pray for you right now?",
          "What would be a helpful next step after today?"
        ],
        warnings: Array.from(new Set(contextReview.warnings || [])),
        littleInformation: informationCount === 0 && !calendarDateParts(person.lastMeaningfulInteraction) && !calendarDateParts(person.nextFollowUpDate)
      };
    }

    async function confirmCareVaultRevision(requiredRevision) {
      const required = Number(requiredRevision);
      if (!settings.localEncryptionEnabled || !vaultPassphrase || !Number.isInteger(required) || required < 1) return false;
      while (vaultSaveCompletedRevision < required) {
        if (vaultSaveTimer) {
          const clear = window.clearTimeout || clearTimeout;
          clear(vaultSaveTimer);
          vaultSaveTimer = null;
        }
        const saved = await flushEncryptedVaultSaves();
        if (vaultSaveCompletedRevision >= required) return true;
        if (!saved) return false;
      }
      return true;
    }

      if (recoveryMutationBlocked() || view.sheet?.type !== "care-cadence") return false;
      const cadence = document.getElementById("sheet-care-cadence")?.value || "None";
      const customDays = document.getElementById("sheet-care-custom-days")?.value || "";

    async function submitCareCadenceSheet() {
      const sheet = view.sheet?.type === "care-cadence" ? view.sheet : null;
      if (!sheet || sheet.saving) return false;
      const person = personById(sheet.personId);
      if (!person || !personIsActive(person)) return false;
      const cadence = document.getElementById("sheet-care-cadence")?.value || "";
      if (!FOLLOW_UP_CADENCES.includes(cadence)) {
        reportFieldError("sheet-care-cadence", "Choose a valid care cadence.");
        return false;
      }
      const rawCustomDays = document.getElementById("sheet-care-custom-days")?.value || "";
      const customDays = normalizeFollowUpCustomDays(rawCustomDays, cadence);
      if (cadence === "Custom days" && !customDays) {
        reportFieldError("sheet-care-custom-days", `Use a whole number from 1 to ${MAX_FOLLOW_UP_CUSTOM_DAYS}.`);
        return false;
      }
      const nextDate = document.getElementById("sheet-care-next-date")?.value || "";
      if (nextDate && (!isISODateString(nextDate) || calendarDayDelta(nextDate) < 0)) {
        reportFieldError("sheet-care-next-date", "Choose today or a future date, or clear the date.");
        return false;
      }
      return withActiveMutation("care-cadence-save", async () => {
      const beforeData = cloneJson(db);
      const beforeMemoryVault = cloneJson(memoryVaultCache);
      const beforeUndoStack = cloneJson(undoStack);
      const beforeUndoGeneration = undoGeneration;
      const storageSnapshot = localStorageSnapshot([STORAGE_KEY, AUTO_MEMORY_KEY]);
      sheet.saving = true;
      render();
      try {
        recordUndo("care cadence update");
        person.followUpCadence = cadence;
        person.followUpCustomDays = customDays;
        person.nextFollowUpDate = nextDate;
        person.updatedAt = nowISO();
        saveData();
        const requiredVaultRevision = settings.localEncryptionEnabled ? vaultSaveRequestedRevision : 0;
        if (settings.localEncryptionEnabled) {
          if (!(await confirmCareVaultRevision(requiredVaultRevision))) throw new Error("Encrypted care cadence save failed.");
        }
      } catch (error) {
        db = beforeData;
        memoryVaultCache = beforeMemoryVault;
        undoStack = beforeUndoStack;
        undoGeneration = beforeUndoGeneration;
        restoreLocalStorageSnapshot(storageSnapshot);
        view.sheet = { ...sheet, saving: false };
        console.warn("Could not save care cadence", error);
        showToast("The follow-up rhythm was not saved. Your previous plan is intact.", "error");
        render();
        return false;
      }
      view.sheet = null;
      showToast(nextDate ? `Follow-up rhythm saved for ${formatCalendarDay(nextDate)}.` : "Follow-up rhythm saved with no next date.");
      render();
      return true;
      });
    }

    function bindScreen() {
      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", handleAction);
      });
      document.querySelectorAll("[data-setting-toggle]").forEach(input => {
        input.addEventListener("change", event => {
          if (recoveryMutationBlocked()) return false;
          if (["localEncryptionEnabled", "enableVoiceCapture"].includes(event.target.dataset.settingToggle)) rememberSheetReturnFocus(event.target);
          return updateSetting(event.target.dataset.settingToggle, event.target.checked);
        });
      });
      document.querySelectorAll("[data-setting-select]").forEach(select => {
        select.addEventListener("change", event => {
          if (recoveryMutationBlocked()) return false;
          return updateSetting(event.target.dataset.settingSelect, event.target.value);
        });
      });
      const careCadence = document.getElementById("sheet-care-cadence");
      const careCustomDays = document.getElementById("sheet-care-custom-days");
      if (careCadence) careCadence.addEventListener("change", updateCareCadenceSheetProposal);
      if (careCustomDays) careCustomDays.addEventListener("input", updateCareCadenceSheetProposal);
      document.querySelectorAll("[data-copy-key]").forEach(el => {
        el.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          if (recoveryMutationBlocked()) return false;
          return editCopyText(el.dataset.copyKey, el.dataset.copyFallback || el.textContent.trim());
        });
      });
      document.querySelectorAll("[data-ai-action-select]").forEach(input => {
        input.addEventListener("change", event => {
          if (recoveryMutationBlocked()) return false;
          return persistAiActionSelection(
            event.target.dataset.aiActionSelect,
            event.target.dataset.actionId,
            event.target.checked
          );
        });
      });
      restoreAutosaveDraft();
      document.querySelectorAll("input, textarea, select").forEach(el => {
        if (!isAutosaveField(el)) return;
        el.addEventListener("input", scheduleAutosave);
        el.addEventListener("change", scheduleAutosave);
      });
      const peopleSearch = document.getElementById("people-search");
      if (peopleSearch) {
        peopleSearch.addEventListener("input", event => {
          if (recoveryMutationBlocked()) return false;
          const caret = Number.isFinite(event.target.selectionStart) ? event.target.selectionStart : event.target.value.length;
          view.search = event.target.value;
          view.peopleVisibleLimit = PEOPLE_BATCH_SIZE;
          saveCurrentDraftNow();
          render();
          const restoredSearch = document.getElementById("people-search");
          if (restoredSearch) {
            restoredSearch.focus({ preventScroll: true });
            restoredSearch.setSelectionRange(caret, caret);
          }
        });
      }
      const globalSearch = document.getElementById("global-search");
      if (globalSearch) {
        globalSearch.addEventListener("input", event => {
          if (recoveryMutationBlocked()) return false;
          const caret = Number.isFinite(event.target.selectionStart) ? event.target.selectionStart : event.target.value.length;
          view.globalSearch = event.target.value;
          view.searchVisibleLimits = {};
          saveCurrentDraftNow();
          if (globalSearchTimer) window.clearTimeout(globalSearchTimer);
          const searchEpoch = recoveryEpoch;
          globalSearchTimer = window.setTimeout(() => {
            globalSearchTimer = null;
            if (!recoveryEpochIsCurrent(searchEpoch)) return;
            if (view.screen !== "search") return;
            render();
            const restoredSearch = document.getElementById("global-search");
            if (restoredSearch) {
              restoredSearch.focus({ preventScroll: true });
              restoredSearch.setSelectionRange(caret, caret);
            }
          }, 120);
        });
      }
      const quickText = document.getElementById("quick-text");
      if (quickText) {
        view.quickGrabDraftText = quickText.value;
        quickText.addEventListener("input", event => {
          if (recoveryMutationBlocked()) return false;
          view.quickGrabDraftText = event.target.value;
          return true;
