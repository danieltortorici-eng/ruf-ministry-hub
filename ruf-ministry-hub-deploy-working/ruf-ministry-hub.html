<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#202731">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="RUF Hub">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="ruf-ministry-hub.webmanifest">
  <link rel="icon" href="ruf-ministry-hub-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" sizes="180x180" href="ruf-ministry-hub-icon-180.png">
  <link rel="apple-touch-icon" sizes="192x192" href="ruf-ministry-hub-icon-192.png">
  <title>RUF Ministry Hub</title>
  <style>
    :root {
      --ink: #17202a;
      --soft-ink: #384452;
      --muted: #667085;
      --paper: #f7f8fb;
      --surface: #ffffff;
      --line: #d8dee8;
      --accent: #2f6f63;
      --accent-strong: #23544b;
      --terra: #b45f3a;
      --gold: #c89122;
      --violet: #6554b3;
      --rose: #b34b6d;
      --ok: #287d4f;
      --warning: #9a6a00;
      --danger: #a23f3f;
      --shadow: 0 8px 24px rgba(23, 32, 42, 0.08);
      --radius: 8px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      -webkit-text-size-adjust: 100%;
      scroll-padding-bottom: 120px;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
      min-height: 100dvh;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 248px minmax(0, 1fr);
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 22px 18px;
      background: #202731;
      color: #f5f7fa;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .brand {
      display: grid;
      gap: 4px;
      padding: 0 6px;
    }

    .brand-title {
      font-size: 1.18rem;
      font-weight: 800;
      letter-spacing: 0;
    }

    .brand-subtitle {
      color: #c8d1dc;
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .nav {
      display: grid;
      gap: 6px;
    }

    .nav button {
      min-height: 42px;
      border-radius: var(--radius);
      color: #edf2f7;
      background: transparent;
      text-align: left;
      padding: 10px 12px;
      font-weight: 650;
    }

    .nav button:hover,
    .nav button.active {
      background: #33404e;
    }

    .sidebar-note {
      margin-top: auto;
      border-top: 1px solid rgba(255,255,255,0.14);
      padding: 14px 6px 0;
      color: #d5dde6;
      line-height: 1.45;
      font-size: 0.88rem;
    }

    .content {
      min-width: 0;
      padding: 28px;
    }

    .app-frame.focus-mode .content {
      max-width: 1180px;
    }

    .topbar {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .page-title {
      margin: 0;
      font-size: clamp(1.7rem, 2.4vw, 2.45rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .page-kicker {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
      line-height: 1.45;
    }

    .quick-open {
      flex: 0 0 auto;
      min-width: 160px;
    }

    .grid {
      display: grid;
      gap: 16px;
    }

    .grid.two {
      grid-template-columns: minmax(0, 1.25fr) minmax(300px, 0.75fr);
      align-items: start;
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: start;
    }

    .section {
      display: grid;
      gap: 12px;
      margin-bottom: 26px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 34px;
    }

    .section-title {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .surface {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 16px;
    }

    .item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px;
      display: grid;
      gap: 10px;
    }

    .item.compact {
      padding: 12px;
      gap: 8px;
    }

    .item-title-row,
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .row.wrap {
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    .item-title {
      font-weight: 760;
      line-height: 1.25;
    }

    .item-preview {
      margin: 0;
      color: var(--soft-ink);
      line-height: 1.45;
    }

    .preserve-lines {
      white-space: pre-line;
    }

    .meta {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.35;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef1f5;
      color: #344052;
      border: 1px solid #dce2ea;
      font-size: 0.78rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .pill.green { background: #e8f4ef; color: #24594b; border-color: #c9e6db; }
    .pill.gold { background: #fff4d8; color: #7a5600; border-color: #f0d18a; }
    .pill.terra { background: #faece6; color: #8a4127; border-color: #efc7b8; }
    .pill.violet { background: #eeeafd; color: #4d3e97; border-color: #d9d0fa; }
    .pill.rose { background: #f8e9ef; color: #873552; border-color: #ecc2d1; }
    .pill.gray { background: #f1f3f6; color: #4c5665; border-color: #dfe4ec; }

    .button {
      min-height: 40px;
      border-radius: var(--radius);
      padding: 9px 13px;
      background: #eef2f6;
      color: var(--ink);
      font-weight: 760;
      border: 1px solid #d9e1eb;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      line-height: 1.2;
    }

    .button:hover {
      filter: brightness(0.98);
    }

    .button.primary {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .button.primary:hover {
      background: var(--accent-strong);
    }

    .button.terra {
      background: var(--terra);
      color: white;
      border-color: var(--terra);
    }

    .button.danger {
      background: #f8e9e9;
      color: var(--danger);
      border-color: #e8c6c6;
    }

    .button.plain {
      background: transparent;
      border-color: transparent;
      color: var(--accent-strong);
      padding-left: 4px;
      padding-right: 4px;
    }

    .button.small {
      min-height: 32px;
      padding: 6px 9px;
      font-size: 0.86rem;
    }

    .button.full {
      width: 100%;
    }

    .action-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .focus-hero {
      display: grid;
      gap: 14px;
      background: #ffffff;
      border: 1px solid var(--line);
      border-left: 5px solid var(--accent);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .focus-hero h2 {
      margin: 0;
      font-size: 1.22rem;
      letter-spacing: 0;
    }

    .focus-step {
      display: grid;
      gap: 4px;
      padding: 13px;
      border-radius: var(--radius);
      background: #edf7f3;
      border: 1px solid #cde7dd;
    }

    .focus-step-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .focus-step strong {
      color: var(--accent-strong);
      line-height: 1.35;
    }

    .focus-card {
      border-left: 4px solid #dce6ef;
    }

    .focus-card.important {
      border-left-color: var(--gold);
    }

    .focus-card.today {
      border-left-color: var(--terra);
    }

    .next-step-line {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: var(--soft-ink);
      font-size: 0.9rem;
    }

    .next-step-line strong {
      color: var(--ink);
    }

    .extra-actions {
      display: none;
      padding-top: 8px;
      border-top: 1px solid var(--line);
    }

    .extra-actions.is-open {
      display: flex;
    }

    .app-frame:not(.focus-mode) .extra-actions {
      display: flex;
    }

    .app-frame.advanced-actions .extra-actions {
      display: flex;
    }

    .calm-toggle {
      background: #eef7f3;
      color: var(--accent-strong);
      border-color: #cbe7dc;
    }

    .editable-copy {
      display: inline;
      border-radius: 6px;
      outline: 2px dashed #9ccdbd;
      outline-offset: 3px;
      cursor: text;
    }

    .editable-copy:hover {
      background: #eef7f3;
    }

    .settings-list {
      display: grid;
      gap: 10px;
    }

    .setting-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
      background: #fff;
    }

    .setting-row .item-title {
      margin-bottom: 3px;
    }

    .switch {
      display: inline-flex;
      align-items: center;
      min-width: 52px;
      height: 30px;
      border-radius: 999px;
      background: #d9e1eb;
      padding: 3px;
    }

    .switch input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch span {
      width: 24px;
      height: 24px;
      border-radius: 999px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(23, 32, 42, 0.24);
      transition: transform 140ms ease;
    }

    .switch input:checked + span {
      transform: translateX(22px);
      background: #ffffff;
    }

    .switch.is-on {
      background: var(--accent);
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field label {
      font-size: 0.86rem;
      color: var(--soft-ink);
      font-weight: 760;
    }

    .input,
    .select,
    .textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: white;
      color: var(--ink);
      padding: 10px 11px;
      min-height: 42px;
      outline: none;
    }

    .textarea {
      min-height: 170px;
      resize: vertical;
      line-height: 1.45;
    }

    .textarea.small {
      min-height: 92px;
    }

    .input:focus,
    .select:focus,
    .textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(47, 111, 99, 0.16);
    }

    .quick-box {
      display: grid;
      gap: 14px;
    }

    .quick-box .textarea {
      min-height: 210px;
      font-size: 1.05rem;
    }

    .chip-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .chip {
      min-height: 34px;
      padding: 7px 10px;
      border-radius: 999px;
      background: white;
      color: var(--soft-ink);
      border: 1px solid var(--line);
      font-weight: 720;
    }

    .chip.active {
      background: #e8f4ef;
      border-color: #9ccdbd;
      color: #24594b;
    }

    .chip.urgent.active {
      background: #fff4d8;
      border-color: #e7c477;
      color: #7a5600;
    }

    .empty {
      border: 1px dashed #cbd4df;
      border-radius: var(--radius);
      padding: 18px;
      color: var(--muted);
      background: rgba(255,255,255,0.65);
      line-height: 1.45;
    }

    .notice {
      border-radius: var(--radius);
      border: 1px solid #dfe4ec;
      background: #f4f7fa;
      color: var(--soft-ink);
      padding: 12px;
      line-height: 1.45;
    }

    .notice.sensitive {
      border-color: #ecc2d1;
      background: #fff5f8;
      color: #753248;
    }

    .notice.backup {
      border-color: #f0d18a;
      background: #fff8e7;
      color: #6f4d00;
    }

    .notice.secure {
      border-color: #cbe7dc;
      background: #eef7f3;
      color: #23544b;
    }

    .notice.danger {
      border-color: #efc8c8;
      background: #fff3f3;
      color: #7c2f2f;
    }

    .lock-screen {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 22px;
      background: #202731;
    }

    .lock-panel {
      width: min(100%, 420px);
      display: grid;
      gap: 16px;
      background: #ffffff;
      border-radius: var(--radius);
      border: 1px solid #d8dee8;
      padding: 20px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.22);
    }

    .manual-list {
      display: grid;
      gap: 10px;
    }

    .manual-list details {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #ffffff;
      padding: 12px;
    }

    .manual-list summary {
      cursor: pointer;
      font-weight: 800;
      color: var(--ink);
    }

    .manual-list ol,
    .manual-list ul {
      margin: 10px 0 0;
      padding-left: 22px;
      color: var(--soft-ink);
      line-height: 1.45;
    }

    .lock-title {
      margin: 0;
      font-size: 1.45rem;
      line-height: 1.1;
      letter-spacing: 0;
    }

    .review-card {
      display: grid;
      gap: 14px;
      min-height: 340px;
      align-content: start;
    }

    .review-progress {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      color: var(--muted);
      font-weight: 760;
      font-size: 0.9rem;
    }

    .people-shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .shortcut-button {
      min-height: 38px;
      border-radius: 999px;
      padding: 8px 11px;
      background: #ffffff;
      color: var(--accent-strong);
      border: 1px solid #cbe7dc;
      font-weight: 760;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }

    .form-grid .wide {
      grid-column: 1 / -1;
    }

    .check-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    .check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 10px;
      background: #ffffff;
      color: var(--soft-ink);
      line-height: 1.35;
      min-height: 44px;
    }

    .check input {
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .profile-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: start;
      margin-bottom: 20px;
    }

    .profile-identity {
      display: grid;
      grid-template-columns: 92px minmax(0, 1fr);
      gap: 14px;
      align-items: center;
    }

    .profile-photo {
      width: 92px;
      height: 92px;
      border-radius: 50%;
      border: 2px solid #d8dee8;
      background: #eef2f6;
      color: var(--accent-strong);
      display: grid;
      place-items: center;
      overflow: hidden;
      font-size: 1.45rem;
      font-weight: 850;
      flex: 0 0 auto;
    }

    .profile-photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .profile-name {
      margin: 0;
      font-size: clamp(1.7rem, 2.5vw, 2.6rem);
      letter-spacing: 0;
      line-height: 1.05;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    .stat {
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 11px;
      min-height: 78px;
      display: grid;
      gap: 5px;
      align-content: start;
    }

    .stat-label {
      color: var(--muted);
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 800;
    }

    .stat-value {
      color: var(--ink);
      font-weight: 760;
      line-height: 1.25;
    }

    .timeline {
      display: grid;
      gap: 10px;
      position: relative;
    }

    .timeline-item {
      display: grid;
      grid-template-columns: 105px minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      background: white;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tab {
      min-height: 34px;
      border-radius: 999px;
      padding: 7px 11px;
      background: white;
      border: 1px solid var(--line);
      color: var(--soft-ink);
      font-weight: 760;
    }

    .tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }

    .toast {
      position: fixed;
      right: 18px;
      bottom: 18px;
      background: #202731;
      color: white;
      padding: 11px 13px;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: 160ms ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: grid;
      place-items: end center;
      padding: 18px;
      background: rgba(23, 32, 42, 0.42);
    }

    .sheet-panel {
      width: min(100%, 620px);
      max-height: min(88vh, 760px);
      overflow: auto;
      display: grid;
      gap: 14px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 22px 55px rgba(23, 32, 42, 0.24);
      padding: 16px;
    }

    .sheet-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .sheet-head h2 {
      margin: 0;
      font-size: 1.18rem;
      line-height: 1.2;
      letter-spacing: 0;
    }

    .sheet-form {
      display: grid;
      gap: 12px;
    }

    .sheet-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      padding-top: 4px;
    }

    .mobile-nav {
      display: none;
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 10;
      background: #202731;
      color: white;
      padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
      gap: 5px;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      overflow: hidden;
      border-top: 1px solid rgba(255,255,255,0.12);
      box-shadow: 0 -10px 28px rgba(23, 32, 42, 0.18);
    }

    .mobile-nav button {
      min-width: 0;
      min-height: 48px;
      border-radius: 999px;
      padding: 7px 4px;
      background: #33404e;
      color: white;
      font-weight: 750;
      font-size: 0.72rem;
      line-height: 1.1;
      white-space: nowrap;
    }

    .mobile-nav button.active {
      background: var(--accent);
    }

    .mobile-fab {
      display: none;
      position: fixed;
      right: 16px;
      bottom: calc(74px + env(safe-area-inset-bottom));
      z-index: 12;
      min-height: 56px;
      min-width: 142px;
      border-radius: 999px;
      padding: 14px 18px;
      background: var(--accent);
      color: #fff;
      font-weight: 850;
      box-shadow: 0 12px 30px rgba(35, 84, 75, 0.32);
    }

    @media (max-width: 980px) {
      .shell {
        grid-template-columns: 1fr;
        min-height: 100dvh;
      }

      .sidebar {
        display: none;
      }

      .mobile-nav {
        display: grid;
      }

      .content {
        padding: calc(16px + env(safe-area-inset-top)) 14px calc(118px + env(safe-area-inset-bottom));
      }

      .app-frame.focus-mode .content {
        max-width: none;
      }

      .mobile-fab {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

    function uid(prefix) {
      return prefix + "_" + Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-4);
    }

    function localISODate(date = new Date()) {
      const d = new Date(date);
      const year = d.getFullYear();
      const month = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function todayISO() {
      return localISODate();
    }

    function daysFromNow(days) {
      const d = new Date();
      d.setDate(d.getDate() + days);
      return localISODate(d);
    }

    function daysAgo(days) {
      return daysFromNow(-days);
    }

    function isISODateString(value) {
      const raw = String(value || "");
      if (!/^\d{4}-\d{2}-\d{2}$/.test(raw)) return false;
      const [year, month, day] = raw.split("-").map(Number);
      const d = new Date(year, month - 1, day);
      return d.getFullYear() === year && d.getMonth() === month - 1 && d.getDate() === day;
    }

    function startOfToday() {
      const d = new Date();
      d.setHours(0, 0, 0, 0);
      return d;
    }

    function dateLabel(value) {
      if (!value) return "Not set";
      const d = new Date(value + "T12:00:00");
      return d.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
    }

    function dateTimeLabel(value) {
      if (!value) return "Not set";
      const raw = String(value);
      const d = raw.length === 10 ? new Date(raw + "T12:00:00") : new Date(raw);
      if (Number.isNaN(d.getTime())) return "Not set";
      return d.toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        year: "numeric",
        hour: "numeric",
        minute: "2-digit"
      });
    }

    function timestampLine(record, primaryLabel = "", primaryValue = "") {
      const parts = [];
      if (primaryLabel && primaryValue) parts.push(`${primaryLabel}: ${dateTimeLabel(primaryValue)}`);
      if (record?.createdAt) parts.push(`Created: ${dateTimeLabel(record.createdAt)}`);
      if (record?.updatedAt) parts.push(`Updated: ${dateTimeLabel(record.updatedAt)}`);
      return parts.length ? `<div class="meta">${escapeHtml(parts.join(" • "))}</div>` : "";
    }

    function nowISO() {
      return new Date().toISOString();
    }

    function canUseServiceWorker() {
      return typeof navigator !== "undefined"
        && navigator.serviceWorker
        && typeof navigator.serviceWorker.register === "function"
        && typeof window !== "undefined"
        && /^https?:$/.test(window.location.protocol);
    }

    function registerServiceWorker() {
      if (!canUseServiceWorker()) return;
      const hadControllerAtRegistration = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.register("ruf-ministry-hub-sw.js").then(registration => {
        serviceWorkerRegistration = registration;
        if (registration.waiting) {
          updateAvailable = true;
          render();
        }
        registration.addEventListener("updatefound", () => {
          const installing = registration.installing;
          if (!installing) return;
          installing.addEventListener("statechange", () => {
            if (installing.state === "installed" && navigator.serviceWorker.controller) {
              updateAvailable = true;
              render();
            }
          });
        });
      }).catch(error => console.warn("Could not register service worker", error));
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hadControllerAtRegistration && !updateAvailable) return;
        if (reloadingForUpdate) return;
        reloadingForUpdate = true;
        window.location.reload();
      });
    }

    function applyAppUpdate() {
      const waiting = serviceWorkerRegistration && serviceWorkerRegistration.waiting;
      if (waiting) {
        waiting.postMessage({ type: "SKIP_WAITING" });
        showToast("Updating app...");
        return;
      }
      if (typeof window !== "undefined") window.location.reload();
    }

    function checkForAppUpdate() {
      if (!serviceWorkerRegistration || !serviceWorkerRegistration.update) {
        showToast(canUseServiceWorker() ? "Offline updater is still starting." : "Serve over HTTPS or localhost for update checks.");
        return;
      }
      serviceWorkerRegistration.update().then(() => {
        showToast(updateAvailable ? "Update ready." : "No update found.");
        render();
      }).catch(() => showToast("Could not check for updates."));
    }

      merged.quickGrabAiMode = ["localMock", "backendQuickGrab"].includes(merged.quickGrabAiMode) ? merged.quickGrabAiMode : "localMock";

      if (!record || typeof record !== "object") return "Normal";
      const explicitTier = normalizeAiPrivacyTier(record.aiPrivacyTier || record.aiContextPrivacyTier || "", "");
      if (explicitTier) return explicitTier;
      if (record.aiDoNotSendToAi === true) return "Do Not Send to AI";
      const sensitivity = normalizeAiPrivacyTier(record.sensitivityLevel || "", "");
      if (sensitivity) return sensitivity;
      if (record.sensitivityLevel === "Sensitive") return "Sensitive";
      if (record.sensitiveFlag === true) return "Sensitive";
      return collection === "prayerRequests" && record.sensitivityLevel === "Sensitive" ? "Sensitive" : "Normal";
    }

      return "gray";

      if (tier === "Sensitive") return settings?.aiAllowSensitive === true;

    function canUseIndexedDb() {
      return typeof indexedDB !== "undefined";
    }

    function openIndexedDb() {
      return new Promise((resolve, reject) => {
        if (!canUseIndexedDb()) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        const request = indexedDB.open(IDB_NAME, 1);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(IDB_STORE)) database.createObjectStore(IDB_STORE);
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    function idbTransaction(mode, key, value) {
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, mode);
        const store = transaction.objectStore(IDB_STORE);
        const request = mode === "readonly" ? store.get(key) : store.put(value, key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => {
          database.close();
          reject(transaction.error);
        };
      }));
    }

    function mirrorToIndexedDb(key, value) {
      if (!canUseIndexedDb()) return;
      idbTransaction("readwrite", key, value).catch(() => {});
    }

    function deleteFromIndexedDb(key) {
      if (!canUseIndexedDb()) return;
      openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, "readwrite");
        const request = transaction.objectStore(IDB_STORE).delete(key);
        request.onsuccess = () => resolve();
        request.onerror = () => reject(request.error);
        transaction.oncomplete = () => database.close();
        transaction.onerror = () => {
          database.close();
          reject(transaction.error);
        };
      })).catch(() => {});
    }

    async function hydrateFromIndexedDb() {
      if (!canUseIndexedDb()) return;
      try {
        const hasLocalData = Boolean(localStorage.getItem(STORAGE_KEY));
        const hasLocalSettings = Boolean(localStorage.getItem(SETTINGS_KEY));
        const hasLocalCopy = Boolean(localStorage.getItem(COPY_KEY));
        const hasLocalAutoMemory = Boolean(localStorage.getItem(AUTO_MEMORY_KEY));
        const hasLocalEncrypted = Boolean(localStorage.getItem(ENCRYPTED_STORAGE_KEY));
        let changed = false;
        if (settings.localEncryptionEnabled) {
          if (!hasLocalEncrypted) {
            const storedEncrypted = await idbTransaction("readonly", ENCRYPTED_STORAGE_KEY);
            if (storedEncrypted) {
              localStorage.setItem(ENCRYPTED_STORAGE_KEY, JSON.stringify(storedEncrypted));
              view.encryptionLocked = true;
              changed = true;
            }
          }
          if (changed) render();
          return;
        }
        if (!hasLocalData) {
          const storedDb = await idbTransaction("readonly", STORAGE_KEY);
          if (storedDb) {
            db = storedDb;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            changed = true;
          }
        }
        if (!hasLocalSettings) {
          const storedSettings = await idbTransaction("readonly", SETTINGS_KEY);
          if (storedSettings) {
            settings = normalizeSettings(storedSettings);
            view.focusMode = settings.calmMode;
            view.locked = Boolean(settings.appLockEnabled && settings.pinHash);
            view.encryptionLocked = Boolean(settings.localEncryptionEnabled && encryptedVaultExists());
            localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
            changed = true;
          }
        }
        if (!hasLocalCopy) {
          const storedCopy = await idbTransaction("readonly", COPY_KEY);
          if (storedCopy) {
            customCopy = storedCopy;
            localStorage.setItem(COPY_KEY, JSON.stringify(customCopy));
            changed = true;
          }
        }
        if (!hasLocalAutoMemory) {
          const storedAutoMemory = await idbTransaction("readonly", AUTO_MEMORY_KEY);
          if (storedAutoMemory) {
            localStorage.setItem(AUTO_MEMORY_KEY, JSON.stringify(normalizeAutoMemoryVault(storedAutoMemory)));
            changed = true;
          }
        }
        if (changed) render();
      } catch (error) {
        console.warn("Could not hydrate from IndexedDB", error);
      }
    }

    function canUseWebCrypto() {
      return typeof crypto !== "undefined" && crypto.subtle && typeof TextEncoder !== "undefined" && typeof TextDecoder !== "undefined" && typeof btoa !== "undefined" && typeof atob !== "undefined";
    }

    function bytesToBase64(bytes) {
      let binary = "";
      Array.from(bytes).forEach(byte => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    async function deriveVaultKey(passphrase, salt) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(payload, passphrase, kind = "ruf-ministry-hub-encrypted") {
      if (!canUseWebCrypto()) throw new Error("Encryption is not available in this browser.");
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveVaultKey(passphrase, salt);
      const plaintext = new TextEncoder().encode(JSON.stringify(payload));
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
      return {
        kind,
        version: 1,
        algorithm: "AES-GCM",
        kdf: "PBKDF2-SHA-256",
        iterations: 150000,
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        ciphertext: bytesToBase64(new Uint8Array(ciphertext)),
        encryptedAt: nowISO()
      };
    }

    async function decryptPayload(envelope, passphrase) {
      if (!canUseWebCrypto()) throw new Error("Encryption is not available in this browser.");
      if (!envelope || !envelope.salt || !envelope.iv || !envelope.ciphertext) throw new Error("Encrypted file is missing required fields.");
      const salt = base64ToBytes(envelope.salt);
      const iv = base64ToBytes(envelope.iv);
      const key = await deriveVaultKey(passphrase, salt);
      const ciphertext = base64ToBytes(envelope.ciphertext);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    function scheduleVaultSave() {
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return;
      if (vaultSaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(vaultSaveTimer);
      }
      const delay = window.setTimeout || setTimeout;
      vaultSaveTimer = delay(() => persistEncryptedVault(), 250);
    }

    async function persistEncryptedVault() {
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return;
      try {
        const envelope = await encryptPayload({ data: db, customCopy, autosaveDrafts: loadAutosaveDrafts(), autoMemoryVault: loadAutoMemoryVault() }, vaultPassphrase);
        localStorage.setItem(ENCRYPTED_STORAGE_KEY, JSON.stringify(envelope));
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(COPY_KEY);
        localStorage.removeItem(AUTOSAVE_KEY);
        localStorage.removeItem(AUTO_MEMORY_KEY);
        settings.localEncryptionUpdatedAt = envelope.encryptedAt;
        localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        mirrorToIndexedDb(ENCRYPTED_STORAGE_KEY, envelope);
        deleteFromIndexedDb(STORAGE_KEY);
        deleteFromIndexedDb(COPY_KEY);
        deleteFromIndexedDb(AUTOSAVE_KEY);
        deleteFromIndexedDb(AUTO_MEMORY_KEY);
      } catch (error) {
        console.warn("Could not save encrypted vault", error);
        showToast("Encrypted save failed.");
      }
    }

    function currentPortablePayload() {
      return {
        exportedAt: nowISO(),
        app: "RUF Ministry Hub",
        version: 2,
        data: db,
        settings,
        customCopy,
        autosaveDrafts: loadAutosaveDrafts()
      };
    }

    function emptyAutoMemoryVault() {
      return {
        version: 1,
        updatedAt: "",
        snapshots: []
      };
    }

    function autoMemoryLimit() {
      const limit = Number(settings?.autoMemorySnapshotLimit || DEFAULT_SETTINGS.autoMemorySnapshotLimit);
      if (!Number.isFinite(limit)) return Number(DEFAULT_SETTINGS.autoMemorySnapshotLimit);
      return Math.max(3, Math.min(50, Math.floor(limit)));
    }

    function autoMemoryComparablePayload(payload) {
      const cleanSettings = { ...(payload?.settings || {}) };
      delete cleanSettings.lastBackupAt;
      delete cleanSettings.localEncryptionUpdatedAt;
      return {
        data: payload?.data || payload?.db || emptyData(),
        settings: cleanSettings,
        customCopy: payload?.customCopy || {},
        autosaveDrafts: payload?.autosaveDrafts || {}
      };
    }

    function autoMemorySignature(payload) {
      try {
        return JSON.stringify(autoMemoryComparablePayload(payload));
      } catch (error) {
        return String(Date.now());
      }
    }

    function normalizeAutoMemoryVault(raw = {}) {
      const normalized = emptyAutoMemoryVault();
      if (!raw || typeof raw !== "object") return normalized;
      normalized.version = Number(raw.version || 1);
      normalized.updatedAt = typeof raw.updatedAt === "string" ? raw.updatedAt : "";
      const snapshots = Array.isArray(raw.snapshots) ? raw.snapshots : [];
      normalized.snapshots = snapshots
        .filter(snapshot => snapshot && typeof snapshot === "object" && snapshot.payload && (snapshot.payload.data || snapshot.payload.db))
        .map(snapshot => {
          const payload = snapshot.payload;
          return {
            id: snapshot.id || uid("memory"),
            savedAt: snapshot.savedAt || snapshot.createdAt || payload.exportedAt || nowISO(),
            label: String(snapshot.label || "Auto save").slice(0, 80),
            appVersion: snapshot.appVersion || "",
            summary: snapshot.summary || dataSummaryText(payload.data || payload.db),
            signature: snapshot.signature || autoMemorySignature(payload),
            payload
          };
        })
        .sort((a, b) => String(b.savedAt || "").localeCompare(String(a.savedAt || "")))
        .slice(0, autoMemoryLimit());
      return normalized;
    }

    function loadAutoMemoryVault() {
      if (settings?.localEncryptionEnabled) return normalizeAutoMemoryVault(memoryVaultCache || emptyAutoMemoryVault());
      try {
        const raw = localStorage.getItem(AUTO_MEMORY_KEY);
        if (raw) return normalizeAutoMemoryVault(JSON.parse(raw));
      } catch (error) {
        console.warn("Could not load Auto Memory Vault", error);
      }
      return emptyAutoMemoryVault();
    }

    function saveAutoMemoryVault(vault) {
      const normalized = normalizeAutoMemoryVault(vault);
      if (settings?.localEncryptionEnabled) {
        memoryVaultCache = normalized;
        scheduleVaultSave();
        return true;
      }
      const working = normalizeAutoMemoryVault(normalized);
      while (true) {
        try {
          localStorage.setItem(AUTO_MEMORY_KEY, JSON.stringify(working));
          mirrorToIndexedDb(AUTO_MEMORY_KEY, working);
          return true;
        } catch (error) {
          if (!working.snapshots.length) {
            console.warn("Could not save Auto Memory Vault", error);
            return false;
          }
          working.snapshots.pop();
          working.updatedAt = working.snapshots[0]?.savedAt || "";
        }
      }
    }

    function captureAutoMemorySnapshot(label = "Auto save", options = {}) {
      if (!settings?.autoMemoryVaultEnabled) return null;
      if (typeof db === "undefined" || !db) return null;
      const payload = currentPortablePayload();
      payload.exportedAt = nowISO();
      const signature = autoMemorySignature(payload);
      const vault = loadAutoMemoryVault();
      const latest = vault.snapshots[0];
      if (!options.force && latest && latest.signature === signature) return latest;
      const snapshot = {
        id: uid("memory"),
        savedAt: payload.exportedAt,
        label,
        appVersion: APP_VERSION,
        summary: dataSummaryText(payload.data),
        signature,
        payload
      };
      vault.snapshots = [
        snapshot,
        ...vault.snapshots.filter(item => item.signature !== signature)
      ].slice(0, autoMemoryLimit());
      vault.updatedAt = snapshot.savedAt;
      return saveAutoMemoryVault(vault) ? snapshot : null;
    }

    function autoMemoryVaultState() {
      const vault = loadAutoMemoryVault();
      const snapshots = vault.snapshots || [];
      const latest = snapshots[0] || null;
      if (!settings.autoMemoryVaultEnabled) {
        return {

      if (!snapshots.length) {
        return {

          count: 0,
          latest: null

      return {

    function findAutoMemorySnapshot(id) {

    function saveAutoMemoryRestorePoint() {

    function deleteAutoMemorySnapshot(id) {
      const vault = loadAutoMemoryVault();
      const before = vault.snapshots.length;
      vault.snapshots = vault.snapshots.filter(snapshot => snapshot.id !== id);
      vault.updatedAt = vault.snapshots[0]?.savedAt || "";
      if (before === vault.snapshots.length) return false;
      saveAutoMemoryVault(vault);
      return true;
    }

    function clearAutoMemorySnapshots() {
      const vault = emptyAutoMemoryVault();

    function applyRestoredPayload(payload, options = {}) {
      const restoredData = normalizeData(payload.data || payload.db);
      const incomingSettings = normalizeSettings(payload.settings || {});
      const keepVault = {
        localEncryptionEnabled: settings.localEncryptionEnabled,
        localEncryptionHint: settings.localEncryptionHint,
        localEncryptionUpdatedAt: settings.localEncryptionUpdatedAt
      };
      if (options.captureBefore !== false) captureAutoMemorySnapshot(options.beforeLabel || "Before backup restore", { force: true });
      recordUndo(options.undoLabel || "backup restore");
      db = restoredData;
      settings = normalizeSettings({ ...incomingSettings, ...keepVault });
      customCopy = payload.customCopy && typeof payload.customCopy === "object" ? payload.customCopy : {};
      autosaveDraftsCache = payload.autosaveDrafts && typeof payload.autosaveDrafts === "object" ? payload.autosaveDrafts : {};
      saveSettings();
      saveData();
      saveCustomCopy();
      saveAutosaveDrafts(autosaveDraftsCache || {});
      resetViewAfterRestore();
      showToast(options.toast || "Backup restored.");
      render();
    }

    function loadAutosaveDrafts() {
      if (settings?.localEncryptionEnabled) return autosaveDraftsCache || {};
      try {
        const raw = localStorage.getItem(AUTOSAVE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        console.warn("Could not load autosave drafts", error);
        return {};
      }
    }

    function saveAutosaveDrafts(drafts) {
      if (settings?.localEncryptionEnabled) {
        autosaveDraftsCache = cloneJson(drafts || {});
        localStorage.removeItem(AUTOSAVE_KEY);
        deleteFromIndexedDb(AUTOSAVE_KEY);
        scheduleVaultSave();
        return;
      }
      localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(drafts));
      mirrorToIndexedDb(AUTOSAVE_KEY, drafts);
    }

    function autosaveDraftKey() {
      if (view.screen === "quick") return "screen:quick";
      if (view.screen === "process" && view.quickGrabId) return "process:" + view.quickGrabId;
      if (view.screen === "snooze" && view.quickGrabId) return "snooze:" + view.quickGrabId;
      if (view.screen === "search") return "screen:search";
      if (view.screen === "people") return "screen:people";
      return "";
    }

    function isAutosaveField(el) {
      if (!settings.enableAutoSave || !el || !el.id) return false;
      if (el.type === "password" || el.type === "file") return false;
      if (el.id === "pin-input" || el.id === "vault-passphrase" || el.id === "import-backup-file") return false;
      if (el.dataset.settingToggle || el.dataset.settingSelect || el.dataset.copyKey) return false;
      if (typeof el.closest === "function" && el.closest("[data-sheet-panel]")) return false;
      return ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName);
    }

    function collectAutosaveDraft() {
      const key = autosaveDraftKey();
      if (!key) return null;
      const fields = {};
      document.querySelectorAll("input, textarea, select").forEach(el => {
        if (!isAutosaveField(el)) return;
        fields[el.id] = el.type === "checkbox" ? Boolean(el.checked) : el.value;
      });
      const quickTags = Array.from(document.querySelectorAll("#quick-tags .chip.active")).map(el => el.dataset.tag).filter(Boolean);
      const urgency = document.querySelector("#urgency-tags .chip.active")?.dataset.urgency || "";
      if (quickTags.length) fields["quick-tags"] = quickTags;
      if (urgency) fields["urgency-tags"] = urgency;
      return { key, fields, updatedAt: nowISO(), screen: view.screen };
    }

    function hasDraftContent(fields) {
      return Object.values(fields).some(value => {
        if (Array.isArray(value)) return value.length > 0;
        if (typeof value === "boolean") return value;
        return String(value || "").trim() !== "";
      });
    }

    function saveCurrentDraftNow() {
      if (!settings.enableAutoSave) return;
      const draft = collectAutosaveDraft();
      if (!draft) return;
      const drafts = loadAutosaveDrafts();
      if (hasDraftContent(draft.fields)) drafts[draft.key] = draft;
      else delete drafts[draft.key];
      saveAutosaveDrafts(drafts);
    }

    function scheduleAutosave() {
      if (!settings.enableAutoSave) return;
      if (autosaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(autosaveTimer);
      }
      const delay = window.setTimeout || setTimeout;
      autosaveTimer = delay(saveCurrentDraftNow, 180);
    }

    function restoreAutosaveDraft() {
      if (!settings.enableAutoSave) return;
      const key = autosaveDraftKey();
      if (!key) return;
      const draft = loadAutosaveDrafts()[key];
      if (!draft || !draft.fields) return;
      Object.entries(draft.fields).forEach(([id, value]) => {
        if (id === "quick-tags") {
          document.querySelectorAll("#quick-tags .chip").forEach(button => {
            button.classList.toggle("active", Array.isArray(value) && value.includes(button.dataset.tag));
          });
          return;
        }
        if (id === "urgency-tags") {
          document.querySelectorAll("#urgency-tags .chip").forEach(button => {
            button.classList.toggle("active", value === button.dataset.urgency);
          });
          return;
                }
        const el = document.getElementById(id);
        if (!isAutosaveField(el)) return;
        if (el.type === "checkbox") el.checked = Boolean(value);
        else el.value = value;
      });
      updateNewPersonFields();
      const quickText = document.getElementById("quick-text");
      if (quickText) view.quickGrabDraftText = quickText.value;
    }

    function clearAutosaveDraft(key = autosaveDraftKey()) {
      if (!key) return;
      const drafts = loadAutosaveDrafts();
      if (!drafts[key]) return;
      delete drafts[key];
      saveAutosaveDrafts(drafts);
    }

    function clearAutosaveDraftPrefix(prefix) {
      const drafts = loadAutosaveDrafts();
      let changed = false;
      Object.keys(drafts).forEach(key => {
        if (key.startsWith(prefix)) {
          delete drafts[key];
          changed = true;
        }
      });
      if (changed) saveAutosaveDrafts(drafts);
    }

    function clearAllAutosaveDrafts() {
      autosaveDraftsCache = {};
      localStorage.removeItem(AUTOSAVE_KEY);
      deleteFromIndexedDb(AUTOSAVE_KEY);
      if (settings?.localEncryptionEnabled) scheduleVaultSave();
    }

    function makeQuickGrab(rawContent, tags = [], urgency = "Whenever", peopleList = null) {
      const parsed = parseQuickGrab(rawContent, tags, urgency, peopleList);
      return {
        id: uid("grab"),
        rawContent,
        detectedPersonName: parsed.detectedPersonName,
        relatedPersonId: parsed.relatedPersonId,
        detectedDate: parsed.detectedDate,
        detectedPrayerRequest: parsed.detectedPrayerRequest,
        detectedFollowUp: parsed.detectedFollowUp,
        detectedFollowUpDate: parsed.detectedFollowUpDate,
        detectedMeetingSummary: parsed.detectedMeetingSummary,
        category: parsed.category,
        status: "Needs Processing",
        urgency,
        remindAt: parsed.remindAt,
        snoozedUntil: "",
        sensitiveFlag: false,
        convertedToTypes: [],
        convertedRecordIds: [],
        createdAt: nowISO(),
        updatedAt: nowISO()
      };
    }

    function parseQuickGrab(rawContent, tags = [], urgency = "Whenever", peopleList = null) {
      const raw = rawContent.trim();
      const lower = raw.toLowerCase();
      const knownPeople = peopleList || (db && db.people ? db.people : []);
      const related = knownPeople.find(person => lower.includes(person.name.toLowerCase().split(" ")[0]) || lower.includes(person.name.toLowerCase())) || null;
      const hasPrayer = /\bpray|prayer|sick|surgery|wisdom|anxiety|hard\b/i.test(raw);
      const hasMeeting = /\bmet|coffee|talked|lunch|meeting|called|sat down\b/i.test(raw);
      const hasFollow = /\bfollow up|check in|remind me|ask .* about|send .* text|send .* note\b/i.test(raw);
      let category = "Unsure";
      if (tags.length) category = tags.find(tag => CATEGORIES.includes(tag)) || "Unsure";
      else if (/\bdonor|supporter|alumni\b/i.test(raw)) category = "Donors";
      else if (/\bpray|prayer|sick|surgery\b/i.test(raw)) category = "Prayer";
      else if (/\bsermon|lesson|illustration|teaching|bible study\b/i.test(raw)) category = "Teaching";
      else if (/\bcups|large group|retreat|calendar|event\b/i.test(raw)) category = "Events";
      else if (related || hasMeeting || hasFollow) category = "People";
      let followUpDate = "";
      if (/next friday/i.test(raw)) followUpDate = nextWeekday(5);
      else if (/next tuesday/i.test(raw)) followUpDate = nextWeekday(2);
      else if (/tomorrow/i.test(raw)) followUpDate = daysFromNow(1);
      else if (/next week/i.test(raw)) followUpDate = daysFromNow(7);
      else if (/this week/i.test(raw)) followUpDate = daysFromNow(3);
      let remindAt = "";
      if (urgency === "Today") remindAt = todayISO();
      if (urgency === "Soon") remindAt = daysFromNow(1);
      if (urgency === "Important") remindAt = todayISO();
      return {
        detectedPersonName: related ? related.name : guessPersonName(raw),
        relatedPersonId: related ? related.id : "",
        detectedDate: hasMeeting ? todayISO() : "",
        detectedPrayerRequest: hasPrayer ? extractPrayer(raw) : "",
        detectedFollowUp: hasFollow ? extractFollowUp(raw) : "",
        detectedFollowUpDate: followUpDate,
        detectedMeetingSummary: hasMeeting ? raw : "",
        category,
        remindAt
      };
    }

    function nextWeekday(dayIndex) {
      const d = new Date();
      const diff = (dayIndex + 7 - d.getDay()) % 7 || 7;
      d.setDate(d.getDate() + diff);
      return localISODate(d);
    }

    function guessPersonName(raw) {
      const match = raw.match(/\b(?:with|to|from|ask|called|met with|coffee with)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/);
      return match ? match[1].replace(/\.$/, "") : "";
    }

    function extractPrayer(raw) {
      const prayerMatch = raw.match(/(?:pray(?:er)?\s*(?:for)?|needs prayer for)\s+([^.!?]+[.!?]?)/i);
      if (prayerMatch) return cleanSentence(prayerMatch[1]);
      const sickMatch = raw.match(/([^.!?]*(?:sick|surgery|anxiety|wisdom)[^.!?]*[.!?]?)/i);
      return sickMatch ? cleanSentence(sickMatch[1]) : raw;
    }

    function extractFollowUp(raw) {
      const followMatch = raw.match(/((?:follow up|check in|remind me|ask|send)[^.!?]*[.!?]?)/i);
      return followMatch ? cleanSentence(followMatch[1]) : "";
    }

    function cleanSentence(value) {
      return value.trim().replace(/^\s*(for|about)\s+/i, "").replace(/[. ]+$/, ".");
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function personById(id) {
      return db.people.find(person => person.id === id);
    }

    function promptQuickGrabs() {
      const today = startOfToday();
      const promptAfterMs = Number(settings.promptMeAfterHours || 24) * 60 * 60 * 1000;
      return db.quickGrabs.filter(grab => {
        if (["Done", "Converted", "Archived"].includes(grab.status)) return false;
        if (grab.snoozedUntil && new Date(grab.snoozedUntil + "T00:00:00") > today) return false;
        if (!["New", "Needs Processing", "Prompt Me", "Snoozed"].includes(grab.status)) return false;
        if (!grab.remindAt) {
          if (!promptAfterMs) return true;
          return Date.now() - new Date(grab.createdAt).getTime() >= promptAfterMs;
        }
        return new Date(grab.remindAt + "T00:00:00") <= today;
      }).sort((a, b) => urgencyRank(b.urgency) - urgencyRank(a.urgency) || b.createdAt.localeCompare(a.createdAt));
    }

    function urgencyRank(urgency) {
      return { Important: 4, Today: 3, Soon: 2, Whenever: 1 }[urgency] || 0;
    }

    function openQuickGrabs() {
      return db.quickGrabs
        .filter(grab => !["Done", "Converted", "Archived"].includes(grab.status))
        .sort((a, b) => b.createdAt.localeCompare(a.createdAt));
    }

    function peopleToCareFor() {
      const today = startOfToday();
      return db.people
        .filter(person => person.nextFollowUpDate && new Date(person.nextFollowUpDate + "T00:00:00") <= new Date(today.getTime() + 7 * 86400000))
        .sort((a, b) => a.nextFollowUpDate.localeCompare(b.nextFollowUpDate));
    }

    function taskDueSoon() {
      const cutoff = new Date(startOfToday().getTime() + 7 * 86400000);
      return db.tasks
        .filter(task => task.status !== "Done / Archived" && task.dueDate && new Date(task.dueDate + "T00:00:00") <= cutoff)
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate));
    }

    function hashPin(pin) {
      let hash = 2166136261;
      for (let index = 0; index < String(pin).length; index += 1) {
        hash ^= String(pin).charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }

    function unlockApp() {
      const input = document.getElementById("pin-input");
      const pin = input ? input.value.trim() : "";
      if (!pin) {
        showToast("Enter your PIN.");
        return;
      }
      if (hashPin(pin) !== settings.pinHash) {
        showToast("That PIN did not match.");
        return;
      }
      view.locked = false;
      showToast("Unlocked.");
      render();
    }

    async function unlockVault() {
      const input = document.getElementById("vault-passphrase");
      const passphrase = input ? input.value : "";
      if (!passphrase) {
        showToast("Enter your vault passphrase.");
        return;
      }
      try {
        const envelope = JSON.parse(localStorage.getItem(ENCRYPTED_STORAGE_KEY) || "{}");
        const payload = await decryptPayload(envelope, passphrase);
        db = normalizeData(payload.data);
        customCopy = payload.customCopy && typeof payload.customCopy === "object" ? payload.customCopy : {};
        autosaveDraftsCache = payload.autosaveDrafts && typeof payload.autosaveDrafts === "object" ? payload.autosaveDrafts : {};
        memoryVaultCache = normalizeAutoMemoryVault(payload.autoMemoryVault || emptyAutoMemoryVault());
        vaultPassphrase = passphrase;
        view.encryptionLocked = false;
        view.locked = Boolean(settings.appLockEnabled && settings.pinHash);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(COPY_KEY);
        localStorage.removeItem(AUTO_MEMORY_KEY);
        initializeAutoMemoryVault();
        showToast("Encrypted storage unlocked.");
        render();
      } catch (error) {
        console.warn("Could not unlock encrypted storage", error);
        showToast("Passphrase did not unlock storage.");
      }
    }

    async function enableLocalEncryption() {
      if (!canUseWebCrypto()) {
        showToast("Encrypted storage is not available in this browser.");
        render();
        return;
      }
      const passphrase = window.prompt("Choose a vault passphrase. There is no recovery if you forget it:");
      if (!passphrase || passphrase.length < 8) {
        showToast("Use at least 8 characters.");
        render();
        return;
      }
      const confirmPassphrase = window.prompt("Confirm the vault passphrase:");
      if (confirmPassphrase !== passphrase) {
        showToast("Passphrases did not match.");
        render();
        return;
      }
      const hint = window.prompt("Optional passphrase hint. Do not enter the passphrase itself:", settings.localEncryptionHint || "") || "";
      if (await enableLocalEncryptionRecord(passphrase, hint)) showToast("Encrypted local storage enabled.");
      render();
    }

    async function enableLocalEncryptionRecord(passphrase, hint = "") {
      if (!canUseWebCrypto()) {
        showToast("Encrypted storage is not available in this browser.");
        return false;
      }
      if (!passphrase || passphrase.length < 8) {
        showToast("Use at least 8 characters.");
        return false;
      }
      autosaveDraftsCache = loadAutosaveDrafts();
      memoryVaultCache = loadAutoMemoryVault();
      vaultPassphrase = passphrase;
      settings.localEncryptionEnabled = true;
      settings.localEncryptionHint = String(hint || "").trim();
      saveSettings();
      await persistEncryptedVault();
      if (!encryptedVaultExists()) {
        settings.localEncryptionEnabled = false;
        settings.localEncryptionHint = "";
        vaultPassphrase = "";
        saveSettings();
        showToast("Encrypted storage could not be enabled.");
        return false;
      }
      return true;
    }

    function disableLocalEncryptionRecord() {
      const autoMemoryVault = normalizeAutoMemoryVault(memoryVaultCache || emptyAutoMemoryVault());
      settings.localEncryptionEnabled = false;
      settings.localEncryptionHint = "";
      settings.localEncryptionUpdatedAt = "";
      vaultPassphrase = "";
      localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
      localStorage.setItem(COPY_KEY, JSON.stringify(customCopy));
      if (autosaveDraftsCache && Object.keys(autosaveDraftsCache).length) {
        localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(autosaveDraftsCache));
        mirrorToIndexedDb(AUTOSAVE_KEY, autosaveDraftsCache);
      }
      autosaveDraftsCache = null;
      localStorage.removeItem(ENCRYPTED_STORAGE_KEY);
      mirrorToIndexedDb(STORAGE_KEY, db);
      mirrorToIndexedDb(COPY_KEY, customCopy);
      if (autoMemoryVault.snapshots.length) saveAutoMemoryVault(autoMemoryVault);
      saveSettings();
      memoryVaultCache = null;
      deleteFromIndexedDb(ENCRYPTED_STORAGE_KEY);
      return true;
    }

        render();

      }

    function maybeSendReminderNotification() {

    function cleanQuickGrabUrlParams(params) {
      params.delete("quickgrab");
      params.delete("text");
      params.delete("note");
      params.delete("quickgrabCategory");
      params.delete("category");
      params.delete("tag");
      params.delete("tags");
      params.delete("quickgrabUrgency");
      params.delete("urgency");
      if (typeof window === "undefined" || !window.history || !window.history.replaceState) return;
      try {
        const cleaned = window.location.pathname + (params.toString() ? "?" + params.toString() : "") + window.location.hash;
        window.history.replaceState({}, "", cleaned);
      } catch (error) {
        console.warn("Could not clean Quick Grab URL", error);
      }
    }

    function normalizeCategoryParam(value) {
      const raw = String(value || "").trim().toLowerCase().replace(/[_-]+/g, " ");
      const aliases = {
        person: "People",
        people: "People",
        student: "People",
        students: "People",
        prayer: "Prayer",
        prayers: "Prayer",
        donor: "Donors",
        donors: "Donors",
        supporter: "Donors",
        supporters: "Donors",
        teaching: "Teaching",
        lesson: "Teaching",
        event: "Events",
        events: "Events",
        admin: "Admin",
        personal: "Personal",
        unsure: "Unsure"
      };
      return aliases[raw] || CATEGORIES.find(category => category.toLowerCase() === raw) || "";
    }

    function normalizeUrgencyParam(value) {
      const raw = String(value || "").trim().toLowerCase();
      return URGENCIES.find(urgency => urgency.toLowerCase() === raw) || "";
    }

    function quickGrabTagsFromParams(params) {
      const raw = params.get("quickgrabCategory") || params.get("category") || params.get("tag") || params.get("tags") || "";
      return String(raw)
        .split(/[,|]/)
        .map(normalizeCategoryParam)
        .filter(Boolean)
        .filter((tag, index, list) => list.indexOf(tag) === index);
    }

    function decodeSharedUrlText(value) {
      const text = String(value || "");
      if (!/%[0-9a-f]{2}/i.test(text)) return text;
      try {
        return decodeURIComponent(text);
      } catch (error) {
        return text;
      }
    }

    function captureQuickGrabFromUrl() {
      if (!settings.enableUrlQuickGrab || typeof window === "undefined" || !window.location || !window.location.search) return false;
      const params = new URLSearchParams(window.location.search);
      const imported = params.get("quickgrab") || params.get("text") || params.get("note") || "";
      const sharedText = decodeSharedUrlText(imported).trim();
      if (!sharedText) return false;
      pendingUrlQuickGrabText = sharedText;
      pendingUrlQuickGrabTags = quickGrabTagsFromParams(params);
      pendingUrlQuickGrabUrgency = normalizeUrgencyParam(params.get("quickgrabUrgency") || params.get("urgency") || "");
      pendingUrlQuickGrabParams = params;
      view.screen = "quick";
      view.quickGrabId = null;
      view.processPreset = [];
      return true;
    }

    function importQuickGrabFromCurrentUrl() {
      if (captureQuickGrabFromUrl()) render();
    }

    function appendQuickGrabDraft(existing, imported) {
      const current = String(existing || "");
      const incoming = String(imported || "").trim();
      if (!incoming) return current;
      if (!current.trim()) return incoming;
      const existingBlocks = current.split(/\n{2,}/).map(block => block.trim()).filter(Boolean);
      if (existingBlocks.includes(incoming)) return current;
      return current.replace(/\s+$/, "") + "\n\n" + incoming;
    }

    function focusQuickGrabTextareaAtEnd(textarea) {
      if (!textarea || typeof textarea.focus !== "function") return;
      textarea.focus();
      const end = textarea.value.length;
      if (typeof textarea.setSelectionRange === "function") textarea.setSelectionRange(end, end);
    }

    function afterVisibleTextareaUpdate(callback) {
      if (typeof window !== "undefined" && typeof window.requestAnimationFrame === "function") {
        window.requestAnimationFrame(() => callback());
        return;
      }
      const defer = typeof window !== "undefined" && window.setTimeout ? window.setTimeout : setTimeout;
      defer(callback, 0);
    }

    function applyPendingUrlQuickGrabText() {
      if (!pendingUrlQuickGrabText || view.screen !== "quick") return;
      const textarea = document.getElementById("quick-text");
      if (!textarea) return;
      const nextText = appendQuickGrabDraft(textarea.value || view.quickGrabDraftText, pendingUrlQuickGrabText);
      pendingUrlQuickGrabText = "";
      view.quickGrabDraftText = nextText;
      textarea.value = nextText;
      if (pendingUrlQuickGrabTags.length) {
        document.querySelectorAll("#quick-tags .chip").forEach(button => {
          button.classList.toggle("active", pendingUrlQuickGrabTags.includes(button.dataset.tag));
        });
      }
      if (pendingUrlQuickGrabUrgency) {
        document.querySelectorAll("#urgency-tags .chip").forEach(button => {
          button.classList.toggle("active", pendingUrlQuickGrabUrgency === button.dataset.urgency);
        });
      }
      pendingUrlQuickGrabTags = [];
      pendingUrlQuickGrabUrgency = "";
      scheduleAutosave();
      focusQuickGrabTextareaAtEnd(textarea);
      if (pendingUrlQuickGrabParams) {
        cleanQuickGrabUrlParams(pendingUrlQuickGrabParams);
        pendingUrlQuickGrabParams = null;
      }
      afterVisibleTextareaUpdate(() => showToast("Shared text added to Quick Grab draft."));
    }

    function startDictation() {
      const textarea = document.getElementById("quick-text");
      const Recognition = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
      if (!textarea || !Recognition) {
        showToast("Dictation is not available in this browser.");
        return;
      }
      const recognition = new Recognition();
      recognition.lang = "en-US";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = event => {
        const spoken = Array.from(event.results).map(result => result[0].transcript).join(" ").trim();
        textarea.value = [textarea.value.trim(), spoken].filter(Boolean).join("\n");
        showToast("Dictation added.");
      };
      recognition.onerror = () => showToast("Dictation stopped.");
      recognition.start();
      showToast("Listening...");
    }

    function normalizedName(name) {
      return String(name || "").toLowerCase().replace(/[^a-z0-9 ]+/g, "").replace(/\s+/g, " ").trim();
    }

    function findDuplicatePeople() {
      const pairs = [];
      for (let i = 0; i < db.people.length; i += 1) {
        for (let j = i + 1; j < db.people.length; j += 1) {
          const a = db.people[i];
          const b = db.people[j];
          const an = normalizedName(a.name);
          const bn = normalizedName(b.name);
          const sameFirst = an.split(" ")[0] && an.split(" ")[0] === bn.split(" ")[0];
          const close = levenshtein(an, bn) <= 3 || an.includes(bn) || bn.includes(an);
          if (sameFirst || close) pairs.push([a, b]);
        }
      }
      return pairs.slice(0, 12);
    }

    function mergePeopleRecord(fromId, toId) {
      if (!fromId || !toId || fromId === toId) return;
      const from = personById(fromId);
      const to = personById(toId);
      if (!from || !to) return;
      recordUndo("person merge");
      ["notes", "meetingNotes", "prayerRequests", "tasks", "quickGrabs"].forEach(collection => {
        db[collection].forEach(record => {
          if (record.relatedPersonId === fromId) record.relatedPersonId = toId;
        });
      });
      Object.keys(to).forEach(key => {
        if ((to[key] === "" || to[key] === null || to[key] === undefined) && from[key]) to[key] = from[key];
      });
      to.updatedAt = nowISO();
      db.people = db.people.filter(person => person.id !== fromId);
      settings.pinnedPersonIds = Array.from(new Set(settings.pinnedPersonIds.map(id => id === fromId ? toId : id))).filter(id => personById(id));
      settings.recentPersonIds = Array.from(new Set(settings.recentPersonIds.map(id => id === fromId ? toId : id))).filter(id => personById(id));
      saveData();
      saveSettings();
      return to;
    }

    function mergePeople(fromId, toId) {
      const from = personById(fromId);
      const to = personById(toId);
      if (!from || !to) return;
      if (!window.confirm(`Merge ${from.name} into ${to.name}? Linked notes, meetings, prayers, tasks, and Quick Grabs will move to ${to.name}.`)) return;
      if (!mergePeopleRecord(fromId, toId)) return;
      view.screen = "person";
      view.personId = toId;
      showToast("People merged.");
      render();
    }

    function applyAutoArchiveAnswered() {
      if (settings.autoArchiveAnsweredDays === "never") return;
      const days = Number(settings.autoArchiveAnsweredDays);
      if (!days) return;
      const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
      let changed = false;
      db.prayerRequests.forEach(prayer => {
        const answeredAt = prayer.answeredAt || prayer.updatedAt;
        if (prayer.status === "Answered" && answeredAt && new Date(answeredAt).getTime() <= cutoff) {
          prayer.status = "Archived";
          prayer.archivedAt = todayISO();
          prayer.archivedFromStatus = "Answered";
          prayer.updatedAt = nowISO();
          changed = true;
        }
      });
      if (changed) saveData();
    }

        ${todaySectionVisible("todayShowBackupNotice") ? renderBackupNotice() : ""}
        ${todaySectionVisible("todayShowCoachNudge") ? renderAppCoachNudge() : ""}
        ${settings.showStartHere ? renderStartHere(promptItems, carePeople, tasks) : ""}
        ${settings.showAutopilotOnToday ? renderAutopilotCard("today") : ""}
        ${todaySectionVisible("todayShowQuickCapture") ? renderQuickCapturePanel("Capture") : ""}
        ${todaySectionVisible("todayShowPeopleShortcuts") ? renderPeopleShortcuts() : ""}
        ${renderTodayWorkSections(promptItems, carePeople, tasks)}
      `;
    }

    function autopilotNextAction() {
      const promptItem = promptQuickGrabs()[0];
      if (promptItem) {
        return {
          kind: "Quick Grab",
          title: "Process one loose thing",
          detail: promptItem.sensitiveFlag ? "Sensitive grabbed item" : promptItem.rawContent,
          reason: "Loose captures are easiest to trust when they keep moving into a person, prayer, task, note, or archive.",
          primaryLabel: "Process This",
          primaryAction: "qg-process",
          id: promptItem.id,
          secondaryLabel: "Open Review",
          secondaryAction: "nav",
          secondaryScreen: "review"
        };
      }

      const task = taskDueSoon()[0];
      if (task) {
        const person = task.relatedPersonId ? personById(task.relatedPersonId) : null;
        return {
          kind: "Follow-Up",
          title: "Finish one follow-up",
          detail: `${task.title}${person ? ` - ${person.name}` : ""}`,
          reason: "Completing one concrete follow-up lowers the pressure without making you scan the whole task list.",
          primaryLabel: "Mark Done",
          primaryAction: "task-done",
          id: task.id,
          secondaryLabel: person ? "Open Person" : "Open Today",
          secondaryAction: person ? "person-open" : "nav",
          secondaryScreen: "today",
          secondaryId: person ? person.id : ""
        };
      }

      const person = peopleToCareFor()[0];
      if (person) {
        return {
          kind: "Person",
          title: "Care for one person",
          detail: `${person.name}${person.followUpReason ? ` - ${person.followUpReason}` : ""}`,
          reason: "One relationship is enough for the next step. Open the profile, then mark followed up when you have acted.",
          primaryLabel: "Open Profile",
          primaryAction: "person-open",
          id: person.id,
          secondaryLabel: "Mark Followed Up",
          secondaryAction: "person-followed-up",
          secondaryId: person.id
        };
      }

      const prayer = db.prayerRequests.find(item => item.status === "Follow-Up Needed") || db.prayerRequests.find(item => item.status === "Active");
      if (prayer) {
        return {
          kind: "Prayer",
          title: "Check one prayer request",
          detail: maskedText(prayer.sensitivityLevel === "Sensitive", "Sensitive prayer request", prayer.request),
          reason: "Prayer follow-up stays humane when the app brings one request forward instead of asking you to browse every request.",
          primaryLabel: "Open Prayer",
          primaryAction: "open-prayer-filter",
          primaryFilter: prayer.status === "Follow-Up Needed" ? "Follow-Up Needed" : "Active",
          secondaryLabel: prayer.status === "Answered" ? "Archive" : "Mark Answered",
          secondaryAction: prayer.status === "Answered" ? "prayer-archive" : "prayer-answered",
          secondaryId: prayer.id
        };
      }

      if (backupReminderDue()) {
        return {
          kind: "Backup",
          title: "Export a fresh backup",
          detail: backupStatusText(),
          reason: "A current backup is the safety net for a local-first app.",
          primaryLabel: "Export Backup",
          primaryAction: "export-json",
          secondaryLabel: "Open Readiness",
          secondaryAction: "nav",
          secondaryScreen: "readiness"
        };
      }

      if (findDuplicatePeople().length) {
        return {
          kind: "Cleanup",
          title: "Review possible duplicate people",
          detail: "A possible duplicate profile is waiting.",
          reason: "Merging duplicate people keeps ministry history attached to one clear profile.",
          primaryLabel: "Review Duplicates",
          primaryAction: "nav",
          primaryScreen: "duplicates",
          secondaryLabel: "Later",
          secondaryAction: "nav",
          secondaryScreen: "today"
        };
      }

      return {
        kind: "Capture",
        title: "Capture what is in your head",
        detail: "Nothing urgent is asking for attention right now.",
        reason: "When the app is quiet, the most useful action is making capture effortless.",
        primaryLabel: "Open Quick Grab",
        primaryAction: "nav",
        primaryScreen: "quick",
        secondaryLabel: "Weekly Reset",
        secondaryAction: "nav",
        secondaryScreen: "weekly"
      };
    }

    function renderAutopilotActionButton(action, label, mode = "primary", meta = {}) {
      if (!action || !label) return "";
      const attrs = [
        `class="button ${mode === "primary" ? "primary" : ""}"`,
        `data-action="${escapeHtml(action)}"`
      ];
      return `<button ${attrs.join(" ")}
        ${label ? `aria-label="${escapeHtml(label)}"` : ""}
        ${meta.id ? `data-id="${escapeHtml(meta.id)}"` : ""}
        ${meta.screen ? `data-screen="${escapeHtml(meta.screen)}"` : ""}
        ${meta.filter ? `data-filter="${escapeHtml(meta.filter)}"` : ""}>${escapeHtml(label)}</button>`;
    }

    function renderAutopilotCard(context = "screen") {
      if (!settings.autopilotMode) return "";
      const next = autopilotNextAction();
      const primaryMeta = { id: next.id, screen: next.primaryScreen, filter: next.primaryFilter };
      const secondaryMeta = { id: next.secondaryId || next.id, screen: next.secondaryScreen, filter: next.secondaryFilter };
      return `
        <section class="section">
          <div class="focus-hero">
            <div class="row wrap">
              <div>
                <span class="pill green">Autopilot</span>
                <h2>${context === "today" ? "Next Best Step" : "Autopilot Next Step"}</h2>
                <p class="page-kicker">${escapeHtml(next.reason)}</p>
              </div>
              <span class="pill gold">${escapeHtml(next.kind)}</span>
            </div>
            <div class="focus-step">
              <div class="focus-step-label">Do this next</div>
              <strong>${escapeHtml(next.title)}</strong>
              <div class="meta">${escapeHtml(next.detail)}</div>
            </div>
            <div class="action-row">
              ${renderAutopilotActionButton(next.primaryAction, next.primaryLabel, "primary", primaryMeta)}
              ${renderAutopilotActionButton(next.secondaryAction, next.secondaryLabel, "secondary", secondaryMeta)}
              <button class="button" data-action="nav" data-screen="quick">Capture Instead</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderAutopilot() {
      return `
        ${renderTopbar("Autopilot", "One suggested action at a time. No dashboard scanning required.")}
        ${renderAutopilotCard()}
        <section class="section">
          <div class="surface">
            <h2 class="section-title">How Autopilot Chooses</h2>
            <p class="page-kicker">It stays local to this device and chooses from loose Quick Grabs, due follow-ups, people needing care, prayer follow-ups, backups, duplicates, then capture.</p>
            <div class="action-row" style="margin-top:14px;">
              <button class="button primary" data-action="nav" data-screen="today">Back To Today</button>
              <button class="button" data-action="nav" data-screen="settings">Tune Settings</button>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="surface">
            <h2 class="section-title">Next-Level Build Guardrails</h2>
            <p class="item-preview">Cloud sync, calendar/contact import, native widgets, and external AI can take this app further, but they need explicit services, permissions, and privacy choices. Until those are wired, the app should label them as roadmap work instead of active features.</p>
          </div>
        </section>
      `;
    }

    function renderTodayWorkSections(promptItems, carePeople, tasks) {
      const quickReview = todaySectionVisible("todayShowQuickReview") ? `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${editableCopy("today.remember.title", settings.adhdMode ? "Next Loose Thing" : "Things You Wanted to Remember")}</h2>
            <button class="button small" data-action="nav" data-screen="review">${settings.adhdMode ? "Review One" : "Review One At A Time"}</button>
          </div>
          ${promptItems.length ? promptItems.map(renderQuickGrabCard).join("") : emptyState("You're clear for now. Grab something when it pops into your head.")}
        </section>
      ` : "";
      const people = todaySectionVisible("todayShowCarePeople") ? `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${editableCopy("today.people.title", settings.adhdMode ? "Next Person" : "People To Care For")}</h2>
            <button class="button small" data-action="nav" data-screen="people">Open People</button>
          </div>
          ${carePeople.length ? carePeople.map(renderPersonCareCard).join("") : emptyState("No one is pressing today. You can still pray, encourage someone, or check your Weekly Reset.")}
        </section>
      ` : "";
      const followUps = todaySectionVisible("todayShowFollowUps") ? `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${editableCopy("today.followUp.title", settings.adhdMode ? "Next Follow-Up" : "Follow Up When You Can")}</h2>
          </div>
          ${tasks.length ? tasks.map(renderTaskCard).join("") : emptyState("No follow-up tasks are asking for attention right now.")}
        </section>
      ` : "";
      if (settings.adhdMode) return quickReview + people + followUps;
      return `
        <div class="grid two">
          ${quickReview}
          ${people}
        </div>
        ${followUps}
      `;
    }

    function renderStartHere(promptItems, carePeople, tasks) {
      const firstGrab = promptItems[0];
      const firstPerson = carePeople[0];
      const firstTask = tasks[0];
      let stepText = "Grab the thing in your head before it floats away.";
      let primaryButton = `<button class="button primary" data-action="nav" data-screen="quick">Open Quick Grab</button>`;
      if (firstGrab) {
        stepText = `Process this loose reminder: ${firstGrab.sensitiveFlag ? "Sensitive grabbed item" : firstGrab.rawContent}`;
        primaryButton = `<button class="button primary" data-action="nav" data-screen="review">Review One Quick Grab</button>`;
      } else if (firstTask) {
        stepText = `Take this follow-up: ${firstTask.title}`;
        primaryButton = firstTask.relatedPersonId
          ? `<button class="button primary" data-action="person-open" data-id="${firstTask.relatedPersonId}">Open Related Profile</button>`
          : `<button class="button primary" data-action="nav" data-screen="minutes">Open Short List</button>`;
      } else if (firstPerson) {
        stepText = `Care for ${firstPerson.name}: ${firstPerson.followUpReason || "check in when you can."}`;
        primaryButton = `<button class="button primary" data-action="person-open" data-id="${firstPerson.id}">Open That Profile</button>`;
      }
      return `
        <section class="section">
          <div class="focus-hero">
            <div>
              <h2>${editableCopy("startHere.title", settings.adhdMode ? "Now" : "Start Here")}</h2>
