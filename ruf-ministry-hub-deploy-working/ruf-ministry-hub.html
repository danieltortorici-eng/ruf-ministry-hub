        : findings.dueFollowUpTasks[0]
          ? `Complete or reschedule the due follow-up: ${findings.dueFollowUpTasks[0].title || "untitled task"}.`
          : findings.prayerRequestsNeedingFollowUp[0]
            ? `Check on one prayer request for ${dataJanitorRecordOwner(findings.prayerRequestsNeedingFollowUp[0])}.`
            : findings.backupReminderDue
              ? "Export a fresh backup before making cleanup decisions."
              : "Choose one person to pray for and send one small encouragement.";
      const tenMinutePlan = [
        "Pray briefly and choose one faithful next step.",
        findings.staleQuickGrabs[0] ? "Process one stale Quick Grab." : "Scan the open Quick Grabs for one useful next step.",
        findings.dueFollowUpTasks[0] ? "Handle one due follow-up task." : "Check whether any follow-up needs a date.",
        findings.prayerRequestsNeedingFollowUp[0] ? "Review one prayer request needing follow-up." : "Pray through one active request.",
        findings.backupReminderDue ? "Export a backup if you have two extra minutes." : "Leave the app in a calmer state than you found it."
      ];
      const thirtyMinutePlan = [
        "Process the oldest three loose Quick Grabs.",
        "Handle due or overdue follow-up tasks first.",
        "Review prayer requests that need follow-up, then answered requests that may be ready to archive.",
        "Choose the top people care priorities for the week.",
        findings.duplicatePeople.length ? "Review possible duplicate people before adding new profile details." : "Check that this week's ministry records have enough context.",
        findings.backupReminderDue ? "Export a fresh backup after the reset." : "Confirm backup health before closing."
      ];
      return {
        oneFaithfulNextStep,
        tenMinutePlan,
        thirtyMinutePlan,
        peoplePriorities: findings.peopleNeedingCare.slice(0, 6).map(person => `${person.name || "Unnamed person"} - ${person.nextFollowUpDate ? `follow up by ${dateLabel(person.nextFollowUpDate)}` : "care rhythm needs review"}.`),
        prayerPriorities: [
          ...findings.prayerRequestsNeedingFollowUp.slice(0, 5).map(prayer => `${weeklyResetRecordOwner(prayer)} - follow-up needed${prayer.followUpDate ? ` by ${dateLabel(prayer.followUpDate)}` : ""}.`),
          ...findings.answeredPrayerRequests.slice(0, 3).map(prayer => `${weeklyResetRecordOwner(prayer)} - answered prayer may be ready to archive after review.`)
        ],
        followUpPriorities: [
          ...findings.dueFollowUpTasks.slice(0, 6).map(task => `${weeklyResetRecordOwner(task)} - ${task.title || "Untitled follow-up"} due ${dateLabel(task.dueDate)}.`),
          ...findings.peopleNeedingCare.slice(0, 4).map(person => `${person.name || "Unnamed person"} - ${person.followUpReason || "choose a simple check-in reason"}.`)
        ],
        quickGrabCleanup: findings.staleQuickGrabs.slice(0, 8).map(grab => `${dateLabel(grab.createdAt)} - ${grab.status} - ${grab.rawContent || "Untitled Quick Grab"}`),
        adminCleanup: [
          ...findings.duplicatePeople.slice(0, 5).map(([a, b]) => `Possible duplicate people: ${a.name} / ${b.name}.`),
          ...findings.pendingAiProposals.slice(0, 5).map(proposal => `Pending AI Review item: ${proposal.title || "Untitled proposal"}.`),
          findings.backupReminderDue ? "Backup appears due before larger cleanup." : "Backup reminder is current or off."
        ],
        backupReminder: findings.backupReminderDue ? `Backup appears due. ${backupStatusText()}` : `Backup reminder is current or off. ${backupStatusText()}`,
        sensitivityWarnings: contextReview.warnings.filter(warning => /Sensitive|Highly Sensitive|Do Not Send|sensitive/i.test(warning)),
        contextSummary: weeklyResetContextSummary(contextReview.recordsByCollection, findings)
      };
    }

    function buildWeeklyResetProposedActions(findings) {
      const actions = [];
      findings.staleQuickGrabs.slice(0, 6).forEach(grab => {
        actions.push({ actionType: "noAction", label: `Review stale Quick Grab: ${(grab.rawContent || "").slice(0, 80)}`, quickGrabId: grab.id });
      });
      findings.dueFollowUpTasks.slice(0, 5).forEach(task => {
        actions.push({ actionType: "noAction", label: `Complete or reschedule due follow-up: ${task.title || "Untitled task"}`, taskId: task.id });
      });
      findings.peopleNeedingCare.slice(0, 6).forEach(person => {
        actions.push({
          actionType: "createFollowUpTask",
          relatedPersonId: person.id,
          title: `Weekly Reset follow-up for ${person.name || "this person"}`,
          dueDate: daysFromNow(3),
          label: `Create a follow-up task for ${person.name || "this person"}`
        });
        actions.push({
          actionType: "updatePerson",
          reviewOnly: true,
          personId: person.id,
          label: `Review care rhythm fields for ${person.name || "this person"}`
        });
      });
      findings.prayerRequestsNeedingFollowUp.slice(0, 5).forEach(prayer => {
        actions.push({
          actionType: "createFollowUpTask",
          relatedPrayerRequestId: prayer.id,
          relatedPersonId: prayer.relatedPersonId || "",
          title: `Follow up on prayer request for ${weeklyResetRecordOwner(prayer)}`,
          dueDate: daysFromNow(3),
          label: `Create prayer follow-up task for ${weeklyResetRecordOwner(prayer)}`
        });
        actions.push({
          actionType: "updatePrayerRequest",
          reviewOnly: true,
          prayerRequestId: prayer.id,
          followUpDate: daysFromNow(7),
          label: `Review follow-up date for ${weeklyResetRecordOwner(prayer)}`
        });
      });
      findings.answeredPrayerRequests.slice(0, 5).forEach(prayer => {
        actions.push({ actionType: "archiveItem", reviewOnly: true, prayerRequestId: prayer.id, label: `Review answered prayer for archive: ${weeklyResetRecordOwner(prayer)}` });
      });
      findings.sensitiveLookingPrayerRequests.slice(0, 5).forEach(prayer => {
        actions.push({ actionType: "markSensitive", reviewOnly: true, prayerRequestId: prayer.id, label: `Review sensitive-looking prayer request for ${weeklyResetRecordOwner(prayer)}` });
      });
      findings.duplicatePeople.slice(0, 4).forEach(([a, b]) => {
        actions.push({
          actionType: "mergePeopleSuggestion",
          reviewOnly: true,
          fromPersonId: a.id,
          toPersonId: b.id,
          label: `Review possible duplicate people: ${a.name} / ${b.name}`
        });
      });
      if (findings.backupReminderDue) actions.push({ actionType: "noAction", label: "Export a fresh backup before larger cleanup." });
      if (!actions.length) actions.push({ actionType: "noAction", label: "No Weekly Reset action needs attention right now." });
      return actions.slice(0, 40);
    }

    function weeklyResetIssueCount(plan) {
      return [
        plan.peoplePriorities,
        plan.prayerPriorities,
        plan.followUpPriorities,
        plan.quickGrabCleanup,
        plan.adminCleanup,
        plan.sensitivityWarnings
      ].reduce((total, items) => total + (Array.isArray(items) ? items.length : 0), 0);
    }

    const DONOR_UPDATE_COLLECTIONS = ["quickGrabs", "notes", "meetingNotes", "prayerRequests", "people"];
    const DONOR_UPDATE_SOURCE_CATEGORIES = [
      "ministryHighlights",
      "answeredPrayers",
      "prayerRequests",
      "donorRelatedNotes",
      "teachingIdeas",
      "events",
      "peopleStories"
    ];

    function defaultDonorUpdateOptions() {
      return {
        dateRange: "last30",
        customStart: "",
        customEnd: "",
        tone: "warm",
        categories: DONOR_UPDATE_SOURCE_CATEGORIES.slice()
      };
    }

    function normalizeDonorUpdateOptions(options = {}) {
      const defaults = defaultDonorUpdateOptions();
      const range = ["last7", "last30", "semester", "custom"].includes(options.dateRange) ? options.dateRange : defaults.dateRange;
      const tone = ["warm", "brief", "prayerful", "storyDriven"].includes(options.tone) ? options.tone : defaults.tone;
      const categories = Array.isArray(options.categories)
        ? options.categories.filter(category => DONOR_UPDATE_SOURCE_CATEGORIES.includes(category))
        : defaults.categories;
      return {
        dateRange: range,
        customStart: String(options.customStart || "").slice(0, 10),
        customEnd: String(options.customEnd || "").slice(0, 10),
        tone,
        categories: categories.length ? Array.from(new Set(categories)) : defaults.categories
      };
    }

    function donorUpdateCategoryLabel(category) {
      return {
        ministryHighlights: "Ministry highlights",
        answeredPrayers: "Answered prayers",
        prayerRequests: "Prayer requests",
        donorRelatedNotes: "Donor-related notes",
        teachingIdeas: "Teaching ideas",
        events: "Events",
        peopleStories: "People stories, anonymized only"
      }[category] || labelFromCamel(category);
    }

    function donorUpdateToneLabel(tone) {
      return {
        warm: "Warm",
        brief: "Brief",
        prayerful: "Prayerful",
        storyDriven: "Story-driven"
      }[tone] || "Warm";
    }

    function donorUpdateDateWindow(options = {}) {
      const normalized = normalizeDonorUpdateOptions(options);
      const today = todayISO();
      if (normalized.dateRange === "last7") return { start: daysAgo(7), end: today, label: "Last 7 days" };
      if (normalized.dateRange === "custom") {
        return {
          start: isISODateString(normalized.customStart) ? normalized.customStart : daysAgo(30),
          end: isISODateString(normalized.customEnd) ? normalized.customEnd : today,
          label: "Custom range"
        };
      }
      if (normalized.dateRange === "semester") {
        const now = new Date();
        const year = now.getFullYear();
        const month = now.getMonth() + 1;
        const startMonth = month >= 8 ? "08" : "01";
        return { start: `${year}-${startMonth}-01`, end: today, label: "This semester" };
      }
      return { start: daysAgo(30), end: today, label: "Last 30 days" };
    }

    function donorUpdateRecordDate(record, collection) {
      if (collection === "notes") return record.noteDate || record.createdAt || "";
      if (collection === "meetingNotes") return record.meetingDate || record.createdAt || "";
      if (collection === "prayerRequests") return record.dateAdded || record.createdAt || "";
      if (collection === "tasks") return record.dueDate || record.createdAt || "";
      return record.createdAt || record.updatedAt || "";
    }

    function donorUpdateInDateWindow(record, collection, window) {
      const value = String(donorUpdateRecordDate(record, collection) || "").slice(0, 10);
      if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return true;
      return value >= window.start && value <= window.end;
    }

    function donorUpdatePersonIsStudent(person = {}) {
      return /student|freshman|first-year|sophomore|junior|senior|leader/i.test(`${person.personType || ""} ${person.classYear || ""} ${person.rufInvolvement || ""}`);
    }

    function donorUpdatePersonDescriptor(person = {}) {
      if (/freshman|first-year/i.test(person.classYear || "")) return "a freshman";
      if (/leader|leadership/i.test(`${person.rufInvolvement || ""} ${person.careLevel || ""}`)) return "a student leader";
      if (donorUpdatePersonIsStudent(person)) return "one student";
      return "a ministry contact";
    }

    function donorUpdateEscapeRegExp(value) {
      return String(value || "").replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function donorUpdateRedactStudentNames(value) {
      let output = String(value || "");
      db.people
        .slice()
        .sort((a, b) => String(b.name || "").length - String(a.name || "").length)
        .forEach(person => {
          const name = String(person.name || "").trim();
          if (!name) return;
          const descriptor = donorUpdatePersonDescriptor(person);
          output = output.replace(new RegExp(`\\b${donorUpdateEscapeRegExp(name)}\\b`, "gi"), descriptor);
          const first = name.split(/\s+/)[0];
          if (donorUpdatePersonIsStudent(person) && first && first.length > 2) {
            output = output.replace(new RegExp(`\\b${donorUpdateEscapeRegExp(first)}\\b`, "gi"), descriptor);
          }
        });
      return output;
    }

    function donorUpdateSanitizeText(value) {
      return donorUpdateRedactStudentNames(value)
        .replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi, "[email removed]")
        .replace(/\b(?:\+?1[-.\s]?)?(?:\(?\d{3}\)?[-.\s]?)\d{3}[-.\s]?\d{4}\b/g, "[phone removed]")
        .replace(/[ \t]+/g, " ")
        .replace(/\n{3,}/g, "\n\n")
        .trim();
    }

    function donorUpdateRecordText(record, collection) {
      if (collection === "quickGrabs") return record.rawContent || "";
      if (collection === "notes") return record.content || "";
      if (collection === "meetingNotes") return `${record.whatWeTalkedAbout || ""} ${record.whatToRemember || ""} ${record.nextFaithfulStep || ""} ${record.prayerRequestText || ""}`;
      if (collection === "prayerRequests") return `${record.request || ""} ${record.answeredNote || ""}`;
      if (collection === "people") return `${record.name || ""} ${record.rufInvolvement || ""} ${record.followUpReason || ""} ${record.donorStatus || ""}`;
      return aiRecordPreview(record, collection);
    }

    function donorUpdateRecordLabel(record, collection) {
      const text = donorUpdateSanitizeText(donorUpdateRecordText(record, collection));
      return text || dataJanitorCollectionLabel(collection);
    }

    function donorUpdateRecordAllowedInContext(record, collection) {
      const tier = dataJanitorPrivacyTierForRecord(record, collection);
      if (tier === "Do Not Send to AI" || tier === "Highly Sensitive" || tier === "Sensitive" || tier === "Private") return false;
      if (collection === "prayerRequests" && record.shareableStatus === "Private") return false;
      return true;
    }

    function donorUpdateRecordBlockReason(record, collection) {
      const tier = dataJanitorPrivacyTierForRecord(record, collection);
      if (tier === "Do Not Send to AI") return "Do Not Send to AI.";
      if (tier === "Highly Sensitive") return "Highly Sensitive records are always excluded from donor updates.";
      if (tier === "Sensitive") return "Sensitive records are excluded by default from donor updates.";
      if (tier === "Private") return "Private records are excluded from donor-facing drafts.";
      if (collection === "prayerRequests" && record.shareableStatus === "Private") return "Private prayer request.";
      return "Not donor-facing source material.";
    }

    function donorUpdateRecordsByCollection(options = {}) {
      const window = donorUpdateDateWindow(options);
      return DONOR_UPDATE_COLLECTIONS.reduce((memo, collection) => {
        const records = Array.isArray(db[collection]) ? db[collection] : [];
        const inRange = records.filter(record => donorUpdateInDateWindow(record, collection, window));
        memo[collection] = {
          all: inRange,
          allowed: inRange.filter(record => donorUpdateRecordAllowedInContext(record, collection)),
          blocked: inRange.filter(record => !donorUpdateRecordAllowedInContext(record, collection))
        };
        return memo;
      }, {});
    }

    function donorUpdateCategoryEnabled(options, category) {
      const normalized = normalizeDonorUpdateOptions(options);
      return normalized.categories.includes(category);
    }

    function donorUpdateTextLooksLike(text, pattern) {
      return pattern.test(String(text || ""));
    }

    function donorUpdatePotentiallyIdentifiable(record, collection) {
      const person = personById(record.relatedPersonId);
      const text = donorUpdateRecordText(record, collection);
      return Boolean(
        person && (
          String(person.hometown || "").trim()
          || String(person.major || "").trim()
          || String(person.fraternitySorority || "").trim()
          || donorUpdateTextLooksLike(text, /\b(exactly|only|captain|president|internship|scholarship|hospital|family crisis)\b/i)
        )
      );
    }

    function donorUpdateSourceItem(record, collection, label = "") {
      return {
        id: record.id,
        collection,
        label: label || dataJanitorCollectionLabel(collection),
        text: donorUpdateSanitizeText(donorUpdateRecordText(record, collection)).slice(0, 240),
        date: donorUpdateRecordDate(record, collection),
        requiresPermission: donorUpdatePotentiallyIdentifiable(record, collection)
      };
    }

    function donorUpdateFindings(recordsByCollection, options = {}) {
      const findings = {
        ministryHighlights: [],
        answeredPrayers: [],
        prayerRequests: [],
        donorRelatedNotes: [],
        teachingIdeas: [],
        events: [],
        anonymizedStories: [],
        excludedItems: [],
        privacyWarnings: [],
        markSensitiveCandidates: []
      };
      const sources = [
        ...recordsByCollection.quickGrabs.allowed.map(record => ({ record, collection: "quickGrabs" })),
        ...recordsByCollection.notes.allowed.map(record => ({ record, collection: "notes" })),
        ...recordsByCollection.meetingNotes.allowed.map(record => ({ record, collection: "meetingNotes" }))
      ];
      sources.forEach(({ record, collection }) => {
        const text = donorUpdateRecordText(record, collection);
        const item = donorUpdateSourceItem(record, collection);
        if (dataJanitorLooksSensitiveText(text)) findings.markSensitiveCandidates.push({ record, collection });
        if (donorUpdateCategoryEnabled(options, "ministryHighlights") && donorUpdateTextLooksLike(text, /\b(large group|bible study|ministry|campus|discipleship|leadership|encouraged|ruf|retreat|conference|small group)\b/i)) {
          findings.ministryHighlights.push(item);
        }
        if (donorUpdateCategoryEnabled(options, "donorRelatedNotes") && donorUpdateTextLooksLike(text, /\b(donor|supporter|support|gift|thank-you|thank you|alumni)\b/i)) {
          findings.donorRelatedNotes.push(item);
        }
        if (donorUpdateCategoryEnabled(options, "teachingIdeas") && donorUpdateTextLooksLike(text, /\b(teaching|sermon|lesson|illustration|john|romans|scripture|bible)\b/i)) {
          findings.teachingIdeas.push(item);
        }
        if (donorUpdateCategoryEnabled(options, "events") && donorUpdateTextLooksLike(text, /\b(event|large group|retreat|conference|training|dinner|cookout|prayer walk)\b/i)) {
          findings.events.push(item);
        }
        const person = personById(record.relatedPersonId);
        if (donorUpdateCategoryEnabled(options, "peopleStories") && person && donorUpdatePersonIsStudent(person) && item.text) {
          findings.anonymizedStories.push({
            ...item,
            label: item.requiresPermission ? "Anonymized student story - requires permission review" : "Anonymized student story"
          });
        }
      });
      if (donorUpdateCategoryEnabled(options, "answeredPrayers")) {
        recordsByCollection.prayerRequests.allowed
          .filter(prayer => prayer.status === "Answered")
          .forEach(prayer => {
            if (prayer.shareableStatus === "Okay to Share") findings.answeredPrayers.push(donorUpdateSourceItem(prayer, "prayerRequests", "Answered prayer"));
            else findings.excludedItems.push(`Answered prayer kept anonymous because shareable status is ${prayer.shareableStatus || "not set"}.`);
          });
      }
      if (donorUpdateCategoryEnabled(options, "prayerRequests")) {
        recordsByCollection.prayerRequests.allowed
          .filter(prayer => ["Active", "Follow-Up Needed"].includes(prayer.status))
          .forEach(prayer => {
            if (prayer.shareableStatus === "Okay to Share") findings.prayerRequests.push(donorUpdateSourceItem(prayer, "prayerRequests", "Shareable prayer request"));
            else findings.excludedItems.push(`Prayer request kept anonymous because shareable status is ${prayer.shareableStatus || "not set"}.`);
          });
      }
      DONOR_UPDATE_COLLECTIONS.forEach(collection => {
        recordsByCollection[collection].blocked.slice(0, 8).forEach(record => {
          findings.excludedItems.push(`${dataJanitorCollectionLabel(collection)} excluded: ${donorUpdateRecordBlockReason(record, collection)}`);
        });
      });
      if (findings.markSensitiveCandidates.length) {
        findings.privacyWarnings.push("Some donor-safe source text looked pastoral or private. It was summarized carefully and should be reviewed.");
      }
      if (findings.excludedItems.some(item => /Sensitive|Highly Sensitive|Do Not Send|Private/i.test(item))) {
        findings.privacyWarnings.push("Private, Sensitive, Highly Sensitive, and Do Not Send to AI records were excluded before drafting.");
      }
      if (findings.anonymizedStories.some(item => item.requiresPermission)) {
        findings.privacyWarnings.push("At least one anonymized story may still be identifiable and requires permission review.");
      }
      findings.privacyWarnings.push("Student names are anonymized by default in donor-facing drafts.");
      findings.privacyWarnings.push("Prayer requests marked Private or Ask Permission are not treated as public/shareable stories.");
      return findings;
    }

    function donorUpdateContextSummary(options, recordsByCollection, findings) {
      const window = donorUpdateDateWindow(options);
      return [
        `Range: ${window.label} (${window.start} to ${window.end})`,
        `Tone: ${donorUpdateToneLabel(options.tone)}`,
        `Categories: ${options.categories.map(donorUpdateCategoryLabel).join(", ")}`,
        `Highlights: ${findings.ministryHighlights.length}`,
        `Answered prayers: ${findings.answeredPrayers.length}`,
        `Prayer requests: ${findings.prayerRequests.length}`,
        `Anonymized stories: ${findings.anonymizedStories.length}`,
        `Excluded items: ${findings.excludedItems.length}`
      ].join(" | ");
    }

    function buildDonorUpdateContextReview(options = {}) {
      const normalized = normalizeDonorUpdateOptions(options);
      const recordsByCollection = donorUpdateRecordsByCollection(normalized);
      const findings = donorUpdateFindings(recordsByCollection, normalized);
      const window = donorUpdateDateWindow(normalized);
      const context = {
        used: [
          { label: "Date range", tier: "Normal", summary: `${window.label}: ${window.start} to ${window.end}.` },
          { label: "Tone", tier: "Normal", summary: donorUpdateToneLabel(normalized.tone) },
          { label: "Selected source categories", tier: "Normal", summary: normalized.categories.map(donorUpdateCategoryLabel).join(", ") },
          { label: "Donor-safe local source pool", tier: "Normal", summary: `${findings.ministryHighlights.length} highlights, ${findings.answeredPrayers.length} answered prayers, ${findings.prayerRequests.length} shareable prayer requests, ${findings.anonymizedStories.length} anonymized stories.` }
        ],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Email, Gmail, Mailchimp, SMS, calendar, contacts, or sharing integration", tier: "Do Not Send to AI", summary: "Not used. Drafts are copy-only and are never sent automatically." }
        ],
        warnings: [
          "Donor update drafts are not sent. Review carefully before copying or sharing.",
          "Student names are anonymized by default before donor-facing draft text is shown."
        ],
        blocked: false,
        options: normalized,
        recordsByCollection,
        findings
      };
      DONOR_UPDATE_COLLECTIONS.forEach(collection => {
        const group = recordsByCollection[collection];
        group.blocked.slice(0, 5).forEach(record => {
          const tier = dataJanitorPrivacyTierForRecord(record, collection);
          context.notUsed.push({
            label: `${dataJanitorCollectionLabel(collection)} excluded`,
            tier,
            summary: `${donorUpdateSanitizeText(aiRecordPreview(record, collection)) || "Record"} (${donorUpdateRecordBlockReason(record, collection)})`
          });
        });
        if (group.blocked.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Do Not Send to AI")) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} marked Do Not Send to AI were excluded from Donor Update Builder context.`);
        }
        if (group.blocked.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Highly Sensitive")) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} includes Highly Sensitive records that are always excluded from donor updates.`);
        }
        if (group.blocked.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Sensitive")) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} includes Sensitive records that are excluded by default from donor updates.`);
        }
      });
      findings.privacyWarnings.forEach(warning => context.warnings.push(warning));
      return context;
    }

    function donorUpdateToneIntro(tone) {
      if (tone === "brief") return "Here is a short ministry update from the last stretch of campus life.";
      if (tone === "prayerful") return "I am grateful for the ways the Lord has been at work, and I wanted to share a few prayerful updates.";
      if (tone === "storyDriven") return "A few local ministry moments have helped me see the Lord's kindness on campus.";
      return "I wanted to send a warm update from recent ministry life on campus.";
    }

    function donorUpdateBulletLines(items, fallback = "") {
      const lines = items
        .map(item => item.text || item)
        .filter(Boolean)
        .slice(0, 5)
        .map(text => `- ${donorUpdateSanitizeText(text)}`);
      return lines.length ? lines.join("\n") : fallback;
    }

    function donorUpdateBuildDraft(findings, options = {}, contextReview) {
      const materialCount = findings.ministryHighlights.length
        + findings.answeredPrayers.length
        + findings.prayerRequests.length
        + findings.anonymizedStories.length
        + findings.teachingIdeas.length
        + findings.events.length;
      const highlights = [
        ...findings.ministryHighlights,
        ...findings.events,
        ...findings.teachingIdeas
      ].slice(0, 6);
      const storyLines = findings.anonymizedStories.slice(0, 4).map(item => `${item.label}: ${item.text}${item.requiresPermission ? " (permission review needed)" : ""}`);
      const answeredLines = findings.answeredPrayers.slice(0, 4).map(item => item.text);
      const prayerLines = findings.prayerRequests.slice(0, 4).map(item => item.text);
      const ministryHighlights = highlights.map(item => donorUpdateSanitizeText(item.text));
      const anonymizedStories = storyLines.map(donorUpdateSanitizeText);
      const privacyWarnings = Array.from(new Set(findings.privacyWarnings));
      const excludedItemsSummary = findings.excludedItems.length
        ? findings.excludedItems.slice(0, 10)
        : ["No excluded donor update source items in the selected range."];
      const prayerRequestsSection = prayerLines.length
        ? `Prayer requests to share carefully:\n${donorUpdateBulletLines(prayerLines)}`
        : "No donor-shareable prayer requests were found in the selected range. Private and Ask Permission prayer requests were not used as public stories.";
      const lightDraft = "I do not have enough local, donor-safe source material for a full donor update yet. A lighter update would be more honest right now: thank supporters, share that ministry is continuing, and ask for prayer for faithful presence on campus.";
      const emailDraft = materialCount
        ? donorUpdateSanitizeText(`${donorUpdateToneIntro(options.tone)}

Ministry highlights:
${donorUpdateBulletLines(ministryHighlights, "- Recent donor-safe ministry details were limited in the selected range.")}

Anonymized student stories:
${donorUpdateBulletLines(anonymizedStories, "- No anonymized student story is ready to share without more review.")}

Prayer:
${prayerRequestsSection}

Thank you for praying and supporting this ministry. I will keep reviewing details carefully before sharing anything that could identify a student or expose pastoral information.`)
        : lightDraft;
      const shortSupporterUpdate = materialCount
        ? donorUpdateSanitizeText(`${donorUpdateToneIntro(options.tone)} ${ministryHighlights[0] || "Recent records point to steady ministry care."} ${anonymizedStories[0] || "Student details are kept anonymous by default."} Thank you for praying with us.`)
        : lightDraft;
      return {
        emailDraft,
        shortSupporterUpdate,
        prayerRequestsSection: donorUpdateSanitizeText(prayerRequestsSection),
        anonymizedStories,
        ministryHighlights,
        excludedItemsSummary,
        privacyWarnings,
        requiresManualReview: true,
        confidence: materialCount >= 4 ? "high" : materialCount ? "medium" : "low",
        selectedRange: donorUpdateDateWindow(options).label,
        selectedTone: donorUpdateToneLabel(options.tone),
        selectedCategories: options.categories.map(donorUpdateCategoryLabel),
        contextSummary: donorUpdateContextSummary(options, contextReview.recordsByCollection, findings)
      };
    }

    function buildDonorUpdateProposedActions(findings, donorUpdate) {
      const actions = [
        {
          actionType: "draftDonorUpdate",
          reviewOnly: true,
          label: "Review and copy donor update draft only",
          draft: donorUpdate.emailDraft
        }
      ];
      findings.markSensitiveCandidates.slice(0, 5).forEach(item => {
        actions.push({
          actionType: "markSensitive",
          reviewOnly: true,
          collection: item.collection,
          recordId: item.record.id,
          label: `Review sensitive-looking ${dataJanitorCollectionLabel(item.collection).toLowerCase()} before any donor sharing`
        });
      });
      actions.push({ actionType: "noAction", label: "Do not send anything automatically." });
      return actions;
    }

    function buildAiContextReview(proposal) {
      const context = {
        used: [],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Unrelated ministry records", tier: "Private", summary: "Not used. The default context scope is minimal." }
        ],
        warnings: []
      };
      if (!proposal) return context;
      const proposalTier = proposal.aiPrivacyTier === "Do Not Send to AI"
        ? "Do Not Send to AI"
        : proposal.sensitivityRisk === "high"
          ? "Sensitive"
          : proposal.sensitivityRisk === "medium"
            ? "Private"
            : "Normal";
      const proposalRecord = { ...proposal, aiPrivacyTier: proposalTier };
      addAiContextCandidate(context, "AI proposal title and summary", proposalRecord, "aiProposals");
      const sourceRecord = aiProposalSourceRecord(proposal);
      const sourceCollection = aiSourceCollectionForProposal(proposal);
      if (sourceCollection) addAiContextCandidate(context, "Related source record", sourceRecord, sourceCollection);
      if (proposal.sensitivityRisk === "high") context.warnings.push("This proposal is flagged high sensitivity.");
      if (proposal.sensitivityRisk === "medium") context.warnings.push("This proposal is flagged medium sensitivity.");
      return context;
    }

    function buildAiSourceContextReview(sourceType, sourceId, intentLabel = "Mock AI processing") {
      if (sourceType === "person") return buildPersonBriefingContextReview(sourceId);
      const sourceRecord = aiSourceRecord(sourceType, sourceId);
      const sourceCollection = aiSourceCollectionForType(sourceType);
      const context = {
        used: [],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Unrelated ministry records", tier: "Private", summary: "Not used. The default context scope is minimal." }
        ],
        warnings: [],
        blocked: false
      };
      addAiContextCandidate(context, intentLabel, sourceRecord, sourceCollection);
      if (sourceRecord && !aiRecordAllowedInContext(sourceRecord, sourceCollection)) context.blocked = true;
      if (sourceRecord && sourceType === "quickGrab") {
        quickGrabMockSensitivityWarnings(sourceRecord).forEach(warning => context.warnings.push(warning));
      }
      return context;
    }

    function buildQuickGrabAiContextReview(grabId) {
      const grab = db.quickGrabs.find(item => item.id === grabId);
      const candidatePeople = grab ? quickGrabCandidatePeopleForBackend(grab) : [];
      const context = {
        used: [],
        notUsed: [
          { label: "Full database", tier: "Do Not Send to AI", summary: "Not used. Quick Grab AI receives only the selected capture." },
          { label: "Unrelated people profiles", tier: "Private", summary: "Not used. Candidate people are limited to names and ids only." },
          { label: "Unrelated notes, prayers, tasks, meetings, and donor lists", tier: "Private", summary: "Not used. Quick Grab parsing does not send other ministry records." },
          { label: "Backups, Device Vault, passphrases, localStorage dumps, API keys, and secret request headers", tier: "Do Not Send to AI", summary: "Never included in Quick Grab AI context." },
          { label: "Direct browser call to OpenAI", tier: "Do Not Send to AI", summary: "Not used. The browser does not call OpenAI directly or store API keys." }
        ],
        warnings: [],
        blocked: false
      };
      context.used.push({ label: "Current AI mode", tier: "Normal", summary: quickGrabBackendModeEnabled() ? "Backend Quick Grab is selected. The browser calls only /api/ai/quick-grab after approval." : "Local Mock Only is selected. No data leaves this browser." });
      addAiContextCandidate(
        context,
        "One Quick Grab text",
        grab,
        "quickGrabs",
        grab ? String(grab.rawContent || "Quick Grab").slice(0, 280) : ""
      );
      if (!grab || !aiRecordAllowedInContext(grab, "quickGrabs")) {
        context.blocked = true;
        return context;
      }
      context.used.push({ label: "Today's date", tier: "Normal", summary: todayISO() });
      context.used.push({ label: "Selected tags and urgency", tier: "Normal", summary: `Tags: ${grab.category && grab.category !== "Unsure" ? grab.category : "none"} | Urgency: ${grab.urgency || "Whenever"}` });
      context.used.push({ label: "Privacy flags", tier: aiPrivacyTierForRecord(grab, "quickGrabs"), summary: `AI privacy tier: ${aiPrivacyTierForRecord(grab, "quickGrabs")}; sensitive flag: ${grab.sensitiveFlag ? "yes" : "no"}` });
      context.used.push({
        label: "Candidate people names/ids only",
        tier: "Private",
        summary: candidatePeople.length
          ? candidatePeople.map(person => `${person.name} (${person.id})`).join(", ")
          : "No candidate people found. No full profiles are included."
      });
      quickGrabMockSensitivityWarnings(grab).forEach(warning => context.warnings.push(warning));
      if (quickGrabBackendModeEnabled()) {
        context.warnings.push("Backend mode can send this one reviewed Quick Grab payload to the app server route after approval.");
      }
      return context;
    }

    function buildAiGateContext(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse") return buildQuickGrabAiContextReview(sheet.sourceId);
      if (sheet.nextAction === "donorUpdate") return buildDonorUpdateContextReview(sheet.donorOptions || {});
      if (sheet.nextAction === "weeklyReset") return buildWeeklyResetContextReview();
      if (sheet.nextAction === "dataJanitor") return buildDataJanitorContextReview();
      if (sheet.nextAction === "prayerSteward") return buildPrayerStewardContextReview();
      if (sheet.nextAction === "personBriefing") return buildPersonBriefingContextReview(sheet.sourceId);
      if (sheet.nextAction === "followUpDraft") return buildFollowUpDraftContextReview(sheet.sourceType, sheet.sourceId);
      if (sheet.proposalId) return buildAiContextReview(aiProposalById(sheet.proposalId));
      if (sheet.sourceType && sheet.sourceId) return buildAiSourceContextReview(sheet.sourceType, sheet.sourceId, sheet.intentLabel || "Mock AI processing");
      return buildAiContextReview(null);
    }

    function renderAiContextList(items, emptyText) {
      if (!items.length) return `<div class="meta">${escapeHtml(emptyText)}</div>`;
      return `
        <div class="settings-list">
          ${items.map(item => `
            <div class="notice">
              <div class="row wrap">
                <strong>${escapeHtml(item.label)}</strong>
                <span class="pill ${aiPrivacyTierTone(item.tier)}">${escapeHtml(item.tier)}</span>
              </div>
              ${settings.aiShowContextPreview ? `<div class="meta">${escapeHtml(item.summary || "No preview available.")}</div>` : `<div class="meta">Preview hidden by AI privacy setting.</div>`}
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderAiReview() {
      const proposals = filteredAiProposals();
      const counts = {
        Pending: (db.aiProposals || []).filter(item => item.status === "pending" || item.status === "edited").length,
        Approved: (db.aiProposals || []).filter(item => item.status === "approved" || item.status === "partiallyApproved").length,
        Rejected: (db.aiProposals || []).filter(item => item.status === "rejected").length,
        Archived: (db.aiProposals || []).filter(item => item.status === "archived").length,
        "High Sensitivity": (db.aiProposals || []).filter(item => item.sensitivityRisk === "high").length,
        "Low Confidence": (db.aiProposals || []).filter(item => item.confidence === "low").length
      };
      return `
        ${renderTopbar("AI Review", "Draft suggestions for careful human review before anything becomes a real record.")}
        <section class="section">
          <div class="surface">
            <div class="notice secure">AI suggestions are drafts. Review before saving anything to ministry records.</div>
            <p class="page-kicker" style="margin-top:12px;">This inbox is local and review-only. Approving selected actions opens a final confirmation before any local record is saved.</p>
            ${settings.aiMockMode ? "" : `<div class="notice danger" style="margin-top:12px;">Mock AI is off in Settings. Turn it on before continuing with mock review flows.</div>`}
            <div class="tabs" style="margin-top:14px;">
              ${AI_REVIEW_FILTERS.map(filter => `<button class="tab ${view.aiReviewFilter === filter ? "active" : ""}" data-action="ai-review-filter" data-filter="${escapeHtml(filter)}">${escapeHtml(filter)} (${counts[filter] || 0})</button>`).join("")}
            </div>
          </div>
        </section>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${escapeHtml(view.aiReviewFilter || "Pending")}</h2>
            <span class="pill gray">${proposals.length}</span>
          </div>
          ${proposals.length ? proposals.map(renderAiProposalCard).join("") : emptyState("No AI suggestions are in this view.")}
        </section>
      `;
    }

    function renderAiProposalCard(proposal) {
      const warnings = Array.isArray(proposal.warnings) ? proposal.warnings : [];
      const actions = Array.isArray(proposal.proposedActions) ? proposal.proposedActions : [];
      const sourceLabel = `${labelFromCamel(proposal.sourceType)}${proposal.sourceId ? " / " + proposal.sourceId : ""}`;
      const sourceRecord = aiProposalSourceRecord(proposal);
      const sourceTier = sourceRecord ? aiPrivacyTierForRecord(sourceRecord, aiSourceCollectionForProposal(proposal)) : aiPrivacyTierForRecord(proposal, "aiProposals");
      const canOpenSource = aiProposalCanOpenSource(proposal);
      const focused = view.aiReviewFocusId === proposal.id;
      const canExecute = aiProposalCanExecute(proposal);
      const executableCount = actions.filter(aiActionIsExecutable).length;
      const actionSelection = aiCurrentActionSelection(proposal);
      const selectedActionCount = actions.filter((action, index) =>
        aiActionIsExecutable(action) && actionSelection.selectedActionIds.includes(aiActionId(action, index))
      ).length;
      const skippedActionCount = executableCount - selectedActionCount;
      return `
        <article class="item compact focus-card ${focused ? "important" : ""}">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(proposal.title || "Untitled AI suggestion")}</div>
              <div class="meta">${escapeHtml(labelFromCamel(proposal.proposalType))}</div>
            </div>
            <div class="row wrap">
              ${focused ? `<span class="pill green">Focused</span>` : ""}
              <span class="pill ${aiProposalStatusTone(proposal.status)}">${escapeHtml(labelFromCamel(proposal.status || "pending"))}</span>
            </div>
          </div>
          <p class="item-preview">${escapeHtml(proposal.summary || "Review this suggestion before deciding what to do with it.")}</p>
          <div class="row wrap">
            <span class="pill violet">${escapeHtml(labelFromCamel(proposal.proposalType))}</span>
            <span class="pill ${proposal.confidence === "high" ? "green" : proposal.confidence === "medium" ? "gold" : "gray"}">Confidence: ${escapeHtml(labelFromCamel(proposal.confidence))}</span>
            <span class="pill ${aiProposalSensitivityTone(proposal.sensitivityRisk)}">Sensitivity: ${escapeHtml(labelFromCamel(proposal.sensitivityRisk))}</span>
            <span class="pill ${aiPrivacyTierTone(sourceTier)}">AI Privacy: ${escapeHtml(sourceTier)}</span>
            <span class="pill gray">Model: ${escapeHtml(proposal.model || "mock")}</span>
          </div>
          <div class="meta">Source: ${escapeHtml(sourceLabel)}</div>
          ${proposal.contextPreview ? `<p class="item-preview"><strong>Context:</strong> ${escapeHtml(proposal.contextPreview)}</p>` : ""}
          ${proposal.rawInputPreview ? `<p class="item-preview"><strong>Input preview:</strong> ${escapeHtml(proposal.rawInputPreview)}</p>` : ""}
          ${renderAiBriefingResult(proposal)}
          ${renderAiFollowUpDraftResult(proposal)}
          ${renderAiPrayerStewardResult(proposal)}
          ${renderAiDataJanitorResult(proposal)}
          ${renderAiWeeklyResetResult(proposal)}
          ${renderAiDonorUpdateResult(proposal)}
          <div class="field">
            <label>Warnings</label>
            ${warnings.length ? `<div class="settings-list">${warnings.map(warning => `<div class="notice danger">${escapeHtml(warning)}</div>`).join("")}</div>` : `<div class="meta">No warnings attached.</div>`}
          </div>
          <div class="field">
            <label>Proposed actions</label>
            ${executableCount ? `<div class="meta">${selectedActionCount} selected · ${skippedActionCount} skipped. Your choices are saved on this device before final approval.</div>` : ""}
            ${actions.length ? `<div class="settings-list">${actions.map((action, index) => renderAiProposalActionRow(proposal, action, index)).join("")}</div>` : `<div class="meta">No proposed action beyond review.</div>`}
          </div>
          ${timestampLine(proposal)}
          <div class="action-row focus-actions">
            ${canExecute && executableCount ? `<button class="button small primary" data-action="ai-proposal-approve-selected" data-id="${escapeHtml(proposal.id)}">Approve selected actions</button>` : ""}
            ${canExecute && executableCount ? `<button class="button small" data-action="ai-proposal-approve-all" data-id="${escapeHtml(proposal.id)}">Approve all actions</button>` : ""}
            ${proposal.status !== "approved" && !executableCount ? `<button class="button small primary" data-action="ai-proposal-approve" data-id="${escapeHtml(proposal.id)}">Approve proposal</button>` : ""}
            ${proposal.status !== "rejected" ? `<button class="button small" data-action="ai-proposal-reject" data-id="${escapeHtml(proposal.id)}">Reject proposal</button>` : ""}
            ${proposal.status !== "archived" ? `<button class="button small" data-action="ai-proposal-archive" data-id="${escapeHtml(proposal.id)}">Archive proposal</button>` : ""}
            ${canOpenSource ? `<button class="button small" data-action="ai-proposal-open-source" data-id="${escapeHtml(proposal.id)}">Open Related Source</button>` : ""}
            ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="aiProposals" data-field="title" data-label="AI proposal title" data-id="${escapeHtml(proposal.id)}">Edit Title</button>` : ""}
            ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="aiProposals" data-field="summary" data-label="AI proposal summary" data-id="${escapeHtml(proposal.id)}">Edit Summary</button>` : ""}
          </div>
        </article>
      `;
    }

    function renderPrayerStewardItems(title, items) {
      const list = Array.isArray(items) ? items.filter(Boolean) : [];
      return `
        <div class="notice">
          <strong>${escapeHtml(title)}</strong>
          ${list.length ? `<ul>${list.map(item => `<li>${escapeHtml(item)}</li>`).join("")}</ul>` : `<div class="meta">No issue found in this section.</div>`}
        </div>
      `;
    }

    function renderAiPrayerStewardResult(proposal) {
      if (proposal?.proposalType !== "prayerSteward") return "";
      const steward = proposal.result?.steward || {};
      return `
        <div class="field">
          <label>Prayer Steward Audit</label>

    function aiProposalCanExecute(proposal) {
      return ["pending", "edited"].includes(proposal?.status || "pending");
    }

    function aiActionType(action = {}) {
      return action.actionType || action.type || action.action || "noAction";
    }

    function aiActionIsExecutable(action = {}) {
      if (action.reviewOnly === true) return false;
      return AI_EXECUTABLE_ACTION_TYPES.includes(aiActionType(action));
    }

    function aiActionSummary(action = {}) {
      const type = aiActionType(action);
      if (type === "createPrayerRequest") return action.request || action.content || action.text || action.body || action.title || action.label || "";
      if (type === "createMeetingNote") return action.summary || action.content || action.whatWeTalkedAbout || action.body || action.title || action.label || "";
      if (type === "createNote") return action.content || action.draft || action.summary || action.body || action.title || action.label || "";
      if (type === "createFollowUpTask") return action.title || action.task || action.label || action.body || action.content || "";
      if (type === "createPerson") return action.name || action.personName || action.label || action.title || "";
      return action.label || action.title || action.summary || action.request || action.content || action.task || action.name || "";
    }

    function aiActionId(action = {}, index = 0) {
      return String(action.actionId || action.id || action.key || `${aiActionType(action)}-${index + 1}`);
    }

    function aiActionReviewState(proposal) {
      const review = proposal?.result && typeof proposal.result === "object" && proposal.result.actionReview && typeof proposal.result.actionReview === "object"
        ? proposal.result.actionReview
        : null;
      const transient = proposal?.id && view.aiActionSelections ? view.aiActionSelections[proposal.id] : null;
      const completedReview = proposal && (Array.isArray(proposal.selectedActionIds) || Array.isArray(proposal.skippedActionIds))
        ? { selectedActionIds: proposal.selectedActionIds, skippedActionIds: proposal.skippedActionIds }
        : null;
      const source = transient || review || completedReview || {};
      return {
        selectedActionIds: Array.from(new Set(Array.isArray(source.selectedActionIds) ? source.selectedActionIds.map(String) : [])),
        skippedActionIds: Array.from(new Set(Array.isArray(source.skippedActionIds) ? source.skippedActionIds.map(String) : []))
      };
    }

    function aiActionSelectionFromIndexes(proposal, actionIndexes = []) {
      const selectedIndexes = new Set(actionIndexes.filter(index => Number.isInteger(index)));
      const actions = Array.isArray(proposal?.proposedActions) ? proposal.proposedActions : [];
      const executable = actions
        .map((action, index) => ({ action, index, actionId: aiActionId(action, index) }))
        .filter(item => aiActionIsExecutable(item.action));
      const selectedActionIds = executable
        .filter(item => selectedIndexes.has(item.index))
        .map(item => item.actionId);
      const skippedActionIds = executable
        .filter(item => !selectedIndexes.has(item.index))
        .map(item => item.actionId);
      return { selectedActionIds, skippedActionIds };
    }

    function aiCurrentActionSelection(proposal) {
      const actions = Array.isArray(proposal?.proposedActions) ? proposal.proposedActions : [];
      const review = aiActionReviewState(proposal);
      if (review.selectedActionIds.length || review.skippedActionIds.length) return review;
      if (!aiProposalCanExecute(proposal)) return review;
      return aiActionSelectionFromIndexes(
        proposal,
        actions.map((action, index) => aiActionIsExecutable(action) ? index : -1).filter(index => index >= 0)
      );
    }

    function aiActionIsSelected(proposal, action, index) {
      if (!aiActionIsExecutable(action)) return false;
      const actionId = aiActionId(action, index);
      const selection = aiCurrentActionSelection(proposal);
      return selection.selectedActionIds.includes(actionId) && !selection.skippedActionIds.includes(actionId);
    }

    function storeAiActionSelection(proposal, nextSelection) {
      if (!proposal) return false;
      const selectedActionIds = Array.from(new Set((nextSelection?.selectedActionIds || []).map(String)));
      const selectedSet = new Set(selectedActionIds);
      const skippedActionIds = Array.from(new Set((nextSelection?.skippedActionIds || []).map(String)))
        .filter(actionId => !selectedSet.has(actionId));
      const actionReview = { selectedActionIds, skippedActionIds };
      const timestamp = nowISO();
      view.aiActionSelections = {
        ...(view.aiActionSelections || {}),
        [proposal.id]: actionReview
      };
      proposal.result = proposal.result && typeof proposal.result === "object" ? proposal.result : {};
      proposal.result.actionReview = {
        ...actionReview,
        updatedAt: timestamp,
        persistedLocally: true
      };
      proposal.updatedAt = timestamp;
      saveData();
      return true;
    }

    function persistAiActionSelection(proposalId, actionId, checked) {
      const proposal = aiProposalById(proposalId);
      if (!proposal || !aiProposalCanExecute(proposal)) return;
      const actions = Array.isArray(proposal.proposedActions) ? proposal.proposedActions : [];
      const actionIndexes = actions
        .map((action, index) => {
          if (!aiActionIsExecutable(action)) return -1;
          if (aiActionId(action, index) === actionId) return checked ? index : -1;
          return aiActionIsSelected(proposal, action, index) ? index : -1;
        })
        .filter(index => index >= 0);
      const nextSelection = aiActionSelectionFromIndexes(proposal, actionIndexes);
      storeAiActionSelection(proposal, nextSelection);
    }

    function aiActionEditableFields(action = {}) {
      const type = aiActionType(action);
      if (type === "createNote") return [
        { field: "content", label: "Note", kind: "textarea", value: aiActionText(action, ["content", "draft", "summary", "body", "title"]) }

      if (type === "createMeetingNote") return [

      if (type === "createPrayerRequest") return [

        { field: "followUpDate", label: "Follow-up date", kind: "date", value: action.followUpDate || "" }

      if (type === "createFollowUpTask") return [

        { field: "dueDate", label: "Due date", kind: "date", value: action.dueDate || action.followUpDate || action.date || "" }

      if (type === "createPerson") return [

        { field: "phone", label: "Phone", kind: "text", value: action.phone || "" }

      if (type === "updatePerson") return [
        { field: "lastMeaningfulInteraction", label: "Last meaningful interaction", kind: "date", value: action.lastMeaningfulInteraction || action.updates?.lastMeaningfulInteraction || "" },
        { field: "nextFollowUpDate", label: "Next follow-up date", kind: "date", value: action.nextFollowUpDate || action.updates?.nextFollowUpDate || "" },
        { field: "followUpReason", label: "Follow-up reason", kind: "textarea", value: action.followUpReason || action.updates?.followUpReason || "" }
      ];
      if (type === "markSensitive") return [];
      return [
        { field: "label", label: "Review wording", kind: "textarea", value: aiActionSummary(action) }
      ];
    }

    function renderAiProposalActionRow(proposal, action, index) {
      const type = aiActionType(action);
