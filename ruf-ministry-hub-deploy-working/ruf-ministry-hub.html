              <p class="page-kicker">${editableCopy("startHere.kicker", settings.adhdMode ? "Do this, snooze it, or capture what is in your head." : "One clear next step, then you can keep moving.")}</p>
            </div>
            <div class="focus-step">
              <span class="focus-step-label">${editableCopy("startHere.stepLabel", "One good next step")}</span>
              <strong>${escapeHtml(stepText)}</strong>
            </div>
            <div class="action-row">
              ${primaryButton}
              <button class="button" data-action="nav" data-screen="quick">Dump a New Thought</button>
              <button class="button" data-action="nav" data-screen="review">Open Review Queue</button>
              ${settings.adhdMode ? "" : `<button class="button" data-action="nav" data-screen="minutes">I Have 15 Minutes</button>`}
            </div>
          </div>
        </section>
      `;
    }

    function coachThresholds() {
      const map = {
        gentle: { openGrabs: 12, promptItems: 6, answeredPrayer: 6, dueTasks: 8, duplicates: 2 },
        balanced: { openGrabs: 7, promptItems: 3, answeredPrayer: 3, dueTasks: 5, duplicates: 1 },
        proactive: { openGrabs: 3, promptItems: 1, answeredPrayer: 1, dueTasks: 3, duplicates: 1 }
      };
      return map[settings.appCoachSensitivity] || map.balanced;
    }

    function coachSuggestionDismissed(id) {
      const dismissedAt = settings.appCoachDismissed?.[id];
      if (!dismissedAt) return false;
      const dismissedTime = new Date(dismissedAt).getTime();
      if (Number.isNaN(dismissedTime)) return false;
      return Date.now() - dismissedTime < 7 * 24 * 60 * 60 * 1000;
    }

    function sensitiveRecordCount() {
      return db.quickGrabs.filter(item => item.sensitiveFlag).length
        + db.notes.filter(item => item.sensitiveFlag).length
        + db.meetingNotes.filter(item => item.sensitiveFlag).length
        + db.prayerRequests.filter(item => item.sensitivityLevel === "Sensitive").length;
    }

    function totalRecordCount() {
      return db.people.length + db.quickGrabs.length + db.notes.length + db.meetingNotes.length + db.prayerRequests.length + db.tasks.length;
    }

    function coachPinCandidates() {
      const seen = new Set(settings.pinnedPersonIds);
      const candidates = [];
      const add = person => {
        if (!person || seen.has(person.id)) return;
        seen.add(person.id);
        candidates.push(person);
      };
      peopleToCareFor().forEach(add);
      peopleFromIds(settings.recentPersonIds).forEach(add);
      db.people
        .slice()
        .sort((a, b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")))
        .forEach(add);
      return candidates.slice(0, 3);
    }

    function addCoachSuggestion(list, suggestion) {
      if (!suggestion.id || coachSuggestionDismissed(suggestion.id)) return;
      list.push(suggestion);
    }

    function appCoachSuggestions() {
      if (!settings.appCoachEnabled) return [];
      const thresholds = coachThresholds();
      const suggestions = [];
      const promptItems = promptQuickGrabs();
      const openItems = openQuickGrabs();
      const dueTasks = taskDueSoon();
      const duplicatePairs = findDuplicatePeople();
      const sensitiveCount = sensitiveRecordCount();
      const totalRecords = totalRecordCount();
      const answeredPrayer = db.prayerRequests.filter(prayer => prayer.status === "Answered");
      const prayerFollowUps = db.prayerRequests.filter(prayer => prayer.status === "Follow-Up Needed");
      const pinCandidates = coachPinCandidates();

      if (!isLocalOrHttps() || !canUseServiceWorker()) {
        addCoachSuggestion(suggestions, {
          id: "finish-iphone-deploy",
          kind: "iPhone",
          title: "Finish the iPhone-ready setup",
          detail: "The app is still being opened like a file. A private HTTPS copy is what unlocks Home Screen install, offline cache, and update checks.",
          reason: "This matters before you rely on it for daily phone use.",
          primaryLabel: "Open Readiness"
        });
      }

      if (backupReminderDue()) {
        addCoachSuggestion(suggestions, {
          id: "backup-now",
          kind: "Data",
          title: "Export a fresh backup",
          detail: backupStatusText(),
          reason: "Backups are the safety net for iPhone storage, browser updates, and app upgrades.",
          primaryLabel: "Export Backup"
        });
      }

      if (settings.backupReminderDays === "0" && totalRecords > 0) {
        addCoachSuggestion(suggestions, {
          id: "backup-rhythm",
          kind: "Data",
          title: "Turn on a weekly backup rhythm",
          detail: "Backup reminders are off.",
          reason: "A quiet weekly reminder makes it much less likely that ministry history gets stuck on one device.",
          primaryLabel: "Use Weekly Backups"
        });
      }

      if (!settings.autoMemoryVaultEnabled && totalRecords > 0) {
        addCoachSuggestion(suggestions, {
          id: "enable-auto-memory",
          kind: "Data",
          title: "Turn Auto Memory Vault back on",
          detail: "Local restore points are paused.",
          reason: "Auto Memory protects you from accidental edits, bad imports, and demo resets without needing manual exports every time.",
          primaryLabel: "Turn On Auto Memory"
        });
      }

      if (!settings.enableAutoSave) {
        addCoachSuggestion(suggestions, {
          id: "enable-autosave",
          kind: "iPhone",
          title: "Turn Auto Save Drafts back on",
          detail: "Typed drafts are not currently being saved while you work.",
          reason: "Phone interruptions are common. Autosave protects half-written notes and processing forms.",
          primaryLabel: "Turn On Autosave"
        });
      }

      if (!settings.localEncryptionEnabled && (sensitiveCount > 0 || totalRecords > 12)) {
        addCoachSuggestion(suggestions, {
          id: "enable-vault",
          kind: "Privacy",
          title: "Set up Device Vault",
          detail: sensitiveCount ? `${sensitiveCount} sensitive item${sensitiveCount === 1 ? "" : "s"} found.` : "You have enough local ministry history that encryption is worth considering.",
          reason: "The vault adds app-level encryption for data saved on this device.",
          primaryLabel: "Set Up Vault"
        });
      }

      if (sensitiveCount > 0 && (!settings.maskSensitivePreviews || settings.includeSensitiveInSearch)) {
        addCoachSuggestion(suggestions, {
          id: "tighten-sensitive-privacy",
          kind: "Privacy",
          title: "Tighten sensitive item privacy",
          detail: "Sensitive previews or sensitive search results are currently more visible.",
          reason: "Masking sensitive previews keeps shoulder-glance moments safer on a phone.",
          primaryLabel: "Tighten Privacy"
        });
      }

      if (openItems.length >= thresholds.openGrabs || promptItems.length >= thresholds.promptItems) {
        addCoachSuggestion(suggestions, {
          id: "gentle-review-flow",
          kind: "Focus",
          title: "Switch cleanup into a one-card review flow",
          detail: `${openItems.length} open Quick Grab${openItems.length === 1 ? "" : "s"} and ${promptItems.length} asking for attention.`,
          reason: "A single-card queue is easier to use on an iPhone when the backlog gets noisy.",
          primaryLabel: "Make Review Gentler"
        });
      }

      if (answeredPrayer.length >= thresholds.answeredPrayer && settings.autoArchiveAnsweredDays === "never") {
        addCoachSuggestion(suggestions, {
          id: "auto-archive-answered",
          kind: "Prayer",
          title: "Auto-archive answered prayer after 30 days",
          detail: `${answeredPrayer.length} answered prayer request${answeredPrayer.length === 1 ? "" : "s"} are still outside the archive.`,
          reason: "This keeps answered prayer visible for a little while, then clears the active lists automatically.",
          primaryLabel: "Use 30-Day Archive"
        });
      }

      if (duplicatePairs.length >= thresholds.duplicates) {
        addCoachSuggestion(suggestions, {
          id: "review-duplicates",
          kind: "People",
          title: "Review possible duplicate people",
          detail: `${duplicatePairs.length} possible duplicate pair${duplicatePairs.length === 1 ? "" : "s"} found.`,
          reason: "Merging duplicates keeps notes, prayers, and follow-ups attached to one clear profile.",
          primaryLabel: "Review Duplicates"
        });
      }

      if (dueTasks.length >= thresholds.dueTasks && settings.launchScreen !== "today") {
        addCoachSuggestion(suggestions, {
          id: "launch-today",
          kind: "Focus",
          title: "Open to Today when follow-ups are stacking up",
          detail: `${dueTasks.length} follow-up task${dueTasks.length === 1 ? "" : "s"} are due soon.`,
          reason: "Today is the best first screen when you need the app to tell you what matters next.",
          primaryLabel: "Open To Today"
        });
      }

      if (settings.pinnedPersonIds.length < 2 && pinCandidates.length) {
        addCoachSuggestion(suggestions, {
          id: "pin-care-people",
          kind: "People",
          title: "Pin a few important people",
          detail: pinCandidates.map(person => person.name).join(", "),
          reason: "Pinned people stay one tap away on Today, which is better for phone use than searching every time.",
          primaryLabel: "Pin These People"
        });
      }

      if (!settings.notificationsEnabled && typeof Notification !== "undefined" && (dueTasks.length || promptItems.length || prayerFollowUps.length)) {
        addCoachSuggestion(suggestions, {
          id: "enable-reminders",
          kind: "Reminders",
          title: "Allow one open-app reminder",
          detail: "Notifications are off while there are items waiting.",
          reason: "A generic browser reminder can nudge you after the app is open without showing sensitive details.",
          primaryLabel: "Allow Reminders"
        });
      }

      return suggestions.slice(0, 10);
    }

    function renderAppCoachNudge() {
      if (!settings.appCoachEnabled || !settings.appCoachShowOnToday) return "";
      const suggestion = appCoachSuggestions()[0];
      if (!suggestion) return "";
      return `
        <section class="section">
          <div class="notice secure">
            <div class="row wrap">
              <div>
                <strong>App Coach suggestion</strong>
                <div class="meta">${escapeHtml(suggestion.title)} - ${escapeHtml(suggestion.reason)}</div>
              </div>
              <button class="button small primary" data-action="nav" data-screen="coach">Review</button>
              <button class="button small" data-action="coach-dismiss" data-suggestion="${escapeHtml(suggestion.id)}">Hide</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderCoachSuggestionCard(suggestion) {
      return `
        <article class="item">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(suggestion.title)}</div>
              <div class="meta">${escapeHtml(suggestion.detail)}</div>
            </div>
            <span class="pill green">${escapeHtml(suggestion.kind)}</span>
          </div>
          <p class="item-preview">${escapeHtml(suggestion.reason)}</p>
          <div class="action-row">
            <button class="button primary" data-action="coach-apply" data-suggestion="${escapeHtml(suggestion.id)}">${escapeHtml(suggestion.primaryLabel)}</button>
            <button class="button" data-action="coach-dismiss" data-suggestion="${escapeHtml(suggestion.id)}">Dismiss for now</button>
          </div>
        </article>
      `;
    }

    function renderAppCoach() {
      const suggestions = appCoachSuggestions();
      const dismissedCount = Object.keys(settings.appCoachDismissed || {}).length;
      return `
        ${renderTopbar("App Coach", "Local suggestions that help the hub tune itself without changing anything until you approve.", false)}
        <section class="section">
          <div class="surface">
            <div class="action-row">
              <button class="button" data-action="nav" data-screen="settings">Back to Settings</button>
              <button class="button" data-action="coach-refresh">Refresh Audit</button>
              <button class="button" data-action="donor-update-builder">Donor Update Builder</button>
              <button class="button primary" data-action="weekly-reset-agent">Build Weekly Reset Plan</button>
              <button class="button primary" data-action="data-janitor">Run Data Janitor</button>
              ${dismissedCount ? `<button class="button" data-action="coach-clear-dismissed">Show Hidden Suggestions</button>` : ""}
          </div>
          </div>
        </section>
        <section class="section">
          <div class="surface quick-box">
            <div>
              <h2 class="section-title">How It Works</h2>
              <p class="page-kicker">The coach checks local patterns like stale Quick Grabs, backups, privacy settings, duplicate people, answered prayer, and iPhone readiness. It does not send ministry data anywhere.</p>
            </div>
            <div class="notice secure">Data Janitor suggests cleanup only. Review before changing ministry records.</div>
            <div class="settings-list">
              ${settingToggle("appCoachEnabled", "App Coach Suggestions", "Let the app look for helpful local improvements.")}
              ${settingToggle("appCoachShowOnToday", "Show One Suggestion On Today", "Show the highest-value coach suggestion on the Today screen.")}
              ${settingSelect("appCoachSensitivity", "Suggestion Style", [["gentle", "Gentle"], ["balanced", "Balanced"], ["proactive", "Proactive"]], "Choose how quickly the coach points out optimization ideas.")}
            </div>
            <div class="action-row" style="margin-top:14px;">
              <button class="button" data-action="donor-update-builder">Donor Update Builder</button>
              <button class="button primary" data-action="weekly-reset-agent">Build Weekly Reset Plan</button>
              <button class="button primary" data-action="data-janitor">Run Data Janitor</button>
            </div>
          </div>
        </section>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Suggested Adjustments</h2>
          </div>
          ${suggestions.length ? suggestions.map(renderCoachSuggestionCard).join("") : emptyState(settings.appCoachEnabled ? "No helpful adjustments are waiting right now." : "App Coach is turned off.")}
        </section>
      `;
    }

    function renderQuickGrab() {
      const recent = db.quickGrabs.slice().sort((a, b) => b.createdAt.localeCompare(a.createdAt)).slice(0, 8);
      const promptItems = promptQuickGrabs();
      return `
        ${renderTopbar("Quick Grab", "Grab it and keep moving. Sort it when you have a little more room.", false)}
        <div class="grid two">
          <section class="section">
            <div class="surface quick-box">
              <div class="field">
                <label for="quick-text">Quick Grab</label>
                <textarea class="textarea" id="quick-text" placeholder="Dump it here...">${escapeHtml(view.quickGrabDraftText || "")}</textarea>
              </div>
              <div class="field">
                <label>Quick buttons</label>
                <div class="chip-row" id="quick-tags">
                  ${["People", "Prayer", "Donors", "Teaching", "Events", "Admin", "Personal"].map(tag => `<button class="chip" data-tag="${tag}">${tag}</button>`).join("")}
                </div>
              </div>
              <div class="field">
                <label>Urgency</label>
                <div class="chip-row" id="urgency-tags">
                  ${["Today", "Soon", "Important"].map(tag => `<button class="chip urgent" data-urgency="${tag}">${tag}</button>`).join("")}
                </div>
              </div>
              <div class="action-row">
                <button class="button primary full" data-action="grab-create">Grab It</button>
                ${settings.enableVoiceCapture ? `<button class="button full" data-action="voice-capture">Dictate</button>` : ""}
              </div>
            </div>
          </section>
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Prompt Me</h2>
              <div class="action-row">
                <span class="pill green">${promptItems.length} ready</span>
                <button class="button small" data-action="nav" data-screen="review">Review Queue</button>
              </div>
            </div>
            ${promptItems.length ? promptItems.map(renderQuickGrabCard).join("") : emptyState("You're clear for now. Grab something when it pops into your head.")}
          </section>
        </div>
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Recent Grabs</h2>
          </div>
          ${recent.length ? recent.map(renderQuickGrabCard).join("") : emptyState("No Quick Grabs yet.")}
        </section>
      `;
    }

    function renderReviewQueue() {
      const batchSize = Number(settings.reviewBatchSize || 3);
      const items = promptQuickGrabs().slice(0, batchSize);
      if (!items.length) {
        return `
          ${renderTopbar("Quick Review", "One loose reminder at a time, with no pile staring back at you.")}
          <section class="section">
            ${emptyState("Nothing needs review right now. Quick Grab is ready when a thought pops up.")}
          </section>
        `;
      }
      const index = Math.min(Math.max(view.reviewIndex || 0, 0), items.length - 1);
      const grab = items[index];
      return `
        ${renderTopbar("Quick Review", "One loose reminder at a time, with no pile staring back at you.")}
        <section class="section">
          <div class="surface review-card">
            <div class="review-progress">
              <span>Card ${index + 1} of ${items.length}</span>
              <span>${promptQuickGrabs().length} total waiting</span>
            </div>
            ${renderQuickGrabCard(grab, "summary")}
            <div class="action-row">
              <button class="button" data-action="review-prev" ${index === 0 ? "disabled" : ""}>Previous</button>
              <button class="button" data-action="review-next" ${index >= items.length - 1 ? "disabled" : ""}>Next</button>
              <button class="button primary" data-action="qg-process" data-id="${grab.id}">Process This</button>
              <button class="button" data-action="qg-mock-ai" data-id="${grab.id}">${quickGrabAiButtonLabel()}</button>
              <button class="button" data-action="snooze-screen" data-id="${grab.id}">Snooze</button>
              <button class="button" data-action="qg-done" data-id="${grab.id}">Done</button>
              <button class="button danger" data-action="qg-archive" data-id="${grab.id}">Archive</button>
            </div>
          </div>
        </section>
      `;
    }

    function renderQuickGrabCard(grab, mode = "full") {
      const person = personById(grab.relatedPersonId);
      const sensitivePreview = maskedText(grab.sensitiveFlag, "Sensitive grabbed item - tap to view.", grab.rawContent);
      const expanded = view.expandedQuickGrabIds.includes(grab.id);
      const showActions = mode !== "summary";
      return `
        <article class="item compact focus-card ${grab.urgency === "Important" ? "important" : grab.urgency === "Today" ? "today" : ""}">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(grab.category)} Quick Grab</div>
            <span class="pill ${grab.urgency === "Important" ? "gold" : grab.urgency === "Today" ? "terra" : "gray"}">${escapeHtml(grab.urgency)}</span>
          </div>
          <p class="item-preview">${escapeHtml(sensitivePreview)}</p>
          <div class="row wrap">
            <span class="meta">${escapeHtml(grab.status)}${person ? " - " + escapeHtml(person.name) : ""}</span>
            ${grab.remindAt ? `<span class="meta">Prompt: ${dateLabel(grab.remindAt)}</span>` : ""}
          </div>
          ${timestampLine(grab, "Captured", grab.createdAt)}
          <div class="next-step-line">
            <span class="pill green">Next</span>
            <strong>${escapeHtml(quickGrabNextStep(grab))}</strong>
          </div>
          ${showActions ? `
            <div class="action-row focus-actions">
              <button class="button small primary" data-action="qg-process" data-id="${grab.id}">Process</button>
              <button class="button small" data-action="qg-mock-ai" data-id="${grab.id}">${quickGrabAiButtonLabel()}</button>
              <button class="button small" data-action="snooze-screen" data-id="${grab.id}">Snooze</button>
              <button class="button small" data-action="qg-done" data-id="${grab.id}">Done</button>
              ${settings.showAdvancedActions ? "" : `<button class="button small" data-action="qg-toggle-more" data-id="${grab.id}">${expanded ? "Less" : "More"}</button>`}
            </div>
            <div class="action-row extra-actions ${expanded ? "is-open" : ""}">
              <button class="button small" data-action="qg-preset" data-type="note" data-id="${grab.id}">Turn into Note</button>
              <button class="button small" data-action="qg-preset" data-type="followup" data-id="${grab.id}">Turn into Task</button>
              <button class="button small" data-action="qg-preset" data-type="followup" data-id="${grab.id}">Turn into Follow-Up</button>
              <button class="button small" data-action="qg-preset" data-type="prayer" data-id="${grab.id}">Turn into Prayer Request</button>
              <button class="button small" data-action="qg-preset" data-type="meeting" data-id="${grab.id}">Turn into Meeting Note</button>
              <button class="button small" data-action="qg-preset" data-type="teaching" data-id="${grab.id}">Turn into Teaching Idea</button>
              <button class="button small" data-action="qg-preset" data-type="donor" data-id="${grab.id}">Turn into Donor Update Idea</button>
              ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="quickGrabs" data-field="rawContent" data-label="Quick Grab" data-id="${grab.id}">Edit Grab</button>` : ""}
              <button class="button small" data-action="qg-archive" data-id="${grab.id}">Archive</button>
            </div>
          ` : ""}
        </article>
      `;
    }

    function quickGrabNextStep(grab) {
      if (grab.detectedMeetingSummary && grab.detectedPrayerRequest) return "Review and turn this into linked meeting and prayer records.";
      if (grab.detectedMeetingSummary) return "Review this as a meeting note.";
      if (grab.detectedPrayerRequest) return "Review this as a prayer request.";
      if (grab.detectedFollowUp) return "Review this as a follow-up task.";
      return "Decide what this should become.";
    }

    function renderSearch() {
      const query = view.globalSearch.trim();
      const results = query ? buildSearchResults(query) : [];
      const total = results.reduce((sum, group) => sum + group.items.length, 0);
      return `
        ${renderTopbar("Search", "Find the person, note, prayer request, meeting, task, or loose reminder you half-remember.")}
        <section class="section">
          <div class="surface quick-box">
            <div class="field">
              <label for="global-search">Search anything</label>
              <input class="input" id="global-search" value="${escapeHtml(view.globalSearch)}" placeholder="Try a name, SAE, surgery, summer plans, Large Group...">
            </div>
            <div class="meta">${query ? `${total} result${total === 1 ? "" : "s"} found` : "Type whatever fragment you remember. One word is enough to start."}</div>
          </div>
        </section>
        ${query ? renderSearchResults(results) : renderSearchSuggestions()}
      `;
    }

    function renderSearchSuggestions() {
      return `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">Good Things To Search</h2>
          </div>
          <div class="grid three">
            <div class="item compact"><div class="item-title">A person</div><p class="item-preview">Name, fraternity, class year, major, hometown, or donor status.</p></div>
            <div class="item compact"><div class="item-title">A care detail</div><p class="item-preview">Something like surgery, anxiety, wisdom, summer plans, or family.</p></div>
            <div class="item compact"><div class="item-title">A ministry thing</div><p class="item-preview">Large Group, cups, teaching ideas, meetings, follow-ups, or prayer.</p></div>
          </div>
        </section>
      `;
    }

    function renderSearchResults(results) {
      const visibleGroups = results.filter(group => group.items.length);
      if (!visibleGroups.length) {
        return `<section class="section">${emptyState("Nothing matched that search. Try one smaller word, a first name, or a phrase you remember.")}</section>`;
      }
      return visibleGroups.map(group => `
        <section class="section">
          <div class="section-header">
            <h2 class="section-title">${escapeHtml(group.label)}</h2>
            <span class="pill gray">${group.items.length}</span>
          </div>
          ${group.items.map(renderSearchResultCard).join("")}
        </section>
      `).join("");
    }

    function buildSearchResults(query) {
      const q = query.toLowerCase();
      const matches = fields => fields.filter(Boolean).join(" ").toLowerCase().includes(q);
      const people = db.people
        .filter(person => matches([person.name, person.personType, person.status, person.careLevel, person.preferredContactMethod, person.phone, person.email, person.classYear, person.fraternitySorority, person.major, person.hometown, person.rufInvolvement, person.donorStatus, person.followUpReason]))
        .map(person => ({
          kind: "Person",
          title: person.name,
          meta: `${person.personType} - ${person.careLevel}`,
          preview: person.followUpReason || person.rufInvolvement || "Open the profile for the whole ministry history.",
          personId: person.id,
          createdAt: person.createdAt,
          updatedAt: person.updatedAt
        }));
      const quickGrabs = db.quickGrabs
        .filter(grab => (settings.includeArchivedInSearch || grab.status !== "Archived") && (settings.includeSensitiveInSearch || !grab.sensitiveFlag) && matches([grab.rawContent, grab.detectedPersonName, grab.detectedPrayerRequest, grab.detectedFollowUp, grab.detectedMeetingSummary, grab.category, grab.status, grab.urgency]))
        .map(grab => ({
          kind: "Quick Grab",
          title: `${grab.category} Quick Grab`,
          meta: `${grab.status} - ${grab.urgency}`,
          preview: maskedText(grab.sensitiveFlag, "Sensitive grabbed item - open to process.", grab.rawContent),
          quickGrabId: grab.id,
          createdAt: grab.createdAt,
          updatedAt: grab.updatedAt
        }));
      const prayers = db.prayerRequests
        .filter(prayer => {
          if (!settings.includeArchivedInSearch && prayer.status === "Archived") return false;
          if (!settings.includeSensitiveInSearch && prayer.sensitivityLevel === "Sensitive") return false;
          const person = personById(prayer.relatedPersonId);
          return matches([person?.name, prayer.request, prayer.status, prayer.sensitivityLevel, prayer.shareableStatus, prayer.answeredNote]);
        })
        .map(prayer => {
          const person = personById(prayer.relatedPersonId);
          return {
            kind: "Prayer Request",
            title: person ? person.name : "Unlinked person",
            meta: `${prayer.status} - ${dateLabel(prayer.dateAdded)}`,
            preview: maskedText(prayer.sensitivityLevel === "Sensitive", "Sensitive prayer request - open related profile.", prayer.request),
            personId: prayer.relatedPersonId,
            prayerStatus: prayer.status,
            createdAt: prayer.createdAt,
            updatedAt: prayer.updatedAt,
            primaryLabel: "Added",
            primaryValue: prayer.dateAdded
          };
        });
      const meetings = db.meetingNotes
        .filter(meeting => {
          if (!settings.includeSensitiveInSearch && meeting.sensitiveFlag) return false;
          const person = personById(meeting.relatedPersonId);
          return matches([person?.name, meeting.meetingType, meeting.location, meeting.whatWeTalkedAbout, meeting.whatToRemember, meeting.prayerRequestText, meeting.nextFaithfulStep]);
        })
        .map(meeting => {
          const person = personById(meeting.relatedPersonId);
          return {
            kind: "Meeting Note",
            title: `${meeting.meetingType} meeting${person ? " with " + person.name : ""}`,
            meta: dateLabel(meeting.meetingDate),
            preview: maskedText(meeting.sensitiveFlag, "Sensitive meeting note - open related profile.", meeting.whatWeTalkedAbout),
            personId: meeting.relatedPersonId,
            createdAt: meeting.createdAt,
            updatedAt: meeting.updatedAt,
            primaryLabel: "Meeting",
            primaryValue: meeting.meetingDate
          };
        });
      const notes = db.notes
        .filter(note => {
          if (!settings.includeSensitiveInSearch && note.sensitiveFlag) return false;
          const person = personById(note.relatedPersonId);
          return matches([person?.name, note.noteType, note.content]);
        })
        .map(note => {
          const person = personById(note.relatedPersonId);
          return {
            kind: "Note",
            title: `${note.noteType}${person ? " - " + person.name : ""}`,
            meta: dateLabel(note.noteDate),
            preview: maskedText(note.sensitiveFlag, "Sensitive note - open related profile.", note.content),
            personId: note.relatedPersonId,
            createdAt: note.createdAt,
            updatedAt: note.updatedAt,
            primaryLabel: "Note",
            primaryValue: note.noteDate
          };
        });
      const tasks = db.tasks
        .filter(task => {
          const person = personById(task.relatedPersonId);
          return matches([person?.name, task.title, task.status, task.sourceType]);
        })
        .map(task => {
          const person = personById(task.relatedPersonId);
          return {
            kind: "Follow-Up Task",
            title: task.title,
            meta: `${task.status} - ${dateLabel(task.dueDate)}`,
            preview: person ? `Connected to ${person.name}` : task.sourceType || "Follow-up task",
            personId: task.relatedPersonId,
            createdAt: task.createdAt,
            updatedAt: task.updatedAt,
            primaryLabel: "Due",
            primaryValue: task.dueDate
          };
        });
      return [
        { label: "People", items: people },
        { label: "Quick Grabs", items: quickGrabs },
        { label: "Prayer Requests", items: prayers },
        { label: "Meeting Notes", items: meetings },
        { label: "Notes", items: notes },
        { label: "Follow-Up Tasks", items: tasks }
      ];
    }

    function renderSearchResultCard(result) {
      return `
        <article class="item compact focus-card">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(result.title)}</div>
              <div class="meta">${escapeHtml(result.meta)}</div>
            </div>
            <span class="pill violet">${escapeHtml(result.kind)}</span>
          </div>
          <p class="item-preview">${escapeHtml(result.preview)}</p>
          ${timestampLine(result, result.primaryLabel, result.primaryValue)}
          <div class="action-row">
            ${result.personId ? `<button class="button small primary" data-action="person-open" data-id="${result.personId}">Open Profile</button>` : ""}
            ${result.quickGrabId ? `<button class="button small primary" data-action="qg-process" data-id="${result.quickGrabId}">Process Quick Grab</button>` : ""}
            ${result.kind === "Prayer Request" ? `<button class="button small" data-action="open-prayer-filter" data-filter="${escapeHtml(prayerFilterForStatus(result.prayerStatus))}">Open Prayer List</button>` : ""}
          </div>
        </article>
      `;
    }

    function labelFromCamel(value) {
      return String(value || "")
        .replace(/([a-z0-9])([A-Z])/g, "$1 $2")
        .replace(/[-_]+/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .replace(/^./, char => char.toUpperCase());
    }

    function aiProposalById(id) {
      return (db.aiProposals || []).find(proposal => proposal.id === id) || null;
    }

    function aiProposalFilterMatches(proposal, filter) {
      if (filter === "Approved") return proposal.status === "approved" || proposal.status === "partiallyApproved";
      if (filter === "Rejected") return proposal.status === "rejected";
      if (filter === "Archived") return proposal.status === "archived";
      if (filter === "High Sensitivity") return proposal.sensitivityRisk === "high";
      if (filter === "Low Confidence") return proposal.confidence === "low";
      return proposal.status === "pending" || proposal.status === "edited";
    }

    function filteredAiProposals() {
      const filter = AI_REVIEW_FILTERS.includes(view.aiReviewFilter) ? view.aiReviewFilter : "Pending";
      view.aiReviewFilter = filter;
      const proposals = (db.aiProposals || [])
        .filter(proposal => aiProposalFilterMatches(proposal, filter))
        .slice()
        .sort((a, b) => String(b.updatedAt || b.createdAt || "").localeCompare(String(a.updatedAt || a.createdAt || "")));
      if (view.aiReviewFocusId) {
        proposals.sort((a, b) => (a.id === view.aiReviewFocusId ? -1 : 0) + (b.id === view.aiReviewFocusId ? 1 : 0));
      }
      return proposals;
    }

    function aiProposalStatusTone(status) {
      if (status === "approved" || status === "partiallyApproved") return "green";
      if (status === "rejected" || status === "archived") return "gray";
      if (status === "edited") return "violet";
      return "gold";
    }

    function aiProposalSensitivityTone(risk) {
      if (risk === "high") return "rose";
      if (risk === "medium") return "gold";
      if (risk === "low") return "violet";
      return "gray";
    }

    function aiSourceCollectionForType(sourceType) {
      if (sourceType === "quickGrab") return "quickGrabs";
      if (sourceType === "person") return "people";
      if (sourceType === "prayerRequest") return "prayerRequests";
      if (sourceType === "meetingNote") return "meetingNotes";
      if (sourceType === "followUpTask") return "tasks";
      return "";
    }

    function aiSourceRecord(sourceType, sourceId) {
      if (!sourceType || !sourceId) return null;
      if (sourceType === "quickGrab") return db.quickGrabs.find(item => item.id === sourceId) || null;
      if (sourceType === "person") return personById(sourceId);
      if (sourceType === "prayerRequest") return db.prayerRequests.find(item => item.id === sourceId) || null;
      if (sourceType === "meetingNote") return db.meetingNotes.find(item => item.id === sourceId) || null;
      if (sourceType === "followUpTask") return db.tasks.find(item => item.id === sourceId) || null;
      return null;
    }

    function aiProposalSourceRecord(proposal) {
      return proposal ? aiSourceRecord(proposal.sourceType, proposal.sourceId) : null;
    }

    function aiProposalCanOpenSource(proposal) {
      const record = aiProposalSourceRecord(proposal);
      if (!record) return false;
      if (proposal.sourceType === "meetingNote") return Boolean(record.relatedPersonId && personById(record.relatedPersonId));
      if (proposal.sourceType === "followUpTask") return Boolean(record.relatedPersonId && personById(record.relatedPersonId));
      return ["quickGrab", "person", "prayerRequest"].includes(proposal.sourceType);
    }

    function aiSourceCollectionForProposal(proposal) {
      return proposal ? aiSourceCollectionForType(proposal.sourceType) : "";
    }

    function aiRecordPreview(record, collection = "") {
      if (!record) return "";
      if (collection === "people") return `${record.name || "Unnamed person"} - ${record.careLevel || record.personType || "person"}`;
      if (collection === "quickGrabs") return record.rawContent || "Quick Grab";
      if (collection === "prayerRequests") return record.request || "Prayer request";
      if (collection === "meetingNotes") return record.whatWeTalkedAbout || record.whatToRemember || "Meeting note";
      if (collection === "notes") return record.content || "Note";
      if (collection === "tasks") return record.title || "Follow-up task";
      return record.title || record.summary || "Selected record";
    }

    function aiContextBlockReason(tier) {
      if (tier === "Do Not Send to AI") return "Marked Do Not Send to AI.";
      if (tier === "Highly Sensitive") return "Highly Sensitive context is blocked by AI settings.";
      if (tier === "Sensitive") return "Sensitive context is blocked by AI settings.";
      return "Not included in the selected context scope.";
    }

    function aiContextWarningForTier(tier, label) {
      if (tier === "Private") return `${label} is marked Private. Review carefully before using it.`;
      if (tier === "Sensitive") return `${label} is Sensitive. It is blocked unless Sensitive context is allowed.`;
      if (tier === "Highly Sensitive") return `${label} is Highly Sensitive. It is blocked unless Highly Sensitive context is allowed.`;
      if (tier === "Do Not Send to AI") return `${label} is marked Do Not Send to AI and cannot be included.`;
      return "";
    }

    function addAiContextCandidate(context, label, record, collection, summaryOverride = "") {
      if (!record) {
        context.notUsed.push({ label, tier: "Do Not Send to AI", summary: "No related source record was found." });
        return;
      }
      const tier = aiPrivacyTierForRecord(record, collection);
      const item = { label, tier, summary: summaryOverride || aiRecordPreview(record, collection) };
      const warning = aiContextWarningForTier(tier, label);
      if (warning) context.warnings.push(warning);
      if (!aiRecordAllowedInContext(record, collection)) {
        context.notUsed.push({ ...item, summary: `${item.summary} (${aiContextBlockReason(tier)})` });
        return;
      }
      if (["Private", "Sensitive", "Highly Sensitive"].includes(tier)) {
        context.warnings.push(`${label} is ${tier} and is included in this mock context. Review carefully.`);
      }
      context.used.push(item);
    }

    function personBriefingRecordSets(personId) {
      const person = personById(personId);
      const notes = db.notes
        .filter(note => note.relatedPersonId === personId)
        .sort((a, b) => String(b.noteDate || b.updatedAt || "").localeCompare(String(a.noteDate || a.updatedAt || "")))
        .slice(0, 3);
      const meetings = db.meetingNotes
        .filter(meeting => meeting.relatedPersonId === personId)
        .sort((a, b) => String(b.meetingDate || b.updatedAt || "").localeCompare(String(a.meetingDate || a.updatedAt || "")))
        .slice(0, 3);
      const prayers = db.prayerRequests
        .filter(prayer => prayer.relatedPersonId === personId)
        .filter(prayer => !["Archived", "Answered"].includes(prayer.status))
        .sort((a, b) => String(b.dateAdded || b.updatedAt || "").localeCompare(String(a.dateAdded || a.updatedAt || "")))
        .slice(0, 5);
      const tasks = db.tasks
        .filter(task => task.relatedPersonId === personId)
        .filter(task => task.status !== "Done / Archived")
        .sort((a, b) => String(a.dueDate || "").localeCompare(String(b.dueDate || "")))
        .slice(0, 5);
      return { person, notes, meetings, prayers, tasks };
    }

    function personBriefingPersonSummary(person) {
      return [
        `Name: ${person.name || "Unnamed"}`,
        `Care level: ${person.careLevel || "Not set"}`,
        `Last meaningful interaction: ${dateLabel(person.lastMeaningfulInteraction)}`,
        `Next follow-up: ${dateLabel(person.nextFollowUpDate)}`,
        `Follow-up reason: ${person.followUpReason || "Not set"}`
      ].join(" | ");
    }

    function buildPersonBriefingContextReview(personId) {
      const records = personBriefingRecordSets(personId);
      const context = {
        used: [],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Unrelated ministry records", tier: "Private", summary: "Not used. Person briefings use this person only." }
        ],
        warnings: [],
        blocked: false
      };
      addAiContextCandidate(context, "Person basics", records.person, "people", records.person ? personBriefingPersonSummary(records.person) : "");
      if (!records.person || !aiRecordAllowedInContext(records.person, "people")) {
        context.blocked = true;
        return context;
      }
      records.notes.forEach(note => addAiContextCandidate(context, "Recent note", note, "notes"));
      records.meetings.forEach(meeting => addAiContextCandidate(context, "Recent meeting", meeting, "meetingNotes"));
      records.prayers.forEach(prayer => addAiContextCandidate(context, "Active prayer request", prayer, "prayerRequests"));
      records.tasks.forEach(task => addAiContextCandidate(context, "Open follow-up task", task, "tasks"));
      return context;
    }

    function personBriefingAllowedContext(personId) {
      const records = personBriefingRecordSets(personId);
      return {
        person: records.person && aiRecordAllowedInContext(records.person, "people") ? records.person : null,
        notes: records.notes.filter(note => aiRecordAllowedInContext(note, "notes")),
        meetings: records.meetings.filter(meeting => aiRecordAllowedInContext(meeting, "meetingNotes")),
        prayers: records.prayers.filter(prayer => aiRecordAllowedInContext(prayer, "prayerRequests")),
        tasks: records.tasks.filter(task => aiRecordAllowedInContext(task, "tasks"))
      };
    }

    function followUpDraftPersonForSource(sourceType, sourceRecord) {
      if (!sourceRecord) return null;
      if (sourceType === "person") return sourceRecord;
      return sourceRecord.relatedPersonId ? personById(sourceRecord.relatedPersonId) : null;
    }

    function followUpDraftSourceLabel(sourceType) {
      if (sourceType === "person") return "Person profile";
      if (sourceType === "prayerRequest") return "Prayer request";
      if (sourceType === "meetingNote") return "Meeting note";
      if (sourceType === "followUpTask") return "Follow-up task";
      return "Selected source";
    }

    function buildFollowUpDraftContextReview(sourceType, sourceId) {
      const sourceRecord = aiSourceRecord(sourceType, sourceId);
      const sourceCollection = aiSourceCollectionForType(sourceType);
      const person = followUpDraftPersonForSource(sourceType, sourceRecord);
      const context = {
        used: [],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Unrelated ministry records", tier: "Private", summary: "Not used. Follow-up drafts use only the selected source and related person basics." }
        ],
        warnings: [],
        blocked: false
      };
      addAiContextCandidate(context, followUpDraftSourceLabel(sourceType), sourceRecord, sourceCollection);
      if (!sourceRecord || !aiRecordAllowedInContext(sourceRecord, sourceCollection)) {
        context.blocked = true;
        return context;
      }
      if (person && sourceType !== "person") {
        addAiContextCandidate(context, "Related person basics", person, "people", personBriefingPersonSummary(person));
      }
      if (sourceType === "prayerRequest" && sourceRecord.sensitivityLevel === "Sensitive" && aiRecordAllowedInContext(sourceRecord, "prayerRequests")) {
        context.warnings.push("This draft references a sensitive prayer request. Avoid naming details unless the person clearly expects that privacy.");
      }
      return context;
    }

    function followUpDraftAllowedContext(sourceType, sourceId) {
      const sourceRecord = aiSourceRecord(sourceType, sourceId);
      const sourceCollection = aiSourceCollectionForType(sourceType);
      const person = followUpDraftPersonForSource(sourceType, sourceRecord);
      return {
        sourceType,
        sourceCollection,
        source: sourceRecord && aiRecordAllowedInContext(sourceRecord, sourceCollection) ? sourceRecord : null,
        person: person && aiRecordAllowedInContext(person, "people") ? person : null
      };
    }

    function prayerStewardPrayerSummary(prayer) {
      const person = personById(prayer.relatedPersonId);
      const personName = person ? person.name : "Unlinked person";
      const followUp = prayer.followUpDate ? ` | follow-up ${dateLabel(prayer.followUpDate)}` : "";
      return `${personName} | ${prayer.status} | added ${dateLabel(prayer.dateAdded)}${followUp} | ${prayer.request || "No request text"}`;
    }

    function prayerStewardCounts(prayers = db.prayerRequests) {
      const today = todayISO();
      return {
        total: prayers.length,
        active: prayers.filter(prayer => prayer.status === "Active").length,
        followUpNeeded: prayers.filter(prayer => prayer.status === "Follow-Up Needed").length,
        answered: prayers.filter(prayer => prayer.status === "Answered").length,
        archived: prayers.filter(prayer => prayer.status === "Archived").length,
        sensitive: prayers.filter(prayer => prayer.sensitivityLevel === "Sensitive").length,
        oldActive: prayers.filter(prayer => prayer.status === "Active" && prayer.dateAdded && prayer.dateAdded < daysAgo(30)).length,
        overdueFollowUps: prayers.filter(prayer => prayer.followUpDate && prayer.followUpDate < today && prayer.status !== "Archived").length,
        unlinked: prayers.filter(prayer => !prayer.relatedPersonId || !personById(prayer.relatedPersonId)).length
      };
    }

    function prayerStewardCountsSummary(counts) {
      return `${counts.total} total | ${counts.active} active | ${counts.followUpNeeded} follow-up needed | ${counts.answered} answered | ${counts.archived} archived | ${counts.sensitive} sensitive | ${counts.oldActive} older than 30 days | ${counts.overdueFollowUps} overdue follow-ups | ${counts.unlinked} unlinked`;
    }

    function prayerStewardDuplicateKey(prayer) {
      return String(prayer.request || "")
        .toLowerCase()
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim()
        .slice(0, 90);
    }

    function prayerStewardDuplicateGroups(prayers) {
      const groups = new Map();
      prayers.forEach(prayer => {
        const key = `${prayer.relatedPersonId || "unlinked"}:${prayerStewardDuplicateKey(prayer)}`;
        if (!prayerStewardDuplicateKey(prayer)) return;
        const current = groups.get(key) || [];
        current.push(prayer);
        groups.set(key, current);
      });
      return Array.from(groups.values()).filter(group => group.length > 1);
    }

    function prayerStewardLooksSensitive(prayer) {
      return /\b(confidential|private|do not share|pastoral|abuse|trauma|suicid|self[- ]?harm|addiction|divorce|affair|counseling)\b/i.test(prayer.request || "");
    }

    function prayerStewardFindings(prayers) {
      const today = todayISO();
      const activeOlderThan30 = prayers.filter(prayer => prayer.status === "Active" && prayer.dateAdded && prayer.dateAdded < daysAgo(30));
      const overdueFollowUps = prayers.filter(prayer => prayer.followUpDate && prayer.followUpDate < today && prayer.status !== "Archived");
      const answeredReadyToArchive = prayers.filter(prayer => prayer.status === "Answered" && !prayer.archivedAt);
      const sensitiveShareWarnings = prayers.filter(prayer =>
        prayer.sensitivityLevel === "Sensitive" ||
        prayerStewardLooksSensitive(prayer) ||
        (prayer.shareableStatus && prayer.shareableStatus !== "Private" && prayer.sensitivityLevel === "Sensitive")
      );
      const duplicateLooking = prayerStewardDuplicateGroups(prayers);
      const noRelatedPerson = prayers.filter(prayer => !prayer.relatedPersonId || !personById(prayer.relatedPersonId));
      return { activeOlderThan30, overdueFollowUps, answeredReadyToArchive, sensitiveShareWarnings, duplicateLooking, noRelatedPerson };
    }

    function prayerStewardSelectedPrayers(findings) {
      const selected = [
        ...findings.activeOlderThan30,
        ...findings.overdueFollowUps,
        ...findings.answeredReadyToArchive,
        ...findings.sensitiveShareWarnings,
        ...findings.duplicateLooking.flat(),
        ...findings.noRelatedPerson
      ];
      return Array.from(new Map(selected.map(prayer => [prayer.id, prayer])).values()).slice(0, 12);
    }

    function buildPrayerStewardContextReview() {
      const counts = prayerStewardCounts(db.prayerRequests);
      const includedPrayers = db.prayerRequests.filter(prayer => aiRecordAllowedInContext(prayer, "prayerRequests"));
      const excludedPrayers = db.prayerRequests.filter(prayer => !aiRecordAllowedInContext(prayer, "prayerRequests"));
      const findings = prayerStewardFindings(includedPrayers);
      const selected = prayerStewardSelectedPrayers(findings);
      const context = {
        used: [
          { label: "Prayer request counts", tier: "Normal", summary: prayerStewardCountsSummary(counts) }
        ],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Unrelated non-prayer records", tier: "Private", summary: "Not used. Prayer Steward audits prayer requests only." }
        ],
        warnings: [],
        blocked: false,
        findings
      };
      selected.forEach(prayer => addAiContextCandidate(context, "Selected prayer request summary", prayer, "prayerRequests", prayerStewardPrayerSummary(prayer)));
      excludedPrayers.slice(0, 6).forEach(prayer => {
        const tier = aiPrivacyTierForRecord(prayer, "prayerRequests");
        context.notUsed.push({
          label: "Excluded prayer request",
          tier,
          summary: `${personById(prayer.relatedPersonId)?.name || "Unlinked person"} | ${prayer.status} (${aiContextBlockReason(tier)})`
        });
      });
      if (excludedPrayers.some(prayer => aiPrivacyTierForRecord(prayer, "prayerRequests") === "Do Not Send to AI")) {
        context.warnings.push("Some prayer requests are marked Do Not Send to AI and are excluded from the steward audit.");
      }
      if (counts.sensitive) {
        context.warnings.push("Sensitive prayer requests should not appear in shareable content.");
      }
      if (findings.sensitiveShareWarnings.length) {
        context.warnings.push("Included sensitive-looking prayer requests need careful handling before sharing or drafting.");
      }
      return context;
    }

    const DATA_JANITOR_COLLECTIONS = ["people", "quickGrabs", "prayerRequests", "tasks", "notes", "meetingNotes", "aiProposals"];

    function dataJanitorCollectionLabel(collection) {
      return {
        people: "People",
        quickGrabs: "Quick Grabs",
        prayerRequests: "Prayer Requests",
        tasks: "Follow-Up Tasks",
        notes: "Notes",
        meetingNotes: "Meeting Notes",
        aiProposals: "AI Review proposals"
      }[collection] || labelFromCamel(collection);
    }

    function dataJanitorCollectionSummary(collection, allowed, blocked) {
      return `${allowed.length} inspected, ${blocked.length} excluded from ${dataJanitorCollectionLabel(collection).toLowerCase()}.`;
    }

    function dataJanitorPrivacyTierForRecord(record, collection) {
      const tier = aiPrivacyTierForRecord(record, collection);
      if (collection === "aiProposals" && tier === "Normal") {
        if (record?.sensitivityRisk === "high") return "Sensitive";
        if (record?.sensitivityRisk === "medium") return "Private";
      }
      return tier;
    }

    function dataJanitorRecordAllowedInContext(record, collection) {
      const tier = dataJanitorPrivacyTierForRecord(record, collection);
      if (tier === "Do Not Send to AI") return false;
      if (tier === "Highly Sensitive") return settings?.aiAllowHighlySensitive === true;
      if (tier === "Sensitive") return settings?.aiAllowSensitive === true;
      return true;
    }

    function dataJanitorAllowedRecordsByCollection() {
      return DATA_JANITOR_COLLECTIONS.reduce((memo, collection) => {
        const records = Array.isArray(db[collection]) ? db[collection] : [];
        memo[collection] = {
          all: records,
          allowed: records.filter(record => dataJanitorRecordAllowedInContext(record, collection)),
          blocked: records.filter(record => !dataJanitorRecordAllowedInContext(record, collection))
        };
        return memo;
      }, {});
    }

    function buildDataJanitorContextReview() {
      const recordsByCollection = dataJanitorAllowedRecordsByCollection();
      const context = {
        used: [],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." }
        ],
        warnings: [],
        blocked: false,
        recordsByCollection
      };
      DATA_JANITOR_COLLECTIONS.forEach(collection => {
        const group = recordsByCollection[collection];
        const sensitive = group.all.filter(record => ["Sensitive", "Highly Sensitive"].includes(dataJanitorPrivacyTierForRecord(record, collection)));
        const privateCount = group.all.filter(record => dataJanitorPrivacyTierForRecord(record, collection) === "Private").length;
        const tier = sensitive.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Highly Sensitive")
          ? "Highly Sensitive"
          : sensitive.length
            ? "Sensitive"
            : privateCount
              ? "Private"
              : "Normal";
        context.used.push({
          label: dataJanitorCollectionLabel(collection),
          tier,
          summary: dataJanitorCollectionSummary(collection, group.allowed, group.blocked)
        });
        group.blocked.slice(0, 4).forEach(record => {
          const blockedTier = dataJanitorPrivacyTierForRecord(record, collection);
          context.notUsed.push({
            label: `${dataJanitorCollectionLabel(collection)} excluded`,
            tier: blockedTier,
            summary: `${aiRecordPreview(record, collection)} (${aiContextBlockReason(blockedTier)})`
          });
        });
        if (group.blocked.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Do Not Send to AI")) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} marked Do Not Send to AI were excluded from cleanup review.`);
        }
        if (sensitive.length) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} includes ${sensitive.length} Sensitive or Highly Sensitive item${sensitive.length === 1 ? "" : "s"}. Those records are blocked unless the matching AI privacy setting is enabled.`);
        }
      });
      return context;
    }

    function dataJanitorDateBefore(value, cutoff) {
      const text = String(value || "").slice(0, 10);
      return /^\d{4}-\d{2}-\d{2}$/.test(text) && text < cutoff;
    }

    function dataJanitorLooksSensitiveText(value) {
      return /\b(confidential|private|do not share|pastoral|abuse|trauma|suicid|self[- ]?harm|addiction|porn|pregnan|divorce|affair|counseling|mental health|depression|anxiety|grief|hospital)\b/i.test(value || "");
    }

    function dataJanitorDuplicatePeople(people) {
      const pairs = [];
      for (let i = 0; i < people.length; i += 1) {
        for (let j = i + 1; j < people.length; j += 1) {
          const a = people[i];
          const b = people[j];
          const an = normalizedName(a.name);
          const bn = normalizedName(b.name);
          const sameFirst = an.split(" ")[0] && an.split(" ")[0] === bn.split(" ")[0];
          const close = levenshtein(an, bn) <= 3 || an.includes(bn) || bn.includes(an);
          if (sameFirst || close) pairs.push([a, b]);
        }
      }
      return pairs.slice(0, 12);
    }

    function dataJanitorPersonLabel(person) {
      return `${person.name || "Unnamed person"}${person.personType ? ` - ${person.personType}` : ""}`;
    }

    function dataJanitorRecordOwner(record) {
      return personById(record.relatedPersonId)?.name || "Unlinked person";
    }

    function dataJanitorFindings(recordsByCollection) {
      const today = todayISO();
      const people = recordsByCollection.people.allowed;
      const quickGrabs = recordsByCollection.quickGrabs.allowed;
      const prayerRequests = recordsByCollection.prayerRequests.allowed;
      const tasks = recordsByCollection.tasks.allowed;
      const notes = recordsByCollection.notes.allowed;
      const meetingNotes = recordsByCollection.meetingNotes.allowed;
      const aiProposals = recordsByCollection.aiProposals.allowed;
      const donorPeople = people.filter(person =>
        person.personType === "Donor" ||
        /donor|supporter|alumni/i.test(`${person.personType || ""} ${person.rufInvolvement || ""} ${person.donorStatus || ""}`)
      );
      return {
        duplicatePeople: dataJanitorDuplicatePeople(people),
        missingCareLevel: people.filter(person => !String(person.careLevel || "").trim()),
        missingPreferredContact: people.filter(person => !String(person.preferredContactMethod || "").trim()),
        missingFollowUpFields: people.filter(person => !person.nextFollowUpDate && !String(person.followUpReason || "").trim()),
        staleNextFollowUp: people.filter(person => person.nextFollowUpDate && dataJanitorDateBefore(person.nextFollowUpDate, today)),
        activeNoRecentInteraction: people.filter(person => person.status === "Active" && (!person.lastMeaningfulInteraction || dataJanitorDateBefore(person.lastMeaningfulInteraction, daysAgo(60)))),
        staleQuickGrabs: quickGrabs.filter(grab => !["Done", "Converted", "Archived"].includes(grab.status) && dataJanitorDateBefore(grab.createdAt, daysAgo(14))),
        longNeedsProcessing: quickGrabs.filter(grab => grab.status === "Needs Processing" && dataJanitorDateBefore(grab.createdAt, daysAgo(7))),
        overdueTasks: tasks.filter(task => task.status !== "Done / Archived" && dataJanitorDateBefore(task.dueDate, today)),
        prayerFollowUpNoDate: prayerRequests.filter(prayer => prayer.status === "Follow-Up Needed" && !prayer.followUpDate),
        oldActivePrayers: prayerRequests.filter(prayer => prayer.status === "Active" && dataJanitorDateBefore(prayer.dateAdded, daysAgo(30))),
        answeredReadyToArchive: prayerRequests.filter(prayer => prayer.status === "Answered" && !prayer.archivedAt),
        sensitiveLookingNotes: notes.filter(note => !note.sensitiveFlag && dataJanitorLooksSensitiveText(note.content)),
        sensitiveLookingMeetings: meetingNotes.filter(meeting => !meeting.sensitiveFlag && dataJanitorLooksSensitiveText(`${meeting.whatWeTalkedAbout || ""} ${meeting.whatToRemember || ""} ${meeting.prayerRequestText || ""}`)),
        donorMissingStatus: donorPeople.filter(person => !String(person.donorStatus || "").trim()),
        donorNeedsContact: donorPeople.filter(person => (!person.lastMeaningfulInteraction || dataJanitorDateBefore(person.lastMeaningfulInteraction, daysAgo(90))) && !person.nextFollowUpDate),
        unlinkedRecords: [
          ...notes.filter(note => !note.relatedPersonId).map(record => ({ collection: "notes", record })),
          ...meetingNotes.filter(meeting => !meeting.relatedPersonId).map(record => ({ collection: "meetingNotes", record })),
          ...prayerRequests.filter(prayer => !prayer.relatedPersonId).map(record => ({ collection: "prayerRequests", record })),
          ...tasks.filter(task => !task.relatedPersonId).map(record => ({ collection: "tasks", record })),
          ...quickGrabs.filter(grab => grab.category === "People" && !grab.relatedPersonId).map(record => ({ collection: "quickGrabs", record }))
        ],
        oldPendingAiProposals: aiProposals.filter(proposal => ["pending", "edited"].includes(proposal.status) && dataJanitorDateBefore(proposal.updatedAt || proposal.createdAt, daysAgo(30)))
      };
    }

    function dataJanitorResultSummary(findings, contextReview) {
      const countsSummary = DATA_JANITOR_COLLECTIONS
        .map(collection => {
          const group = contextReview.recordsByCollection[collection];
          return `${dataJanitorCollectionLabel(collection)}: ${group.allowed.length}/${group.all.length}`;
        })
        .join(" | ");
      return {
        countsSummary,
        duplicatePeople: findings.duplicatePeople.map(([a, b]) => `${a.name} / ${b.name}`),
        peopleProfileGaps: [
          ...findings.missingCareLevel.map(person => `${dataJanitorPersonLabel(person)} - missing care level.`),
          ...findings.missingPreferredContact.map(person => `${dataJanitorPersonLabel(person)} - missing preferred contact method.`),
          ...findings.missingFollowUpFields.map(person => `${dataJanitorPersonLabel(person)} - missing useful follow-up fields.`)
        ],
        staleFollowUps: [
          ...findings.staleNextFollowUp.map(person => `${dataJanitorPersonLabel(person)} - next follow-up was ${dateLabel(person.nextFollowUpDate)}.`),
          ...findings.activeNoRecentInteraction.map(person => `${dataJanitorPersonLabel(person)} - active with no recent meaningful interaction.`)
        ],
        quickGrabCleanup: [
          ...findings.staleQuickGrabs.map(grab => `${dateLabel(grab.createdAt)} - ${grab.status} - ${grab.rawContent}`),
          ...findings.longNeedsProcessing.map(grab => `${dateLabel(grab.createdAt)} - Needs Processing for a while - ${grab.rawContent}`)
        ],
        taskCleanup: findings.overdueTasks.map(task => `${dataJanitorRecordOwner(task)} - ${task.title} - due ${dateLabel(task.dueDate)}.`),
        prayerCleanup: [
          ...findings.prayerFollowUpNoDate.map(prayer => `${dataJanitorRecordOwner(prayer)} - Follow-Up Needed with no follow-up date.`),
          ...findings.oldActivePrayers.map(prayer => `${dataJanitorRecordOwner(prayer)} - active prayer older than 30 days.`),
          ...findings.answeredReadyToArchive.map(prayer => `${dataJanitorRecordOwner(prayer)} - answered prayer ready to archive after review.`)
        ],
        sensitiveReview: [
          ...findings.sensitiveLookingNotes.map(note => `${dataJanitorRecordOwner(note)} - note may be sensitive.`),
          ...findings.sensitiveLookingMeetings.map(meeting => `${dataJanitorRecordOwner(meeting)} - meeting note may be sensitive.`)
        ],
        donorCareCleanup: [
          ...findings.donorMissingStatus.map(person => `${dataJanitorPersonLabel(person)} - missing donor status.`),
          ...findings.donorNeedsContact.map(person => `${dataJanitorPersonLabel(person)} - donor care may need contact or follow-up.`)
        ],
        unlinkedRecords: findings.unlinkedRecords.map(item => `${dataJanitorCollectionLabel(item.collection)} - ${aiRecordPreview(item.record, item.collection)}`),
        oldAiProposals: findings.oldPendingAiProposals.map(proposal => `${proposal.title || "Untitled proposal"} - ${labelFromCamel(proposal.status)} since ${dateLabel(proposal.updatedAt || proposal.createdAt)}.`)
      };
    }

    function buildDataJanitorProposedActions(findings) {
      const actions = [];
      findings.duplicatePeople.slice(0, 5).forEach(([a, b]) => {
        actions.push({
          actionType: "mergePeopleSuggestion",
          reviewOnly: true,
          label: `Review possible duplicate people: ${a.name} / ${b.name}`,
          fromPersonId: a.id,
          toPersonId: b.id
        });
      });
      findings.missingCareLevel.slice(0, 5).forEach(person => {
        actions.push({ actionType: "updatePerson", reviewOnly: true, personId: person.id, label: `Choose a care level for ${person.name}` });
      });
      findings.missingPreferredContact.slice(0, 5).forEach(person => {
        actions.push({ actionType: "updatePerson", reviewOnly: true, personId: person.id, label: `Add a preferred contact method for ${person.name}` });
      });
      findings.missingFollowUpFields.slice(0, 5).forEach(person => {
        actions.push({ actionType: "updatePerson", reviewOnly: true, personId: person.id, label: `Add follow-up fields for ${person.name}` });
      });
      [...findings.staleNextFollowUp, ...findings.activeNoRecentInteraction].slice(0, 6).forEach(person => {
        actions.push({
          actionType: "createFollowUpTask",
          relatedPersonId: person.id,
          title: `Review follow-up for ${person.name}`,
          dueDate: daysFromNow(3),
          label: `Create a follow-up review task for ${person.name}`
        });
      });
      [...findings.staleQuickGrabs, ...findings.longNeedsProcessing].slice(0, 6).forEach(grab => {
        actions.push({
          actionType: "noAction",
          label: `Review stale Quick Grab: ${grab.rawContent.slice(0, 80)}`,
          quickGrabId: grab.id
        });
      });
      findings.overdueTasks.slice(0, 6).forEach(task => {
        actions.push({ actionType: "noAction", label: `Review overdue task: ${task.title}`, taskId: task.id });
      });
      findings.prayerFollowUpNoDate.slice(0, 5).forEach(prayer => {
        actions.push({
          actionType: "updatePrayerRequest",
          reviewOnly: true,
          prayerRequestId: prayer.id,
          followUpDate: daysFromNow(7),
          label: `Set a follow-up date for ${dataJanitorRecordOwner(prayer)}`
        });
      });
      findings.oldActivePrayers.slice(0, 5).forEach(prayer => {
        actions.push({
          actionType: "createFollowUpTask",
          relatedPrayerRequestId: prayer.id,
          relatedPersonId: prayer.relatedPersonId || "",
          title: `Review old active prayer for ${dataJanitorRecordOwner(prayer)}`,
          dueDate: daysFromNow(3),
          label: `Create follow-up task for old active prayer: ${dataJanitorRecordOwner(prayer)}`
        });
      });
      findings.answeredReadyToArchive.slice(0, 5).forEach(prayer => {
        actions.push({ actionType: "archiveItem", reviewOnly: true, prayerRequestId: prayer.id, label: `Review answered prayer for archive: ${dataJanitorRecordOwner(prayer)}` });
      });
      findings.sensitiveLookingNotes.slice(0, 5).forEach(note => {
        actions.push({ actionType: "markSensitive", reviewOnly: true, collection: "notes", recordId: note.id, label: `Review sensitive-looking note for ${dataJanitorRecordOwner(note)}` });
      });
      findings.sensitiveLookingMeetings.slice(0, 5).forEach(meeting => {
        actions.push({ actionType: "markSensitive", reviewOnly: true, collection: "meetingNotes", recordId: meeting.id, label: `Review sensitive-looking meeting note for ${dataJanitorRecordOwner(meeting)}` });
      });
      findings.donorMissingStatus.slice(0, 5).forEach(person => {
        actions.push({ actionType: "updatePerson", reviewOnly: true, personId: person.id, label: `Review donor status for ${person.name}` });
      });
      findings.donorNeedsContact.slice(0, 5).forEach(person => {
        actions.push({
          actionType: "createFollowUpTask",
          relatedPersonId: person.id,
          title: `Check in with donor ${person.name}`,
          dueDate: daysFromNow(7),
          label: `Create donor care follow-up for ${person.name}`
        });
      });
      findings.unlinkedRecords.slice(0, 8).forEach(item => {
        actions.push({ actionType: "noAction", label: `Review unlinked ${dataJanitorCollectionLabel(item.collection).toLowerCase()}: ${aiRecordPreview(item.record, item.collection)}` });
      });
      findings.oldPendingAiProposals.slice(0, 5).forEach(proposal => {
        actions.push({ actionType: "archiveItem", reviewOnly: true, aiProposalId: proposal.id, label: `Review old AI proposal for archive: ${proposal.title || "Untitled proposal"}` });
      });
      if (!actions.length) actions.push({ actionType: "noAction", label: "No cleanup issue needs attention right now." });
      return actions.slice(0, 40);
    }

    function dataJanitorIssueCount(summary) {
      return Object.entries(summary)
        .filter(([key, value]) => key !== "countsSummary" && Array.isArray(value))
        .reduce((total, [, items]) => total + items.length, 0);
    }

    const WEEKLY_RESET_COLLECTIONS = ["quickGrabs", "tasks", "people", "prayerRequests", "aiProposals"];

    function weeklyResetAllowedRecordsByCollection() {
      return WEEKLY_RESET_COLLECTIONS.reduce((memo, collection) => {
        const records = Array.isArray(db[collection]) ? db[collection] : [];
        memo[collection] = {
          all: records,
          allowed: records.filter(record => dataJanitorRecordAllowedInContext(record, collection)),
          blocked: records.filter(record => !dataJanitorRecordAllowedInContext(record, collection))
        };
        return memo;
      }, {});
    }

    function weeklyResetMaxTier(records, collection) {
      const tiers = records.map(record => dataJanitorPrivacyTierForRecord(record, collection));
      if (tiers.includes("Highly Sensitive")) return "Highly Sensitive";
      if (tiers.includes("Sensitive")) return "Sensitive";
      if (tiers.includes("Private")) return "Private";
      return "Normal";
    }

    function weeklyResetFindings(recordsByCollection) {
      const today = todayISO();
      const soon = daysFromNow(7);
      const people = recordsByCollection.people.allowed;
      const quickGrabs = recordsByCollection.quickGrabs.allowed;
      const prayerRequests = recordsByCollection.prayerRequests.allowed;
      const tasks = recordsByCollection.tasks.allowed;
      const aiProposals = recordsByCollection.aiProposals.allowed;
      const openQuickGrabStatuses = ["New", "Needs Processing", "Prompt Me"];
      const activePeople = people.filter(person => person.status === "Active" || !person.status);
      return {
        openQuickGrabs: quickGrabs
          .filter(grab => openQuickGrabStatuses.includes(grab.status))
          .sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "")),
        staleQuickGrabs: quickGrabs
          .filter(grab => !["Done", "Converted", "Archived"].includes(grab.status) && dataJanitorDateBefore(grab.createdAt, daysAgo(7)))
          .sort((a, b) => (a.createdAt || "").localeCompare(b.createdAt || "")),
        dueFollowUpTasks: tasks
          .filter(task => task.status !== "Done / Archived" && task.dueDate && String(task.dueDate).slice(0, 10) <= today)
          .sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || "")),
        peopleNeedingCare: activePeople
          .filter(person => (person.nextFollowUpDate && String(person.nextFollowUpDate).slice(0, 10) <= soon) || !person.lastMeaningfulInteraction || dataJanitorDateBefore(person.lastMeaningfulInteraction, daysAgo(45)))
          .sort((a, b) => String(a.nextFollowUpDate || "9999-99-99").localeCompare(String(b.nextFollowUpDate || "9999-99-99"))),
        activePrayerRequests: prayerRequests.filter(prayer => prayer.status === "Active"),
        prayerRequestsNeedingFollowUp: prayerRequests
          .filter(prayer => prayer.status === "Follow-Up Needed" || (prayer.followUpDate && String(prayer.followUpDate).slice(0, 10) <= today && !["Answered", "Archived"].includes(prayer.status)))
          .sort((a, b) => String(a.followUpDate || "9999-99-99").localeCompare(String(b.followUpDate || "9999-99-99"))),
        answeredPrayerRequests: prayerRequests.filter(prayer => prayer.status === "Answered" && !prayer.archivedAt),
        duplicatePeople: dataJanitorDuplicatePeople(people),
        pendingAiProposals: aiProposals.filter(proposal => ["pending", "edited"].includes(proposal.status)),
        sensitiveLookingPrayerRequests: prayerRequests.filter(prayer =>
          aiPrivacyTierForRecord(prayer, "prayerRequests") === "Normal" && dataJanitorLooksSensitiveText(prayer.request || "")
        ),
        backupReminderDue: backupReminderDue(),
        appCoachSuggestions: appCoachSuggestions().slice(0, 5)
      };
    }

    function weeklyResetContextSummary(recordsByCollection, findings) {
      return [
        `Open Quick Grabs: ${findings.openQuickGrabs.length}`,
        `Stale Quick Grabs: ${findings.staleQuickGrabs.length}`,
        `Due follow-up tasks: ${findings.dueFollowUpTasks.length}`,
        `People needing care: ${findings.peopleNeedingCare.length}`,
        `Active prayer requests: ${findings.activePrayerRequests.length}`,
        `Prayer requests needing follow-up: ${findings.prayerRequestsNeedingFollowUp.length}`,
        `Answered prayer requests: ${findings.answeredPrayerRequests.length}`,
        `Possible duplicate people: ${findings.duplicatePeople.length}`,
        `Pending AI proposals: ${findings.pendingAiProposals.length}`,
        `Backup status: ${findings.backupReminderDue ? "backup appears due" : "backup reminder is current or off"}`,
        `App Coach suggestions: ${findings.appCoachSuggestions.length}`
      ].join(" | ");
    }

    function weeklyResetRecordOwner(record) {
      const person = personById(record?.relatedPersonId);
      if (!person) return "Unlinked person";
      if (!dataJanitorRecordAllowedInContext(person, "people")) return "Related person excluded";
      return person.name || "Unnamed person";
    }

    function buildWeeklyResetContextReview() {
      const recordsByCollection = weeklyResetAllowedRecordsByCollection();
      const findings = weeklyResetFindings(recordsByCollection);
      const context = {
        used: [
          {
            label: "Open Quick Grabs",
            tier: weeklyResetMaxTier(recordsByCollection.quickGrabs.allowed, "quickGrabs"),
            summary: `${findings.openQuickGrabs.length} open, ${findings.staleQuickGrabs.length} stale.`
          },
          {
            label: "Due follow-up tasks",
            tier: weeklyResetMaxTier(recordsByCollection.tasks.allowed, "tasks"),
            summary: `${findings.dueFollowUpTasks.length} due or overdue task${findings.dueFollowUpTasks.length === 1 ? "" : "s"}.`
          },
          {
            label: "People needing care",
            tier: weeklyResetMaxTier(recordsByCollection.people.allowed, "people"),
            summary: `${findings.peopleNeedingCare.length} person${findings.peopleNeedingCare.length === 1 ? "" : "s"} with a due, stale, or missing care rhythm.`
          },
          {
            label: "Prayer reset priorities",
            tier: weeklyResetMaxTier(recordsByCollection.prayerRequests.allowed, "prayerRequests"),
            summary: `${findings.activePrayerRequests.length} active, ${findings.prayerRequestsNeedingFollowUp.length} needing follow-up, ${findings.answeredPrayerRequests.length} answered.`
          },
          {
            label: "Possible duplicate people count",
            tier: "Normal",
            summary: `${findings.duplicatePeople.length} possible duplicate pair${findings.duplicatePeople.length === 1 ? "" : "s"}.`
          },
          {
            label: "Backup status",
            tier: "Normal",
            summary: findings.backupReminderDue ? `Backup appears due. ${backupStatusText()}` : `Backup reminder is current or off. ${backupStatusText()}`
          },
          {
            label: "App Coach suggestions",
            tier: "Normal",
            summary: `${findings.appCoachSuggestions.length} local suggestion${findings.appCoachSuggestions.length === 1 ? "" : "s"} considered.`
          },
          {
            label: "Pending AIProposals",
            tier: weeklyResetMaxTier(recordsByCollection.aiProposals.allowed, "aiProposals"),
            summary: `${findings.pendingAiProposals.length} pending or edited proposal${findings.pendingAiProposals.length === 1 ? "" : "s"} may need review.`
          }
        ],
        notUsed: [
          { label: "OpenAI or external model call", tier: "Do Not Send to AI", summary: "Not used. This build is mock mode only." },
          { label: "Backend or cloud sync", tier: "Do Not Send to AI", summary: "Not used. No ministry data leaves this browser." },
          { label: "Notes and meeting notes", tier: "Private", summary: "Not used. Weekly Reset keeps context focused on planning signals." }
        ],
        warnings: [],
        blocked: false,
        recordsByCollection,
        findings
      };
      WEEKLY_RESET_COLLECTIONS.forEach(collection => {
        const group = recordsByCollection[collection];
        group.blocked.slice(0, 4).forEach(record => {
          const tier = dataJanitorPrivacyTierForRecord(record, collection);
          context.notUsed.push({
            label: `${dataJanitorCollectionLabel(collection)} excluded`,
            tier,
            summary: `${aiRecordPreview(record, collection)} (${aiContextBlockReason(tier)})`
          });
        });
        if (group.blocked.some(record => dataJanitorPrivacyTierForRecord(record, collection) === "Do Not Send to AI")) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} marked Do Not Send to AI were excluded from Weekly Reset Agent context.`);
        }
        const sensitiveCount = group.all.filter(record => ["Sensitive", "Highly Sensitive"].includes(dataJanitorPrivacyTierForRecord(record, collection))).length;
        if (sensitiveCount) {
          context.warnings.push(`${dataJanitorCollectionLabel(collection)} includes ${sensitiveCount} Sensitive or Highly Sensitive item${sensitiveCount === 1 ? "" : "s"}; review before using this reset plan.`);
        }
      });
      if (findings.sensitiveLookingPrayerRequests.length) {
        context.warnings.push("Some prayer requests look sensitive and should be handled gently before sharing or summarizing.");
      }
      if (findings.backupReminderDue) {
        context.warnings.push("A backup appears due before larger weekly cleanup.");
      }
      return context;
    }

    function weeklyResetPlanFromFindings(findings, contextReview) {
      const oneFaithfulNextStep = findings.staleQuickGrabs[0]
        ? `Review one stale Quick Grab: ${findings.staleQuickGrabs[0].rawContent || "untitled grab"}.`
