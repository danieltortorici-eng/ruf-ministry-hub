      const captureSource = CAPTURE_SOURCES.includes(source.captureSource) ? source.captureSource : "legacy";
      const captureRevision = Math.max(1, Number.parseInt(source.captureRevision, 10) || 1);
      let processingState = ["unprocessed", "awaitingApproval", "processing", "review", "failed", "saved"]
        .includes(source.processingState)
        ? source.processingState
        : ["Converted", "Done", "Archived"].includes(source.status) ? "saved" : "unprocessed";
      if (processingState === "processing") processingState = "failed";
      return {
        ...source,
        captureSource,
        captureRevision,
        submissionKey: String(source.submissionKey || `${captureSource}:${source.id || "legacy"}:${captureRevision}`),
        processingState,
        processingError: String(source.processingError || (source.processingState === "processing" ? "Processing was interrupted. Retry when ready." : "")),
        proposalKey: String(source.proposalKey || ""),
        lastProcessingAttemptAt: String(source.lastProcessingAttemptAt || ""),
        personLocked: source.personLocked === true
      };
    }

    function emptyData() {
      return {
        dataSchemaVersion: DATA_SCHEMA_VERSION,
        people: [],
        quickGrabs: [],
        notes: [],
        meetingNotes: [],
        prayerRequests: [],
        tasks: [],
        aiProposals: []
      };
    }

    function hasHistoricalDataShape(value) {
      return Boolean(value && typeof value === "object" && !Array.isArray(value)
        && CORE_DATA_COLLECTIONS.every(collection => Array.isArray(value[collection])));
    }

    function classifyStoredDataSchema(value) {
      if (!hasHistoricalDataShape(value)) {
        throw new Error("Saved ministry data is structurally incomplete.");
      }
      const present = Object.prototype.hasOwnProperty.call(value, "dataSchemaVersion");
      const schemaVersion = present ? value.dataSchemaVersion : null;
      if (present && !(
        typeof schemaVersion === "number"
        && Number.isFinite(schemaVersion)
        && Number.isInteger(schemaVersion)
        && (schemaVersion === 2 || schemaVersion === DATA_SCHEMA_VERSION)
      )) {
        const error = new Error("Saved ministry data schema is not supported.");
        error.code = "UNSUPPORTED_STORED_DATA_SCHEMA";
        throw error;
      }
      return { schemaVersion, present };
    }

    function isUnsupportedStoredDataSchemaError(error) {
      return error?.code === "UNSUPPORTED_STORED_DATA_SCHEMA";
    }

    function hasCurrentDataShape(value) {
      return Boolean(isPlainBackupObject(value)
        && value.dataSchemaVersion === DATA_SCHEMA_VERSION
        && DATA_COLLECTIONS.every(collection => Array.isArray(value[collection])));
    }

    function isPlainBackupObject(value) {
      if (!value || typeof value !== "object" || Array.isArray(value)) return false;
      const prototype = Object.getPrototypeOf(value);
      return prototype === Object.prototype || prototype === null;
    }

    function assertSafeBackupId(value, label) {
      if (value === "") return;
      if (typeof value !== "string" || !SAFE_BACKUP_ID_PATTERN.test(value)) {
        throw new Error(`${label} contains an unsafe identifier.`);
      }
    }

    function validateBackupNode(value, path, state, depth = 0) {
      state.nodes += 1;
      if (state.nodes > MAX_BACKUP_NODES) throw new Error("Backup contains too much nested data.");
      if (depth > MAX_BACKUP_DEPTH) throw new Error("Backup data is nested too deeply.");
      if (typeof value === "string") {
        if (value.length > MAX_BACKUP_STRING_CHARS) throw new Error(`${path} is too large.`);
        return;
      }
      if (value === null || ["boolean", "number"].includes(typeof value)) return;
      if (Array.isArray(value)) {
        value.forEach((item, index) => validateBackupNode(item, `${path}[${index}]`, state, depth + 1));
        return;
      }
      if (!isPlainBackupObject(value)) throw new Error(`${path} must be plain JSON data.`);
      Object.entries(value).forEach(([key, item]) => {
        if (["__proto__", "prototype", "constructor"].includes(key)) throw new Error(`${path}.${key} is not allowed.`);
        if (/Id$/.test(key) && typeof item === "string") assertSafeBackupId(item, `${path}.${key}`);
        if (/Ids$/.test(key) && Array.isArray(item)) item.forEach((id, index) => assertSafeBackupId(id, `${path}.${key}[${index}]`));
        validateBackupNode(item, `${path}.${key}`, state, depth + 1);
      });
    }

    function classifyPortableBackupSchema(payload) {
      if (!isPlainBackupObject(payload)) throw new Error("Backup must be a JSON object.");
      if (payload.app !== "RUF Ministry Hub" || payload.version !== 2) {
        throw new Error("Backup app or version is not supported.");
      }
      if (!isPlainBackupObject(payload.data)) throw new Error("Backup data is missing.");
      const topPresent = Object.prototype.hasOwnProperty.call(payload, "dataSchemaVersion");
      const nestedPresent = Object.prototype.hasOwnProperty.call(payload.data, "dataSchemaVersion");
      const topVersion = topPresent ? payload.dataSchemaVersion : null;
      const nestedVersion = nestedPresent ? payload.data.dataSchemaVersion : null;
      const supportedVersion = value => typeof value === "number"
        && Number.isFinite(value)
        && Number.isInteger(value)
        && (value === 2 || value === DATA_SCHEMA_VERSION);
      if (
        (topPresent && !supportedVersion(topVersion))
        || (nestedPresent && !supportedVersion(nestedVersion))
        || (topPresent && nestedPresent && topVersion !== nestedVersion)
      ) {
        throw new Error("Backup data schema is not supported.");
      }
      return {
        schemaVersion: topPresent ? topVersion : nestedPresent ? nestedVersion : null,
        topPresent,
        nestedPresent
      };
    }

    function validateBackupPayload(payload) {
      classifyPortableBackupSchema(payload);
      const expectedCollections = DATA_COLLECTIONS;
      let totalRecords = 0;
      const seenIds = new Set();
      expectedCollections.forEach(collection => {
        const records = collection === "aiProposals" && payload.data[collection] === undefined ? [] : payload.data[collection];
        if (!Array.isArray(records)) throw new Error(`Backup collection ${collection} is missing.`);
        if (records.length > MAX_BACKUP_RECORDS_PER_COLLECTION) throw new Error(`Backup collection ${collection} is too large.`);
        totalRecords += records.length;
        records.forEach((record, index) => {
          if (!isPlainBackupObject(record)) throw new Error(`Backup ${collection}[${index}] must be an object.`);
          if (!record.id) throw new Error(`Backup ${collection}[${index}] is missing an identifier.`);
          assertSafeBackupId(record.id, `Backup ${collection}[${index}].id`);
          if (seenIds.has(record.id)) throw new Error("Backup contains duplicate record identifiers.");
          seenIds.add(record.id);
        });
      });
      if (totalRecords > MAX_BACKUP_TOTAL_RECORDS) throw new Error("Backup contains too many records.");
      ["settings", "customCopy", "autosaveDrafts"].forEach(key => {
        if (payload[key] !== undefined && !isPlainBackupObject(payload[key])) throw new Error(`Backup ${key} must be an object.`);
      });
      validateBackupNode(payload, "backup", { nodes: 0 });
      return payload;
    }

    function assertBackupFileSize(file) {
      const size = Number(file?.size);
      if (Number.isFinite(size) && size > MAX_BACKUP_FILE_BYTES) throw new Error("Backup file is too large.");
    }

    function normalizeData(raw) {
      if (!raw || typeof raw !== "object") throw new Error("Backup data is missing.");
      const normalized = { ...raw };
      DATA_COLLECTIONS.forEach(key => {
        normalized[key] = Array.isArray(raw[key]) ? raw[key] : [];
      });
      normalized.dataSchemaVersion = DATA_SCHEMA_VERSION;
      normalized.quickGrabs = normalized.quickGrabs.map(normalizeQuickGrab);
      normalized.aiProposals = normalizeAiProposals(raw.aiProposals);
      normalized.people.forEach(person => {
        if (!String(person.name || "").trim()) person.name = "Unnamed person";
        if (!("phone" in person)) person.phone = "";
        if (!("photoDataUrl" in person)) person.photoDataUrl = "";
        normalizePersonCare(person);
      });
      return normalized;
    }

    function encryptedVaultExists() {
      try {
        return Boolean(localStorage.getItem(ENCRYPTED_STORAGE_KEY));
      } catch (error) {
        return false;
      }
    }

    function loadSettings() {
      try {
        const raw = localStorage.getItem(SETTINGS_KEY);
        if (raw) {
          initialSettingsNeedsRecovery = false;
          initialSettingsWasInvalid = false;
          return normalizeSettings(JSON.parse(raw));
        }
        initialSettingsNeedsRecovery = true;
        initialSettingsWasInvalid = false;
      } catch (error) {
        initialSettingsNeedsRecovery = true;
        initialSettingsWasInvalid = true;
        console.warn("Could not load Ministry Hub settings", error);
      }
      return normalizeSettings({
        ...DEFAULT_SETTINGS,
        calmMode: localStorage.getItem(CALM_MODE_KEY) !== "off"
      });
    }

    function localStorageSnapshot(keys) {
      const snapshot = new Map();
      keys.forEach(key => {
        try {
          snapshot.set(key, localStorage.getItem(key));
        } catch (error) {
          snapshot.set(key, null);
        }
      });
      return snapshot;
    }

    function restoreLocalStorageSnapshot(snapshot) {
      snapshot.forEach((value, key) => {
        try {
          if (value === null) localStorage.removeItem(key);
          else localStorage.setItem(key, value);
        } catch (error) {
          console.warn(`Could not restore local storage key ${key}`, error);
        }
      });
    }

    function writeLocalStorageBatch(entries) {
      const unique = new Map(entries);
      const snapshot = localStorageSnapshot(Array.from(unique.keys()));
      try {
        unique.forEach((value, key) => {
          if (value === null) localStorage.removeItem(key);
          else localStorage.setItem(key, value);
        });
        return snapshot;
      } catch (error) {
        restoreLocalStorageSnapshot(snapshot);
        throw error;
      }
    }

    function persistPlainRecord(key, value) {
      const snapshot = cloneJson(value);
      try {
        localStorage.setItem(key, JSON.stringify(snapshot));
      } catch (error) {
        console.warn(`Could not save ${key} to local storage; a recovery write was requested.`, error);
        showToast("Local storage is full or unavailable. Your change was not confirmed.", "error");
        throw error;
      }
      // Local storage is the synchronous commit point used at startup. Mirror only
      // after it succeeds so a quota failure cannot leave a newer IndexedDB copy
      // that is silently discarded on the next launch.
      mirrorToIndexedDb(key, snapshot);
    }

    function saveSettings() {
      if (recoveryMutationBlocked()) return false;
      writeLocalStorageBatch([
        [SETTINGS_KEY, JSON.stringify(settings)],
        [CALM_MODE_KEY, settings.calmMode ? "on" : "off"]
      ]);
      mirrorToIndexedDb(SETTINGS_KEY, cloneJson(settings));
      captureAutoMemorySnapshot("Settings update");
      return true;
    }

    function loadCustomCopy() {
      if (settings?.localEncryptionEnabled && encryptedVaultExists()) return {};
      try {
        const raw = localStorage.getItem(COPY_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          initialCopyNeedsRecovery = false;
          initialCopyWasInvalid = false;
          return parsed && typeof parsed === "object" ? parsed : {};
        }
        initialCopyNeedsRecovery = true;
        initialCopyWasInvalid = false;
      } catch (error) {
        initialCopyNeedsRecovery = true;
        initialCopyWasInvalid = true;
        console.warn("Could not load Ministry Hub wording", error);
      }
      return {};
    }

    function saveCustomCopy() {
      if (recoveryMutationBlocked()) return false;
      if (settings?.localEncryptionEnabled) {
        localStorage.removeItem(COPY_KEY);
        captureAutoMemorySnapshot("Wording update");
        scheduleVaultSave();
        return true;
      }
      persistPlainRecord(COPY_KEY, customCopy);
      captureAutoMemorySnapshot("Wording update");
      return true;
    }

    function slugifyCopyKey(value) {
      return String(value).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 60) || "copy";
    }

    function copyText(key, fallback) {
      return customCopy[key] || fallback;
    }

   function editableCopy(key, fallback) {
     const value = copyText(key, fallback);
     if (!settings.editWording) return escapeHtml(value);
      return `<button type="button" class="editable-copy" data-copy-key="${escapeHtml(key)}" data-copy-fallback="${escapeHtml(fallback)}" aria-label="Edit wording: ${escapeHtml(value)}" title="Edit this wording">${escapeHtml(value)}</button>`;
   }

    function maskedText(isSensitive, hiddenText, visibleText) {
      return settings.maskSensitivePreviews && isSensitive ? hiddenText : visibleText;
    }

    function saveData() {
      if (recoveryMutationBlocked()) return false;
      if (settings?.localEncryptionEnabled) {
        localStorage.removeItem(STORAGE_KEY);
        captureAutoMemorySnapshot("Auto save");
        scheduleVaultSave();
        return true;
      }
      persistPlainRecord(STORAGE_KEY, db);
      captureAutoMemorySnapshot("Auto save");
      return true;
    }

    function loadData() {
      if (settings?.localEncryptionEnabled && encryptedVaultExists()) {
        initialDataNeedsRecovery = false;
        initialDataWasInvalid = false;
        initialDataSchemaUnsupported = false;
        return emptyData();
      }
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          classifyStoredDataSchema(parsed);
          initialDataNeedsRecovery = false;
          initialDataWasInvalid = false;
          initialDataSchemaUnsupported = false;
          return normalizeData(parsed);
        }
        initialDataNeedsRecovery = true;
        initialDataWasInvalid = false;
        initialDataSchemaUnsupported = false;
      } catch (error) {
        initialDataNeedsRecovery = true;
        initialDataWasInvalid = true;
        initialDataSchemaUnsupported = isUnsupportedStoredDataSchemaError(error);
        console.warn("Could not load saved Ministry Hub data", error);
        if (initialDataSchemaUnsupported) return emptyData();
      }
      return normalizeData(demoData());
    }

    function canUseIndexedDb() {
      return typeof indexedDB !== "undefined";
    }

    function storageSetTimeout(callback, delay) {
      const schedule = typeof window !== "undefined" && window.setTimeout ? window.setTimeout : setTimeout;
      return schedule(callback, delay);
    }

    function storageClearTimeout(timer) {
      const clear = typeof window !== "undefined" && window.clearTimeout ? window.clearTimeout : clearTimeout;
      clear(timer);
    }

    function vaultFlushLeaseIsCurrent(lease) {
      return Boolean(lease && activeVaultFlushLease === lease && !lease.revoked);
    }

    function restoreVaultFlushLeaseLocalSnapshot(lease) {
      if (!lease?.localCommitted || !lease.localSnapshot) return false;
      restoreLocalStorageSnapshot(lease.localSnapshot);
      lease.localCommitted = false;
      return true;
    }

    function revokeVaultFlushLease(lease) {
      if (!lease || activeVaultFlushLease !== lease) return false;
      if (lease.revoked) return true;
      lease.revoked = true;
      lease.allowFollowup = false;
      trustedRevokedVaultFlushLeaseId = lease.id;
      const transaction = lease.indexedDbTransaction;
      if (lease.localCommitted || (transaction && !lease.indexedDbSettled)) {
        revokedVaultFlushSettlement = {
          leaseId: lease.id,
          recoveryEpoch: lease.recoveryEpoch,
          passphrase: lease.passphrase,
          targetRevision: lease.targetRevision,
          payloadGeneration: lease.payloadGeneration
        };
      } else {
        revokedVaultFlushSettlement = null;
      }
      restoreVaultFlushLeaseLocalSnapshot(lease);
      if (transaction && !lease.indexedDbSettled) {
        try { transaction.abort?.(); } catch (error) {}
      }
      return true;
    }

    function revokeVaultFlushLeaseForRecoverySettlement(settlement) {
      const lease = activeVaultFlushLease;
      if (!lease || !settlement || !recoveryTransactionPending) return false;
      const ownsInitialLease = settlement.initialLeaseId !== null && lease.id === settlement.initialLeaseId;
      const ownsFreshLease = lease.id > settlement.leaseSequenceAtStart
        && lease.recoveryEpoch === settlement.recoveryEpoch;
      if (!ownsInitialLease && !ownsFreshLease) return false;
      if (recoveryEpoch !== settlement.recoveryEpoch
        || vaultPassphrase !== settlement.passphrase
        || vaultSaveRequestedRevision !== settlement.targetRevision
        || vaultPayloadGeneration !== settlement.payloadGeneration
        || lease.passphrase !== settlement.passphrase
        || lease.targetRevision !== settlement.targetRevision
        || lease.payloadGeneration !== settlement.payloadGeneration) return false;
      return revokeVaultFlushLease(lease);
    }

    function settleRecoveryOperationWithinDeadline(operation, label, options = {}) {
      return new Promise((resolve, reject) => {
        let settled = false;
        let timer = null;
        const finish = (callback, value) => {
          if (settled) return;
          settled = true;
          if (timer !== null) storageClearTimeout(timer);
          callback(value);
        };
        timer = storageSetTimeout(() => {
          try { options.onTimeout?.(); } catch (error) {}
          finish(reject, new Error(`${label} timed out.`));
        }, RECOVERY_CRYPTO_DEADLINE_MS);
        Promise.resolve()
          .then(operation)
          .then(value => finish(resolve, value), error => finish(reject, error));
      });
    }

    function openIndexedDb() {
      return new Promise((resolve, reject) => {
        if (!canUseIndexedDb()) {
          reject(new Error("IndexedDB unavailable"));
          return;
        }
        let settled = false;
        const request = indexedDB.open(IDB_NAME, 1);
        const timer = storageSetTimeout(() => {
          if (settled) return;
          settled = true;
          reject(new Error("IndexedDB open timed out."));
        }, IDB_DEADLINE_MS);
        request.onupgradeneeded = () => {
          const database = request.result;
          if (!database.objectStoreNames.contains(IDB_STORE)) database.createObjectStore(IDB_STORE);
        };
        request.onsuccess = () => {
          if (settled) {
            request.result?.close?.();
            return;
          }
          settled = true;
          storageClearTimeout(timer);
          resolve(request.result);
        };
        request.onerror = () => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          reject(request.error || new Error("IndexedDB open failed."));
        };
        request.onblocked = () => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          reject(new Error("IndexedDB open was blocked."));
        };
      });
    }

    function enqueueIndexedDbWork(label, keys, operation, options = {}) {
      if (!canUseIndexedDb()) return Promise.resolve(options.unavailableValue ?? false);
      const sequence = ++indexedDbQueueSequence;
      const affectedKeys = Array.from(new Set(keys || []));
      const tracksFailure = options.tracksFailure !== false;
      indexedDbPendingCount += 1;
      const run = indexedDbQueueTail.then(() => operation());
      const exposed = run.then(value => {
        if (tracksFailure) {
          affectedKeys.forEach(key => {
            const prior = indexedDbFailedKeys.get(key);
            if (!prior || prior.sequence <= sequence) indexedDbFailedKeys.delete(key);
          });
        }
        return value;
      }, error => {
        if (tracksFailure) affectedKeys.forEach(key => indexedDbFailedKeys.set(key, { sequence, label, error }));
        throw error;
      });
      indexedDbQueueTail = exposed.then(() => undefined, () => undefined).finally(() => {
        indexedDbPendingCount = Math.max(0, indexedDbPendingCount - 1);
      });
      return exposed;
    }

    async function waitForStableIndexedDbQueue() {
      if (!canUseIndexedDb()) return true;
      for (let attempt = 0; attempt < 8; attempt += 1) {
        const ceiling = indexedDbQueueTail;
        await ceiling;
        if (ceiling === indexedDbQueueTail && indexedDbPendingCount === 0) return true;
      }
      throw new Error("IndexedDB queue did not reach a stable ceiling.");
    }

    function canonicalIndexedDbValue(key) {
      if (!recoveryPersistenceKeys().includes(key)) throw new Error("IndexedDB retry key is outside the canonical local boundary.");
      const raw = localStorage.getItem(key);
      if (raw === null) return undefined;
      if (key === CALM_MODE_KEY) {
        if (raw !== "on" && raw !== "off") throw new Error("Canonical Calm mode value is invalid.");
        return raw;
      }
      try {
        const value = JSON.parse(raw);
        if (key === SETTINGS_KEY && !isPlainBackupObject(value)) {
          throw new Error("Canonical settings must be an object.");
        }
        if (key === STORAGE_KEY) classifyStoredDataSchema(value);
        if ([COPY_KEY, AUTOSAVE_KEY].includes(key) && !isPlainBackupObject(value)) {
          throw new Error("Canonical local wording or drafts must be an object.");
        }
        if (key === AUTO_MEMORY_KEY && !hasMaintainedAutoMemoryVaultShape(value)) {
          throw new Error("Canonical Auto Memory data is structurally incomplete.");
        }
        if (key === ENCRYPTED_STORAGE_KEY && !hasMaintainedEncryptedEnvelopeShape(value)) {
          throw new Error("Canonical Device Vault data is structurally incomplete.");
        }
        return value;
      } catch (error) {
        throw new Error(`Canonical local value for ${key} is invalid.`);
      }
    }

    function hasMaintainedAutoMemoryVaultShape(value) {
      try {
        classifyAutoMemoryVault(value);
        if (typeof value.updatedAt !== "string" || (value.snapshots.length && !value.updatedAt.trim())) return false;
        return value.snapshots.every(snapshot => {
          if (!isPlainBackupObject(snapshot)
            || ![snapshot.id, snapshot.savedAt, snapshot.label, snapshot.appVersion, snapshot.summary, snapshot.signature].every(field => typeof field === "string" && field.trim().length > 0)
            || !isPlainBackupObject(snapshot.payload)) return false;
          classifyAutoMemorySnapshotPayload(snapshot.payload);
          const payload = snapshot.payload;
          return typeof payload.exportedAt === "string" && payload.exportedAt.trim().length > 0
            && isPlainBackupObject(payload.settings)
            && isPlainBackupObject(payload.customCopy)
            && isPlainBackupObject(payload.autosaveDrafts);
        });
      } catch (_error) {
        return false;
      }
    }

    function hasMaintainedEncryptedEnvelopeShape(value) {
      return Boolean(isPlainBackupObject(value)
        && value.kind === "ruf-ministry-hub-encrypted"
        && value.version === 1
        && value.algorithm === "AES-GCM"
        && value.kdf === "PBKDF2-SHA-256"
        && value.iterations === 150000
        && [value.salt, value.iv, value.ciphertext, value.encryptedAt].every(field => typeof field === "string" && field.length > 0));
    }

    async function reconcileFailedIndexedDbKeys() {
      const failedKeys = Array.from(indexedDbFailedKeys.keys());
      if (!failedKeys.length) return true;
      const entries = failedKeys.map(key => [key, canonicalIndexedDbValue(key)]);
      await writeIndexedDbBatch(entries);
      await waitForStableIndexedDbQueue();
      return failedKeys.every(key => !indexedDbFailedKeys.has(key));
    }

    async function drainIndexedDbCoordinator(options = {}) {
      if (!canUseIndexedDb()) return true;
      await waitForStableIndexedDbQueue();
      if (indexedDbFailedKeys.size && options.reconcileFailures) {
        if (!(await reconcileFailedIndexedDbKeys())) return false;
        await waitForStableIndexedDbQueue();
      }
      return indexedDbFailedKeys.size === 0;
    }

    function runIndexedDbTransaction(mode, key, value) {
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, mode);
        const store = transaction.objectStore(IDB_STORE);
        const request = mode === "readonly" ? store.get(key) : store.put(value, key);
        let requestResult;
        let settled = false;
        const timer = storageSetTimeout(() => {
          try { transaction.abort?.(); } catch (error) {}
          fail(new Error("IndexedDB transaction timed out."));
        }, IDB_DEADLINE_MS);
        const fail = error => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          reject(error || new Error("IndexedDB transaction failed."));
        };
        request.onsuccess = () => {
          requestResult = request.result;
        };
        request.onerror = () => fail(request.error);
        transaction.oncomplete = () => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          resolve(requestResult);
        };
        transaction.onerror = () => fail(transaction.error);
        transaction.onabort = () => fail(transaction.error || new Error("IndexedDB transaction was aborted."));
      }));
    }

    function idbTransaction(mode, key, value) {
      const operationValue = mode === "readonly" || value === undefined ? value : cloneJson(value);
      return enqueueIndexedDbWork(
        `${mode} ${key}`,
        [key],
        () => runIndexedDbTransaction(mode, key, operationValue),
        { tracksFailure: mode !== "readonly", unavailableValue: undefined }
      );
    }

    function mirrorToIndexedDb(key, value) {
      if (!canUseIndexedDb()) return Promise.resolve(false);
      return idbTransaction("readwrite", key, value).then(() => true, () => false);
    }

    function runDeleteFromIndexedDb(key) {
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, "readwrite");
        const request = transaction.objectStore(IDB_STORE).delete(key);
        let settled = false;
        const timer = storageSetTimeout(() => {
          try { transaction.abort?.(); } catch (error) {}
          fail(new Error("IndexedDB delete timed out."));
        }, IDB_DEADLINE_MS);
        const fail = error => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          reject(error || new Error("IndexedDB delete failed."));
        };
        request.onsuccess = () => {};
        request.onerror = () => fail(request.error);
        transaction.oncomplete = () => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          resolve(true);
        };
        transaction.onerror = () => {
          fail(transaction.error);
        };
        transaction.onabort = () => fail(transaction.error || new Error("IndexedDB delete aborted."));
      }));
    }

    function deleteFromIndexedDb(key) {
      return enqueueIndexedDbWork(`delete ${key}`, [key], () => runDeleteFromIndexedDb(key));
    }

    function runReadIndexedDbSnapshot(keys) {
      const uniqueKeys = Array.from(new Set(keys));
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, "readonly");
        const store = transaction.objectStore(IDB_STORE);
        const snapshot = new Map();
        let settled = false;
        const timer = storageSetTimeout(() => {
          try { transaction.abort?.(); } catch (error) {}
          finish(new Error("Recovery snapshot timed out."));
        }, IDB_DEADLINE_MS);
        const finish = (error, value = snapshot) => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          if (error) reject(error); else resolve(value);
        };
        transaction.oncomplete = () => finish(null, snapshot);
        transaction.onerror = () => finish(transaction.error || new Error("Recovery snapshot failed."));
        transaction.onabort = () => finish(transaction.error || new Error("Recovery snapshot was aborted."));
        try {
          uniqueKeys.forEach(key => {
            const request = store.get(key);
            request.onsuccess = () => snapshot.set(key, request.result === undefined ? undefined : cloneJson(request.result));
            request.onerror = () => finish(request.error || new Error("Recovery snapshot read failed."));
          });
        } catch (error) {
          finish(error);
        }
      }));
    }

    function readIndexedDbSnapshot(keys) {
      if (!canUseIndexedDb()) return Promise.resolve(null);
      const uniqueKeys = Array.from(new Set(keys));
      return enqueueIndexedDbWork("recovery snapshot", uniqueKeys, () => runReadIndexedDbSnapshot(uniqueKeys), { tracksFailure: false, unavailableValue: null });
    }

    function runWriteIndexedDbBatch(entries) {
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        const transaction = database.transaction(IDB_STORE, "readwrite");
        const store = transaction.objectStore(IDB_STORE);
        let settled = false;
        const timer = storageSetTimeout(() => {
          try { transaction.abort?.(); } catch (error) {}
          finish(new Error("Recovery transaction timed out."));
        }, IDB_DEADLINE_MS);
        const finish = (error, value = true) => {
          if (settled) return;
          settled = true;
          storageClearTimeout(timer);
          database.close();
          if (error) reject(error); else resolve(value);
        };
        transaction.oncomplete = () => finish(null, true);
        transaction.onerror = () => finish(transaction.error || new Error("Recovery transaction failed."));
        transaction.onabort = () => finish(transaction.error || new Error("Recovery transaction was aborted."));
        try {
          new Map(entries).forEach((value, key) => {
            if (value === undefined) store.delete(key);
            else store.put(cloneJson(value), key);
          });
        } catch (error) {
          finish(error);
        }
      }));
    }

    function writeIndexedDbBatch(entries) {
      if (!canUseIndexedDb()) return Promise.resolve(false);
      const normalizedEntries = Array.from(
        new Map(entries).entries(),
        ([key, value]) => [key, value === undefined ? undefined : cloneJson(value)]
      );
      return enqueueIndexedDbWork("IndexedDB batch", normalizedEntries.map(([key]) => key), () => runWriteIndexedDbBatch(normalizedEntries));
    }

    function restoreIndexedDbSnapshot(snapshot) {
      if (!snapshot) return Promise.resolve(false);
      return writeIndexedDbBatch(Array.from(snapshot.entries()));
    }

    function runCommitEncryptedVaultToIndexedDb(envelope, nextSettings, flushLease = null) {
      return openIndexedDb().then(database => new Promise((resolve, reject) => {
        if (flushLease && !vaultFlushLeaseIsCurrent(flushLease)) {
          database.close();
          reject(new Error("Encrypted vault flush lease was revoked before its transaction began."));
          return;
        }
        const transaction = database.transaction(IDB_STORE, "readwrite");
        if (flushLease) {
          flushLease.indexedDbTransaction = transaction;
          flushLease.indexedDbSettled = false;
        }
        const store = transaction.objectStore(IDB_STORE);
        let settled = false;
        const timer = storageSetTimeout(() => {
          try { transaction.abort?.(); } catch (error) {}
          finish(new Error("Encrypted vault transaction timed out."));
        }, IDB_DEADLINE_MS);
        const finish = (error, value = true) => {
          if (settled) return;
          settled = true;
          if (flushLease?.indexedDbTransaction === transaction) {
            flushLease.indexedDbTransaction = null;
            flushLease.indexedDbSettled = true;
          }
          storageClearTimeout(timer);
          database.close();
          if (error) reject(error); else resolve(value);
        };
        transaction.oncomplete = () => finish(null, true);
        transaction.onerror = () => finish(transaction.error || new Error("Encrypted vault transaction failed."));
        transaction.onabort = () => finish(transaction.error || new Error("Encrypted vault transaction aborted."));
        try {
          store.put(envelope, ENCRYPTED_STORAGE_KEY);
          store.put(nextSettings, SETTINGS_KEY);
          [STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, AUTO_MEMORY_KEY].forEach(key => store.delete(key));
        } catch (error) {
          finish(error);
        }
      }));
    }

    function commitEncryptedVaultToIndexedDb(envelope, nextSettings, flushLease = null) {
      if (!canUseIndexedDb()) return Promise.resolve(false);
      const stagedEnvelope = cloneJson(envelope);
      const stagedSettings = cloneJson(nextSettings);
      const keys = [ENCRYPTED_STORAGE_KEY, SETTINGS_KEY, STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, AUTO_MEMORY_KEY];
      return enqueueIndexedDbWork("encrypted vault commit", keys, () => runCommitEncryptedVaultToIndexedDb(stagedEnvelope, stagedSettings, flushLease));
    }

    function localObjectState(key) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return { state: "missing", raw: "", value: null };
        const value = JSON.parse(raw);
        if (!value || typeof value !== "object") return { state: "invalid", raw, value: null };
        return { state: "valid", raw, value };
      } catch (error) {
        return { state: "invalid", raw: localStorage.getItem(key) || "", value: null };
      }
    }

    async function hydrateFromIndexedDb() {
      return withActiveMutation("startup-hydration", async () => {
      view.startupRecoveryError = "";
      const localEnvelopeState = localObjectState(ENCRYPTED_STORAGE_KEY);
      const localAutoMemoryState = localObjectState(AUTO_MEMORY_KEY);
      if (!canUseIndexedDb()) {
        const orphanEnvelope = localEnvelopeState.state === "valid" && initialDataNeedsRecovery && !initialDataSchemaUnsupported;
        if (settings.localEncryptionEnabled || orphanEnvelope) {
          if (localEnvelopeState.state !== "valid") {
            view.startupRecoveryError = "Encrypted storage is enabled, but its local vault could not be recovered. Nothing was replaced.";
            return false;
          }
          settings = normalizeSettings({ ...settings, localEncryptionEnabled: true });
          settings.launchScreen = calmLaunchScreen(settings.launchScreen);
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(COPY_KEY);
          localStorage.removeItem(AUTOSAVE_KEY);
          localStorage.removeItem(AUTO_MEMORY_KEY);
          db = emptyData();
          customCopy = {};
          autosaveDraftsCache = null;
          memoryVaultCache = null;
          view.focusMode = true;
          view.locked = false;
          view.encryptionLocked = true;
          initialSettingsNeedsRecovery = false;
          initialSettingsWasInvalid = false;
          initialDataNeedsRecovery = false;
          initialDataWasInvalid = false;
          initialDataSchemaUnsupported = false;
          return true;
        }
        if (localAutoMemoryState.state === "valid") {
          try {
            normalizeAutoMemoryVault(localAutoMemoryState.value);
          } catch (_error) {
            view.startupRecoveryError = "Local recovery could not finish. Calm OS did not replace your ministry data. Retry before making changes.";
            return false;
          }
        } else if (localAutoMemoryState.state === "invalid") {
          view.startupRecoveryError = "Local data is present but could not be read, and no recovery store is available. Nothing was replaced.";
          return false;
        }
        if (initialDataSchemaUnsupported) {
          view.startupRecoveryError = "Local recovery could not finish. Calm OS did not replace your ministry data. Retry before making changes.";
          return false;
        }
        if (initialSettingsWasInvalid || initialDataWasInvalid || initialCopyWasInvalid) {
          view.startupRecoveryError = "Local data is present but could not be read, and no recovery store is available. Nothing was replaced.";
          return false;
        }
        if (initialSettingsNeedsRecovery) {
          settings = normalizeSettings(settings);
          settings.launchScreen = calmLaunchScreen(settings.launchScreen);
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
          initialSettingsNeedsRecovery = false;
        }
        if (initialDataNeedsRecovery) {
          db = normalizeData(db);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
          initialDataNeedsRecovery = false;
        }
        view.screen = calmLaunchScreen(settings.launchScreen);
        view.focusMode = true;
        view.locked = Boolean(settings.appLockEnabled && settings.pinHash);
        view.encryptionLocked = false;
        return true;
      }

      try {
        const staged = {
          settings: settings,
          data: db,
          copy: customCopy,
          envelope: localEnvelopeState.state === "valid" ? localEnvelopeState.value : null,
          autoMemory: null,
          autosave: null,
          writeSettings: false,
          seedSettings: false,
          writeData: false,
          seedData: false,
          writeCopy: false,
          writeEnvelope: false,
          writeAutoMemory: false,
          writeAutosave: false
        };

        if (initialSettingsNeedsRecovery) {
          const storedSettings = await idbTransaction("readonly", SETTINGS_KEY);
          if (storedSettings && typeof storedSettings === "object") {
            staged.settings = normalizeSettings(storedSettings);
            staged.writeSettings = true;
          } else if (initialSettingsWasInvalid) {
            throw new Error("Saved settings are unreadable and no valid recovery copy exists.");
          } else {
            staged.settings = normalizeSettings(settings);
            staged.writeSettings = true;
            staged.seedSettings = true;
          }
        }
        staged.settings.launchScreen = calmLaunchScreen(staged.settings.launchScreen);

        if (!staged.envelope) {
          const storedEnvelope = await idbTransaction("readonly", ENCRYPTED_STORAGE_KEY);
          if (storedEnvelope && typeof storedEnvelope === "object") {
            staged.envelope = storedEnvelope;
            staged.writeEnvelope = true;
          }
        }

        const orphanEnvelope = Boolean(staged.envelope && initialDataNeedsRecovery && !initialDataSchemaUnsupported);
        if (staged.settings.localEncryptionEnabled || orphanEnvelope) {
          if (!staged.envelope) throw new Error("Encrypted storage is enabled, but the encrypted vault could not be recovered.");
          staged.settings = normalizeSettings({ ...staged.settings, localEncryptionEnabled: true });
          staged.settings.launchScreen = calmLaunchScreen(staged.settings.launchScreen);
          if (staged.seedSettings) await idbTransaction("readwrite", SETTINGS_KEY, staged.settings);
          settings = staged.settings;
          localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
          if (staged.writeEnvelope || localEnvelopeState.state !== "valid") {
            localStorage.setItem(ENCRYPTED_STORAGE_KEY, JSON.stringify(staged.envelope));
          }
          localStorage.removeItem(STORAGE_KEY);
          localStorage.removeItem(COPY_KEY);
          localStorage.removeItem(AUTOSAVE_KEY);
          localStorage.removeItem(AUTO_MEMORY_KEY);
          db = emptyData();
          customCopy = {};
          autosaveDraftsCache = null;
          memoryVaultCache = null;
          view.screen = calmLaunchScreen(settings.launchScreen);
          view.focusMode = true;
          view.locked = false;
          view.encryptionLocked = true;
          initialSettingsNeedsRecovery = false;
          initialSettingsWasInvalid = false;
          initialDataNeedsRecovery = false;
          initialDataWasInvalid = false;
          initialDataSchemaUnsupported = false;
          return true;
        }

        if (initialDataSchemaUnsupported) {
          view.startupRecoveryError = "Local recovery could not finish. Calm OS did not replace your ministry data. Retry before making changes.";
          return false;
        }

        if (localAutoMemoryState.state === "valid") normalizeAutoMemoryVault(localAutoMemoryState.value);

        if (initialDataNeedsRecovery) {
          const storedDb = await idbTransaction("readonly", STORAGE_KEY);
          if (storedDb !== undefined) {
            classifyStoredDataSchema(storedDb);
            staged.data = normalizeData(storedDb);
            staged.writeData = true;
          } else if (initialDataWasInvalid) {
            throw new Error("Saved ministry data is unreadable and no valid recovery copy exists.");
          } else {
            staged.data = normalizeData(db);
            staged.writeData = true;
            staged.seedData = true;
          }
        }

        if (initialCopyNeedsRecovery) {
          const storedCopy = await idbTransaction("readonly", COPY_KEY);
          if (storedCopy && typeof storedCopy === "object") {
            staged.copy = { ...storedCopy };
            staged.writeCopy = true;
          } else if (initialCopyWasInvalid) {
            throw new Error("Saved custom wording is unreadable and no valid recovery copy exists.");
          }
        }

        if (localAutoMemoryState.state !== "valid") {
          const storedAutoMemory = await idbTransaction("readonly", AUTO_MEMORY_KEY);
          if (storedAutoMemory && typeof storedAutoMemory === "object") {
            staged.autoMemory = normalizeAutoMemoryVault(storedAutoMemory);
            staged.writeAutoMemory = true;
          } else if (localAutoMemoryState.state === "invalid") {
            throw new Error("Saved restore points are unreadable and no valid recovery copy exists.");
          }
        }

        const localAutosave = localObjectState(AUTOSAVE_KEY);
        if (localAutosave.state !== "valid") {
          const storedAutosave = await idbTransaction("readonly", AUTOSAVE_KEY);
          if (storedAutosave && typeof storedAutosave === "object") {
            staged.autosave = { ...storedAutosave };
            staged.writeAutosave = true;
          } else if (localAutosave.state === "invalid") {
            throw new Error("Saved drafts are unreadable and no valid recovery copy exists.");
          }
        }

        if (staged.seedSettings) await idbTransaction("readwrite", SETTINGS_KEY, staged.settings);
        if (staged.seedData) await idbTransaction("readwrite", STORAGE_KEY, staged.data);

        settings = normalizeSettings(staged.settings);
        settings.launchScreen = calmLaunchScreen(settings.launchScreen);
        db = normalizeData(staged.data);
        customCopy = staged.copy && typeof staged.copy === "object" ? staged.copy : {};
        if (staged.writeSettings) localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings));
        if (staged.writeData) {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
        }
        if (staged.writeCopy) localStorage.setItem(COPY_KEY, JSON.stringify(customCopy));
        if (staged.writeAutoMemory) localStorage.setItem(AUTO_MEMORY_KEY, JSON.stringify(staged.autoMemory));
        if (staged.writeAutosave) localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(staged.autosave));

        initialSettingsNeedsRecovery = false;
        initialSettingsWasInvalid = false;
        initialDataNeedsRecovery = false;
        initialDataWasInvalid = false;
        initialDataSchemaUnsupported = false;
        initialCopyNeedsRecovery = false;
        initialCopyWasInvalid = false;
        view.screen = calmLaunchScreen(settings.launchScreen);
        view.focusMode = true;
        view.locked = Boolean(settings.appLockEnabled && settings.pinHash);
        view.encryptionLocked = false;
        return true;
      } catch (error) {
        if (isUnsupportedStoredDataSchemaError(error)) {
          initialDataSchemaUnsupported = true;
          db = emptyData();
        }
        console.warn("Could not hydrate from IndexedDB", error);
        view.startupRecoveryError = "Local recovery could not finish. Calm OS did not replace your ministry data. Retry before making changes.";
        return false;
      }
      });
    }


    function cloneJson(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function recoveryPersistenceKeys() {
      return [SETTINGS_KEY, CALM_MODE_KEY, STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, ENCRYPTED_STORAGE_KEY, AUTO_MEMORY_KEY];
    }

    function retainedRecoveryOwner() {
      return Array.from(activeMutations.values()).find(mutation => mutation.cancelNeedsRetry) || null;
    }

    function recoveryRetryRequired() {
      return Boolean(retainedRecoveryOwner());
    }

    function recoveryMutationBlocked() {
      return recoveryTransactionPending || recoveryRetryRequired();
    }

    function currentUndoRetryClaim() {
      const selected = undoStack[0];
      if (!selected) return null;
      return Object.freeze({
        kind: "undo",
        undoId: String(selected.id || ""),
        undoEntryGeneration: Number(selected.generation),
        undoGeneration: Number(undoGeneration)
      });
    }

    function recoveryRetryClaimMatches(mutation) {
      const selected = undoStack[0];
      const claim = mutation?.retryClaim;
      return Boolean(claim
        && claim.kind === "undo"
        && claim.undoId
        && selected
        && String(selected.id || "") === claim.undoId
        && Number(selected.generation) === claim.undoEntryGeneration
        && Number(undoGeneration) === claim.undoGeneration);
    }

    function registerActiveMutation(kind, options = {}) {
      const mutation = {
        id: `mutation_${++activeMutationSequence}`,
        kind,
        epoch: recoveryEpoch,
        blocking: options.blocking !== false,
        cancel: typeof options.cancel === "function" ? options.cancel : null,
        cancelled: false,
        cancelNeedsRetry: false,
        operationSettled: false
      };
      activeMutations.set(mutation.id, mutation);
      return mutation;
    }

    function finishActiveMutation(mutation) {
      if (!mutation) return;
      mutation.operationSettled = true;
      if (mutation.cancelNeedsRetry) return;
      if (activeMutations.get(mutation.id) === mutation) activeMutations.delete(mutation.id);
    }

    async function withActiveMutation(kind, callback) {
      if (recoveryMutationBlocked()) return false;
      const mutation = registerActiveMutation(kind);
      try {
        return await callback(mutation);
      } finally {
        finishActiveMutation(mutation);
      }
    }

    function activeMutationIsCurrent(mutation) {
      return Boolean(mutation && !mutation.cancelled && mutation.epoch === recoveryEpoch && activeMutations.get(mutation.id) === mutation);
    }

    function recoveryEpochIsCurrent(epoch) {
      return epoch === recoveryEpoch && !recoveryMutationBlocked();
    }

    function hasBlockingActiveMutation() {
      return Array.from(activeMutations.values()).some(mutation => mutation.blocking && !mutation.cancelled);
    }

    async function cancelDiscardableActiveMutations() {
      const discardable = Array.from(activeMutations.values()).filter(mutation => !mutation.blocking && (!mutation.cancelled || mutation.cancelNeedsRetry));
      for (const mutation of discardable) {
        if (recoveryTransactionKind !== "undo") return false;
        if (!mutation.retryClaim) {
          Object.defineProperty(mutation, "retryClaim", {
            value: currentUndoRetryClaim(),
            enumerable: true,
            configurable: false,
            writable: false
          });
        }
        if (!recoveryRetryClaimMatches(mutation)) return false;
        mutation.cancelled = true;
        mutation.cancelNeedsRetry = true;
        try {
          if (mutation.cancel && !(await mutation.cancel())) return false;
          mutation.cancelNeedsRetry = false;
          if (activeMutations.get(mutation.id) === mutation) activeMutations.delete(mutation.id);
        } catch (error) {
          console.warn(`Could not cancel ${mutation.kind} before recovery`, error);
          return false;
        }
      }
      return true;
    }

    function cancelRecoveryTimers() {
      const clear = window.clearTimeout || clearTimeout;
      if (autosaveTimer) {
        clear(autosaveTimer);
        autosaveTimer = null;
      }
      if (vaultSaveTimer) {
        clear(vaultSaveTimer);
        vaultSaveTimer = null;
      }
      if (globalSearchTimer) {
        clear(globalSearchTimer);
        globalSearchTimer = null;
      }
    }

    async function settleVaultBeforeRecovery() {
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return true;
      const revokedSettlement = revokedVaultFlushSettlement;
      const revokedSettlementMatches = () => Boolean(revokedSettlement
        && recoveryTransactionPending
        && revokedSettlement.leaseId === trustedRevokedVaultFlushLeaseId
        && recoveryEpoch >= revokedSettlement.recoveryEpoch + 1
        && vaultPassphrase === revokedSettlement.passphrase
        && vaultSaveRequestedRevision === revokedSettlement.targetRevision
        && vaultPayloadGeneration === revokedSettlement.payloadGeneration
        && vaultSaveCompletedRevision < revokedSettlement.targetRevision);
      if (vaultSaveInFlight) {
        const settled = await vaultSaveInFlight;
        if (!settled && !revokedSettlementMatches()) return false;
      }
      if (revokedSettlement) {
        if (!revokedSettlementMatches()) return false;
        if (revokedVaultFlushSettlement === revokedSettlement) {
          revokedVaultFlushSettlement = null;
          trustedRevokedVaultFlushLeaseId = 0;
        }
      }
      let attempts = 0;
      while (vaultSaveCompletedRevision < vaultSaveRequestedRevision && attempts < 8) {
        attempts += 1;
        const ceiling = vaultSaveRequestedRevision;
        if (!(await confirmCareVaultRevision(ceiling))) return false;
      }
      return vaultSaveCompletedRevision === vaultSaveRequestedRevision;
    }

    function beginRecoveryTransaction(kind) {
      if (recoveryTransactionPending) return false;
      if (hasBlockingActiveMutation()) {
        showToast("Finish the current save before starting recovery.", "error");
        return false;
      }
      try {
        invalidateProtectedBackupExport();
        cancelActiveDictation({ announce: false });
        if (autosaveTimer) {
          const clear = window.clearTimeout || clearTimeout;
          clear(autosaveTimer);
          autosaveTimer = null;
          saveCurrentDraftNow();
        }
        recoveryTransactionPending = true;
        recoveryEpoch += 1;
        recoveryTransactionKind = kind === "restore" ? "restore" : "undo";
        view.undoSaving = recoveryTransactionKind === "undo";
        view.restoreSaving = recoveryTransactionKind === "restore";
        cancelRecoveryTimers();
        render();
        const needsAsyncPreparation = activeMutations.size > 0 || canUseIndexedDb() || (settings.localEncryptionEnabled && vaultPassphrase);
        if (!needsAsyncPreparation) return true;
        return (async () => {
          if (!(await cancelDiscardableActiveMutations())) throw new Error("Pending asynchronous work could not be cancelled before recovery.");
          if (canUseIndexedDb() && !(await drainIndexedDbCoordinator({ reconcileFailures: true }))) throw new Error("A prior IndexedDB mirror failed and must be retried before recovery.");
          if (!(await settleVaultBeforeRecovery())) throw new Error("Pending encrypted work could not settle before recovery.");
          if (canUseIndexedDb() && !(await drainIndexedDbCoordinator({ reconcileFailures: true }))) throw new Error("IndexedDB did not reach a stable recovery ceiling.");
          return true;
        })()
          .then(() => {
            return true;
          })
          .catch(error => {
            finishRecoveryTransaction();
            console.warn("Recovery could not claim a stable persistence boundary", error);
            showToast("Recovery could not start because earlier local work is not durable yet. Retry when storage is ready.", "error");
            render();
            return false;
          });
      } catch (error) {
        finishRecoveryTransaction();
        console.warn("Recovery could not claim a stable persistence boundary", error);
        showToast("Recovery could not start because earlier local work is not durable yet. Retry when storage is ready.", "error");
        render();
        return false;
      }
    }

    function finishRecoveryTransaction() {
      recoveryTransactionPending = false;
      recoveryTransactionKind = "";
      view.undoSaving = false;
      view.restoreSaving = false;
      if (sharedFragmentImportDeferred && !recoveryRetryRequired()) {
        if (!sharedFragmentQuickGrabEnabled()) {
          activatePendingFragmentQuickGrab();
          return;
        }
        const epoch = recoveryEpoch;
        Promise.resolve().then(() => {
          if (recoveryEpochIsCurrent(epoch)) activatePendingFragmentQuickGrab();
        });
      }
    }

    async function confirmStableRecoveryRevision() {
      let attempts = 0;
      while (attempts < 8) {
        attempts += 1;
        const ceiling = vaultSaveRequestedRevision;
        if (!(await confirmCareVaultRevision(ceiling))) return false;
        if (vaultSaveRequestedRevision === ceiling && vaultSaveCompletedRevision === ceiling) return true;
      }
      return false;
    }

    function captureRecoveryTransactionState() {
      return {
        db: cloneJson(db),
        settings: cloneJson(settings),
        customCopy: cloneJson(customCopy),
        autosaveDrafts: cloneJson(loadAutosaveDrafts()),
        autoMemoryVault: cloneJson(loadAutoMemoryVault()),
        undoStack: cloneJson(undoStack),
        undoGeneration,
        view: cloneJson(view),
        revisions: { requested: vaultSaveRequestedRevision, completed: vaultSaveCompletedRevision },
        localStorage: localStorageSnapshot(recoveryPersistenceKeys()),
        indexedDb: null
      };
    }

    async function restoreRecoveryTransactionState(snapshot) {
      db = cloneJson(snapshot.db);
      settings = normalizeSettings(snapshot.settings);
      customCopy = cloneJson(snapshot.customCopy);
      autosaveDraftsCache = cloneJson(snapshot.autosaveDrafts);
      memoryVaultCache = normalizeAutoMemoryVault(snapshot.autoMemoryVault);
      undoStack = cloneJson(snapshot.undoStack);
      undoGeneration = Number(snapshot.undoGeneration) || 0;
      view = cloneJson(snapshot.view);
      vaultSaveRequestedRevision = snapshot.revisions.requested;
      vaultSaveCompletedRevision = snapshot.revisions.completed;
      restoreLocalStorageSnapshot(snapshot.localStorage);
      if (snapshot.indexedDb) await restoreIndexedDbSnapshot(snapshot.indexedDb);
    }

    async function persistPlainRecoveryState(drafts, autoMemoryVault) {
      const normalizedDrafts = cloneJson(drafts || {});
      const normalizedMemory = normalizeAutoMemoryVault(autoMemoryVault || emptyAutoMemoryVault());
      const localEntries = [
        [SETTINGS_KEY, JSON.stringify(settings)],
        [CALM_MODE_KEY, settings.calmMode ? "on" : "off"],
        [STORAGE_KEY, JSON.stringify(db)],
        [COPY_KEY, JSON.stringify(customCopy)],
        [AUTOSAVE_KEY, JSON.stringify(normalizedDrafts)],
        [AUTO_MEMORY_KEY, JSON.stringify(normalizedMemory)]
      ];
      const localSnapshot = writeLocalStorageBatch(localEntries);
      try {
        if (canUseIndexedDb()) {
          await writeIndexedDbBatch([
            [SETTINGS_KEY, settings],
            [STORAGE_KEY, db],
            [COPY_KEY, customCopy],
            [AUTOSAVE_KEY, normalizedDrafts],
            [AUTO_MEMORY_KEY, normalizedMemory]
          ]);
        }
      } catch (error) {
        restoreLocalStorageSnapshot(localSnapshot);
        throw error;
      }
    }

    function recordUndo(label = "last change", restoreRecovery = null, options = {}) {
      if (recoveryMutationBlocked() && options.allowDuringRecovery !== true) return false;
      if (!settings.enableUndo) return false;
      const entry = {
        id: uid("undo"),
        generation: ++undoGeneration,
        label,
        db: cloneJson(db),
        settings: cloneJson(settings),
        customCopy: cloneJson(customCopy)
      };
      if (restoreRecovery) entry.restoreRecovery = cloneJson(restoreRecovery);
      undoStack.unshift(entry);
      undoStack = undoStack.slice(0, 5);
      return true;
    }

    async function undoLast() {
      if (recoveryTransactionPending || view.undoSaving) return false;
      const selected = undoStack[0];
      if (!selected) {
        showToast("Nothing to undo.");
        return false;
      }
      const snapshot = cloneJson(selected);
      const selectedUndoGeneration = undoGeneration;
      const previousView = cloneJson(view);
      const started = beginRecoveryTransaction("undo");
      if (started && typeof started.then === "function") {
        if (!(await started)) return false;
      } else if (!started) {
        return false;
      }
      const before = captureRecoveryTransactionState();
      before.view = previousView;
      try {
        if (canUseIndexedDb()) before.indexedDb = await readIndexedDbSnapshot(recoveryPersistenceKeys());
        if (Boolean(snapshot.settings?.localEncryptionEnabled) !== Boolean(before.settings.localEncryptionEnabled)) {
          throw new Error("Undo cannot cross a Device Vault security transition.");
        }
        db = cloneJson(snapshot.db);
        settings = normalizeSettings(snapshot.settings);
        customCopy = cloneJson(snapshot.customCopy);
        const restoreRecovery = snapshot.restoreRecovery || null;
        const targetDrafts = restoreRecovery ? cloneJson(restoreRecovery.autosaveDrafts || {}) : cloneJson(before.autosaveDrafts);
        const targetMemory = restoreRecovery ? normalizeAutoMemoryVault(restoreRecovery.autoMemoryVault) : normalizeAutoMemoryVault(before.autoMemoryVault);
        if (restoreRecovery?.view) view = cloneJson(restoreRecovery.view);
        view.focusMode = true;
        view.locked = false;
        view.undoSaving = true;
        autosaveDraftsCache = targetDrafts;
        memoryVaultCache = targetMemory;
        if (settings.localEncryptionEnabled) {
          scheduleVaultSave(true);
          if (!(await confirmStableRecoveryRevision())) throw new Error("Encrypted Undo could not finish at a stable revision.");
        } else {
          await persistPlainRecoveryState(targetDrafts, targetMemory);
        }
        const targetIndex = undoStack.indexOf(selected);
        if (undoGeneration !== selectedUndoGeneration || targetIndex !== 0 || undoStack[0] !== selected) {
          throw new Error("Undo ownership changed before durability completed.");
        }
        undoStack.splice(targetIndex, 1);
        undoGeneration += 1;
        finishRecoveryTransaction();
        showToast("Undid " + snapshot.label + ".");
        render();
        return true;
      } catch (error) {
        cancelRecoveryTimers();
        try {
          await restoreRecoveryTransactionState(before);
        } catch (restoreError) {
          console.warn("Could not fully restore Undo persistence", restoreError);
        }
        finishRecoveryTransaction();
        console.warn("Undo was rolled back because local persistence failed", error);
        showToast("Undo could not be saved. Your previous data remains in place; retry when storage is ready.", "error");
        render();
        return false;
      }
    }

    function backupReminderDue() {

      if (Number.isNaN(last)) return true;
      return Date.now() - last >= days * 24 * 60 * 60 * 1000;

    function backupAgeDays() {
      if (!settings.lastBackupAt) return null;
      const last = new Date(settings.lastBackupAt).getTime();
      if (Number.isNaN(last)) return null;

    function canUseWebCrypto() {
      return typeof crypto !== "undefined" && crypto.subtle && typeof TextEncoder !== "undefined" && typeof TextDecoder !== "undefined" && typeof btoa !== "undefined" && typeof atob !== "undefined";
    }

    function bytesToBase64(bytes) {
      let binary = "";
      Array.from(bytes).forEach(byte => {
        binary += String.fromCharCode(byte);
      });
      return btoa(binary);
    }

    function base64ToBytes(value) {
      const binary = atob(value);
      return Uint8Array.from(binary, char => char.charCodeAt(0));
    }

    async function deriveVaultKey(passphrase, salt) {
      const material = await crypto.subtle.importKey(
        "raw",
        new TextEncoder().encode(passphrase),
        "PBKDF2",
        false,
        ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 150000, hash: "SHA-256" },
        material,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
      );
    }

    async function encryptPayload(payload, passphrase, kind = "ruf-ministry-hub-encrypted") {
      if (!canUseWebCrypto()) throw new Error("Encryption is not available in this browser.");
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveVaultKey(passphrase, salt);
      const plaintext = new TextEncoder().encode(JSON.stringify(payload));
      const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, plaintext);
      return {
        kind,
        version: 1,
        algorithm: "AES-GCM",
        kdf: "PBKDF2-SHA-256",
        iterations: 150000,
        salt: bytesToBase64(salt),
        iv: bytesToBase64(iv),
        ciphertext: bytesToBase64(new Uint8Array(ciphertext)),
        encryptedAt: nowISO()
      };
    }

    async function decryptPayload(envelope, passphrase) {
      if (!canUseWebCrypto()) throw new Error("Encryption is not available in this browser.");
      if (!envelope || !envelope.salt || !envelope.iv || !envelope.ciphertext) throw new Error("Encrypted file is missing required fields.");
      const salt = base64ToBytes(envelope.salt);
      const iv = base64ToBytes(envelope.iv);
      const key = await deriveVaultKey(passphrase, salt);
      const ciphertext = base64ToBytes(envelope.ciphertext);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ciphertext);
      return JSON.parse(new TextDecoder().decode(decrypted));
    }

    function scheduleVaultSave(allowDuringRecovery = false) {
      if (recoveryMutationBlocked() && !allowDuringRecovery) return false;
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return;
      vaultSaveRequestedRevision += 1;
      vaultPayloadGeneration += 1;
      if (vaultSaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(vaultSaveTimer);
      }
      const delay = window.setTimeout || setTimeout;
      const scheduledEpoch = recoveryEpoch;
      vaultSaveTimer = delay(() => {
        vaultSaveTimer = null;
        if (!allowDuringRecovery && !recoveryEpochIsCurrent(scheduledEpoch)) return;
        flushEncryptedVaultSaves();
      }, 250);
      return true;
    }

    function encryptedVaultPayloadSnapshot() {
      return cloneJson({
        data: db,
        customCopy,
        autosaveDrafts: loadAutosaveDrafts(),
        autoMemoryVault: loadAutoMemoryVault()
      });
    }

    function flushEncryptedVaultSaves() {
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return Promise.resolve(false);
      if (vaultSaveInFlight) return vaultSaveInFlight;
      let allowFollowup = true;
      vaultSaveInFlight = (async () => {
        let saved = false;
        const flushEpoch = recoveryEpoch;
        while (settings.localEncryptionEnabled && vaultPassphrase && vaultSaveCompletedRevision < vaultSaveRequestedRevision) {
          const targetRevision = vaultSaveRequestedRevision;
          const payloadGeneration = vaultPayloadGeneration;
          const passphrase = vaultPassphrase;
          const payload = encryptedVaultPayloadSnapshot();
          const flushLease = {
            id: ++vaultFlushLeaseSequence,
            recoveryEpoch: flushEpoch,
            passphrase,
            targetRevision,
            payloadGeneration,
            revoked: false,
            allowFollowup: true,
            localSnapshot: null,
            localCommitted: false,
            indexedDbTransaction: null,
            indexedDbSettled: true
          };
          activeVaultFlushLease = flushLease;
          const flushOwnershipIsCurrent = () => vaultFlushLeaseIsCurrent(flushLease)
            && (recoveryEpoch === flushLease.recoveryEpoch || (recoveryTransactionPending && recoveryEpoch === flushLease.recoveryEpoch + 1))
            && settings.localEncryptionEnabled
            && Boolean(vaultPassphrase)
            && flushLease.passphrase === vaultPassphrase;
          const payloadOwnershipIsCurrent = () => flushLease.targetRevision === vaultSaveRequestedRevision
            && flushLease.payloadGeneration === vaultPayloadGeneration;
          try {
            const envelope = await encryptPayload(payload, flushLease.passphrase);
            if (!flushOwnershipIsCurrent()) {
              allowFollowup = false;
              break;
            }
            if (!payloadOwnershipIsCurrent()) continue;
            const nextSettings = { ...settings, localEncryptionUpdatedAt: envelope.encryptedAt };
            const localEntries = [
              [ENCRYPTED_STORAGE_KEY, JSON.stringify(envelope)],
              [STORAGE_KEY, null],
              [COPY_KEY, null],
              [AUTOSAVE_KEY, null],
              [AUTO_MEMORY_KEY, null],
              [SETTINGS_KEY, JSON.stringify(nextSettings)]
            ];
            flushLease.localSnapshot = localStorageSnapshot(localEntries.map(([key]) => key));
            writeLocalStorageBatch(localEntries);
            flushLease.localCommitted = true;
            try {
              if (canUseIndexedDb()) await commitEncryptedVaultToIndexedDb(envelope, nextSettings, flushLease);
            } catch (error) {
              restoreVaultFlushLeaseLocalSnapshot(flushLease);
              throw error;
            }
            if (!flushOwnershipIsCurrent()) throw new Error("Encrypted vault flush lease changed before final publication.");
            settings.localEncryptionUpdatedAt = envelope.encryptedAt;
            vaultSaveCompletedRevision = flushLease.targetRevision;
            flushLease.localCommitted = false;
            saved = true;
          } catch (error) {
            restoreVaultFlushLeaseLocalSnapshot(flushLease);
            if (flushLease.revoked || !flushOwnershipIsCurrent()) {
              allowFollowup = false;
              break;
            }
            if (!payloadOwnershipIsCurrent()) continue;
            allowFollowup = false;
            console.warn("Could not save encrypted vault", error);
            showToast("Encrypted save failed.");
            break;
          } finally {
            if (!flushLease.allowFollowup) allowFollowup = false;
            if (activeVaultFlushLease === flushLease) activeVaultFlushLease = null;
          }
        }
        return saved;
      })().finally(() => {
        vaultSaveInFlight = null;
        if (allowFollowup && settings.localEncryptionEnabled && vaultPassphrase && vaultSaveCompletedRevision < vaultSaveRequestedRevision && !vaultSaveTimer) {
          const delay = window.setTimeout || setTimeout;
          vaultSaveTimer = delay(() => {
            vaultSaveTimer = null;
            flushEncryptedVaultSaves();
          }, 250);
        }
      });
      return vaultSaveInFlight;
    }

    function persistEncryptedVault(allowDuringRecovery = false) {
      if (recoveryMutationBlocked() && !allowDuringRecovery) return Promise.resolve(false);
      if (!settings.localEncryptionEnabled || !vaultPassphrase) return Promise.resolve(false);
      vaultSaveRequestedRevision += 1;
      vaultPayloadGeneration += 1;
      if (vaultSaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(vaultSaveTimer);
        vaultSaveTimer = null;
      }
      return flushEncryptedVaultSaves();
    }

    function currentPortablePayload() {
      return {
        exportedAt: nowISO(),
        app: "RUF Ministry Hub",
        version: 2,
        dataSchemaVersion: DATA_SCHEMA_VERSION,
        data: db,
        settings,
        customCopy,
        autosaveDrafts: loadAutosaveDrafts()
      };
    }

    function emptyAutoMemoryVault() {
      return {
        version: 1,
        updatedAt: "",
        snapshots: []
      };
    }

    function autoMemoryLimit() {
      const limit = Number(settings?.autoMemorySnapshotLimit || DEFAULT_SETTINGS.autoMemorySnapshotLimit);
      if (!Number.isFinite(limit)) return Number(DEFAULT_SETTINGS.autoMemorySnapshotLimit);
      return Math.max(3, Math.min(50, Math.floor(limit)));
    }

    function autoMemoryComparablePayload(payload) {
      const cleanSettings = { ...(payload?.settings || {}) };
      delete cleanSettings.lastBackupAt;
      delete cleanSettings.localEncryptionUpdatedAt;
      return {
        data: payload?.data || payload?.db || emptyData(),
        settings: cleanSettings,
        customCopy: payload?.customCopy || {},
        autosaveDrafts: payload?.autosaveDrafts || {}
      };
    }

    function compactAutoMemoryFingerprint(value) {
      const text = JSON.stringify(value);
      let hash = 2166136261;
      for (let index = 0; index < text.length; index += 1) {
        hash ^= text.charCodeAt(index);
        hash = Math.imul(hash, 16777619);
      }
      return `v2-${(hash >>> 0).toString(16)}-${text.length}`;
    }

    function autoMemorySignature(payload) {
      try {
        return compactAutoMemoryFingerprint(autoMemoryComparablePayload(payload));
      } catch (error) {
        return String(Date.now());
      }
    }

    function autoMemorySchemaError() {
      return new Error(AUTO_MEMORY_SCHEMA_RETRY_MESSAGE);
    }

    function classifyAutoMemorySnapshotPayload(payload) {
      if (!isPlainBackupObject(payload)) throw autoMemorySchemaError();
      const ownsData = Object.prototype.hasOwnProperty.call(payload, "data");
      const ownsLegacyData = Object.prototype.hasOwnProperty.call(payload, "db");
      if (ownsData === ownsLegacyData) throw autoMemorySchemaError();
      const data = ownsData ? payload.data : payload.db;
      if (!isPlainBackupObject(data) || !hasHistoricalDataShape(data)) throw autoMemorySchemaError();
      const topPresent = Object.prototype.hasOwnProperty.call(payload, "dataSchemaVersion");
      const nestedPresent = Object.prototype.hasOwnProperty.call(data, "dataSchemaVersion");
      const topVersion = topPresent ? payload.dataSchemaVersion : null;
      const nestedVersion = nestedPresent ? data.dataSchemaVersion : null;
      const supportedVersion = value => typeof value === "number"
        && Number.isFinite(value)
        && Number.isInteger(value)
        && (value === 2 || value === DATA_SCHEMA_VERSION);
      if ((topPresent && !supportedVersion(topVersion))
        || (nestedPresent && !supportedVersion(nestedVersion))
        || (topPresent && nestedPresent && topVersion !== nestedVersion)) throw autoMemorySchemaError();
      const schemaVersion = topPresent ? topVersion : nestedPresent ? nestedVersion : null;
      if (schemaVersion === DATA_SCHEMA_VERSION && !DATA_COLLECTIONS.every(collection => Array.isArray(data[collection]))) {
        throw autoMemorySchemaError();
      }
      if (schemaVersion !== DATA_SCHEMA_VERSION && data.aiProposals !== undefined && !Array.isArray(data.aiProposals)) {
        throw autoMemorySchemaError();
      }
      const ownsApp = Object.prototype.hasOwnProperty.call(payload, "app");
      const ownsVersion = Object.prototype.hasOwnProperty.call(payload, "version");
      if (ownsApp !== ownsVersion || (ownsApp && (payload.app !== "RUF Ministry Hub" || payload.version !== 2))) {
        throw autoMemorySchemaError();
      }
      for (const key of ["settings", "customCopy", "autosaveDrafts"]) {
        if (Object.prototype.hasOwnProperty.call(payload, key) && !isPlainBackupObject(payload[key])) throw autoMemorySchemaError();
      }
      return { data, source: ownsData ? "data" : "db", schemaVersion, topPresent, nestedPresent };
    }

    function classifyAutoMemoryVault(raw) {
      if (!isPlainBackupObject(raw)
        || raw.version !== 1
        || !Array.isArray(raw.snapshots)
        || raw.snapshots.length > MAX_AUTO_MEMORY_RAW_SNAPSHOTS) throw autoMemorySchemaError();
      return raw;
    }

    function normalizeAutoMemoryPayload(payload) {
      const classification = classifyAutoMemorySnapshotPayload(payload);
      const normalized = {
        ...payload,
        exportedAt: payload.exportedAt || payload.savedAt || nowISO(),
        app: "RUF Ministry Hub",
        version: 2,
        data: classification.data,
        settings: payload.settings || {},
        customCopy: payload.customCopy || {},
        autosaveDrafts: payload.autosaveDrafts || {}
      };
      if (classification.source === "db") delete normalized.db;
      return normalized;
    }

    function normalizeAutoMemoryVault(raw = {}) {
      classifyAutoMemoryVault(raw);
      const normalized = emptyAutoMemoryVault();
      normalized.version = raw.version;
      normalized.updatedAt = typeof raw.updatedAt === "string" ? raw.updatedAt : "";
      normalized.snapshots = raw.snapshots
        .map(snapshot => {
          if (!isPlainBackupObject(snapshot)) throw autoMemorySchemaError();
          const payload = normalizeAutoMemoryPayload(snapshot.payload);
          return {
            id: snapshot.id || uid("memory"),
            savedAt: snapshot.savedAt || snapshot.createdAt || payload.exportedAt || nowISO(),
            label: String(snapshot.label || "Auto save").slice(0, 80),
            appVersion: snapshot.appVersion || "",
            summary: snapshot.summary || dataSummaryText(payload.data),
            signature: snapshot.signature || autoMemorySignature(payload),
            payload
          };
        })
        .sort((a, b) => String(b.savedAt || "").localeCompare(String(a.savedAt || "")))
        .slice(0, autoMemoryLimit());
      return normalized;
    }

    function loadAutoMemoryVault() {
      if (settings?.localEncryptionEnabled) return normalizeAutoMemoryVault(memoryVaultCache || emptyAutoMemoryVault());
      try {
        const raw = localStorage.getItem(AUTO_MEMORY_KEY);
        if (raw) return normalizeAutoMemoryVault(JSON.parse(raw));
      } catch (error) {
        console.warn("Could not load Auto Memory Vault", error);
      }
      return emptyAutoMemoryVault();
    }

    function saveAutoMemoryVault(vault) {
      const normalized = normalizeAutoMemoryVault(vault);
      if (settings?.localEncryptionEnabled) {
        memoryVaultCache = normalized;
        scheduleVaultSave();
        return true;
      }
      const working = normalizeAutoMemoryVault(normalized);
      while (true) {
        try {
          localStorage.setItem(AUTO_MEMORY_KEY, JSON.stringify(working));
          mirrorToIndexedDb(AUTO_MEMORY_KEY, working);
          return true;
        } catch (error) {
          if (!working.snapshots.length) {
            console.warn("Could not save Auto Memory Vault", error);
            return false;
          }
          working.snapshots.pop();
          working.updatedAt = working.snapshots[0]?.savedAt || "";
        }
      }
    }

    function captureAutoMemorySnapshot(label = "Auto save", options = {}) {
      if (!settings?.autoMemoryVaultEnabled) return null;
      if (typeof db === "undefined" || !db) return null;
      const payload = cloneJson(currentPortablePayload());
      payload.exportedAt = nowISO();
      const signature = autoMemorySignature(payload);
      const vault = loadAutoMemoryVault();
      const latest = vault.snapshots[0];
      if (!options.force && latest && latest.signature === signature) return latest;
      const snapshot = {
        id: uid("memory"),
        savedAt: payload.exportedAt,
        label,
        appVersion: APP_VERSION,
        summary: dataSummaryText(payload.data),
        signature,
        payload
      };
      vault.snapshots = [
        snapshot,
        ...vault.snapshots.filter(item => item.signature !== signature)
      ].slice(0, autoMemoryLimit());
      vault.updatedAt = snapshot.savedAt;
      return saveAutoMemoryVault(vault) ? snapshot : null;
    }

    function autoMemoryVaultState() {
      const vault = loadAutoMemoryVault();
      const snapshots = vault.snapshots || [];
      const latest = snapshots[0] || null;
      if (!settings.autoMemoryVaultEnabled) {
        return {
          tone: "gray",
          label: "Paused",
          detail: snapshots.length
            ? `${snapshots.length} local restore point${snapshots.length === 1 ? "" : "s"} kept. Auto Memory is off.`
            : "Auto Memory is off.",
          count: snapshots.length,
          latest
        };
      }
      if (!snapshots.length) {
        return {
          tone: "gold",
          label: "Waiting",
          detail: "The next saved change will create a local restore point on this device.",
          count: 0,
          latest: null
        };
      }
      return {
        tone: "green",
        label: "Auto saved",
        detail: `${snapshots.length} local restore point${snapshots.length === 1 ? "" : "s"} kept. Last: ${dateTimeLabel(latest.savedAt)}.`,
        count: snapshots.length,
        latest
      };
    }

    function findAutoMemorySnapshot(id) {
      return loadAutoMemoryVault().snapshots.find(snapshot => snapshot.id === id) || null;

      const snapshot = captureAutoMemorySnapshot("Manual restore point", { force: true });
      showToast(snapshot ? "Restore point saved." : "Auto Memory could not save.");
