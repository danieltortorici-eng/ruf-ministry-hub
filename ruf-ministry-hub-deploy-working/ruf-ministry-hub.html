    function deleteAutoMemorySnapshot(id) {
      const vault = loadAutoMemoryVault();
      const before = vault.snapshots.length;
      vault.snapshots = vault.snapshots.filter(snapshot => snapshot.id !== id);
      vault.updatedAt = vault.snapshots[0]?.savedAt || "";
      if (before === vault.snapshots.length) return false;
      saveAutoMemoryVault(vault);
      return true;
    }

    function clearAutoMemorySnapshots() {
      const vault = emptyAutoMemoryVault();
      saveAutoMemoryVault(vault);

    async function restoreAutoMemorySnapshot(id) {
      const snapshot = findAutoMemorySnapshot(id);
      if (!snapshot) {
        showToast("That restore point is no longer available.");

    function downloadJson(payload, filename) {
      let url = "";
      let anchor = null;
      let appendAttempted = false;
      let clickReturned = false;
      let failure = null;
      try {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        url = URL.createObjectURL(blob);
        anchor = document.createElement("a");
        anchor.href = url;
        anchor.download = filename;
        appendAttempted = true;
        document.body.appendChild(anchor);
        anchor.click();
        clickReturned = true;
      } catch (error) {
        failure = new Error("Backup download could not be initiated safely.");
      } finally {
        if (anchor && appendAttempted) {
          try {
            anchor.remove();
          } catch (error) {
            if (!failure) failure = new Error("Backup download cleanup could not finish safely.");
          }
        }
        if (url) {
          try {
            URL.revokeObjectURL(url);
          } catch (error) {
            if (!failure) failure = new Error("Backup download cleanup could not finish safely.");
          }
        }
      }
      if (failure) {
        Object.defineProperty(failure, "downloadMayHaveStarted", {
          value: clickReturned,
          enumerable: false,
          configurable: false,
          writable: false
        });
        throw failure;
      }
      return true;
    }

    function stagedRestoreMemoryVault(previous, label) {
      const vault = normalizeAutoMemoryVault(previous.autoMemoryVault);
      if (!previous.settings.autoMemoryVaultEnabled) return vault;
      const payload = {
        exportedAt: nowISO(),
        app: "RUF Ministry Hub",
        version: 2,
        dataSchemaVersion: DATA_SCHEMA_VERSION,
        data: cloneJson(previous.db),
        settings: cloneJson(previous.settings),
        customCopy: cloneJson(previous.customCopy),
        autosaveDrafts: cloneJson(previous.autosaveDrafts)
      };
      const signature = autoMemorySignature(payload);
      const snapshot = {
        id: uid("memory"),
        savedAt: payload.exportedAt,
        label: String(label || "Before backup restore").slice(0, 80),
        appVersion: APP_VERSION,
        summary: dataSummaryText(payload.data),
        signature,
        payload
      };
      vault.snapshots = [snapshot, ...vault.snapshots.filter(item => item.signature !== signature)].slice(0, autoMemoryLimit());
      vault.updatedAt = snapshot.savedAt;
      return vault;
    }

    function applyRestoredPayload(payload, options = {}) {
      if (recoveryMutationBlocked()) return Promise.resolve(false);
      const validatedPayload = validateBackupPayload(payload);
      const previousView = cloneJson(view);
      return (async () => {
        const started = beginRecoveryTransaction("restore");
        if (started && typeof started.then === "function") {
          if (!(await started)) return false;
        } else if (!started) {
          return false;
        }
        const previous = captureRecoveryTransactionState();
        previous.view = previousView;
        try {
          if (canUseIndexedDb()) previous.indexedDb = await readIndexedDbSnapshot(recoveryPersistenceKeys());
          const restoredData = normalizeData(validatedPayload.data);
          const incomingSettings = normalizeSettings(validatedPayload.settings || {});
          const keepVault = {
            localEncryptionEnabled: previous.settings.localEncryptionEnabled,
            localEncryptionHint: previous.settings.localEncryptionHint,
            localEncryptionUpdatedAt: previous.settings.localEncryptionUpdatedAt
          };
          const targetMemory = options.captureBefore === false
            ? normalizeAutoMemoryVault(previous.autoMemoryVault)
            : stagedRestoreMemoryVault(previous, options.beforeLabel);
          recordUndo(options.undoLabel || "backup restore", {
            autosaveDrafts: previous.autosaveDrafts,
            autoMemoryVault: previous.autoMemoryVault,
            view: previous.view
          }, { allowDuringRecovery: true });
          db = restoredData;
          settings = normalizeSettings({ ...incomingSettings, ...keepVault });
          customCopy = validatedPayload.customCopy && typeof validatedPayload.customCopy === "object" ? validatedPayload.customCopy : {};
          autosaveDraftsCache = validatedPayload.autosaveDrafts && typeof validatedPayload.autosaveDrafts === "object" ? validatedPayload.autosaveDrafts : {};
          memoryVaultCache = targetMemory;
          resetViewAfterRestore();
          if (settings.localEncryptionEnabled) {
            scheduleVaultSave(true);
            if (!(await confirmStableRecoveryRevision())) throw new Error("Encrypted backup restore could not finish at a stable revision.");
          } else {
            await persistPlainRecoveryState(autosaveDraftsCache, targetMemory);
          }
          finishRecoveryTransaction();
          showToast(options.toast || "Backup restored.");
          render();
          return true;
        } catch (error) {
          cancelRecoveryTimers();
          try {
            await restoreRecoveryTransactionState(previous);
          } catch (restoreError) {
            console.warn("Could not fully roll back backup restore persistence", restoreError);
          }
          finishRecoveryTransaction();
          console.warn("Backup restore was rolled back because local persistence failed", error);
          showToast("Backup restore could not be saved. Your previous data remains in place.", "error");
          render();
          return false;
        }
      })();
    }

    function loadAutosaveDrafts() {
      if (settings?.localEncryptionEnabled) return autosaveDraftsCache || {};
      try {
        const raw = localStorage.getItem(AUTOSAVE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (error) {
        console.warn("Could not load autosave drafts", error);
        return {};
      }
    }

    function saveAutosaveDrafts(drafts) {
      if (recoveryMutationBlocked()) return false;
      if (settings?.localEncryptionEnabled) {
        autosaveDraftsCache = cloneJson(drafts || {});
        localStorage.removeItem(AUTOSAVE_KEY);
        deleteFromIndexedDb(AUTOSAVE_KEY).catch(() => {});
        scheduleVaultSave();
        return true;
      }
      persistPlainRecord(AUTOSAVE_KEY, drafts);
      return true;
    }

    function autosaveDraftKey() {
      if (view.screen === "quick") return "capture:main";
      if (view.screen === "today") return "capture:today";
      if (view.screen === "person" && (view.profileCapturePersonId || view.personId)) return `capture:profile:${view.profileCapturePersonId || view.personId}`;
      if (view.screen === "aiConfirmActions" && view.aiConfirmProposalId) return `workflow:ai-confirm:${view.aiConfirmProposalId}`;
      if (view.screen === "snooze" && view.quickGrabId) return "snooze:" + view.quickGrabId;
      if (view.screen === "search") return "screen:search";
      if (view.screen === "people") return "screen:people";
      return "";
    }

    function isAutosaveField(el) {
      if (!settings.enableAutoSave || !el || !el.id) return false;
      if (el.type === "password" || el.type === "file") return false;
      if (el.id === "pin-input" || el.id === "vault-passphrase" || el.id === "import-backup-file") return false;
      if (["ai-confirm-action-confirm", "ai-confirm-duplicate-confirm", "ai-confirm-convert-quickgrab"].includes(el.id)) return false;
      if (el.dataset.settingToggle || el.dataset.settingSelect || el.dataset.copyKey) return false;
      if (typeof el.closest === "function" && el.closest("[data-sheet-panel]")) return false;
      return ["INPUT", "TEXTAREA", "SELECT"].includes(el.tagName);
    }

    function collectAutosaveDraft() {
      const key = autosaveDraftKey();
      if (!key) return null;
      const fields = {};
      let eligibleCount = 0;
      document.querySelectorAll("input, textarea, select").forEach(el => {
        if (!isAutosaveField(el)) return;
        eligibleCount += 1;
        fields[el.id] = el.type === "checkbox" ? Boolean(el.checked) : el.value;
      });
      if (!eligibleCount) return null;
      return { key, fields, updatedAt: nowISO(), screen: view.screen };
    }

    function hasDraftContent(fields) {
      return Object.values(fields).some(value => {
        if (Array.isArray(value)) return value.length > 0;
        if (typeof value === "boolean") return value;
        return String(value || "").trim() !== "";
      });
    }

    function saveCurrentDraftNow() {
      if (recoveryMutationBlocked() || !settings.enableAutoSave) return false;
      const draft = collectAutosaveDraft();
      if (!draft) return false;
      const drafts = loadAutosaveDrafts();
      const workflowDraft = draft.key.startsWith("workflow:");
      if (workflowDraft || hasDraftContent(draft.fields)) drafts[draft.key] = draft;
      else delete drafts[draft.key];
      if (workflowDraft) {
        drafts[ACTIVE_WORKFLOW_DRAFT_KEY] = {
          type: "aiConfirmActions",
          proposalId: view.aiConfirmProposalId,
          draftKey: draft.key,
          updatedAt: draft.updatedAt
        };
      }
      saveAutosaveDrafts(drafts);
      return true;
    }

    function scheduleAutosave() {
      if (recoveryMutationBlocked() || !settings.enableAutoSave) return false;
      if (autosaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(autosaveTimer);
      }
      const delay = window.setTimeout || setTimeout;
      const scheduledEpoch = recoveryEpoch;
      autosaveTimer = delay(() => {
        autosaveTimer = null;
        if (!recoveryEpochIsCurrent(scheduledEpoch)) return;
        saveCurrentDraftNow();
      }, 180);
      return true;
    }

    function restoreAutosaveDraft() {
      if (!settings.enableAutoSave) return;
      const key = autosaveDraftKey();
      if (!key) return;
      const drafts = loadAutosaveDrafts();
      const draft = drafts[key] || (key === "capture:main" ? drafts["screen:quick"] : null);
      if (!draft || !draft.fields) return;
      Object.entries(draft.fields).forEach(([id, value]) => {
        if (id === autosaveRestoreSkipTargetId) return;
        const el = document.getElementById(id);
        if (!isAutosaveField(el)) return;
        if (el.type === "checkbox") el.checked = Boolean(value);
        else el.value = value;
      });
      const quickText = document.getElementById("quick-text");
      if (quickText) view.quickGrabDraftText = quickText.value;
      const todayText = document.getElementById("today-capture-text");
      if (todayText) view.todayCaptureDraftText = todayText.value;
    }

    function clearAutosaveDraft(key = autosaveDraftKey()) {
      if (!key) return;
      const drafts = loadAutosaveDrafts();
      if (!drafts[key] && drafts[ACTIVE_WORKFLOW_DRAFT_KEY]?.draftKey !== key) return;
      delete drafts[key];
      if (drafts[ACTIVE_WORKFLOW_DRAFT_KEY]?.draftKey === key) delete drafts[ACTIVE_WORKFLOW_DRAFT_KEY];
      saveAutosaveDrafts(drafts);
    }

    function clearActiveWorkflowRecovery(proposalId = "") {
      const drafts = loadAutosaveDrafts();
      const active = drafts[ACTIVE_WORKFLOW_DRAFT_KEY];
      const activeProposalId = String(active?.proposalId || "");
      if (proposalId && activeProposalId && activeProposalId !== String(proposalId)) return false;
      const expectedDraftKey = activeProposalId ? `workflow:ai-confirm:${activeProposalId}` : "";
      if (expectedDraftKey && active?.draftKey === expectedDraftKey) delete drafts[expectedDraftKey];
      delete drafts[ACTIVE_WORKFLOW_DRAFT_KEY];
      saveAutosaveDrafts(drafts);
      return true;
    }

    function restoreInterruptedWorkflow() {
      if (!settings.enableAutoSave || view.encryptionLocked) return false;
      const drafts = loadAutosaveDrafts();
      const active = drafts[ACTIVE_WORKFLOW_DRAFT_KEY];
      if (!active || active.type !== "aiConfirmActions" || !active.proposalId) return false;
      const expectedDraftKey = `workflow:ai-confirm:${active.proposalId}`;
      if (active.draftKey !== expectedDraftKey) {
        clearActiveWorkflowRecovery(active.proposalId);
        return false;
      }
      const proposal = aiProposalById(active.proposalId);
      if (!proposal || !aiProposalCanExecute(proposal) || proposal.result?.executedAt) {
        clearActiveWorkflowRecovery(active.proposalId);
        return false;
      }
      const fields = drafts[active.draftKey]?.fields || {};
      const selectedPerson = String(fields["ai-confirm-person-choice"] || "");
      view.screen = "aiConfirmActions";
      view.aiConfirmProposalId = proposal.id;
      view.aiConfirmActionIndexes = selectedAiActionIndexes(proposal.id);
      view.aiConfirmPersonChoice = selectedPerson === "new"
        ? { mode: "new", newPersonName: String(fields["ai-confirm-new-person-name"] || "") }
        : selectedPerson
          ? { mode: "existing", existingPersonId: selectedPerson }
          : {};
      view.aiConfirmValidationErrors = [];
      view.aiConfirmValidationWarnings = [];
      view.sheet = null;
      view.aiReviewFocusId = proposal.id;
      return true;
    }

    function clearAllAutosaveDrafts() {
      autosaveDraftsCache = {};
      localStorage.removeItem(AUTOSAVE_KEY);
      deleteFromIndexedDb(AUTOSAVE_KEY).catch(() => {});
      if (settings?.localEncryptionEnabled) scheduleVaultSave();
    }

    function parseQuickGrab(rawContent, tags = [], urgency = "Whenever", peopleList = null) {
      const raw = rawContent.trim();
      const lower = raw.toLowerCase();
      const knownPeople = peopleList || (db && db.people ? db.people : []);
      const related = knownPeople.find(person => {
        const name = String(person?.name || "").trim().toLowerCase();
        if (!name) return false;
        return lower.includes(name.split(" ")[0]) || lower.includes(name);
      }) || null;
      const hasPrayer = /\bpray|prayer|sick|surgery|wisdom|anxiety|hard\b/i.test(raw);
      const hasMeeting = /\bmet|coffee|talked|lunch|meeting|called|sat down\b/i.test(raw);
      const hasFollow = /\bfollow up|check in|remind me|ask .* about|send .* text|send .* note\b/i.test(raw);
      let category = "Unsure";
      if (tags.length) category = tags.find(tag => CATEGORIES.includes(tag)) || "Unsure";
      else if (/\bdonor|supporter|alumni\b/i.test(raw)) category = "Donors";
      else if (/\bpray|prayer|sick|surgery\b/i.test(raw)) category = "Prayer";
      else if (/\bsermon|lesson|illustration|teaching|bible study\b/i.test(raw)) category = "Teaching";
      else if (/\bcups|large group|retreat|calendar|event\b/i.test(raw)) category = "Events";
      else if (related || hasMeeting || hasFollow) category = "People";
      let followUpDate = "";
      if (/next friday/i.test(raw)) followUpDate = nextWeekday(5);
      else if (/next tuesday/i.test(raw)) followUpDate = nextWeekday(2);
      else if (/tomorrow/i.test(raw)) followUpDate = daysFromNow(1);
      else if (/next week/i.test(raw)) followUpDate = daysFromNow(7);
      else if (/this week/i.test(raw)) followUpDate = daysFromNow(3);
      let remindAt = "";
      if (urgency === "Today") remindAt = todayISO();
      if (urgency === "Soon") remindAt = daysFromNow(1);
      if (urgency === "Important") remindAt = todayISO();
      return {
        detectedPersonName: related ? related.name : guessPersonName(raw),
        relatedPersonId: related ? related.id : "",
        detectedDate: hasMeeting ? todayISO() : "",
        detectedPrayerRequest: hasPrayer ? extractPrayer(raw) : "",
        detectedFollowUp: hasFollow ? extractFollowUp(raw) : "",
        detectedFollowUpDate: followUpDate,
        detectedMeetingSummary: hasMeeting ? raw : "",
        category,
        remindAt
      };
    }

    function nextWeekday(dayIndex) {
      const d = new Date();

    function guessPersonName(raw) {
      const match = raw.match(/\b(?:with|to|from|ask|called|met with|coffee with)\s+([A-Z][a-z]+(?:\s+[A-Z][a-z]+)?)/);
      return match ? match[1].replace(/\.$/, "") : "";

    function extractPrayer(raw) {
      const prayerMatch = raw.match(/(?:pray(?:er)?\s*(?:for)?|needs prayer for)\s+([^.!?]+[.!?]?)/i);
      if (prayerMatch) return cleanSentence(prayerMatch[1]);
      const sickMatch = raw.match(/([^.!?]*(?:sick|surgery|anxiety|wisdom)[^.!?]*[.!?]?)/i);
      return sickMatch ? cleanSentence(sickMatch[1]) : raw;
    }

    function extractFollowUp(raw) {
      const followMatch = raw.match(/((?:follow up|check in|remind me|ask|send)[^.!?]*[.!?]?)/i);

    function bindSheetAccessibility() {
      const panel = document.querySelector("[data-sheet-panel]");

      [document.querySelector(".shell"), document.querySelector(".mobile-nav")].filter(Boolean).forEach(region => {
        region.inert = true;

      const focusableSelector = 'button:not([disabled]), input:not([disabled]), select:not([disabled]), textarea:not([disabled]), a[href], [tabindex]:not([tabindex="-1"])';
      const focusableControls = () => typeof panel.querySelectorAll === "function"
        ? Array.from(panel.querySelectorAll(focusableSelector)).filter(control => control.getAttribute?.("aria-hidden") !== "true")
        : [];

        if (event.key === "Escape") {

        const first = controls[0];
        const last = controls[controls.length - 1];
        if (event.shiftKey && (document.activeElement === first || !panel.contains(document.activeElement))) {
          event.preventDefault();
          last.focus();

      const preferred = typeof panel.querySelector === "function"
        ? panel.querySelector("[autofocus]:not([disabled]), textarea:not([disabled]), input:not([disabled]), select:not([disabled])")
        : null;

          const right = calendarDayDelta(b.dueDate, reference);
          if (left === null && right !== null) return 1;
          if (left !== null && right === null) return -1;
          if (left !== right) return (left ?? 0) - (right ?? 0);

    function hashPin(pin) {

      for (let index = 0; index < String(pin).length; index += 1) {

      }
      return (hash >>> 0).toString(36);

    async function unlockVault() {
      const input = document.getElementById("vault-passphrase");
      const passphrase = input ? input.value : "";
      if (!passphrase) {
        reportFieldError(input, "Enter your vault passphrase.");
        return;
      }
      const unlockAttemptId = ++vaultUnlockAttemptSequence;
      const unlockEpoch = recoveryEpoch;
      let rawEnvelope = "";
      const ownership = () => {
        if (!recoveryEpochIsCurrent(unlockEpoch) || unlockAttemptId !== vaultUnlockAttemptSequence) return "stale";
        try {
          if ((localStorage.getItem(ENCRYPTED_STORAGE_KEY) || "") !== rawEnvelope) return "changed";
        } catch (_error) {
          return "changed";
        }
        return "current";
      };
      const reportStorageRetry = message => {
        input?.removeAttribute?.("aria-invalid");
        input?.focus?.({ preventScroll: false });
        showToast(message, "error");
        return false;
      };
      try {
        rawEnvelope = localStorage.getItem(ENCRYPTED_STORAGE_KEY) || "";
        const envelope = JSON.parse(rawEnvelope || "{}");
        const payload = await decryptPayload(envelope, passphrase);
        const currentOwnership = ownership();
        if (currentOwnership === "stale") return false;
        if (currentOwnership === "changed") return reportStorageRetry(VAULT_ENVELOPE_RETRY_MESSAGE);
        let stagedData;
        let stagedCopy;
        let stagedDrafts;
        let stagedAutoMemory;
        try {
          classifyStoredDataSchema(payload?.data);
          const ownsAutoMemory = isPlainBackupObject(payload)
            && Object.prototype.hasOwnProperty.call(payload, "autoMemoryVault");
          const rawAutoMemory = ownsAutoMemory ? payload.autoMemoryVault : emptyAutoMemoryVault();
          classifyAutoMemoryVault(rawAutoMemory);
          rawAutoMemory.snapshots.forEach(snapshot => {
            if (!isPlainBackupObject(snapshot)) throw autoMemorySchemaError();
            classifyAutoMemorySnapshotPayload(snapshot.payload);
          });
          stagedData = normalizeData(payload.data);
          stagedCopy = payload.customCopy && typeof payload.customCopy === "object" ? payload.customCopy : {};
          stagedDrafts = payload.autosaveDrafts && typeof payload.autosaveDrafts === "object" ? payload.autosaveDrafts : {};
          stagedAutoMemory = normalizeAutoMemoryVault(rawAutoMemory);
        } catch (_error) {
          return reportStorageRetry(VAULT_SCHEMA_RETRY_MESSAGE);
        }
        const publicationOwnership = ownership();
        if (publicationOwnership === "stale") return false;
        if (publicationOwnership === "changed") return reportStorageRetry(VAULT_ENVELOPE_RETRY_MESSAGE);
        db = stagedData;
        customCopy = stagedCopy;
        autosaveDraftsCache = stagedDrafts;
        memoryVaultCache = stagedAutoMemory;
        vaultPassphrase = passphrase;
        view.encryptionLocked = false;
        view.locked = Boolean(settings.appLockEnabled && settings.pinHash);
        localStorage.removeItem(STORAGE_KEY);
        localStorage.removeItem(COPY_KEY);
        localStorage.removeItem(AUTO_MEMORY_KEY);
        restoreInterruptedWorkflow();
        initializeAutoMemoryVault();
        showToast("Encrypted storage unlocked.");
        if (!view.locked) requestPageHeadingFocus();
        render();
        return true;
      } catch (error) {
        const currentOwnership = ownership();
        if (currentOwnership === "stale") return false;
        if (currentOwnership === "changed") return reportStorageRetry(VAULT_ENVELOPE_RETRY_MESSAGE);
        console.warn("Could not unlock encrypted storage", error);
        reportFieldError(input, "Passphrase did not unlock storage.");
        return false;
      }
    }

    async function enableLocalEncryptionRecord(passphrase, hint = "") {
      if (!canUseWebCrypto()) {
        showToast("Encrypted storage is not available in this browser.");
        return false;
      }
      if (!passphrase || passphrase.length < 8) {
        showToast("Use at least 8 characters.");
        return false;
      }
      return withActiveMutation("device-vault-enable", async () => {
      const previous = {
        settings: cloneJson(settings),
        autosaveDraftsCache,
        memoryVaultCache,
        vaultPassphrase,
        requestedRevision: vaultSaveRequestedRevision,
        completedRevision: vaultSaveCompletedRevision
      };
      const persistenceKeys = [SETTINGS_KEY, CALM_MODE_KEY, STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, ENCRYPTED_STORAGE_KEY, AUTO_MEMORY_KEY];
      const persistenceSnapshot = localStorageSnapshot(persistenceKeys);
      const previousDrafts = loadAutosaveDrafts();
      const previousMemory = loadAutoMemoryVault();
      autosaveDraftsCache = previousDrafts;
      memoryVaultCache = previousMemory;
      vaultPassphrase = passphrase;
      settings.localEncryptionEnabled = true;
      settings.localEncryptionHint = String(hint || "").trim();
      const saved = await persistEncryptedVault();
      if (!saved) {
        settings = previous.settings;
        autosaveDraftsCache = previous.autosaveDraftsCache;
        memoryVaultCache = previous.memoryVaultCache;
        vaultPassphrase = previous.vaultPassphrase;
        vaultSaveRequestedRevision = previous.requestedRevision;
        vaultSaveCompletedRevision = previous.completedRevision;
        restoreLocalStorageSnapshot(persistenceSnapshot);
        if (canUseIndexedDb()) {
          try {
            await idbTransaction("readwrite", SETTINGS_KEY, settings);
            await idbTransaction("readwrite", STORAGE_KEY, db);
            await idbTransaction("readwrite", COPY_KEY, customCopy);
            if (previousDrafts && Object.keys(previousDrafts).length) await idbTransaction("readwrite", AUTOSAVE_KEY, previousDrafts);
            else await deleteFromIndexedDb(AUTOSAVE_KEY);
            if (previousMemory && previousMemory.snapshots?.length) await idbTransaction("readwrite", AUTO_MEMORY_KEY, previousMemory);
            else await deleteFromIndexedDb(AUTO_MEMORY_KEY);
            const previousEnvelope = persistenceSnapshot.get(ENCRYPTED_STORAGE_KEY);
            if (previousEnvelope) await idbTransaction("readwrite", ENCRYPTED_STORAGE_KEY, JSON.parse(previousEnvelope));
            else await deleteFromIndexedDb(ENCRYPTED_STORAGE_KEY);
          } catch (restoreError) {
            console.warn("Could not fully restore IndexedDB after failed vault setup", restoreError);
          }
        }
        showToast("Encrypted storage could not be enabled.");
        return false;
      }
      undoStack = [];
      undoGeneration += 1;
      return true;
      });
    }

          [AUTOSAVE_KEY, drafts ? JSON.stringify(drafts) : null],
          [AUTO_MEMORY_KEY, memory ? JSON.stringify(memory) : null],
          [SETTINGS_KEY, JSON.stringify(nextSettings)],
          [CALM_MODE_KEY, nextSettings.calmMode ? "on" : "off"],
          [ENCRYPTED_STORAGE_KEY, null]
        ]);
        if (canUseIndexedDb()) {
          await writeIndexedDbBatch([
            [STORAGE_KEY, db],
            [COPY_KEY, customCopy],
            [AUTOSAVE_KEY, drafts || undefined],
            [AUTO_MEMORY_KEY, memory || undefined],
            [SETTINGS_KEY, nextSettings],
            [ENCRYPTED_STORAGE_KEY, undefined]
          ]);
        }
      } catch (error) {
        if (localSnapshot) restoreLocalStorageSnapshot(localSnapshot);
        console.warn("Could not stage plaintext records while disabling encrypted storage", error);
        showToast("Encrypted storage remains on because plaintext records could not be saved.", "error");
        return false;
      }
      settings = nextSettings;
      vaultPassphrase = "";
      autosaveDraftsCache = null;
      memoryVaultCache = null;
      undoStack = [];
      undoGeneration += 1;
      return true;
      });
    }

    function setAppPinRecord(pin) {
      const trimmed = String(pin || "").trim();
      if (!/^\d{4,}$/.test(trimmed)) {
        showToast("Use at least 4 numbers.");
        return false;
      }
      settings.pinHash = hashPin(trimmed);
      settings.appLockEnabled = true;
      saveSettings();
      return true;
    }

    function clearAppPinRecord(pin) {
      if (!settings.pinHash) return false;
      if (!pin || hashPin(String(pin || "").trim()) !== settings.pinHash) {
        showToast("PIN did not match.");
        return false;
      }
      settings.pinHash = "";
      settings.appLockEnabled = false;
      view.locked = false;
      saveSettings();
      return true;
    }

    function lockApp() {
      if (!settings.appLockEnabled || !settings.pinHash) {
        showToast("Set a PIN in Settings first.");
        return;
      }
      view.locked = true;
      render();
    }

    function pendingAttentionCount() {
      return promptQuickGrabs().length + peopleToCareFor().length + taskDueSoon().length;
    }

    async function requestNotifications() {
      if (recoveryMutationBlocked()) return false;
      if (typeof window === "undefined" || !("Notification" in window)) {
        settings.notificationsEnabled = false;
        saveSettings();
        showToast("Notifications are not available in this browser.");
        render();
        return;
      }
      const permissionEpoch = recoveryEpoch;
      let permission = Notification.permission;
      if (permission === "default") permission = await Notification.requestPermission();
      if (!recoveryEpochIsCurrent(permissionEpoch)) return false;
      settings.notificationsEnabled = permission === "granted";
      saveSettings();
      showToast(settings.notificationsEnabled ? "Reminders enabled." : "Notifications were not enabled.");
      render();
      return true;
    }

    function maybeSendReminderNotification() {
      if (!settings.notificationsEnabled || typeof window === "undefined" || !("Notification" in window)) return;
      if (Notification.permission !== "granted") return;
      const today = todayISO();
      if (settings.lastNotificationDate === today) return;
      const count = pendingAttentionCount();
      if (!count) return;
      settings.lastNotificationDate = today;
      saveSettings();
      const body = settings.notificationDigest === "minimal"
        ? "You have ministry items waiting."
        : `${count} item${count === 1 ? "" : "s"} may need attention today.`;
      new Notification("RUF Ministry Hub", { body, tag: "ruf-ministry-hub-digest" });
    }

    const LEGACY_QUICK_GRAB_QUERY_KEYS = [
      "quickgrab",
      "text",
      "note",
      "quickgrabCategory",
      "category",
      "tag",
      "tags",
      "quickgrabUrgency",
      "urgency"
    ];
    const MAX_SHARED_QUICK_GRAB_CHARACTERS = 6000;

    function replaceCurrentSharedCaptureUrl(search, hash) {
      if (typeof window === "undefined" || !window.location || !window.history || typeof window.history.replaceState !== "function") return false;
      try {
        const cleaned = window.location.pathname + (search ? "?" + search : "") + (hash || "");
        window.history.replaceState(window.history.state, "", cleaned);
        return true;
      } catch (error) {
        console.warn("Could not clean the shared capture URL.");
        return false;
      }
    }

    function scrubLegacyQuickGrabQuery() {
      if (typeof window === "undefined" || !window.location) return true;
      const params = new URLSearchParams(window.location.search || "");
      let changed = false;
      LEGACY_QUICK_GRAB_QUERY_KEYS.forEach(key => {
        if (!params.has(key)) return;
        params.delete(key);
        changed = true;
      });
      if (!changed) return true;
      return replaceCurrentSharedCaptureUrl(params.toString(), window.location.hash || "");
    }

    function currentQuickGrabFragment() {
      if (typeof window === "undefined" || !window.location) return { kind: "none" };
      const hash = String(window.location.hash || "");
      if (hash !== "#quickgrab" && !hash.startsWith("#quickgrab=")) return { kind: "none" };
      const body = hash.slice(1);
      if (/%(?![0-9a-f]{2})/i.test(body)) return { kind: "invalid" };
      const params = new URLSearchParams(body);
      const entries = Array.from(params.entries());
      if (entries.length !== 1 || entries[0][0] !== "quickgrab" || params.getAll("quickgrab").length !== 1) return { kind: "invalid" };
      const text = entries[0][1];
      if (!text.trim() || text.length > MAX_SHARED_QUICK_GRAB_CHARACTERS) return { kind: "invalid" };
      return { kind: "capture", text };
    }

    function sharedFragmentQuickGrabEnabled() {
      return normalizeSettings(settings).enableUrlQuickGrab === true;
    }

    function clearPendingFragmentQuickGrab() {
      pendingFragmentQuickGrabText = "";
      sharedFragmentImportDeferred = false;
    }

    function activatePendingFragmentQuickGrab() {
      if (!sharedFragmentQuickGrabEnabled()) {
        clearPendingFragmentQuickGrab();
        return false;
      }
      if (view.startupHydrating) {
        sharedFragmentImportDeferred = Boolean(pendingFragmentQuickGrabText);
        return false;
      }
      if (view.startupRecoveryError) {
        sharedFragmentImportDeferred = Boolean(pendingFragmentQuickGrabText);
        return false;
      }
      if (recoveryMutationBlocked()) {
        sharedFragmentImportDeferred = Boolean(pendingFragmentQuickGrabText);
        return false;
      }
      if (!pendingFragmentQuickGrabText) {
        sharedFragmentImportDeferred = false;
        return false;
      }
      sharedFragmentImportDeferred = false;
      view.quickGrabDraftSource = "shared";
      view.screen = "quick";
      view.quickGrabId = null;
      render();
      return true;
    }

    function importQuickGrabFromCurrentFragment() {
      if (typeof window === "undefined" || !window.location) return false;
      if (!scrubLegacyQuickGrabQuery()) {
        showToast("Shared text could not be opened safely.", "error");
        return false;
      }
      const fragment = currentQuickGrabFragment();
      if (fragment.kind === "none") return false;
      if (!replaceCurrentSharedCaptureUrl(new URLSearchParams(window.location.search || "").toString(), "")) {
        showToast("Shared text could not be opened safely.", "error");
        return false;
      }
      if (fragment.kind !== "capture") {
        showToast("Shared text could not be opened safely.", "error");
        return false;
      }
      if (!sharedFragmentQuickGrabEnabled()) {
        clearPendingFragmentQuickGrab();
        return false;
      }
      pendingFragmentQuickGrabText = fragment.text;
      return activatePendingFragmentQuickGrab();
    }

    function appendQuickGrabDraft(existing, imported) {
      const current = String(existing || "");
      const incoming = String(imported || "");
      if (!incoming.trim()) return current;
      if (!current) return incoming;
      const existingBlocks = current.split(/\n{2,}/).map(block => block.trim()).filter(Boolean);
      if (current === incoming || existingBlocks.includes(incoming)) return current;
      return current.replace(/\s+$/, "") + "\n\n" + incoming;
    }

    function focusQuickGrabTextareaAtEnd(textarea) {
      if (!textarea || typeof textarea.focus !== "function") return;
      textarea.focus();
      const end = textarea.value.length;
      if (typeof textarea.setSelectionRange === "function") textarea.setSelectionRange(end, end);
    }

    function afterVisibleTextareaUpdate(callback) {
      if (typeof window !== "undefined" && typeof window.requestAnimationFrame === "function") {
        window.requestAnimationFrame(() => callback());
        return;
      }
      const defer = typeof window !== "undefined" && window.setTimeout ? window.setTimeout : setTimeout;
      defer(callback, 0);
    }

    function applyPendingFragmentQuickGrabText() {
      if (!sharedFragmentQuickGrabEnabled()) {
        clearPendingFragmentQuickGrab();
        return false;
      }
      if (recoveryMutationBlocked()) return false;
      if (!pendingFragmentQuickGrabText || view.screen !== "quick") return false;
      const textarea = document.getElementById("quick-text");
      if (!textarea) return false;
      const nextText = appendQuickGrabDraft(textarea.value || view.quickGrabDraftText, pendingFragmentQuickGrabText);
      pendingFragmentQuickGrabText = "";
      view.quickGrabDraftText = nextText;
      textarea.value = nextText;
      scheduleAutosave();
      focusQuickGrabTextareaAtEnd(textarea);
      afterVisibleTextareaUpdate(() => showToast("Shared text added to Quick Grab draft."));
      return true;
    }

    function voiceCaptureIsEnabled(value = settings) {
      return Boolean(value?.enableVoiceCapture === true
        && value?.voiceCaptureDisclosureVersion === VOICE_CAPTURE_DISCLOSURE_VERSION);
    }

    function dictationCaptureContext(targetId = "quick-text") {
      return {
        targetId: String(targetId || "quick-text"),
        screen: String(view.screen || ""),
        draftKey: String(autosaveDraftKey() || ""),
        personId: String(view.personId || ""),
        profileCapturePersonId: String(view.profileCapturePersonId || ""),
        profileCaptureDraftTargetId: String(view.profileCaptureDraftTargetId || "")
      };
    }

    function dictationCaptureContextMatches(expected = {}) {
      const current = dictationCaptureContext(expected.targetId);
      return Object.keys(current).every(key => current[key] === expected[key]);
    }

    function clearDictationSession(session) {
      if (!session) return;
      if (session.deadlineTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(session.deadlineTimer);
        session.deadlineTimer = null;
      }
      if (session.recognition) {
        try {
          session.recognition.onresult = null;
          session.recognition.onerror = null;
          session.recognition.onend = null;
        } catch (error) {
          // Some browser speech implementations expose non-writable handlers.
        }
      }
      if (activeDictationSession === session) activeDictationSession = null;
    }

    function bestEffortAbortDictation(session) {
      try {
        if (typeof session?.recognition?.abort === "function") session.recognition.abort();
      } catch (error) {
        // Browser/device behavior is not verified; app state is already detached.
      }
    }

    function failDictationSession(session, options = {}) {
      if (!session || session.finished || activeDictationSession !== session) return false;
      session.finished = true;
      session.transcript = "";
      clearDictationSession(session);
      bestEffortAbortDictation(session);
      if (options.announce !== false) showToast(options.message || "Could not add dictation. Nothing was saved.", "error");
      return false;
    }

    function cancelActiveDictation(options = {}) {
      return activeDictationSession ? failDictationSession(activeDictationSession, options) : false;
    }

    function syncCommittedDictationDraft(targetId, value) {
      if (targetId === "quick-text") view.quickGrabDraftText = value;
      if (targetId === "today-capture-text") view.todayCaptureDraftText = value;
      if (targetId === "profile-capture-text") view.profileCaptureDraftText = value;
    }

    function currentDictationViewDraft(targetId) {
      if (targetId === "quick-text") return view.quickGrabDraftText;
      if (targetId === "today-capture-text") return view.todayCaptureDraftText;
      if (targetId === "profile-capture-text") return view.profileCaptureDraftText;
      return undefined;
    }

    function finishDictationSession(session) {
      if (!session || session.finished || activeDictationSession !== session) return false;
      if (!session.transcript) return failDictationSession(session, { message: "No dictation was added. Nothing was saved." });
      const target = document.getElementById(session.context.targetId);
      if (!voiceCaptureIsEnabled()
        || !recoveryEpochIsCurrent(session.epoch)
        || !dictationCaptureContextMatches(session.context)
        || !target
        || target !== session.target
        || target.isConnected === false) {
        return failDictationSession(session, { announce: false });
      }
      session.finished = true;
      const nextValue = [String(target.value || "").trim(), session.transcript].filter(Boolean).join("\n");
      const previousValue = target.value;
      const previousViewDraft = currentDictationViewDraft(session.context.targetId);
      const hadCaptureMethod = Object.prototype.hasOwnProperty.call(target.dataset, "captureMethod");
      const previousCaptureMethod = target.dataset.captureMethod;
      const supersededAutosaveTimer = autosaveTimer;
      const previousAutosaveDraftsCache = settings.localEncryptionEnabled ? cloneJson(autosaveDraftsCache || {}) : null;
      clearDictationSession(session);
      target.value = nextValue;
      target.dataset.captureMethod = "dictation";
      syncCommittedDictationDraft(session.context.targetId, nextValue);
      if (settings.enableAutoSave) {
        let saved = false;
        try {
          saved = saveCurrentDraftNow() === true;
        } catch (error) {
          saved = false;
        }
        if (!saved) {
          target.value = previousValue;
          if (previousViewDraft !== undefined) syncCommittedDictationDraft(session.context.targetId, previousViewDraft);
          if (hadCaptureMethod) target.dataset.captureMethod = previousCaptureMethod;
          else delete target.dataset.captureMethod;
          if (previousAutosaveDraftsCache) autosaveDraftsCache = previousAutosaveDraftsCache;
          showToast("Could not add dictation. Nothing was saved.", "error");
          return false;
        }
        if (supersededAutosaveTimer && autosaveTimer === supersededAutosaveTimer) {
          const clear = window.clearTimeout || clearTimeout;
          clear(supersededAutosaveTimer);
          autosaveTimer = null;
        }
      }
      showToast("Dictation added to this draft.");
      return true;
    }

    function beginConfirmedDictation(targetId = "quick-text", expectedContext = null) {
      if (recoveryMutationBlocked() || !voiceCaptureIsEnabled() || activeDictationSession) {
        if (activeDictationSession && !recoveryMutationBlocked()) showToast("A dictation request is already in progress.");
        return false;
      }
      const target = document.getElementById(targetId);
      const context = dictationCaptureContext(targetId);
      const Recognition = typeof window !== "undefined" && (window.SpeechRecognition || window.webkitSpeechRecognition);
      if (!target || target.isConnected === false || (expectedContext && !dictationCaptureContextMatches(expectedContext)) || !Recognition) {
        showToast("Could not start dictation in this browser. Nothing was saved.", "error");
        return false;
      }

      let recognition = null;
      try {
        recognition = new Recognition();
        recognition.lang = "en-US";
        recognition.interimResults = false;
        recognition.maxAlternatives = 1;
      } catch (error) {
        bestEffortAbortDictation({ recognition });
        showToast("Could not start dictation in this browser. Nothing was saved.", "error");
        return false;
      }

      const session = {
        id: ++dictationSessionSequence,
        epoch: recoveryEpoch,
        context,
        target,
        recognition,
        transcript: "",
        finished: false,
        deadlineTimer: null
      };
      activeDictationSession = session;
      try {
        recognition.onresult = event => {
          if (session.finished || activeDictationSession !== session) return;
          if (!voiceCaptureIsEnabled()
            || !recoveryEpochIsCurrent(session.epoch)
            || !dictationCaptureContextMatches(session.context)
            || document.getElementById(session.context.targetId) !== session.target
            || session.target.isConnected === false) {
            failDictationSession(session, { announce: false });
            return;
          }
          try {
            const spoken = Array.from(event?.results || [])
              .filter(result => result && result.isFinal !== false)
              .map(result => String(result?.[0]?.transcript || "").trim())
              .filter(Boolean)
              .join(" ")
              .trim();
            if (!spoken) return;
            if (spoken.length > MAX_DICTATION_TRANSCRIPT_CHARACTERS) {
              failDictationSession(session);
              return;
            }
            session.transcript = spoken;
          } catch (error) {
            failDictationSession(session);
          }
        };
        recognition.onerror = () => failDictationSession(session);
        recognition.onend = () => finishDictationSession(session);
        const delay = window.setTimeout || setTimeout;
        session.deadlineTimer = delay(() => failDictationSession(session), DICTATION_SESSION_DEADLINE_MS);
        recognition.start();
      } catch (error) {
        return failDictationSession(session, { message: "Could not start dictation in this browser. Nothing was saved." });
      }
      if (activeDictationSession === session) showToast("Dictation request started. Waiting for speech recognition.");
      return true;
    }

    function renderWithoutRestoringAutosaveTarget(targetId = "") {
      autosaveRestoreSkipTargetId = String(targetId || "");
      try {
        render({ mutationEffects: false });
      } finally {
        autosaveRestoreSkipTargetId = "";
      }
    }

    function syncLiveDictationDraft(targetId, target) {
      const value = String(target?.value ?? "");
      if (targetId === "quick-text" && view.screen === "quick") {
        view.quickGrabDraftText = value;
        return true;
      }
      if (targetId === "today-capture-text" && view.screen === "today") {
        view.todayCaptureDraftText = value;
        return true;
      }
      if (targetId === "profile-capture-text" && view.screen === "person") {
        const composer = typeof target?.closest === "function"
          ? target.closest('[data-capture-composer="profile"]')
          : null;
        const renderedPersonId = String(composer?.dataset?.personId || "");
        if (!personById(renderedPersonId)) return false;
        view.profileCapturePersonId = renderedPersonId;
        view.profileCaptureDraftTargetId = renderedPersonId;
        view.profileCaptureDraftText = value;
        return true;
      }
      return false;
    }

    function openDictationConsentSheet(targetId = "quick-text") {
      if (recoveryMutationBlocked() || !voiceCaptureIsEnabled() || activeDictationSession) return false;
      const target = document.getElementById(targetId);
      if (!target || target.isConnected === false || !syncLiveDictationDraft(targetId, target)) return false;
      view.sheet = { type: "dictation", kind: "start", targetId, context: dictationCaptureContext(targetId) };
      renderWithoutRestoringAutosaveTarget(targetId);
      return true;
    }

    function openVoiceCaptureEnablement() {
      if (recoveryMutationBlocked()) return false;
      view.sheet = { type: "dictation", kind: "enable" };
      render();
      return true;
    }

    function submitVoiceCaptureEnablement() {
      if (recoveryMutationBlocked() || view.sheet?.type !== "dictation" || view.sheet?.kind !== "enable") return false;
      if (!document.getElementById("dictation-confirm")?.checked) {
        reportFieldError("dictation-confirm", "Confirm that you understand how browser or device speech recognition is controlled.");
        return false;
      }
      const previous = cloneJson(settings);
      settings.enableVoiceCapture = true;
      settings.voiceCaptureDisclosureVersion = VOICE_CAPTURE_DISCLOSURE_VERSION;
      try {
        if (!saveSettings()) throw new Error("voice setting not saved");
      } catch (error) {
        settings = previous;
        showToast("Dictation was not enabled. Your previous setting remains in place.", "error");
        render();
        return false;
      }
      view.sheet = null;
      showToast("Dictation is enabled. You will confirm before each start.");
      render();
      restoreSheetReturnFocus();
      return true;
    }

    function submitDictationStartSheet() {
      const sheet = view.sheet?.type === "dictation" && view.sheet?.kind === "start" ? view.sheet : null;
      if (!sheet || recoveryMutationBlocked() || !voiceCaptureIsEnabled()) return false;
      if (!document.getElementById("dictation-confirm")?.checked) {
        reportFieldError("dictation-confirm", "Confirm that you want to start browser or device speech recognition now.");
        return false;
      }
      const targetId = sheet.targetId;
      const expectedContext = sheet.context;
      view.sheet = null;
      renderWithoutRestoringAutosaveTarget(targetId);
      restoreSheetReturnFocus();
      return beginConfirmedDictation(targetId, expectedContext);
    }

    function startDictation(targetId = "quick-text") {
      return openDictationConsentSheet(targetId);
    }

    function isPinnedPerson(id) {
      return settings.pinnedPersonIds.includes(id);
    }

    function togglePinnedPerson(id) {
      if (recoveryMutationBlocked()) return false;
      const pinned = new Set(settings.pinnedPersonIds);
      if (pinned.has(id)) pinned.delete(id);
      else pinned.add(id);
      settings.pinnedPersonIds = Array.from(pinned);
      saveSettings();
      showToast(pinned.has(id) ? "Person pinned." : "Person unpinned.");
      render();
      return true;
    }

    function recordRecentPerson(id) {
      if (recoveryMutationBlocked()) return false;
      if (!id) return false;
      settings.recentPersonIds = [id, ...settings.recentPersonIds.filter(existing => existing !== id)].slice(0, 8);
      saveSettings();
      return true;
    }

    function peopleFromIds(ids) {
      return ids.map(id => personById(id)).filter(Boolean);
    }

    function normalizedName(name) {
      return String(name || "").toLowerCase().replace(/[^a-z0-9 ]+/g, "").replace(/\s+/g, " ").trim();
    }

    function duplicatePersonPairs(sourcePeople, limit = 12) {
      const people = sourcePeople.map(person => {
        const name = normalizedName(person.name).slice(0, 160);
        const parts = name.split(" ").filter(Boolean);
        return {
          person,
          name,
          first: parts[0] || "",
          last: parts.at(-1) || "",
          prefix: name.slice(0, 3),
          lengthBand: Math.floor(name.length / 4)
        };
      });
      const pairs = [];
      const indexes = new Map();
      const compared = new Set();
      const maximumComparisons = Math.max(600, Math.min(12000, people.length * 24));
      let comparisons = 0;
      const candidateKeys = entry => [
        `first:${entry.first}`,
        `last:${entry.last}`,
        `prefix:${entry.prefix}`,
        `length:${entry.lengthBand}`,
        `length:${entry.lengthBand - 1}`,
        `length:${entry.lengthBand + 1}`
      ].filter(key => !key.endsWith(":"));
      for (let i = 0; i < people.length; i += 1) {
        const b = people[i];
        if (!b.name) continue;
        const candidates = new Set();
        for (const key of candidateKeys(b)) {
          const bucket = indexes.get(key) || [];
          bucket.slice(-32).forEach(index => candidates.add(index));
        }
        for (const j of candidates) {
          if (comparisons >= maximumComparisons) break;
          const pairKey = `${j}:${i}`;
          if (compared.has(pairKey)) continue;
          compared.add(pairKey);
          comparisons += 1;
          const a = people[j];
          const sameFirst = a.first && a.first === b.first;
          const contained = a.name.includes(b.name) || b.name.includes(a.name);
          const close = contained || levenshtein(a.name, b.name, 3) <= 3;
          if (sameFirst || close) pairs.push([a.person, b.person]);
          if (pairs.length === limit) return pairs;
        }
        for (const key of candidateKeys(b)) {
          const bucket = indexes.get(key) || [];
          bucket.push(i);
          if (bucket.length > 64) bucket.shift();
          indexes.set(key, bucket);
        }
        if (comparisons >= maximumComparisons) break;
      }
      return pairs;
    }

    function findDuplicatePeople() {
      return duplicatePersonPairs(db.people);
    }

    function mergePeopleRecord(fromId, toId) {
      if (recoveryMutationBlocked()) return false;
      if (!fromId || !toId || fromId === toId) return;
      const from = personById(fromId);
      const to = personById(toId);
      if (!from || !to) return;
      recordUndo("person merge");
      ["notes", "meetingNotes", "prayerRequests", "tasks", "quickGrabs"].forEach(collection => {
        db[collection].forEach(record => {
          if (record.relatedPersonId === fromId) record.relatedPersonId = toId;
        });
      });
      Object.keys(to).forEach(key => {
        if ((to[key] === "" || to[key] === null || to[key] === undefined) && from[key]) to[key] = from[key];
      });
      to.updatedAt = nowISO();
      db.people = db.people.filter(person => person.id !== fromId);
      settings.pinnedPersonIds = Array.from(new Set(settings.pinnedPersonIds.map(id => id === fromId ? toId : id))).filter(id => personById(id));
      settings.recentPersonIds = Array.from(new Set(settings.recentPersonIds.map(id => id === fromId ? toId : id))).filter(id => personById(id));
      saveData();
      saveSettings();
      return to;
    }

    function render(options = {}) {
      const allowMutationEffects = options.mutationEffects !== false;
      captureFocusedControl();
      if (view.startupHydrating) {
        document.getElementById("app").innerHTML = `
          <main id="main-content" class="lock-screen" role="status" aria-live="polite" aria-busy="true" tabindex="-1">
            <div class="lock-panel">
              <h1 class="lock-title">Opening Calm OS</h1>
              <p class="page-kicker">Checking this device for your latest private local data…</p>
            </div>
          </main>
        `;
        return;
      }
      if (view.startupRecoveryError) {
        document.getElementById("app").innerHTML = `
          <main id="main-content" class="lock-screen" role="alert" tabindex="-1">
            <div class="lock-panel">
              <h1 class="lock-title">Local data check paused</h1>
              <p class="page-kicker">${escapeHtml(view.startupRecoveryError)}</p>
              <button class="button primary full" data-action="startup-retry">Retry local recovery</button>
              <p class="meta">Calm OS will not open or replace data until this check succeeds.</p>
            </div>
          </main>
        `;
        bindScreen();
        return;
      }
      if (recoveryTransactionPending) {
        const restoring = recoveryTransactionKind === "restore";
        const app = document.getElementById("app");
        app.setAttribute?.("aria-busy", "true");
        app.innerHTML = `
          <main id="main-content" class="lock-screen" role="status" aria-live="polite" aria-busy="true" tabindex="-1">
            <div class="lock-panel">
              <h1 class="lock-title">${restoring ? "Restoring backup…" : "Undoing last change…"}</h1>
              <p class="page-kicker">Keep Calm OS open. Records, drafts, and private local recovery are being saved as one transaction.</p>
            </div>
          </main>
        `;
        return;
      }
      if (recoveryRetryRequired()) {
        const app = document.getElementById("app");
        app.removeAttribute?.("aria-busy");
        app.innerHTML = `
          <main id="main-content" class="lock-screen" role="alert" aria-live="assertive" tabindex="-1">
            <div class="lock-panel">
              <h1 class="lock-title">Recovery needs a retry</h1>
              <p class="page-kicker">The earlier Undo stopped safely before changing local records. Retry that same Undo to finish recovery.</p>
              <button class="button primary full" data-action="undo-last">Retry Undo</button>
            </div>
          </main>
        `;
        bindScreen();
        return;
      }
      document.getElementById("app").removeAttribute?.("aria-busy");
      if (allowMutationEffects) applyAutoArchiveAnswered();
      if (view.encryptionLocked) {
        document.getElementById("app").innerHTML = renderVaultUnlockScreen();
        bindScreen();
        return;
      }
      if (view.locked) {
        document.getElementById("app").innerHTML = renderLockScreen();
        bindScreen();
        return;
      }
      const active = view.screen === "person"
        ? "people"
        : ["snooze", "review", "aiReview", "aiConfirmActions"].includes(view.screen)
          ? "quick"
          : ["search", "autopilot", "minutes", "weekly", "coach", "duplicates", "readiness", "manual", "advancedSettings"].includes(view.screen)
            ? "settings"
            : view.screen;
      const navHtml = NAV.map(([key, label]) =>
        `<button class="${active === key ? "active" : ""}" data-action="nav" data-screen="${key}"${active === key ? ' aria-current="page"' : ""}>${escapeHtml(label)}</button>`
      ).join("");
      const mobileNavHtml = NAV.map(([key, label]) =>
        `<button class="${active === key ? "active" : ""}" data-action="nav" data-screen="${key}"${active === key ? ' aria-current="page"' : ""}>${escapeHtml(label)}</button>`
      ).join("");
      document.getElementById("app").innerHTML = `
        <div class="app-frame ${view.focusMode ? "focus-mode" : ""} ${settings.showAdvancedActions ? "advanced-actions" : ""}">
          <nav class="mobile-nav" aria-label="Primary">${mobileNavHtml}</nav>
          <div class="shell">
            <aside class="sidebar">
              <div class="brand">
                <div class="brand-title">${editableCopy("brand.title", "Calm OS")}</div>
                <div class="brand-subtitle">${editableCopy("brand.subtitle", "RUF Ministry Hub · Remember people clearly.")}</div>
              </div>
              <nav class="nav" aria-label="Primary">${navHtml}</nav>
              <div class="sidebar-note">${editableCopy("sidebar.privacy", "Private ministry notes belong here carefully. Use enough detail to care well, not everything.")}</div>
            </aside>
            <main class="content" id="main-content" tabindex="-1">
	              ${view.screen === "today" ? "" : renderUpdateNotice()}
	              ${renderScreen()}
	            </main>
          </div>
          ${renderSheet()}
        </div>
      `;
      bindScreen();
      bindDynamicAccessibility();
      applyPendingFocusDescriptor();
      if (allowMutationEffects) {
        applyPendingFragmentQuickGrabText();
        maybeSendReminderNotification();
      }
    }

    function applyAutoArchiveAnswered() {
      if (settings.autoArchiveAnsweredDays === "never") return;
      const days = Number(settings.autoArchiveAnsweredDays);
      if (!days) return;
      const cutoff = Date.now() - days * 24 * 60 * 60 * 1000;
      let changed = false;
      db.prayerRequests.forEach(prayer => {
        const answeredAt = prayer.answeredAt || prayer.updatedAt;
        if (prayer.status === "Answered" && answeredAt && new Date(answeredAt).getTime() <= cutoff) {
          prayer.status = "Archived";
          prayer.archivedAt = todayISO();
          prayer.archivedFromStatus = "Answered";
          prayer.updatedAt = nowISO();
          changed = true;
        }
      });
      if (changed) saveData();
    }

    function renderTopbar(title, kicker = "") {
      const titleKey = "topbar.title." + slugifyCopyKey(title);
      const kickerKey = "topbar.kicker." + slugifyCopyKey(title);
      return `
        <div class="topbar">
          <div>
            <h1 class="page-title">${editableCopy(titleKey, title)}</h1>
            ${kicker ? `<p class="page-kicker">${editableCopy(kickerKey, kicker)}</p>` : ""}
          </div>
          <div class="top-actions">
            ${view.undoSaving ? `<span class="meta" role="status" aria-live="polite" aria-busy="true">Undoing last change…</span>` : ""}
            ${settings.enableUndo && undoStack.length ? `<button class="button small" data-action="undo-last" ${view.undoSaving ? `disabled aria-disabled="true" aria-busy="true"` : ""}>${view.undoSaving ? "Undoing…" : "Undo"}</button>` : ""}
            ${settings.appLockEnabled && settings.pinHash ? `<button class="button small" data-action="lock-app">Lock</button>` : ""}
          </div>
        </div>
      `;
    }

    function renderScreen() {
      if (view.screen === "today") return renderToday();
      if (view.screen === "quick") return renderQuickGrab();
      if (view.screen === "review") return renderReviewQueue();
      if (view.screen === "search") return renderSearch();
      if (view.screen === "aiReview") return renderAiReview();
      if (view.screen === "aiConfirmActions") return renderConfirmAiActions();
      if (view.screen === "snooze") return renderSnooze();
      if (view.screen === "people") return renderPeople();
      if (view.screen === "person") return renderPersonProfile();
      if (view.screen === "prayer") return renderPrayerRequests();
      if (view.screen === "minutes") return renderFifteenMinutes();
      if (view.screen === "weekly") return renderWeeklyReset();
      if (view.screen === "coach") return renderAppCoach();
      if (view.screen === "duplicates") return renderDuplicateManager();
      if (view.screen === "readiness") return renderReadinessCheck();
      if (view.screen === "manual") return renderAppManual();
      if (view.screen === "settings") return renderMore();
      if (view.screen === "advancedSettings") return renderAdvancedSettings();
      if (view.screen === "autopilot") return renderAutopilot();
      return renderToday();
    }

    function todayCareWindowDays(person = {}) {
      const care = String(person.careLevel || "").toLowerCase();
      if (/pastoral|urgent/.test(care)) return 7;
      if (/pray this week|check in soon/.test(care)) return 14;
      if (/get to know|leader/.test(care)) return 30;
      if (/donor/.test(care)) return 60;
      if (/low touch/.test(care)) return 90;
      return 45;
    }

    function todayRecommendationDeferred(recommendation, reference, appSettings = settings) {
      const deferral = appSettings.todayRecommendationDeferrals?.[recommendation.id];
      if (!deferral || typeof deferral !== "object") return false;
      const today = localISODate(reference);
      if (recommendation.proactive && deferral.dismissedOn === today) return true;
      return Boolean(deferral.returnDate && calendarDayDelta(deferral.returnDate, reference) > 0);
    }

    function buildTodayRecommendations(reference = new Date(), data = db, appSettings = settings) {
      const people = Array.isArray(data.people) ? data.people : [];
      const tasks = Array.isArray(data.tasks) ? data.tasks : [];
      const captures = Array.isArray(data.quickGrabs) ? data.quickGrabs : [];
      const prayers = Array.isArray(data.prayerRequests) ? data.prayerRequests : [];
      const personMap = personMapFrom(people);
      const prayerMap = new Map(prayers.map(prayer => [prayer.id, prayer]));
      const candidatesByTier = new Map();
      const MAX_TODAY_CANDIDATES_PER_TIER = 24;
      const prioritizedCaptureIds = new Set();
      const compareRecommendations = (a, b) => String(a.sortDate || "9999").localeCompare(String(b.sortDate || "9999"))
        || String(a.id || "").localeCompare(String(b.id || ""));
      const add = recommendation => {
        if (!recommendation?.id || todayRecommendationDeferred(recommendation, reference, appSettings)) return;
        const bucket = candidatesByTier.get(recommendation.tier) || [];
        bucket.push(recommendation);
        bucket.sort(compareRecommendations);
        if (bucket.length > MAX_TODAY_CANDIDATES_PER_TIER) bucket.length = MAX_TODAY_CANDIDATES_PER_TIER;
        candidatesByTier.set(recommendation.tier, bucket);
      };
      const personDetail = person => aiPrivacyTierForRecord(person, "people") === "Normal"
        ? String(person.followUpReason || "A follow-up is ready.")
        : "Sensitive care detail hidden.";
      const personLabel = (person, fallback = "this person") => recordIsSensitive(person, "people")
        ? "a private person"
        : String(person?.name || fallback);

      people.forEach(person => {
        if (!personIsActive(person)) return;
        const delta = calendarDayDelta(person.nextFollowUpDate, reference);
        if (delta === null || delta > 0) return;
        const tier = delta < 0 ? 1 : 2;
        add({
          id: `person-follow-up:${person.id}`,
          tier,
          reasonCode: delta < 0 ? "overdue-person-follow-up" : "person-follow-up-today",
          explanation: delta < 0 ? `Person follow-up is overdue by ${Math.abs(delta)} day(s).` : "Person follow-up is due today.",
          kind: "person",
          recordId: person.id,
          personId: person.id,
          subjectKey: `person:${person.id}`,
          sortDate: person.nextFollowUpDate,
          title: `Follow up with ${personLabel(person)}`,
          detail: personDetail(person),
          dateText: formatFollowUpDate(person.nextFollowUpDate, reference),
          proactive: false
        });
      });

      tasks.forEach(task => {
        if (!taskIsActive(task, reference) || taskIsWaiting(task)) return;
        const delta = calendarDayDelta(task.dueDate, reference);
        if (delta === null || delta > 0) return;
        const relatedPrayer = prayerMap.get(task.relatedPrayerRequestId);
        const person = personMap.get(task.relatedPersonId);
        if (person && !personIsActive(person)) return;
        const sensitive = recordIsSensitive(relatedPrayer, "prayerRequests") || recordIsSensitive(task, "tasks") || recordIsSensitive(person, "people");
        const taskPersonLabel = person && recordIsSensitive(person, "people") ? "a private person" : person?.name;
        add({
          id: `task-due:${task.id}`,
          tier: 3,
          reasonCode: "important-task-due-today",
          explanation: delta < 0 ? `Concrete task is overdue by ${Math.abs(delta)} day(s).` : "Concrete task is due today.",
          kind: "task",
          recordId: task.id,
          personId: person?.id || "",
          subjectKey: person?.id ? `person:${person.id}` : `task:${task.id}`,
          sortDate: task.dueDate,
          title: sensitive ? "Complete a sensitive follow-up" : String(task.title || "Complete this follow-up"),
          detail: sensitive ? "Sensitive follow-up detail hidden." : (taskPersonLabel ? `For ${taskPersonLabel}` : "A concrete follow-up is ready."),
          dateText: formatDueDate(task.dueDate, reference),
          proactive: false
        });
      });

      captures.forEach(capture => {
        if (["Done", "Converted", "Archived"].includes(capture.status)) return;
        if (!recordSnoozeIsDue(capture, reference)) return;
        const dueDelta = calendarDayDelta(capture.remindAt || capture.detectedDate, reference);
        if (capture.urgency !== "Important" && capture.urgency !== "Today" && (dueDelta === null || dueDelta > 0)) return;
        prioritizedCaptureIds.add(capture.id);
        const person = personMap.get(capture.relatedPersonId);
        const sensitive = recordIsSensitive(capture, "quickGrabs") || recordIsSensitive(person, "people");
        add({
          id: `capture-due:${capture.id}`,
          tier: 4,
          reasonCode: "important-or-due-capture",
          explanation: "Capture is marked important, today, or has reached its reminder date.",
          kind: "capture",
          recordId: capture.id,
          personId: capture.relatedPersonId || "",
          subjectKey: `capture:${capture.id}`,
          sortDate: capture.remindAt || capture.createdAt,
          title: "Process this capture",
          detail: sensitive ? "Sensitive capture hidden." : String(capture.rawContent || "Unprocessed capture"),
          dateText: dueDelta !== null && dueDelta <= 0 ? "Ready today" : "Important",
          proactive: false
        });
      });

      prayers.forEach(prayer => {
        if (["Answered", "Archived"].includes(prayer.status)) return;
        if (!recordSnoozeIsDue(prayer, reference)) return;
        const delta = calendarDayDelta(prayer.followUpDate, reference);
        if (delta === null || delta > 0) return;
        const person = personMap.get(prayer.relatedPersonId);
        if (person && !personIsActive(person)) return;
        const sensitive = recordIsSensitive(prayer, "prayerRequests") || recordIsSensitive(person, "people");
        add({
          id: `prayer-follow-up:${prayer.id}`,
          tier: 5,
          reasonCode: "prayer-follow-up-due",
          explanation: delta < 0 ? `Prayer follow-up is overdue by ${Math.abs(delta)} day(s).` : "Prayer follow-up is due today.",
          kind: "prayer",
          recordId: prayer.id,
          personId: person?.id || "",
          subjectKey: person?.id ? `person:${person.id}` : `prayer:${prayer.id}`,
          sortDate: prayer.followUpDate,
          title: sensitive ? "Follow up on a private prayer request" : (person ? `Follow up on prayer with ${personLabel(person)}` : "Follow up on a prayer request"),
          detail: sensitive ? "Sensitive prayer concern hidden." : String(prayer.request || "Prayer follow-up is ready."),
          dateText: formatFollowUpDate(prayer.followUpDate, reference),
          proactive: false
        });
      });

      people.forEach(person => {
        if (!personIsActive(person) || person.nextFollowUpDate) return;
        const daysSince = calendarDayDelta(person.lastMeaningfulInteraction, reference);
        if (daysSince === null || Math.abs(daysSince) < todayCareWindowDays(person) || daysSince > 0) return;
        add({
          id: `care-window:${person.id}`,
          tier: 6,
          reasonCode: "person-beyond-care-window",
          explanation: `Last interaction is beyond the ${todayCareWindowDays(person)}-day care window derived from the saved care level.`,
          kind: "person",
          recordId: person.id,
          personId: person.id,
          subjectKey: `person:${person.id}`,
          sortDate: person.lastMeaningfulInteraction,
          title: `Check in with ${personLabel(person)}`,
          detail: "It has been longer than their saved care rhythm.",
          dateText: formatInteractionDate(person.lastMeaningfulInteraction, reference),
          proactive: false
        });
      });

      captures
        .filter(capture => !prioritizedCaptureIds.has(capture.id))
        .filter(capture => !["Done", "Converted", "Archived"].includes(capture.status))
        .filter(capture => recordSnoozeIsDue(capture, reference))
        .forEach(capture => {
          const person = personMap.get(capture.relatedPersonId);
          const sensitive = recordIsSensitive(capture, "quickGrabs") || recordIsSensitive(person, "people");
          add({
            id: `capture-oldest:${capture.id}`,
            tier: 7,
            reasonCode: "oldest-unprocessed-capture",
            explanation: "This is an unprocessed capture; older captures sort first within this tier.",
            kind: "capture",
            recordId: capture.id,
            personId: capture.relatedPersonId || "",
            subjectKey: `capture:${capture.id}`,
            sortDate: capture.createdAt,
            title: "Sort one saved thought",
            detail: sensitive ? "Sensitive capture hidden." : String(capture.rawContent || "Unprocessed capture"),
            dateText: formatHistoryDate(capture.createdAt, "Captured", reference),
            proactive: false
          });
        });

      const proactivePeople = [
        ...(appSettings.pinnedPersonIds || []),
        ...(appSettings.recentPersonIds || []),
        ...people.map(person => person.id)
      ];
      const proactiveSeen = new Set();
      let proactiveId = "";
      for (const id of proactivePeople) {
        if (!id || proactiveSeen.has(id)) continue;
        proactiveSeen.add(id);
        if (!personMap.has(id) || !personIsActive(personMap.get(id))) continue;
        proactiveId = id;
        break;
      }
      if (proactiveId) {
        const person = personMap.get(proactiveId);
        add({
          id: `proactive:${person.id}`,
          tier: 8,
          reasonCode: "proactive-pastoral-opportunity",
          explanation: "A saved person is available for a proactive, non-urgent act of care.",
          kind: "proactive",
          recordId: person.id,
          personId: person.id,
          subjectKey: `person:${person.id}`,
          sortDate: person.lastMeaningfulInteraction || person.createdAt || "",
          title: `Encourage ${personLabel(person, "someone")}`,
          detail: "No urgent deadline—just a quiet opportunity to care.",
          dateText: "Proactive care",
          proactive: true
        });
      }

      const hasMeaningfulMinistryRecommendation = Array.from(candidatesByTier.keys()).some(tier => Number(tier) < 9);
      if (!hasMeaningfulMinistryRecommendation && (data.people?.length || data.quickGrabs?.length || data.tasks?.length || data.prayerRequests?.length)) {
        if (backupReminderDue()) add({
          id: "maintenance:backup",
          tier: 9,
          reasonCode: "maintenance-backup-only",
          explanation: "No higher ministry recommendation is available and the configured backup rhythm is due.",
          kind: "maintenance",
          recordId: "backup",
          subjectKey: "maintenance:backup",
          sortDate: "",
          title: "Protect this ministry memory",
          detail: backupStatusText(),
          dateText: "Maintenance",
          proactive: true
        });
      }

      const candidates = Array.from(candidatesByTier.values()).flat();
      if (!candidates.length) add({
        id: "quiet:capture",
        tier: 9,
        reasonCode: "quiet-capture-fallback",
        explanation: "No ministry or maintenance action is currently due.",
        kind: "quiet",
        recordId: "capture",
        subjectKey: "quiet:capture",
        sortDate: "",
        title: "Nothing is pressing",
        detail: "Capture anything you want to remember, or return to ministry.",
        dateText: "Clear for now",
        proactive: true
      });

      const sorted = Array.from(candidatesByTier.values()).flat().sort((a, b) => a.tier - b.tier
        || String(a.sortDate || "9999").localeCompare(String(b.sortDate || "9999"))
        || String(a.id || "").localeCompare(String(b.id || "")));
      const seenSubjects = new Set();
      return sorted.filter(item => {
        if (seenSubjects.has(item.subjectKey)) return false;
        seenSubjects.add(item.subjectKey);
        return true;
      });
    }

    function renderTodayCriticalAlert() {
      if (updateAvailable) {
        return `<aside class="notice" data-critical-alert><strong>Update ready.</strong> Finish typing first, then <button class="button quiet small" data-action="app-update">Update now</button></aside>`;
      }
      const records = totalRecordCount();
      const backupAge = backupAgeDays();
      if (records >= 25 && (!settings.lastBackupAt || (backupAge !== null && backupAge >= 60))) {
        const action = sensitiveRecordCount() ? "export-encrypted-json" : "export-json";
        return `<aside class="notice" data-critical-alert><strong>Local ministry memory needs a backup.</strong> <button class="button quiet small" data-action="${action}">Back up</button></aside>`;
      }
      return "";
    }

    function renderTodayRecommendationCard(recommendation) {
      return `
        <div class="calm-card primary" data-recommendation-id="${escapeHtml(recommendation.id)}" data-reason-code="${escapeHtml(recommendation.reasonCode)}">
          <div>
            <div class="eyebrow">Next thing to do</div>
            <h2>${escapeHtml(conciseText(recommendation.title, 96))}</h2>
            <p class="item-preview">${escapeHtml(conciseText(recommendation.detail, 180))}</p>
            <div class="meta">${escapeHtml(recommendation.dateText)}</div>
          </div>
          <div class="action-row">
            <button class="button primary" data-action="today-recommendation-open" data-id="${escapeHtml(recommendation.id)}">${recommendation.kind === "quiet" ? "Capture" : "Do this"}</button>
            <button class="button quiet" data-action="today-recommendation-done" data-id="${escapeHtml(recommendation.id)}">Done</button>
            <button class="button quiet" data-action="today-recommendation-later" data-id="${escapeHtml(recommendation.id)}">Later</button>
          </div>
        </div>
      `;
    }

    function renderTodayAfterItem(recommendation) {
      return `
        <article class="calm-list-row" data-recommendation-id="${escapeHtml(recommendation.id)}" data-reason-code="${escapeHtml(recommendation.reasonCode)}">
          <div><strong>${escapeHtml(conciseText(recommendation.title, 96))}</strong><div class="meta">${escapeHtml(recommendation.dateText)}</div></div>
          <button class="button quiet small" data-action="today-recommendation-open" data-id="${escapeHtml(recommendation.id)}">Open</button>
        </article>
      `;
    }

    function renderToday() {
      const recommendations = buildTodayRecommendations();
      const next = recommendations[0];
      const after = recommendations.slice(1, 3);
      return `
        ${renderTopbar("Today", "What is the next thing to do?", false)}
        ${renderTodayCriticalAlert()}
        <section class="section" data-today-section="next">
          ${renderTodayRecommendationCard(next)}
        </section>
        <section class="section" data-today-section="capture">
          <div class="section-header"><h2 class="section-title">Quick Capture</h2></div>
          ${renderCaptureComposer({ source: "today", compact: true })}
        </section>
        <section class="section" data-today-section="after">
          <div class="section-header"><h2 class="section-title">After that</h2></div>
          ${after.length ? `<div class="calm-list">${after.map(renderTodayAfterItem).join("")}</div>` : `<div class="meta">Nothing else is pressing.</div>`}
        </section>
      `;
    }

    function todayRecommendationById(id) {
      return buildTodayRecommendations().find(item => item.id === id) || null;
    }

    function clearTodayRecommendationDeferral(id) {
      if (!id || !settings.todayRecommendationDeferrals?.[id]) return;
      const next = { ...(settings.todayRecommendationDeferrals || {}) };
      delete next[id];
      settings.todayRecommendationDeferrals = next;
      saveSettings();
    }

    function openTodayRecommendation(id) {
      const recommendation = todayRecommendationById(id);
      if (!recommendation) {
        showToast("That next step has already moved on.");
        render();
        return;
      }
      clearTodayRecommendationDeferral(id);
      if (["person", "proactive"].includes(recommendation.kind)) {
        recordRecentPerson(recommendation.personId);
        view.screen = "person";
        view.personId = recommendation.personId;
        render();
        return;
      }
      if (recommendation.kind === "task") {
        if (recommendation.personId) {
          recordRecentPerson(recommendation.personId);
          view.screen = "person";
          view.personId = recommendation.personId;
        } else {
          view.screen = "minutes";
        }
        render();
        return;
      }
      if (recommendation.kind === "capture") {
        beginCaptureProcessing(recommendation.recordId);
        return;
      }
      if (recommendation.kind === "prayer") {
        view.screen = "prayer";
        view.prayerFilter = "Follow-Up Needed";
        render();
        return;
      }
      if (recommendation.kind === "maintenance") {
        const health = backupHealthState();
        if (health.action === "export-encrypted-json") openDataSafetySheet("encrypted-export");
        else exportJson();
        return;
      }
      view.screen = "quick";
      render();
    }

    function completeTodayRecommendation(id) {
      const recommendation = todayRecommendationById(id);
      if (!recommendation) {
        showToast("That next step is already complete.");
        render();
        return;
      }
      clearTodayRecommendationDeferral(id);
      if (["person", "proactive"].includes(recommendation.kind)) {
        markFollowedUp(recommendation.personId);
        return;
      }
      if (recommendation.kind === "task") {
