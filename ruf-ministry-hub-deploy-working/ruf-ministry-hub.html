    async function submitDataSafetySheet(kind) {
      if (kind === "encrypted-export") {
        if (activeProtectedBackupExport || protectedBackupExportOwnsSheet(view.sheet)) return false;
        const passphrase = document.getElementById("sheet-export-passphrase")?.value || "";
        const confirmPassphrase = document.getElementById("sheet-export-confirm")?.value || "";
        if (!canUseWebCrypto()) {
          showToast("Encrypted backups are not available in this browser.");
          return;
        }
        if (passphrase.length < 8) {
          reportFieldError("sheet-export-passphrase", "Use at least 8 characters.");
          return;
        }
        if (confirmPassphrase !== passphrase) {
          reportFieldError("sheet-export-confirm", "Passphrases did not match.");
          return;
        }
        return exportEncryptedJsonWithPassphrase(passphrase);
      }
      if (kind === "import") {
        const input = document.getElementById("sheet-import-backup-file") || document.getElementById("import-backup-file");
        const file = input && input.files ? input.files[0] : null;
        const passphrase = document.getElementById("sheet-import-passphrase")?.value || "";
        if (!file) {
          reportFieldError(input, "Choose a backup file first.");
          return;
        }
        if (!document.getElementById("sheet-import-confirm")?.checked) {
          reportFieldError("sheet-import-confirm", "Confirm that this should replace local data.");
          return;
        }
        const importEpoch = recoveryEpoch;
        try {
          const payload = await readBackupFilePayload(file, passphrase, { allowPrompt: false });
          if (!recoveryEpochIsCurrent(importEpoch)) return false;
          await applyRestoredPayload(payload);
        } catch (error) {
          if (error?.message === "stale_recovery_epoch" || !recoveryEpochIsCurrent(importEpoch)) return false;
          console.warn("Backup import failed", error);
          const passphraseNeeded = error && error.message === "Encrypted backup needs passphrase.";
          reportFieldError(passphraseNeeded ? "sheet-import-passphrase" : input, passphraseNeeded ? "Enter the backup passphrase." : "That backup could not be imported.");
        }
        return;
      }
      if (kind === "reset-demo") {
        if (settings.resetProtection) {
          const typed = document.getElementById("sheet-reset-confirm-text")?.value.trim() || "";
          if (typed !== "RESET") {
            reportFieldError("sheet-reset-confirm-text", "Type RESET to continue.");
            return;
          }
        } else if (!document.getElementById("sheet-reset-confirm")?.checked) {
          reportFieldError("sheet-reset-confirm", "Confirm the demo reset first.");
          return;
        }
        performDemoDataReset();
      }
    }

    function aiActionSourceQuickGrabId(proposal, action = {}) {
      if (proposal?.sourceType === "quickGrab" && proposal.sourceId) return proposal.sourceId;
      return action.createdFromQuickGrabId || action.sourceQuickGrabId || "";
    }

    function aiActionSourceQuickGrab(proposal, selected = []) {
      const sourceId = selected.map(item => aiActionSourceQuickGrabId(proposal, item.action)).find(Boolean)
        || (proposal?.sourceType === "quickGrab" ? proposal.sourceId : "");
      return sourceId ? db.quickGrabs.find(grab => grab.id === sourceId) || null : null;
    }

    function aiActionExistingPersonId(proposal, sourceQuickGrab, action = {}) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      const explicitCandidates = [
        action.relatedPersonId,
        action.personId,
        action.targetPersonId
      ].filter(Boolean);
      const inferredCandidates = result.personMatchAmbiguous === true
        ? []
        : [result.possiblePersonId, sourceQuickGrab?.relatedPersonId].filter(Boolean);
      const candidates = [...explicitCandidates, ...inferredCandidates];
      return candidates.find(id => personById(id)) || "";
    }

    function aiActionPersonName(proposal, sourceQuickGrab, action = {}) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      return String(action.name || action.personName || result.possiblePersonName || sourceQuickGrab?.detectedPersonName || "").trim();
    }

    function aiBestDetectedPersonName(proposal, sourceQuickGrab, selected = []) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      const candidates = [
        result.possiblePersonName,
        sourceQuickGrab?.detectedPersonName,
        proposal?.detectedPersonName,
        proposal?.title,
        proposal?.summary,
        sourceQuickGrab?.rawContent,
        ...selected.flatMap(item => [item.action?.name, item.action?.personName, item.action?.title, item.action?.label, item.action?.summary])
      ];
      for (const candidate of candidates) {
        const text = String(candidate || "").replace(/[“”"'.:,;!?()[\]{}]/g, " ").replace(/\s+/g, " ").trim();
        if (!text) continue;
        if (/^[A-Z][A-Za-z-]{1,}(?:\s+[A-Z][A-Za-z-]{1,}){0,2}$/.test(text)) return text;
        const match = text.match(/\b(?:with|for|about|text|call|email|meet|meeting with|check in with|follow up with|pray for)\s+([A-Z][A-Za-z-]{1,}(?:\s+[A-Z][A-Za-z-]{1,})?)\b/);
        if (match) return match[1].trim();
      }
      return "";
    }

    function aiSheetPersonChoiceFromDom() {
      const selected = document.getElementById("ai-confirm-person-choice")?.value || "";
      const newPersonName = document.getElementById("ai-confirm-new-person-name")?.value.trim() || "";
      if (selected === "new") return { mode: "new", newPersonName };
      if (selected) return { mode: "existing", existingPersonId: selected };
      return { mode: "", existingPersonId: "", newPersonName };
    }

    function normalizeAiSheetPersonChoice(choice = {}) {
      const mode = choice.mode || "";
      const existingPersonId = mode === "existing" && personById(choice.existingPersonId) ? choice.existingPersonId : "";
      const newPersonName = String(choice.newPersonName || "").trim();
      return {
        mode,
        existingPersonId,
        newPersonName,
        willCreatePerson: mode === "new" && Boolean(newPersonName)
      };
    }

    function aiActionNeedsPerson(action = {}) {
      return ["createMeetingNote", "createPrayerRequest", "createFollowUpTask", "updatePerson"].includes(aiActionType(action));
    }

    function aiActionAllowsUnlinkedNote(action = {}, sourceQuickGrab = null) {
      return aiActionType(action) === "createNote" && (action.noteType === "Teaching Idea" || sourceQuickGrab?.category === "Teaching");
    }

    function aiSafeDate(value, fallback = "") {
      const text = String(value || "").trim();
      return /^\d{4}-\d{2}-\d{2}$/.test(text) ? text : fallback;
    }

    function aiActionText(action = {}, fields = []) {
      for (const field of fields) {
        const value = action[field];
        if (String(value || "").trim()) return String(value).trim();
      }
      return "";
    }

    function aiSafePersonUpdatePatch(action = {}) {
      const source = action.updates && typeof action.updates === "object"
        ? action.updates
        : action.patch && typeof action.patch === "object"
          ? action.patch
          : action.fields && typeof action.fields === "object"
            ? action.fields
            : action;
      const patch = {};
      for (const field of AI_SAFE_PERSON_UPDATE_FIELDS) {
        if (source[field] !== undefined) patch[field] = String(source[field] || "").trim();
      }
      return patch;
    }

    function validateAiActionExecution(proposal, actionIndexes = [], options = {}) {
      const errors = [];
      const warnings = [];
      const duplicatePeople = [];
      const personResolutionErrors = [];
      const actions = Array.isArray(proposal?.proposedActions) ? proposal.proposedActions : [];
      const selected = actionIndexes
        .map(index => ({ index, action: actions[index] }))
        .filter(item => item.action && aiActionIsExecutable(item.action));
      const sourceQuickGrab = aiActionSourceQuickGrab(proposal, selected);
      const sourceQuickGrabId = selected.map(item => aiActionSourceQuickGrabId(proposal, item.action)).find(Boolean)
        || (proposal?.sourceType === "quickGrab" ? proposal.sourceId : "");
      const createPersonItem = selected.find(item => aiActionType(item.action) === "createPerson");
      const existingPersonId = selected
        .map(item => aiActionExistingPersonId(proposal, sourceQuickGrab, item.action))
        .find(Boolean) || aiActionExistingPersonId(proposal, sourceQuickGrab, {});
      const personChoice = normalizeAiSheetPersonChoice(options.personChoice || {});
      const chosenExistingPersonId = personChoice.existingPersonId || "";
      const resolvedPersonId = chosenExistingPersonId || existingPersonId;
      const suggestedPersonName = aiBestDetectedPersonName(proposal, sourceQuickGrab, selected)
        || (createPersonItem ? aiActionPersonName(proposal, sourceQuickGrab, createPersonItem.action) : "");
      const newPersonName = personChoice.newPersonName || suggestedPersonName;
      const willCreatePerson = personChoice.willCreatePerson;
      const selectedNeedsPerson = selected.some(item => {
        const action = item.action;
        return aiActionNeedsPerson(action) || (aiActionType(action) === "createNote" && !aiActionAllowsUnlinkedNote(action, sourceQuickGrab));
      });
      const needsPersonResolution = selectedNeedsPerson && !existingPersonId;

      if (!proposal) errors.push("This AI suggestion is no longer available.");
      if (!selected.length) errors.push("No supported actions are selected.");
      for (const index of actionIndexes) {
        const action = actions[index];
        if (action && !aiActionIsExecutable(action)) errors.push(`${labelFromCamel(aiActionType(action))} is review-only in this build.`);
      }
      if (createPersonItem && !willCreatePerson) personResolutionErrors.push("Choose Create new person in the confirm page before creating a person.");
      if (willCreatePerson && !newPersonName) personResolutionErrors.push("The new person choice needs a name.");
      if (newPersonName) duplicatePeople.push(...similarPeople(newPersonName));
      if (needsPersonResolution && !resolvedPersonId && !willCreatePerson) {
        personResolutionErrors.push("Choose an existing person or choose Create new person before saving selected actions.");
      }

      for (const item of selected) {
        const action = item.action;
        const type = aiActionType(action);
        const hasPerson = Boolean(aiActionExistingPersonId(proposal, sourceQuickGrab, action) || resolvedPersonId || willCreatePerson);
        if (aiActionNeedsPerson(action) && !hasPerson) personResolutionErrors.push(`${labelFromCamel(type)} needs an existing person or a selected create person choice.`);
        if (type === "createNote" && !hasPerson && !aiActionAllowsUnlinkedNote(action, sourceQuickGrab)) personResolutionErrors.push("Create note needs a person unless it is a teaching idea.");
        if (type === "createNote" && !aiActionText(action, ["content", "draft", "summary"]) && !proposal?.summary && !sourceQuickGrab?.rawContent) errors.push("Create note needs note text.");
        if (type === "createMeetingNote" && !aiActionText(action, ["summary", "content", "whatWeTalkedAbout"]) && !sourceQuickGrab?.rawContent) errors.push("Create meeting note needs meeting text.");
        if (type === "createPrayerRequest" && !aiActionText(action, ["request", "content", "text"]) && !sourceQuickGrab?.detectedPrayerRequest && !proposal?.summary) errors.push("Create prayer request needs request text.");
        if (type === "createFollowUpTask" && !aiActionText(action, ["title", "task", "label"]) && !sourceQuickGrab?.detectedFollowUp) errors.push("Create follow-up task needs a task title.");
        if (type === "updatePerson") {
          const patch = aiSafePersonUpdatePatch(action);
          if (!Object.keys(patch).length) errors.push("Update person has no safe fields to change.");
          for (const field of ["lastMeaningfulInteraction", "nextFollowUpDate"]) {
            if (patch[field] && !aiSafeDate(patch[field])) errors.push(`${labelFromCamel(field)} must use YYYY-MM-DD.`);
          }
        }
      }

      if (proposal?.sensitivityRisk === "high" || sourceQuickGrab?.sensitiveFlag) {
        warnings.push("This proposal has a sensitivity warning. Save only the minimum helpful detail.");
      }
      if (duplicatePeople.length) {
        warnings.push("A similar person exists. Confirm before creating a new profile.");
      }
      if (options.enforcePersonChoice) {
        errors.push(...personResolutionErrors);
      }

      return {
        errors: Array.from(new Set(errors)),
        personResolutionErrors: Array.from(new Set(personResolutionErrors)),
        warnings: Array.from(new Set(warnings)),
        duplicatePeople: Array.from(new Map(duplicatePeople.map(person => [person.id, person])).values()),
        selected,
        sourceQuickGrab,
        sourceQuickGrabId,
        existingPersonId: resolvedPersonId,
        actionExistingPersonId: existingPersonId,
        chosenExistingPersonId,
        willCreatePerson,
        needsPersonResolution,
        suggestedPersonName,
        newPersonName,
        personChoice
      };
    }

    function aiActionExecutionKey(proposal, action = {}, index = 0) {
      return `${proposal?.id || "proposal"}:${aiActionStableId(action, index)}`;
    }

    function aiAttachSourceLinks(record, proposal, sourceQuickGrabId, executionKey = "") {
      if (!record || !proposal) return;
      record.sourceAIProposalId = proposal.id;
      record.createdFromAIProposalId = proposal.id;
      if (executionKey) record.sourceAIActionId = executionKey;
      if (sourceQuickGrabId && "createdFromQuickGrabId" in record) record.createdFromQuickGrabId = sourceQuickGrabId;
      record.updatedAt = nowISO();
    }

    function markAiActionTargetSensitive(proposal, sourceQuickGrab) {
      const target = sourceQuickGrab || aiProposalSourceRecord(proposal) || proposal;
      if (!target) return null;
      if ("sensitiveFlag" in target) target.sensitiveFlag = true;
      else if ("sensitivityLevel" in target) target.sensitivityLevel = "Sensitive";
      else target.aiPrivacyTier = "Sensitive";
      target.updatedAt = nowISO();
      return target;
    }

    function aiActionRecordResult(type, record, label = "") {
      return { actionType: type, recordId: record?.id || "", recordType: label || labelFromCamel(type) };
    }

    function applyAiProposalActions(proposal, validation, options = {}) {
      if (!proposal || !aiProposalCanExecute(proposal) || proposal.result?.executedAt) {
        throw new Error("These approved updates were already saved.");
      }
      const createdIds = [];
      const createdTypes = [];
      const executedActions = [];
      const selected = validation.selected || [];
      const sourceQuickGrabId = validation.sourceQuickGrabId || "";
      const markSensitiveSelected = selected.some(item => aiActionType(item.action) === "markSensitive");
      const sourceRecord = aiProposalSourceRecord(proposal);
      const sourceCollection = aiSourceCollectionForProposal(proposal);
      const sourceSensitive = Boolean(
        (sourceRecord && recordIsSensitive(sourceRecord, sourceCollection))
        || recordIsSensitive(proposal, "aiProposals")
        || ["medium", "high"].includes(proposal?.sensitivityRisk)
        || (validation.existingPersonId && recordIsSensitive(personById(validation.existingPersonId), "people"))
      );
      let relatedPersonId = validation.existingPersonId || "";
      const createPersonItem = selected.find(item => aiActionType(item.action) === "createPerson");
      let createdPersonId = "";

      if (validation.willCreatePerson) {
        const person = createPerson(validation.newPersonName, createPersonItem?.action?.phone || "");
        const personExecutionKey = aiActionExecutionKey(proposal, createPersonItem?.action || { actionType: "createPerson" }, createPersonItem?.index || 0);
        person.sourceAIProposalId = proposal.id;
        person.createdFromAIProposalId = proposal.id;
        person.sourceAIActionId = personExecutionKey;
        if (sourceQuickGrabId) person.createdFromQuickGrabId = sourceQuickGrabId;
        if (sourceSensitive || markSensitiveSelected) person.sensitiveFlag = true;
        person.updatedAt = nowISO();
        relatedPersonId = person.id;
        createdPersonId = person.id;
        createdIds.push(person.id);
        createdTypes.push("Person");
        executedActions.push(aiActionRecordResult("createPerson", person, "Person"));
      }

      for (const item of selected) {
        const action = item.action;
        const type = aiActionType(action);
        const executionKey = aiActionExecutionKey(proposal, action, item.index);
        const personId = validation.chosenExistingPersonId || aiActionExistingPersonId(proposal, validation.sourceQuickGrab, action) || relatedPersonId;
        const sensitiveFlag = Boolean(
          sourceSensitive
          || action.sensitiveFlag
          || recordIsSensitive(action, "aiProposedActions")
          || validation.sourceQuickGrab?.sensitiveFlag
          || markSensitiveSelected
        );
        if (type === "createPerson") continue;
        if (type === "createNote") {
          const note = createProfileNoteRecord(personId, {
            noteType: action.noteType || "General",
            content: aiActionText(action, ["content", "draft", "summary"]) || proposal.summary || validation.sourceQuickGrab?.rawContent,
            sensitiveFlag
          });
          if (!note) throw new Error("Could not create the note.");
          aiAttachSourceLinks(note, proposal, sourceQuickGrabId, executionKey);
          createdIds.push(note.id);
          createdTypes.push(note.noteType || "Note");
          executedActions.push(aiActionRecordResult(type, note, "Note"));
        }
        if (type === "createMeetingNote") {
          const meeting = createProfileMeetingRecord(personId, {
            meetingDate: aiSafeDate(action.meetingDate || proposal.result?.detectedDate, todayISO()),
            meetingType: action.meetingType,
            summary: aiActionText(action, ["summary", "content", "whatWeTalkedAbout"]) || validation.sourceQuickGrab?.rawContent,
            whatToRemember: aiActionText(action, ["whatToRemember", "summary", "content"]) || validation.sourceQuickGrab?.rawContent,
            prayerRequestText: action.prayerRequestText || "",
            nextFaithfulStep: action.nextFaithfulStep || "",
            followUpDate: aiSafeDate(action.followUpDate || ""),
            sensitiveFlag,
            updatePersonDates: false
          });
          if (!meeting) throw new Error("Could not create the meeting note.");
          aiAttachSourceLinks(meeting, proposal, sourceQuickGrabId, executionKey);
          createdIds.push(meeting.id);
          createdTypes.push("Meeting Note");
          executedActions.push(aiActionRecordResult(type, meeting, "Meeting Note"));
        }
        if (type === "createPrayerRequest") {
          const prayer = createProfilePrayerRecord(personId, {
            request: aiActionText(action, ["request", "content", "text"]) || validation.sourceQuickGrab?.detectedPrayerRequest || proposal.summary,
            dateAdded: todayISO(),
            followUpDate: aiSafeDate(action.followUpDate || proposal.result?.detectedFollowUpDate || ""),
            sensitiveFlag,
            shareableStatus: action.shareableStatus || settings.defaultShareableStatus
          });
          if (!prayer) throw new Error("Could not create the prayer request.");
          aiAttachSourceLinks(prayer, proposal, sourceQuickGrabId, executionKey);
          createdIds.push(prayer.id);
          createdTypes.push("Prayer Request");
          executedActions.push(aiActionRecordResult(type, prayer, "Prayer Request"));
        }
        if (type === "createFollowUpTask") {
          const task = createProfileFollowUpRecord(personId, {
            title: aiActionText(action, ["title", "task", "label"]) || validation.sourceQuickGrab?.detectedFollowUp || "Follow up",
            dueDate: aiSafeDate(action.dueDate || proposal.result?.detectedFollowUpDate, daysFromNow(3)),
            status: action.status || "Today / Soon",
            sensitiveFlag,
            updatePersonDates: false
          });
          if (!task) throw new Error("Could not create the follow-up task.");
          aiAttachSourceLinks(task, proposal, sourceQuickGrabId, executionKey);
          task.sourceType = sourceQuickGrabId ? "Quick Grab" : "AI Proposal";
          createdIds.push(task.id);
          createdTypes.push("Follow-Up Task");
          executedActions.push(aiActionRecordResult(type, task, "Follow-Up Task"));
        }
        if (type === "markSensitive") {
          const target = markAiActionTargetSensitive(proposal, validation.sourceQuickGrab);
          if (!target) throw new Error("Could not mark the source sensitive.");
          executedActions.push({ actionType: type, recordId: target.id || proposal.id, recordType: "Sensitivity" });
        }
        if (type === "updatePerson") {
          const person = personById(personId);
          if (!person) throw new Error("Could not find the person to update.");
          const patch = aiSafePersonUpdatePatch(action);
          Object.assign(person, patch);
          if (sensitiveFlag) person.sensitiveFlag = true;
          person.updatedFromAIProposalId = proposal.id;
          person.lastAIProposalId = proposal.id;
          person.updatedAt = nowISO();
          executedActions.push(aiActionRecordResult(type, person, "Person"));
        }
      }

      if (validation.sourceQuickGrab && options.convertQuickGrab) {
        const grab = validation.sourceQuickGrab;
        grab.status = "Converted";
        grab.convertedToTypes = Array.from(new Set([...(grab.convertedToTypes || []), ...createdTypes]));
        grab.convertedRecordIds = Array.from(new Set([...(grab.convertedRecordIds || []), ...createdIds]));
        if (relatedPersonId && !grab.relatedPersonId) grab.relatedPersonId = relatedPersonId;
        grab.updatedAt = nowISO();
      }

      if (validation.sourceQuickGrab) {
        validation.sourceQuickGrab.processingState = "saved";
        validation.sourceQuickGrab.processingError = "";
        validation.sourceQuickGrab.updatedAt = nowISO();
      }

      const actionIndexes = selected.map(item => item.index);
      const actionReview = aiActionSelectionFromIndexes(proposal, actionIndexes);
      const allExecutableSelected = allExecutableAiActionIndexes(proposal).every(index => actionIndexes.includes(index));
      const timestamp = nowISO();
      proposal.status = allExecutableSelected ? "approved" : "partiallyApproved";
      proposal.savedAt = timestamp;
      proposal.approvedAt = timestamp;
      proposal.updatedAt = timestamp;
      proposal.selectedActionIds = actionReview.selectedActionIds;
      proposal.skippedActionIds = actionReview.skippedActionIds;
      proposal.createdRecordIds = createdIds;
      proposal.createdPersonId = createdPersonId;
      proposal.result = {
        ...(proposal.result && typeof proposal.result === "object" ? proposal.result : {}),
        mockOnly: proposal.result?.backendMode === "real" ? false : proposal.result?.mockOnly === true,
        executedAt: timestamp,
        savedAt: timestamp,
        approvedAt: timestamp,
        executedActions,
        executionKey: `${proposal.id}:${actionReview.selectedActionIds.slice().sort().join("+")}`,
        executedActionKeys: selected.map(item => aiActionExecutionKey(proposal, item.action, item.index)),
        executedActionIndexes: actionIndexes,
        selectedActionIds: actionReview.selectedActionIds,
        skippedActionIds: actionReview.skippedActionIds,
        actionReview: {
          ...actionReview,
          updatedAt: nowISO(),
          persistedLocally: true
        },
        createdRecordIds: createdIds,
        createdPersonId,
        sourceQuickGrabConverted: Boolean(validation.sourceQuickGrab && options.convertQuickGrab)
      };
      return { createdIds, createdTypes, executedActions, createdPersonId };
    }

    function currentAiActionConfirmState() {
      if (view.screen === "aiConfirmActions") {
        return {
          proposalId: view.aiConfirmProposalId || "",
          actionIndexes: Array.isArray(view.aiConfirmActionIndexes) ? view.aiConfirmActionIndexes : [],
          personChoice: view.aiConfirmPersonChoice || {},
          validationErrors: view.aiConfirmValidationErrors || [],
          validationWarnings: view.aiConfirmValidationWarnings || []
        };
      }
      return null;
    }

    function isCheckedInAiActionConfirm(id) {
      return Boolean(document.getElementById(id)?.checked);
    }

    function persistAiActionConfirmState(state) {
      view.aiConfirmProposalId = state.proposalId || "";
      view.aiConfirmActionIndexes = Array.isArray(state.actionIndexes) ? state.actionIndexes : [];
      view.aiConfirmPersonChoice = state.personChoice || {};
      view.aiConfirmValidationErrors = state.validationErrors || [];
      view.aiConfirmValidationWarnings = state.validationWarnings || [];
    }

    function clearAiActionConfirmState() {
      view.aiConfirmProposalId = "";
      view.aiConfirmActionIndexes = [];
      view.aiConfirmPersonChoice = {};
      view.aiConfirmValidationErrors = [];
      view.aiConfirmValidationWarnings = [];
      view.aiConfirmSaving = false;
    }

    async function submitAiActionConfirmSheet() {
      if (view.aiConfirmSaving) return false;
      const state = currentAiActionConfirmState();
      if (!state) return false;
      const proposal = aiProposalById(state.proposalId);
      if (!proposal || !aiProposalCanExecute(proposal) || proposal.result?.executedAt) {
        showToast("These approved updates were already saved.");
        clearActiveWorkflowRecovery(state.proposalId);
        clearAiActionConfirmState();
        view.screen = "aiReview";
        render();
        return false;
      }
      const personChoice = aiSheetPersonChoiceFromDom();
      state.personChoice = personChoice;
      const validation = validateAiActionExecution(proposal, state.actionIndexes || [], {
        personChoice,
        enforcePersonChoice: true
      });
      if (validation.errors.length) {
        state.validationErrors = validation.errors;
        state.validationWarnings = validation.warnings;
        persistAiActionConfirmState(state);
        render();
        reportFieldError(document.getElementById("ai-confirm-person-choice") || document.getElementById("ai-confirm-new-person-name"), validation.errors[0]);
        return false;
      }
      if (validation.willCreatePerson && validation.duplicatePeople.length && !isCheckedInAiActionConfirm("ai-confirm-duplicate-confirm")) {
        state.validationErrors = ["Review the similar person warning first."];
        state.validationWarnings = validation.warnings;
        persistAiActionConfirmState(state);
        render();
        reportFieldError("ai-confirm-duplicate-confirm", "Review the similar person warning first.");
        return false;
      }
      if (!isCheckedInAiActionConfirm("ai-confirm-action-confirm")) {
        state.validationErrors = ["Confirm the selected actions first."];
        state.validationWarnings = validation.warnings;
        persistAiActionConfirmState(state);
        render();
        reportFieldError("ai-confirm-action-confirm", "Confirm the selected actions first.");
        return false;
      }
      return withActiveMutation("ai-action-approval-save", async () => {
      const convertQuickGrab = Boolean(validation.sourceQuickGrab && isCheckedInAiActionConfirm("ai-confirm-convert-quickgrab"));
      if (autosaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(autosaveTimer);
        autosaveTimer = null;
      }
      const beforeData = cloneJson(db);
      const beforeSettings = cloneJson(settings);
      const beforeMemoryVault = cloneJson(memoryVaultCache);
      const beforeAutosaveDrafts = cloneJson(autosaveDraftsCache);
      const beforeUndoStack = cloneJson(undoStack);
      const beforeUndoGeneration = undoGeneration;
      const beforeWorkflow = {
        screen: view.screen,
        sheet: view.sheet ? cloneJson(view.sheet) : null,
        aiReviewFocusId: view.aiReviewFocusId || "",
        confirmState: cloneJson(state)
      };
      const beforeVaultRevisions = {
        requested: vaultSaveRequestedRevision,
        completed: vaultSaveCompletedRevision
      };
      const persistenceKeys = [SETTINGS_KEY, CALM_MODE_KEY, STORAGE_KEY, COPY_KEY, AUTOSAVE_KEY, ENCRYPTED_STORAGE_KEY, AUTO_MEMORY_KEY];
      const storageSnapshot = localStorageSnapshot(persistenceKeys);
      state.validationErrors = [];
      state.validationWarnings = validation.warnings;
      persistAiActionConfirmState(state);
      saveCurrentDraftNow();
      view.aiConfirmSaving = true;
      render();
      try {
        recordUndo("AI proposal action approval");
        const result = applyAiProposalActions(proposal, validation, { convertQuickGrab });
        clearActiveWorkflowRecovery(proposal.id);
        saveData();
        const requiredVaultRevision = settings.localEncryptionEnabled ? vaultSaveRequestedRevision : 0;
        if (settings.localEncryptionEnabled) {
          if (!(await confirmCareVaultRevision(requiredVaultRevision))) throw new Error("Encrypted approved-update save failed.");
        }
        view.sheet = null;
        clearAiActionConfirmState();
        view.screen = "aiReview";
        view.aiReviewFocusId = proposal.id;
        showToast(`Saved ${result.executedActions.length} approved update${result.executedActions.length === 1 ? "" : "s"}.`);
        render();
        return true;
      } catch (error) {
        if (vaultSaveTimer) {
          const clear = window.clearTimeout || clearTimeout;
          clear(vaultSaveTimer);
          vaultSaveTimer = null;
        }
        db = beforeData;
        settings = normalizeSettings(beforeSettings);
        memoryVaultCache = beforeMemoryVault;
        autosaveDraftsCache = beforeAutosaveDrafts;
        undoStack = beforeUndoStack;
        undoGeneration = beforeUndoGeneration;
        vaultSaveRequestedRevision = beforeVaultRevisions.requested;
        vaultSaveCompletedRevision = beforeVaultRevisions.completed;
        restoreLocalStorageSnapshot(storageSnapshot);
        view.screen = beforeWorkflow.screen;
        view.sheet = beforeWorkflow.sheet;
        view.aiReviewFocusId = beforeWorkflow.aiReviewFocusId;
        persistAiActionConfirmState(beforeWorkflow.confirmState);
        view.aiConfirmSaving = false;
        state.validationErrors = [error.message || "Could not save those AI actions."];
        state.validationWarnings = validation.warnings;
        persistAiActionConfirmState(state);
        showToast("The approved updates were not saved. Your previous records are intact; retry when Device Vault is ready.", "error");
        render();
        return false;
      }
      });
    }

    function cancelAiActionConfirmView() {
      if (view.aiConfirmSaving) return false;
      clearActiveWorkflowRecovery(view.aiConfirmProposalId);
      clearAiActionConfirmState();
      view.sheet = null;
      view.screen = "aiReview";
      render();
      return true;
    }

    function copyAiDraftOption(proposalId, draftIndex) {
      const proposal = aiProposalById(proposalId);
      const index = Number(draftIndex);
      const draft = Array.isArray(proposal?.result?.drafts) ? proposal.result.drafts[index] : null;
      const text = String(draft?.text || "").trim();
      if (!text) {
        showToast("That draft is no longer available.");
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Draft copied. Nothing was sent."));
      } else {
        window.prompt("Copy draft:", text);
      }
    }

    function copyAiDonorUpdateDraft(proposalId, field) {
      const proposal = aiProposalById(proposalId);
      const allowedFields = ["emailDraft", "shortSupporterUpdate"];
      const key = allowedFields.includes(field) ? field : "emailDraft";
      const text = String(proposal?.result?.donorUpdate?.[key] || "").trim();
      if (!text) {
        showToast("That donor update draft is no longer available.");
        return;
      }
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => showToast("Donor update draft copied. Nothing was sent."));
      } else {
        window.prompt("Copy donor update draft:", text);
      }
    }

    function openAiProposalSource(id) {
      const proposal = aiProposalById(id);
      const record = aiProposalSourceRecord(proposal);
      if (!proposal || !record) {
        showToast("No related source record was found.");
        return;
      }
      if (proposal.sourceType === "quickGrab") {
        beginCaptureProcessing(proposal.sourceId);
        return;
      }
      if (proposal.sourceType === "person") {
        recordRecentPerson(proposal.sourceId);
        view.screen = "person";
        view.personId = proposal.sourceId;
        render();
        return;
      }
      if (proposal.sourceType === "prayerRequest") {
        view.screen = "prayer";
        view.prayerFilter = prayerFilterForStatus(record.status);
        render();
        return;
      }
      if (proposal.sourceType === "meetingNote" && record.relatedPersonId && personById(record.relatedPersonId)) {
        recordRecentPerson(record.relatedPersonId);
        view.screen = "person";
        view.personId = record.relatedPersonId;
        render();
        return;
      }
      if (proposal.sourceType === "followUpTask" && record.relatedPersonId && personById(record.relatedPersonId)) {
        recordRecentPerson(record.relatedPersonId);

    function updateSetting(key, value) {
      if (recoveryMutationBlocked()) return false;
      if (key === "enableVoiceCapture") {
        if (value) {
          settings.enableVoiceCapture = false;
          settings.voiceCaptureDisclosureVersion = "";
          return openVoiceCaptureEnablement();
        }
        cancelActiveDictation({ announce: false });
        const previous = cloneJson(settings);
        settings.enableVoiceCapture = false;
        settings.voiceCaptureDisclosureVersion = "";
        try {
          if (!saveSettings()) throw new Error("voice setting not saved");
        } catch (error) {
          settings = previous;
          showToast("Dictation was not disabled. Your previous setting remains in place.", "error");
          render();
          return false;
        }
        showToast("Dictation is off.");
        render();
        return true;
      }
      if (key === "aiEnabled") {
        settings.aiEnabled = false;
        showToast("Real AI is not connected in this build.");
        saveSettings();
        render();
        return;
      }
      if (key === "askBeforeAiEveryTime") {
        settings.askBeforeAiEveryTime = true;
        showToast("AI review is locked on.");
        saveSettings();
        render();
        return;
      }
      if (key === "aiAllowDoNotSend") {
        settings.aiAllowDoNotSend = false;
        showToast("Do Not Send to AI can never be included.");
        saveSettings();
        render();
        return;
      }
      if (key === "quickGrabAiMode") {
        settings.quickGrabAiMode = value === "backendQuickGrab" ? "backendQuickGrab" : "localMock";
        showToast(settings.quickGrabAiMode === "backendQuickGrab" ? "Backend Quick Grab selected. The privacy gate still asks every time." : "Quick Grab AI set to Local Mock Only.");
        saveSettings();
        render();
        return;
      }
      if (key === "notificationsEnabled" && value) {
        requestNotifications();
        return;
      }
      if (key === "appLockEnabled" && value && !settings.pinHash) {
        openSecuritySheet("pin-set");
        return;
      }
      if (key === "appLockEnabled" && !value && settings.pinHash) {
        openSecuritySheet("pin-clear");
        return;
      }
      if (key === "localEncryptionEnabled" && value) {
        openSecuritySheet("vault-enable");
        return;
      }
      if (key === "localEncryptionEnabled" && !value) {
        openSecuritySheet("vault-disable");
        return;
      }
      settings[key] = key === "launchScreen" ? calmLaunchScreen(value) : value;
      if (key === "enableAutoSave" && !value) clearAllAutosaveDrafts();
      saveSettings();
	      render();
	      return true;
	    }

    function captureProposalKey(grab) {
      if (!grab) return "";

    }

    function existingCaptureProposal(grab) {
      if (!grab) return null;

      return (db.aiProposals || []).find(proposal => proposal.proposalKey === key)
        || (db.aiProposals || []).find(proposal => proposal.sourceType === "quickGrab" && proposal.sourceId === grab.id && proposal.sourceCaptureRevision === grab.captureRevision)

    }

      }
      const existing = existingCaptureProposal(grab);
      if (existing) {
        grab.proposalKey = existing.proposalKey || captureProposalKey(grab);
        grab.processingState = "review";
        grab.processingError = "";
        saveData();
        showToast("The existing suggested updates are ready to review.");
        return openCaptureProposal(existing);
      }
      grab.proposalKey = captureProposalKey(grab);
      grab.processingState = "awaitingApproval";
      grab.processingError = "";
      grab.lastProcessingAttemptAt = nowISO();
      grab.updatedAt = nowISO();

        reportFieldError(textarea, "Add what you want to remember first.");

      }
      if (button) {
        button.dataset.submitted = "true";
        button.disabled = true;
      }
      const captureMethod = textarea?.dataset?.captureMethod || (source === "main" ? view.quickGrabDraftSource : "") || source;
      const captureSource = CAPTURE_SOURCES.includes(captureMethod) ? captureMethod : source;
      const grab = makeQuickGrab(text, [], "Whenever", null, {
        captureSource,
        personId,
        personLocked: source === "profile" && Boolean(personId)
      });
      grab.captureOrigin = source;
      recordUndo("capture");
      db.quickGrabs.unshift(grab);
      saveData();
      clearCaptureDraft(source, personId);
      view.quickGrabDraftText = "";
      view.quickGrabDraftSource = "";
      if (source === "today") view.todayCaptureDraftText = "";

      if (mode === "process") {
        beginCaptureProcessing(grab.id);

      }
      view.screen = source === "profile" ? "person" : source === "today" ? "today" : "quick";
      view.quickGrabId = null;
      showToast(personId ? "Saved for later with this person. No profile records changed." : "Saved for later. You can process it when ready.");
      render();

      const grab = db.quickGrabs.find(item => item.id === id);

      let date = daysFromNow(1);
      if (when === "later") date = todayISO();
      if (when === "tomorrow") date = daysFromNow(1);
      if (when === "weekend") date = nextWeekend();
      if (when === "nextweek") date = daysFromNow(7);
      if (when === "pick") date = document.getElementById("pick-snooze").value || daysFromNow(2);
	      recordUndo("Quick Grab snooze");
	      Object.assign(grab, { status: "Snoozed", snoozedUntil: date, remindAt: date, updatedAt: nowISO() });
	      saveData();
	      clearAutosaveDraft("snooze:" + id);
	      showToast("Snoozed until " + dateLabel(date) + ".");
      view.screen = "quick";
      render();
      return true;
    }

    function nextWeekend() {
      const d = new Date();
      const diff = (6 + 7 - d.getDay()) % 7 || 7;
      d.setDate(d.getDate() + diff);
      return localISODate(d);
    }

    function similarPeople(name) {
      return similarPeopleInList(name, db.people);
    }

    function similarPeopleInList(name, people = []) {
      const cleaned = normalizedName(name).slice(0, 160);
      if (!cleaned) return [];
      return people.filter(person => {
        const candidate = normalizedName(person.name).slice(0, 160);
        if (!candidate) return false;
        return candidate.includes(cleaned)
          || cleaned.includes(candidate)
          || candidate.split(" ")[0] === cleaned.split(" ")[0]
          || levenshtein(candidate, cleaned, 3) <= 3;
      });
    }

    function levenshtein(left, right, maxDistance = Number.POSITIVE_INFINITY) {
      const a = String(left || "").slice(0, 160);
      const b = String(right || "").slice(0, 160);
      const bounded = Number.isFinite(maxDistance);
      if (bounded && Math.abs(a.length - b.length) > maxDistance) return maxDistance + 1;
      if (!a.length) return b.length;
      if (!b.length) return a.length;
      let previous = Array.from({ length: b.length + 1 }, (_, index) => index);
      let current = new Array(b.length + 1);
      for (let i = 1; i <= a.length; i += 1) {
        current[0] = i;
        let rowMinimum = current[0];
        const start = bounded ? Math.max(1, i - maxDistance) : 1;
        const end = bounded ? Math.min(b.length, i + maxDistance) : b.length;
        for (let j = 1; j < start; j += 1) current[j] = maxDistance + 1;
        for (let j = start; j <= end; j += 1) {
          current[j] = a[i - 1] === b[j - 1]
            ? previous[j - 1]
            : Math.min(previous[j - 1] + 1, current[j - 1] + 1, previous[j] + 1);
          rowMinimum = Math.min(rowMinimum, current[j]);
        }
        for (let j = end + 1; j <= b.length; j += 1) current[j] = maxDistance + 1;
        if (bounded && rowMinimum > maxDistance) return maxDistance + 1;
        [previous, current] = [current, previous];
      }
      return previous[b.length];
    }

    function resizeProfilePhoto(file) {
      return new Promise((resolve, reject) => {
        if (!file || !file.type || !file.type.startsWith("image/")) {
          reject(new Error("Choose an image file."));
          return;
        }
        if (Number(file.size) > 8 * 1024 * 1024) {
          reject(new Error("Choose an image smaller than 8 MB."));
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Could not read that image."));
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => reject(new Error("Could not load that image."));
          image.onload = () => {
            if (Number(image.width) * Number(image.height) > 36_000_000) {
              reject(new Error("Choose an image with fewer than 36 megapixels."));
              return;
            }
            const maxSide = 360;
            const scale = Math.min(1, maxSide / Math.max(image.width, image.height));
            const width = Math.max(1, Math.round(image.width * scale));
            const height = Math.max(1, Math.round(image.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext("2d");
            if (!context) {
              reject(new Error("Image resizing is unavailable."));
              return;
            }
            context.drawImage(image, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.78));
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function backupDownloadFailureMessage(downloadMayHaveStarted = false) {
      return downloadMayHaveStarted
        ? "Backup download may have started, but its status was not recorded."
        : "Backup download could not be started. Nothing was recorded.";
    }

    function commitBackupInitiation(exportedAt, ownerIsCurrent = () => true) {
      if (!ownerIsCurrent() || recoveryMutationBlocked()) return { ok: false, stale: true };
      const previousSettings = settings;
      const nextSettings = cloneJson(settings);
      nextSettings.lastBackupAt = exportedAt;
      const localSnapshot = localStorageSnapshot([SETTINGS_KEY, CALM_MODE_KEY]);
      try {
        writeLocalStorageBatch([
          [SETTINGS_KEY, JSON.stringify(nextSettings)],
          [CALM_MODE_KEY, nextSettings.calmMode ? "on" : "off"]
        ]);
        if (!ownerIsCurrent() || recoveryMutationBlocked()) {
          restoreLocalStorageSnapshot(localSnapshot);
          return { ok: false, stale: true };
        }
        settings = nextSettings;
        mirrorToIndexedDb(SETTINGS_KEY, cloneJson(nextSettings));
        return { ok: true, stale: false };
      } catch (error) {
        settings = previousSettings;
        restoreLocalStorageSnapshot(localSnapshot);
        return { ok: false, stale: false };
      }
    }

    function protectedBackupExportOwnsSheet(sheet = view.sheet) {
      const owner = activeProtectedBackupExport;
      return Boolean(owner
        && owner.sheetBound
        && sheet?.type === "data-safety"
        && sheet?.kind === "encrypted-export"
        && sheet?.backupExportOwnerId === owner.id);
    }

    function protectedBackupExportIsCurrent(owner) {
      if (!owner || activeProtectedBackupExport !== owner || !recoveryEpochIsCurrent(owner.epoch)) return false;
      if (!owner.sheetBound) return true;
      return protectedBackupExportOwnsSheet(view.sheet) && view.sheet.backupExportOwnerId === owner.id;
    }

    function beginProtectedBackupExport() {
      if (activeProtectedBackupExport || recoveryMutationBlocked()) return null;
      const sheetBound = Boolean(view.sheet?.type === "data-safety" && view.sheet?.kind === "encrypted-export");
      const owner = Object.freeze({
        id: `backup_export_${++protectedBackupExportSequence}`,
        epoch: recoveryEpoch,
        sheetBound
      });
      activeProtectedBackupExport = owner;
      if (sheetBound) {
        view.sheet = { ...view.sheet, backupExportOwnerId: owner.id };
        render({ mutationEffects: false });
      }
      return owner;
    }

    function invalidateProtectedBackupExport() {
      const owner = activeProtectedBackupExport;
      if (!owner) return false;
      activeProtectedBackupExport = null;
      if (view.sheet?.backupExportOwnerId === owner.id) {
        const { backupExportOwnerId, ...restoredSheet } = view.sheet;
        view.sheet = restoredSheet;
      }
      return true;
    }

    function finishProtectedBackupExport(owner, options = {}) {
      const current = protectedBackupExportIsCurrent(owner);
      if (activeProtectedBackupExport === owner) activeProtectedBackupExport = null;
      if (!current) return false;
      if (!owner.sheetBound) return true;
      if (view.sheet?.backupExportOwnerId !== owner.id) return false;
      if (options.close) view.sheet = null;
      else {
        const { backupExportOwnerId, ...restoredSheet } = view.sheet;
        view.sheet = restoredSheet;
      }
      render({ mutationEffects: false });
      if (options.close) restoreSheetReturnFocus();
      return true;
    }

    function exportJson() {
      if (recoveryMutationBlocked()) return false;
      const exportEpoch = recoveryEpoch;
      const exportedAt = nowISO();
      const payload = cloneJson(currentPortablePayload());
      payload.exportedAt = exportedAt;
      let downloadMayHaveStarted = false;
      try {
        downloadJson(payload, "ruf-ministry-hub-export-" + todayISO() + ".json");
        downloadMayHaveStarted = true;
      } catch (error) {
        downloadMayHaveStarted = Boolean(error?.downloadMayHaveStarted);
        if (recoveryEpochIsCurrent(exportEpoch)) showToast(backupDownloadFailureMessage(downloadMayHaveStarted), "error");
        return false;
      }
      if (!recoveryEpochIsCurrent(exportEpoch)) return false;
      const committed = commitBackupInitiation(exportedAt, () => recoveryEpochIsCurrent(exportEpoch));
      if (!committed.ok) {
        if (!committed.stale && recoveryEpochIsCurrent(exportEpoch)) showToast(backupDownloadFailureMessage(downloadMayHaveStarted), "error");
        return false;
      }
      showToast("Backup download started. Confirm the file appears in Files.");
      return true;
    }

    async function exportEncryptedJsonWithPassphrase(passphrase) {
      if (!canUseWebCrypto()) {
        showToast("Encrypted backups are not available in this browser.");
        return false;
      }
      if (!passphrase || passphrase.length < 8) {
        showToast("Use at least 8 characters.");
        return false;
      }
      const owner = beginProtectedBackupExport();
      if (!owner) return false;
      const exportedAt = nowISO();
      const payload = cloneJson(currentPortablePayload());
      payload.exportedAt = exportedAt;
      let completed = false;
      let failureMessage = "";
      try {
        const envelope = await encryptPayload(payload, passphrase, "ruf-ministry-hub-encrypted-backup");
        if (!protectedBackupExportIsCurrent(owner)) return false;
        try {
          downloadJson(envelope, "ruf-ministry-hub-encrypted-backup-" + todayISO() + ".json");
        } catch (error) {
          failureMessage = backupDownloadFailureMessage(Boolean(error?.downloadMayHaveStarted));
          return false;
        }
        if (!protectedBackupExportIsCurrent(owner)) return false;
        const committed = commitBackupInitiation(exportedAt, () => protectedBackupExportIsCurrent(owner));
        if (!committed.ok) {
          if (!committed.stale) failureMessage = backupDownloadFailureMessage(true);
          return false;
        }
        if (!protectedBackupExportIsCurrent(owner)) return false;
        showToast("Backup download started. Confirm the file appears in Files.");
        completed = finishProtectedBackupExport(owner, { close: true });
        return completed;
      } catch (error) {
        if (protectedBackupExportIsCurrent(owner)) failureMessage = "Encrypted backup could not be prepared. Nothing was downloaded or recorded.";
        return false;
      } finally {
        if (!completed) {
          if (failureMessage && protectedBackupExportIsCurrent(owner)) showToast(failureMessage, "error");
          finishProtectedBackupExport(owner);
        }
      }
    }

    async function decodeBackupPayload(parsed, passphrase = "", options = {}) {
      if (parsed?.kind === "ruf-ministry-hub-encrypted-backup" || parsed?.kind === "ruf-ministry-hub-encrypted") {
        const chosenPassphrase = passphrase || (options.allowPrompt === false ? "" : window.prompt("Enter the backup passphrase:"));
        if (!chosenPassphrase) throw new Error("Encrypted backup needs passphrase.");
        return decryptPayload(parsed, chosenPassphrase);
      }
      return parsed;
    }

    function readTextFile(file) {
      return new Promise((resolve, reject) => {
        try {
          assertBackupFileSize(file);
        } catch (error) {
          reject(error);
          return;
        }
        const reader = new FileReader();
        reader.onload = event => resolve(event.target.result);
        reader.onerror = () => reject(new Error("Could not read that backup file."));
        reader.readAsText(file);
      });
    }

    async function readBackupFilePayload(file, passphrase = "", options = {}) {
      const readEpoch = recoveryEpoch;
      const text = await readTextFile(file);
      if (!recoveryEpochIsCurrent(readEpoch)) throw new Error("stale_recovery_epoch");
      const parsed = JSON.parse(text);
      const payload = await decodeBackupPayload(parsed, passphrase, options);
      if (!recoveryEpochIsCurrent(readEpoch)) throw new Error("stale_recovery_epoch");
      return validateBackupPayload(payload);
    }

    function showToast(message, severity = "") {
      const toast = document.getElementById("toast");
      const isError = severity === "error" || /^(add|choose|enter|use|type|select|confirm|could not|unable|invalid|no related|passphrases|pins|a valid)/i.test(String(message || ""));
      const generation = ++toastGeneration;
      if (toastTimer) window.clearTimeout(toastTimer);
      toast.setAttribute?.("role", isError ? "alert" : "status");
      toast.setAttribute?.("aria-live", isError ? "assertive" : "polite");
      toast.textContent = message;
      toast.classList.add("show");
      const timer = window.setTimeout(() => {
        if (generation !== toastGeneration || toastTimer !== timer) return;
        toast.classList.remove("show");
        toast.setAttribute?.("role", "status");
        toast.setAttribute?.("aria-live", "polite");
        toast.textContent = "";
        if (toastTimer === timer) toastTimer = null;
      }, isError ? 5000 : 2800);
      toastTimer = timer;
    }

    function reportFieldError(fieldOrId, message) {
      const field = typeof fieldOrId === "string" ? document.getElementById(fieldOrId) : fieldOrId;
      if (field) {
        field.setAttribute?.("aria-invalid", "true");
        field.focus?.({ preventScroll: false });
        field.addEventListener?.("input", () => field.removeAttribute?.("aria-invalid"), { once: true });
        field.addEventListener?.("change", () => field.removeAttribute?.("aria-invalid"), { once: true });
      }
      showToast(message, "error");
      return false;
    }

    function flushRecoveryState() {
      if (recoveryMutationBlocked()) return Promise.resolve(false);
      if (view.startupHydrating || view.startupRecoveryError || view.locked || view.encryptionLocked) return Promise.resolve(false);
      if (autosaveTimer) {
        const clear = window.clearTimeout || clearTimeout;
        clear(autosaveTimer);
        autosaveTimer = null;
      }
      saveCurrentDraftNow();
      if (settings.localEncryptionEnabled && vaultPassphrase) return persistEncryptedVault();
      return canUseIndexedDb() ? drainIndexedDbCoordinator() : Promise.resolve(true);
    }

    function bootstrapLocalState() {
      if (startupBootstrapPromise) return startupBootstrapPromise;
      view.startupHydrating = true;
      view.startupRecoveryError = "";
      render();
      startupBootstrapPromise = hydrateFromIndexedDb()
        .then(recovered => {
          view.startupHydrating = false;
          if (recovered) {
            restoreInterruptedWorkflow();
            initializeAutoMemoryVault();
          }
          if (!activatePendingFragmentQuickGrab()) render();
          return recovered;
        })
        .catch(error => {
          console.warn("Could not finish local startup", error);
          view.startupHydrating = false;
          view.startupRecoveryError = "Local recovery could not finish. Calm OS did not replace your ministry data. Retry before making changes.";
          render();
          return false;
        })
        .finally(() => {
          startupBootstrapPromise = null;
        });
      return startupBootstrapPromise;
    }

    importQuickGrabFromCurrentFragment();
    registerServiceWorker();
    bootstrapLocalState();
    if (typeof window !== "undefined") {
      window.addEventListener("pageshow", importQuickGrabFromCurrentFragment);
      window.addEventListener("focus", importQuickGrabFromCurrentFragment);
      window.addEventListener("pagehide", flushRecoveryState);
    }
    if (typeof document !== "undefined") {
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") flushRecoveryState();
      });
      document.addEventListener("freeze", flushRecoveryState);
    }
  </script>
</body>
</html>
