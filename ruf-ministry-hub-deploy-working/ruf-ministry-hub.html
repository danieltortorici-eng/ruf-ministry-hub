                  </select>
                </div>
                <div class="field wide" id="new-person-fields" style="display:none;">
                  <label for="new-person-name">New person name</label>
                  <input class="input" id="new-person-name" value="${escapeHtml(grab.detectedPersonName)}" placeholder="First and last name">
                  <label for="new-person-phone">Phone number</label>
                  <input class="input" id="new-person-phone" inputmode="tel" autocomplete="tel" placeholder="Optional phone number">
                  <div class="meta" id="duplicate-warning"></div>
                  <label class="check"><input type="checkbox" id="duplicate-confirm"> Create a new person even if a similar person exists.</label>
                </div>
                <div class="field">
                  <label for="meeting-date">Meeting date</label>
                  <input class="input" id="meeting-date" type="date" value="${grab.detectedDate || todayISO()}">
                </div>
                <div class="field">
                  <label for="meeting-type">Meeting type</label>
                  <select class="select" id="meeting-type">
                    ${["Student", "Donor", "Staff", "Pastoral", "Event Planning", "Admin", "Other"].map(type => `<option>${type}</option>`).join("")}
                  </select>
                </div>
                <div class="field wide">
                  <label for="meeting-summary">Meeting note summary</label>
                  <textarea class="textarea small" id="meeting-summary">${escapeHtml(grab.detectedMeetingSummary || grab.rawContent)}</textarea>
                </div>
                <div class="field wide">
                  <label for="what-to-remember">What to remember</label>
                  <textarea class="textarea small" id="what-to-remember">${escapeHtml(grab.rawContent)}</textarea>
                </div>
                <div class="field wide">
                  <label for="prayer-text">Prayer request text</label>
                  <textarea class="textarea small" id="prayer-text">${escapeHtml(grab.detectedPrayerRequest || "")}</textarea>
                </div>
                <div class="field wide">
                  <label for="followup-task">Follow-up task</label>
                  <input class="input" id="followup-task" value="${escapeHtml(grab.detectedFollowUp || "")}" placeholder="Ask about...">
                </div>
                <div class="field">
                  <label for="followup-date">Follow-up date</label>
                  <input class="input" id="followup-date" type="date" value="${grab.detectedFollowUpDate || ""}">
                </div>
                <div class="field">
                  <label for="shareable-status">Shareable status</label>
                  <select class="select" id="shareable-status">
                    ${["Private", "Anonymous Only", "Ask Permission", "Okay to Share"].map(status => `<option ${status === settings.defaultShareableStatus ? "selected" : ""}>${status}</option>`).join("")}
                  </select>
                </div>
                <div class="field wide">
                  <label class="check"><input type="checkbox" id="update-last" checked> Update the person's last meaningful interaction.</label>
                  <label class="check"><input type="checkbox" id="update-next" checked> Update the person's next follow-up date.</label>
                </div>
              </div>
              <div class="action-row" style="margin-top:14px;">
                <button class="button" data-action="qg-mock-ai" data-id="${grab.id}">${quickGrabAiButtonLabel()}</button>
                <button class="button primary" data-action="process-save" data-id="${grab.id}">Save Structured Records</button>
                <button class="button" data-action="nav" data-screen="quick">Back to Quick Grab</button>
              </div>
            </div>
          </section>
        </div>
      `;
    }

    function checkbox(id, label, checked) {
      return `<label class="check"><input type="checkbox" id="${id}" ${checked ? "checked" : ""}> ${escapeHtml(label)}</label>`;
    }

    function inferActions(grab) {
      const actions = [];
      if (grab.detectedMeetingSummary) actions.push("meeting");
      if (grab.detectedPrayerRequest) actions.push("prayer");
      if (grab.detectedFollowUp || grab.detectedFollowUpDate) actions.push("followup");
      if (grab.category === "Teaching") actions.push("teaching");
      if (grab.category === "Donors") actions.push("donor");
      if (!actions.length && grab.category === "People") actions.push("note");
      return actions;
    }

    function quickGrabMockSensitivityWarnings(grab) {
      const raw = String(grab?.rawContent || "");
      const warnings = [];
      if (grab?.sensitiveFlag) warnings.push("This Quick Grab is already marked sensitive.");
      if (/\b(confidential|private|do not share|pastoral|abuse|trauma|suicid|self[- ]?harm|addiction|porn|pregnan|divorce|affair)\b/i.test(raw)) {
        warnings.push("This text appears pastoral or private. Review carefully before saving anything.");
      }
      if (/\b(anxiety|depression|mental health|hospital|surgery|family crisis|grief|death|counseling)\b/i.test(raw)) {
        warnings.push("This may include sensitive care details. Keep only what is needed for faithful follow-up.");
      }
      return Array.from(new Set(warnings));
    }

    function quickGrabMockFlags(grab) {
      const raw = String(grab?.rawContent || "");
      const lower = raw.toLowerCase();
      const parsed = parseQuickGrab(raw, grab?.category ? [grab.category] : [], grab?.urgency || "Whenever", db.people);
      const possiblePeople = parsed.detectedPersonName ? similarPeople(parsed.detectedPersonName) : [];
      const matchedPerson = parsed.relatedPersonId ? personById(parsed.relatedPersonId) : null;
      const hasMeeting = Boolean(parsed.detectedMeetingSummary) || /\b(met|meeting|coffee|lunch|called|talked|sat down|conversation)\b/i.test(raw);
      const hasPrayer = Boolean(parsed.detectedPrayerRequest) || /\b(pray|prayer|wisdom|sick|surgery|anxiety|hard|grief)\b/i.test(raw);
      const hasFollowUp = Boolean(parsed.detectedFollowUp || parsed.detectedFollowUpDate) || /\b(follow up|check in|ask .* about|send .* text|remind me|reach out)\b/i.test(raw);
      const hasDonor = grab?.category === "Donors" || /\b(donor|supporter|alumni|gift|pledge|thank[- ]?you|support)\b/i.test(raw);
      const hasTeaching = grab?.category === "Teaching" || /\b(sermon|lesson|teaching|bible study|illustration|john|romans|psalm)\b/i.test(raw);
      const hasPersonContext = grab?.category === "People" || Boolean(matchedPerson || parsed.detectedPersonName) || hasMeeting || hasPrayer || hasFollowUp;
      const noGoodPersonMatch = Boolean(parsed.detectedPersonName && !matchedPerson);
      const ambiguousPerson = noGoodPersonMatch || (!parsed.detectedPersonName && hasPersonContext && !matchedPerson);
      const ambiguousFollowUp = hasFollowUp && !parsed.detectedFollowUpDate;
      return {
        raw,
        lower,
        parsed,
        possiblePeople,
        matchedPerson,
        hasMeeting,
        hasPrayer,
        hasFollowUp,
        hasDonor,
        hasTeaching,
        hasPersonContext,
        noGoodPersonMatch,
        ambiguousPerson,
        ambiguousFollowUp,
        warnings: quickGrabMockSensitivityWarnings(grab)
      };
    }

    function quickGrabMockProposedActions(grab, flags) {
      const actions = [];
      const personLabel = flags.matchedPerson ? flags.matchedPerson.name : flags.parsed.detectedPersonName || "Unlinked person";
      if (flags.hasMeeting) {
        actions.push({
          actionType: "createMeetingNote",
          label: `Draft meeting note for ${personLabel}`,
          meetingDate: flags.parsed.detectedDate || todayISO(),
          summary: flags.parsed.detectedMeetingSummary || grab.rawContent
        });
      }
      if (flags.hasPrayer) {
        actions.push({
          actionType: "createPrayerRequest",
          label: `Draft prayer request for ${personLabel}`,
          request: flags.parsed.detectedPrayerRequest || extractPrayer(grab.rawContent)
        });
      }
      if (flags.hasFollowUp) {
        actions.push({
          actionType: "createFollowUpTask",
          label: `Draft follow-up for ${personLabel}`,
          title: flags.parsed.detectedFollowUp || extractFollowUp(grab.rawContent) || "Check in",
          dueDate: flags.parsed.detectedFollowUpDate || ""
        });
      }
      if (flags.hasPersonContext && !flags.hasMeeting) {
        actions.push({
          actionType: "createNote",
          label: `Draft profile note for ${personLabel}`,
          content: grab.rawContent
        });
      }
      if (flags.hasDonor) {
        actions.push({
          actionType: "draftDonorUpdate",
          label: "Draft donor update idea",
          draft: grab.rawContent
        });
      }
      if (flags.hasTeaching) {
        actions.push({
          actionType: "createNote",
          label: "Draft teaching idea note",
          noteType: "Teaching Idea",
          content: grab.rawContent
        });
      }
      if (flags.warnings.length) {
        actions.push({
          actionType: "markSensitive",
          label: "Mark this item sensitive before saving real records"
        });
      }
      if (flags.noGoodPersonMatch) {
        actions.push({
          actionType: "createPerson",
          label: `Create a new person candidate for ${flags.parsed.detectedPersonName}`,
          name: flags.parsed.detectedPersonName
        });
      }
      if (!actions.length) {
        actions.push({
          actionType: "noAction",
          label: "Keep as Quick Grab until more context is available"
        });
      }
      return actions;
    }

    function quickGrabMockConfidence(flags, actions) {
      if (flags.noGoodPersonMatch || flags.possiblePeople.length > 1 || (flags.ambiguousPerson && flags.ambiguousFollowUp)) return "low";
      if (flags.ambiguousPerson || flags.ambiguousFollowUp || actions.some(action => action.actionType === "noAction")) return "medium";
      return "high";
    }

    function quickGrabBackendModeEnabled() {
      return settings.quickGrabAiMode === "backendQuickGrab";
    }

    function quickGrabAiModeLabel() {
      return quickGrabBackendModeEnabled() ? "Backend Quick Grab" : "Local Mock Only";
    }

    function quickGrabAiButtonLabel() {
      return quickGrabBackendModeEnabled() ? "Process with Backend Quick Grab" : "Process with Mock AI";
    }

    function quickGrabAiGateTitle(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled() ? "Use Backend Quick Grab?" : "Use Mock AI?";
    }

    function quickGrabAiGateKicker(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) {
        return "Backend Quick Grab may send only this reviewed Quick Grab payload to the app server route after approval. No API keys are stored in the browser.";
      }
      return "No external data is sent yet. This gate is here now so the same review step can protect future real AI calls.";
    }

    function quickGrabAiGateConfirmLabel(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) {
        return "I reviewed the context and approve using only this Quick Grab with the backend Quick Grab route.";
      }
      return "I reviewed the context and understand no real AI call will be made in this build.";
    }

    function quickGrabAiGateContinueLabel(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled() ? "Continue with Backend Quick Grab" : "Continue with Mock AI";
    }

    function aiGateModeLabel(sheet = {}) {
      return sheet.nextAction === "quickGrabParse" ? quickGrabAiModeLabel() : "Local Mock Only";
    }

    function aiGateAllowsContinue(sheet = {}) {
      if (sheet.nextAction === "quickGrabParse" && quickGrabBackendModeEnabled()) return true;
      return settings.aiMockMode;
    }

    function quickGrabCandidatePeopleForBackend(grab) {
      const flags = quickGrabMockFlags(grab);
      const candidates = [
        flags.matchedPerson,
        ...flags.possiblePeople
      ]
        .filter(Boolean)
        .map(person => ({ id: person.id, name: person.name }))
        .filter(person => person.id && person.name);
      const seen = new Set();
      return candidates.filter(person => {
        if (seen.has(person.id)) return false;
        seen.add(person.id);
        return true;
      }).slice(0, 8);
    }

    function buildQuickGrabBackendPayload(grab) {
      const privacyTier = aiPrivacyTierForRecord(grab, "quickGrabs");
      return {
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalType: "quickGrabParse",
        rawQuickGrab: String(grab.rawContent || "").slice(0, 4000),
        today: todayISO(),
        tags: grab.category && grab.category !== "Unsure" ? [grab.category] : [],
        urgency: grab.urgency || "Whenever",
        privacyTier,
        sensitivityLevel: grab.sensitivityLevel || "",
        sensitiveFlag: grab.sensitiveFlag === true,
        sendToAiApproved: true,
        candidatePeople: quickGrabCandidatePeopleForBackend(grab)
      };
    }

    function normalizeBackendQuickGrabProposal(responseBody, grab) {
      const source = responseBody && responseBody.proposal && typeof responseBody.proposal === "object" ? responseBody.proposal : {};
      const proposal = normalizeAiProposal({
        ...source,
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalType: "quickGrabParse",
        status: "pending",
        requiresReview: true,
        sendToAiApproved: false,
        model: source.model || (responseBody?.mode === "real" ? "backend-openai" : "backend-mock"),
        warnings: Array.from(new Set([
          ...(Array.isArray(source.warnings) ? source.warnings : []),
          responseBody?.mode === "real"
            ? "Backend Quick Grab response. Review before saving anything to ministry records."
            : "Backend Quick Grab returned mock output. Review before saving anything to ministry records."
        ])),
        result: {
          ...(source.result && typeof source.result === "object" ? source.result : {}),
          backendRoute: responseBody?.route || "/api/ai/quick-grab",
          backendMode: responseBody?.mode || "unknown",
          proposalOnly: true
        }
      });
      proposal.proposedActions = proposal.proposedActions.map(normalizeAiProposedAction);
      if (!proposal.title) proposal.title = "Quick Grab backend proposal";
      if (!proposal.summary) proposal.summary = "Review these Quick Grab suggestions before changing ministry records.";
      if (!proposal.contextPreview) proposal.contextPreview = "One Quick Grab, today's date, privacy flags, selected tags/urgency, and candidate people names/ids only.";
      if (!proposal.rawInputPreview) proposal.rawInputPreview = "Backend Quick Grab did not return raw ministry content.";
      return proposal;
    }

    function saveQuickGrabAiProposal(proposal, undoLabel, toastMessage) {
      recordUndo(undoLabel);
      db.aiProposals.unshift(proposal);
      saveData();
      view.sheet = null;
      view.screen = "aiReview";
      view.aiReviewFilter = "Pending";
      view.aiReviewFocusId = proposal.id;
      showToast(toastMessage);
      render();
    }

    function backendQuickGrabSafeErrorMessage() {
      return "Backend Quick Grab is not available. No records were changed.";
    }

    async function createQuickGrabBackendAiProposal(grabId) {
      const grab = db.quickGrabs.find(item => item.id === grabId);
      if (!grab) {
        showToast("That Quick Grab is no longer available.");
        return;
      }
      if (aiPrivacyTierForRecord(grab, "quickGrabs") === "Do Not Send to AI") {
        showToast("This Quick Grab is marked Do Not Send to AI.");
        return;
      }
      const payload = buildQuickGrabBackendPayload(grab);
      try {
        const response = await fetch("/api/ai/quick-grab", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || body?.ok !== true || !body.proposal) {
          throw new Error("safe_backend_quick_grab_unavailable");
        }
        const proposal = normalizeBackendQuickGrabProposal(body, grab);
        saveQuickGrabAiProposal(proposal, "backend Quick Grab AI proposal", "Backend Quick Grab proposal created. Review before saving anything.");
      } catch {
        if (settings.aiMockMode) {
          showToast("Backend Quick Grab was unavailable. Creating a local mock proposal instead.");
          createQuickGrabMockAiProposal(grabId);
          return;
        }
        showToast(backendQuickGrabSafeErrorMessage());
      }
    }

    function createQuickGrabAiProposal(grabId) {
      if (quickGrabBackendModeEnabled()) {
        createQuickGrabBackendAiProposal(grabId);
        return;
      }
      createQuickGrabMockAiProposal(grabId);
    }

    function createQuickGrabMockAiProposal(grabId) {
      const grab = db.quickGrabs.find(item => item.id === grabId);
      if (!grab) {
        showToast("That Quick Grab is no longer available.");
        return;
      }
      if (aiPrivacyTierForRecord(grab, "quickGrabs") === "Do Not Send to AI") {
        showToast("This Quick Grab is marked Do Not Send to AI.");
        return;
      }
      const flags = quickGrabMockFlags(grab);
      const proposedActions = quickGrabMockProposedActions(grab, flags);
      const confidence = quickGrabMockConfidence(flags, proposedActions);
      const sensitivityRisk = flags.warnings.length
        ? flags.warnings.some(warning => /private|pastoral|sensitive/i.test(warning)) ? "high" : "medium"
        : grab.sensitiveFlag ? "medium" : "low";
      const personText = flags.matchedPerson
        ? `Matched ${flags.matchedPerson.name}.`
        : flags.parsed.detectedPersonName
          ? `Possible new or unmatched person: ${flags.parsed.detectedPersonName}.`
          : "No clear person match.";
      const typeText = proposedActions.map(action => labelFromCamel(action.actionType)).join(", ");
      const warnings = [
        ...flags.warnings,
        ...(flags.noGoodPersonMatch ? ["No good person match was found. Review before creating a person."] : []),
        ...(flags.ambiguousFollowUp ? ["Follow-up timing is ambiguous. Choose a real due date before saving."] : [])
      ];
      const proposal = emptyAiProposal({
        sourceType: "quickGrab",
        sourceId: grab.id,
        proposalType: "quickGrabParse",
        status: "pending",
        title: `Mock parse: ${grab.category || "Quick Grab"}`,
        summary: `${personText} Suggested actions: ${typeText}.`,
        confidence,
        sensitivityRisk,
        contextPreview: grab.rawContent.slice(0, 240),
        proposedActions,
        warnings: Array.from(new Set(warnings)),
        rawInputPreview: grab.rawContent.slice(0, 360),
        result: {
          possiblePersonId: flags.matchedPerson ? flags.matchedPerson.id : "",
          possiblePersonName: flags.matchedPerson ? flags.matchedPerson.name : flags.parsed.detectedPersonName,
          recordTypes: proposedActions.map(action => action.actionType),
          detectedDate: flags.parsed.detectedDate,
          detectedFollowUpDate: flags.parsed.detectedFollowUpDate,
          mockOnly: true
        }
      });
      recordUndo("mock AI Quick Grab proposal");
      db.aiProposals.unshift(proposal);
      saveData();
      view.sheet = null;
      view.screen = "aiReview";
      view.aiReviewFilter = "Pending";
      view.aiReviewFocusId = proposal.id;
      showToast("Mock AI proposal created. Review before saving anything.");
      render();
    }

    function buildPersonBriefingMockResult(context, warnings = []) {
      const person = context.person;
      const latestNote = context.notes[0];
      const latestMeeting = context.meetings[0];
      const nextTask = context.tasks[0];
      const rememberBeforeMeeting = [
        `Care level: ${person.careLevel || "Not set"}.`,
        person.lastMeaningfulInteraction ? `Last meaningful interaction was ${dateLabel(person.lastMeaningfulInteraction)}.` : "No last meaningful interaction is recorded yet.",
        person.nextFollowUpDate ? `Next follow-up is ${dateLabel(person.nextFollowUpDate)}${person.followUpReason ? ` for ${person.followUpReason}` : ""}.` : "No next follow-up date is recorded.",
        latestMeeting ? `Recent meeting note: ${latestMeeting.whatToRemember || latestMeeting.whatWeTalkedAbout || latestMeeting.meetingType}.` : "",
        latestNote ? `Recent note: ${latestNote.content}.` : ""
      ].filter(Boolean);
      const goodQuestionsToAsk = [
        person.followUpReason ? `How has ${person.followUpReason.toLowerCase()} been since we last talked?` : "What has been most on your mind this week?",
        context.prayers.length ? "How would you like me to keep praying for you right now?" : "Where have you seen encouragement or strain lately?",
        "What would be a helpful next step after today?"
      ];
      const prayerReminders = context.prayers.length
        ? context.prayers.map(prayer => prayer.request)
        : ["Ask if there is anything current to pray for, and keep the record minimal."];
      const followUpSuggestions = [
        nextTask ? `${nextTask.title}${nextTask.dueDate ? ` by ${dateLabel(nextTask.dueDate)}` : ""}.` : "",
        person.nextFollowUpDate ? `Follow up by ${dateLabel(person.nextFollowUpDate)}.` : "",
        latestMeeting?.nextFaithfulStep ? latestMeeting.nextFaithfulStep : ""
      ].filter(Boolean);
      const sensitivityCautions = warnings.length
        ? warnings
        : ["Keep pastoral details minimal and review before saving anything to ministry records."];
      const oneFaithfulNextStep = nextTask
        ? nextTask.title
        : person.nextFollowUpDate
          ? `Check in by ${dateLabel(person.nextFollowUpDate)}.`
          : context.prayers.length
            ? "Ask for a fresh prayer update and record only what is needed."
            : "Listen well, pray, and choose one concrete follow-up after the conversation.";
      return {
        rememberBeforeMeeting,
        goodQuestionsToAsk,
        prayerReminders,
        followUpSuggestions: followUpSuggestions.length ? followUpSuggestions : ["Choose one simple follow-up after the conversation."],
        sensitivityCautions,
        oneFaithfulNextStep
      };
    }

    function createPersonBriefingMockAiProposal(personId) {
      const contextReview = buildPersonBriefingContextReview(personId);
      const context = personBriefingAllowedContext(personId);
      const person = context.person;
      if (!person || contextReview.blocked) {
        showToast("This person cannot be used for AI context.");
        return;
      }
      const briefing = buildPersonBriefingMockResult(context, contextReview.warnings);
      const usedSensitive = contextReview.used.some(item => ["Sensitive", "Highly Sensitive"].includes(item.tier));
      const usedPrivate = contextReview.used.some(item => item.tier === "Private");
      const sensitivityRisk = usedSensitive ? "high" : usedPrivate || contextReview.warnings.length ? "medium" : "low";
      const contextPreview = [
        personBriefingPersonSummary(person),
        `${context.notes.length} recent note(s)`,
        `${context.meetings.length} recent meeting(s)`,
        `${context.prayers.length} active prayer request(s)`,
        `${context.tasks.length} open follow-up task(s)`
      ].join(" | ");
      const proposal = emptyAiProposal({
        sourceType: "person",
        sourceId: person.id,
        proposalType: "personBriefing",
        status: "pending",
        title: `Briefing for ${person.name}`,
        summary: `Mock local briefing for ${person.name}. Review before saving anything to ministry records.`,
        confidence: context.notes.length || context.meetings.length || context.prayers.length || context.tasks.length ? "medium" : "low",
        sensitivityRisk,
        contextPreview,
        proposedActions: [
          { actionType: "noAction", label: "Use this as a review-only briefing before the next conversation" }
        ],
        warnings: Array.from(new Set(contextReview.warnings)),
        rawInputPreview: contextReview.used.map(item => `${item.label}: ${item.summary}`).join("\n").slice(0, 600),
        result: {
          briefing,
          mockOnly: true,
          contextScope: "person-only",
          includedContextLabels: contextReview.used.map(item => item.label),
          excludedContextLabels: contextReview.notUsed.map(item => item.label)
        }
      });
      recordUndo("mock AI person briefing proposal");
      db.aiProposals.unshift(proposal);
      saveData();
      view.sheet = null;
      view.screen = "aiReview";
      view.aiReviewFilter = "Pending";
      view.aiReviewFocusId = proposal.id;
      showToast("Mock person briefing created. Review before saving anything.");
      render();
    }

    function followUpDraftPromptFromContext(context, contextReview) {
      const person = context.person;
      const source = context.source;
      const firstName = person?.name ? person.name.split(" ")[0] : "there";
      const sourceType = context.sourceType;
      const sourceIsSensitivePrayer = sourceType === "prayerRequest" && source?.sensitivityLevel === "Sensitive";
      const hasSensitiveWarning = sourceIsSensitivePrayer || (contextReview.warnings || []).some(warning => /sensitive/i.test(warning));
      const dueText = source?.followUpDate || source?.dueDate || person?.nextFollowUpDate || "";
      const gentleReference = sourceIsSensitivePrayer
        ? "what you asked me to pray about"
        : sourceType === "meetingNote"
          ? "our conversation"
          : sourceType === "followUpTask"
            ? "what we had planned to follow up on"
            : sourceType === "prayerRequest"
              ? "how I can be praying"
              : "how you are doing";
      return { firstName, sourceIsSensitivePrayer, hasSensitiveWarning, dueText, gentleReference };
    }

    function buildFollowUpDraftOptions(context, contextReview) {
      const prompt = followUpDraftPromptFromContext(context, contextReview);
      const prayerPhrase = prompt.sourceIsSensitivePrayer
        ? "I have been praying for you."
        : "I was thinking of you and praying for you today.";
      return [
        {
          tone: "Short",
          text: `Hey ${prompt.firstName}, just wanted to check in. How are you doing today?`
        },
        {
          tone: "Casual",
          text: `Hey ${prompt.firstName}, ${prayerPhrase} How has ${prompt.gentleReference} been going?`
        },
        {
          tone: "Pastoral",
          text: `Hey ${prompt.firstName}, I wanted to follow up gently and see how you are doing. No pressure to share more than you want, but I am glad to pray and listen.`
        }
      ];
    }

    function createFollowUpDraftMockAiProposal(sourceType, sourceId) {
      const contextReview = buildFollowUpDraftContextReview(sourceType, sourceId);
      const context = followUpDraftAllowedContext(sourceType, sourceId);
      if (!context.source || contextReview.blocked) {
        showToast("This source cannot be used for AI context.");
        return;
      }
      const drafts = buildFollowUpDraftOptions(context, contextReview);
      const sourceLabel = followUpDraftSourceLabel(sourceType);

    function prayerStewardPersonName(prayer) {
      return personById(prayer.relatedPersonId)?.name || "Unlinked person";
    }

    function prayerStewardFindingLabel(prayer) {
      return `${prayerStewardPersonName(prayer)} - ${prayer.status} - ${dateLabel(prayer.dateAdded)}${prayer.followUpDate ? ` - follow up ${dateLabel(prayer.followUpDate)}` : ""}`;
    }

    function prayerStewardResultSummary(findings, counts) {
      return {
        countsSummary: prayerStewardCountsSummary(counts),
        activeOlderThan30: findings.activeOlderThan30.map(prayerStewardFindingLabel),
        overdueFollowUps: findings.overdueFollowUps.map(prayerStewardFindingLabel),
        answeredReadyToArchive: findings.answeredReadyToArchive.map(prayerStewardFindingLabel),
        sensitiveShareWarnings: findings.sensitiveShareWarnings.map(prayer => `${prayerStewardFindingLabel(prayer)} - keep out of shareable content.`),
        duplicateLooking: findings.duplicateLooking.map(group => group.map(prayerStewardFindingLabel).join(" / ")),
        noRelatedPerson: findings.noRelatedPerson.map(prayerStewardFindingLabel)
      };
    }

    function buildPrayerStewardProposedActions(findings) {
      const actions = [];
      findings.activeOlderThan30.slice(0, 4).forEach(prayer => {
        actions.push({
          actionType: "createFollowUpTask",
          label: `Create a follow-up task for ${prayerStewardPersonName(prayer)}`,
          relatedPrayerRequestId: prayer.id,
          relatedPersonId: prayer.relatedPersonId || "",
          title: `Follow up on prayer request for ${prayerStewardPersonName(prayer)}`
        });
        actions.push({
          actionType: "updatePrayerRequest",
          label: `Set a fresh follow-up date for ${prayerStewardPersonName(prayer)}`,
          prayerRequestId: prayer.id,
          followUpDate: daysFromNow(7)
        });
      });
      findings.overdueFollowUps.slice(0, 4).forEach(prayer => {
        actions.push({
          actionType: "createFollowUpTask",
          label: `Follow up on overdue prayer request for ${prayerStewardPersonName(prayer)}`,
          relatedPrayerRequestId: prayer.id,
          relatedPersonId: prayer.relatedPersonId || "",
          title: `Check in about prayer request for ${prayerStewardPersonName(prayer)}`
        });
        actions.push({
          actionType: "updatePrayerRequest",
          label: `Move overdue follow-up date for ${prayerStewardPersonName(prayer)}`,
          prayerRequestId: prayer.id,
          followUpDate: daysFromNow(7)
        });
      });
      findings.answeredReadyToArchive.slice(0, 5).forEach(prayer => {
        actions.push({
          actionType: "archiveItem",
          label: `Archive answered prayer for ${prayerStewardPersonName(prayer)} after review`,
          prayerRequestId: prayer.id
        });
      });
      findings.sensitiveShareWarnings.slice(0, 5).forEach(prayer => {
        actions.push({
          actionType: "markSensitive",
          label: `Keep ${prayerStewardPersonName(prayer)} prayer request out of shareable content`,
          prayerRequestId: prayer.id
        });
      });
      findings.duplicateLooking.slice(0, 3).forEach(group => {
        actions.push({
          actionType: "noAction",
          label: `Review duplicate-looking prayer requests: ${group.map(prayerStewardPersonName).join(", ")}`
        });
      });
      findings.noRelatedPerson.slice(0, 4).forEach(prayer => {
        actions.push({
          actionType: "noAction",
          label: `Link unassigned prayer request to a person if appropriate: ${dateLabel(prayer.dateAdded)}`
        });
      });
      if (!actions.length) {
        actions.push({ actionType: "noAction", label: "No immediate prayer stewardship action needed." });
      }
      return actions;
    }

            ${settings.inlineEditing ? `<button class="button" data-action="person-edit-field" data-id="${person.id}" data-field="name" data-label="Name">Edit Name</button>` : ""}
          </div>
        </section>
        <div class="grid two">
          <section class="section">
            <div class="section-header"><h2 class="section-title">Notes</h2></div>
            ${notes.length ? notes.map(renderNoteCard).join("") : emptyState("No notes yet for this person.")}
          </section>
          <section class="section">
            <div class="section-header"><h2 class="section-title">Meeting Notes</h2></div>
            ${meetings.length ? meetings.map(renderMeetingCard).join("") : emptyState("No meeting notes yet for this person.")}
          </section>
        </div>
        <div class="grid two">
          <section class="section">
            <div class="section-header"><h2 class="section-title">Prayer Requests</h2></div>
            ${renderPrayerGroups(prayers)}
          </section>
          <section class="section">
            <div class="section-header"><h2 class="section-title">Follow-Up Tasks</h2></div>
            ${renderTaskGroups(tasks)}
          </section>
        </div>
        <section class="section">
          <div class="section-header"><h2 class="section-title">Person Timeline</h2></div>
          <div class="timeline">
            ${timeline.length ? timeline.map(renderTimelineItem).join("") : emptyState("This timeline will fill in as you add notes, meetings, prayer requests, and follow-ups.")}
          </div>
        </section>
      `;
    }

    function personInitials(person) {
      return String(person?.name || "?")
        .split(/\s+/)
        .filter(Boolean)
        .slice(0, 2)
        .map(part => part[0])
        .join("")
        .toUpperCase() || "?";
    }

    function renderPersonPhoto(person) {
      return `
        <div class="profile-photo" aria-label="${escapeHtml(person.name)} profile picture">
          ${person.photoDataUrl ? `<img src="${escapeHtml(person.photoDataUrl)}" alt="${escapeHtml(person.name)}">` : `<span>${escapeHtml(personInitials(person))}</span>`}
        </div>
      `;
    }

    function profileField(label, value) {
      const fieldMap = {
        "Person type": "personType",
        "Preferred contact": "preferredContactMethod",
        "Phone number": "phone",
        "Email": "email",
        "Class year": "classYear",
        "Fraternity/sorority": "fraternitySorority",
        "Major": "major",
        "Hometown": "hometown",
        "RUF involvement": "rufInvolvement",
        "Donor status": "donorStatus",
        "Follow-up reason": "followUpReason"
      };
      const field = fieldMap[label];
      const edit = settings.inlineEditing && field && view.personId
        ? `<button class="button small" data-action="person-edit-field" data-id="${view.personId}" data-field="${field}" data-label="${escapeHtml(label)}">Edit</button>`
        : "";
      return `<div class="field"><label>${escapeHtml(label)}</label><div class="row wrap"><div class="meta">${escapeHtml(value)}</div>${edit}</div></div>`;
    }

    function miniStat(label, value) {
      return `<div class="stat"><div class="stat-label">${escapeHtml(label)}</div><div class="stat-value">${escapeHtml(value || "Not set")}</div></div>`;
    }

    function renderNoteCard(note) {
      return `
        <article class="item compact">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(note.noteType)}</div>
            <span class="meta">${dateLabel(note.noteDate)}</span>
          </div>
          <p class="item-preview">${escapeHtml(maskedText(note.sensitiveFlag, "Sensitive note - tap to view.", note.content))}</p>
          ${timestampLine(note, "Note date", note.noteDate)}
          ${note.sensitiveFlag ? `<span class="pill rose">Sensitive</span>` : ""}
          ${settings.inlineEditing ? `<div class="action-row"><button class="button small" data-action="edit-record-field" data-collection="notes" data-field="content" data-label="Note" data-id="${note.id}">Edit Note</button></div>` : ""}
        </article>
      `;
    }

    function renderMeetingCard(meeting) {
      return `
        <article class="item compact">
          <div class="item-title-row">
            <div class="item-title">${escapeHtml(meeting.meetingType)} meeting</div>
            <span class="meta">${dateLabel(meeting.meetingDate)}</span>
          </div>
          <p class="item-preview"><strong>Talked about:</strong> ${escapeHtml(maskedText(meeting.sensitiveFlag, "Sensitive meeting note - tap to view.", meeting.whatWeTalkedAbout))}</p>
          <p class="item-preview"><strong>Remember:</strong> ${escapeHtml(maskedText(meeting.sensitiveFlag, "Sensitive details hidden.", meeting.whatToRemember))}</p>
          <p class="item-preview"><strong>Next faithful step:</strong> ${escapeHtml(meeting.nextFaithfulStep || "Not set")}</p>
          ${timestampLine(meeting, "Meeting date", meeting.meetingDate)}
          <div class="row wrap">
            <span class="meta">${escapeHtml(meeting.location || "No location")}</span>
            ${meeting.followUpDate ? `<span class="pill gold">Follow up ${dateLabel(meeting.followUpDate)}</span>` : ""}
            ${meeting.sensitiveFlag ? `<span class="pill rose">Sensitive</span>` : ""}
          </div>
          <div class="action-row">
            <button class="button small" data-action="meeting-add-prayer" data-id="${meeting.id}">Add Prayer Request from this Meeting</button>
            <button class="button small" data-action="followup-draft" data-source-type="meetingNote" data-id="${meeting.id}">Draft Follow-Up</button>
            ${settings.inlineEditing ? `<button class="button small" data-action="edit-record-field" data-collection="meetingNotes" data-field="whatWeTalkedAbout" data-label="Meeting summary" data-id="${meeting.id}">Edit Summary</button>` : ""}
          </div>
        </article>
      `;
    }

    function renderPrayerGroups(prayers) {
      if (!prayers.length) return emptyState("No active prayer requests yet. Add one from Quick Grab, a meeting note, or this profile.");
      const groups = ["Active", "Follow-Up Needed", "Answered", "Archived"];
      return groups.map(group => {
        const items = prayers.filter(prayer => prayer.status === group);
        if (!items.length) return "";
        return `
          <div class="section">
            <div class="section-header"><h3 class="section-title">${escapeHtml(group)}</h3></div>
            ${items.map(renderPrayerCard).join("")}
          </div>
        `;
      }).join("");
    }

    function renderTaskGroups(tasks) {
      if (!tasks.length) return emptyState("No follow-up tasks yet for this person.");
      const groups = ["Today / Soon", "Waiting", "Done / Archived"];
      return groups.map(group => {
        const items = tasks.filter(task => task.status === group);
        if (!items.length) return "";
        return `
          <div class="section">
            <div class="section-header"><h3 class="section-title">${escapeHtml(group)}</h3></div>
            ${items.map(renderTaskCard).join("")}
          </div>
        `;
      }).join("");
    }

    function buildTimeline(personId) {
      const items = [];
      db.meetingNotes.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.meetingDate, type: "Meeting Note", title: item.meetingType + " meeting", preview: item.whatWeTalkedAbout, status: item.followUpNeeded ? "Follow-up planned" : "", sensitive: item.sensitiveFlag, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.notes.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.noteDate, type: "Note", title: item.noteType, preview: item.content, status: "", sensitive: item.sensitiveFlag, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.prayerRequests.filter(item => item.relatedPersonId === personId).filter(item => settings.showArchivedOnProfiles || item.status !== "Archived").forEach(item => {
        items.push({ date: item.dateAdded, type: item.status === "Answered" ? "Answered Prayer" : "Prayer Request", title: item.status, preview: item.request, status: item.shareableStatus, sensitive: item.sensitivityLevel === "Sensitive", createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      db.tasks.filter(item => item.relatedPersonId === personId).forEach(item => {
        items.push({ date: item.dueDate || item.createdAt.slice(0, 10), type: "Follow-Up Task", title: item.title, preview: item.sourceType, status: item.status, sensitive: false, createdAt: item.createdAt, updatedAt: item.updatedAt });
      });
      return items.sort((a, b) => (b.date || "").localeCompare(a.date || ""));
    }

    function renderTimelineItem(item) {
      return `
        <article class="timeline-item">
          <div class="meta">${dateLabel(item.date)}</div>
          <div>
            <div class="row wrap">
              <span class="pill violet">${escapeHtml(item.type)}</span>
              ${item.status ? `<span class="pill gray">${escapeHtml(item.status)}</span>` : ""}
              ${item.sensitive ? `<span class="pill rose">Sensitive</span>` : ""}
            </div>
            <div class="item-title" style="margin-top:8px;">${escapeHtml(item.title)}</div>
            <p class="item-preview">${escapeHtml(maskedText(item.sensitive, "Sensitive item - tap its section to view.", item.preview))}</p>
            ${timestampLine(item, "Timeline date", item.date)}
          </div>
        </article>
      `;
    }

    function renderPrayerRequests() {
      const filters = ["Active", "Follow-Up Needed", "Prayer Walk", "Answered Prayer", "Archived Prayer Requests", "Sensitive Prayer Requests", "Recently Added", "By Person"];
      const filtered = getFilteredPrayers();
      const answeredReady = db.prayerRequests.filter(prayer => prayer.status === "Answered").length;
      const archivedCount = db.prayerRequests.filter(prayer => prayer.status === "Archived").length;
      return `
        ${renderTopbar("Prayer Requests", "Prayer requests only, with meeting notes and tasks linked as context.")}
        <section class="section">
          <div class="surface">
            <div class="row wrap">
              <div>
                <div class="item-title">Answered and archived prayer</div>
                <div class="meta">Answered requests can stay visible until you are ready, then move into the archive without losing the story.</div>
              </div>
              <span class="pill green">${answeredReady} answered</span>
              <span class="pill gray">${archivedCount} archived</span>
              <button class="button" data-action="prayer-steward">Prayer Steward</button>
              <button class="button" data-action="prayer-steward-copy">Copy Prayer Steward Audit</button>
            </div>
          </div>
        </section>
        <div class="tabs">
          ${filters.map(filter => `<button class="tab ${view.prayerFilter === filter ? "active" : ""}" data-action="prayer-filter" data-filter="${filter}">${escapeHtml(filter)}</button>`).join("")}
        </div>
        <section class="section">
          ${filtered.length ? filtered.map(renderPrayerCard).join("") : emptyState(prayerEmptyState())}
        </section>
      `;
    }

    function getFilteredPrayers() {
      const prayers = db.prayerRequests.slice();
      if (view.prayerFilter === "Active") return prayers.filter(prayer => prayer.status === "Active");
      if (view.prayerFilter === "Follow-Up Needed") return prayers.filter(prayer => prayer.status === "Follow-Up Needed");
      if (view.prayerFilter === "Prayer Walk") return prayers.filter(prayer => {
        if (prayer.status === "Archived") return false;
        if (!settings.prayerWalkIncludeAnswered && prayer.status === "Answered") return false;
        if (!settings.prayerWalkIncludeSensitive && prayer.sensitivityLevel === "Sensitive") return false;
        return true;
      });
      if (view.prayerFilter === "Answered Prayer") return prayers.filter(prayer => prayer.status === "Answered");
      if (view.prayerFilter === "Archived Prayer Requests") return prayers.filter(prayer => prayer.status === "Archived").sort((a, b) => (b.archivedAt || b.updatedAt || "").localeCompare(a.archivedAt || a.updatedAt || ""));
      if (view.prayerFilter === "Sensitive Prayer Requests") return prayers.filter(prayer => prayer.sensitivityLevel === "Sensitive");
      if (view.prayerFilter === "Recently Added") return prayers.sort((a, b) => b.dateAdded.localeCompare(a.dateAdded)).slice(0, 12);
      if (view.prayerFilter === "By Person") return prayers.sort((a, b) => (personById(a.relatedPersonId)?.name || "").localeCompare(personById(b.relatedPersonId)?.name || ""));
      return prayers;
    }

    function prayerEmptyState() {
      if (view.prayerFilter === "Archived Prayer Requests") return "No archived prayer requests yet. Answered requests can move here when you are ready to tuck them away.";
      if (view.prayerFilter === "Answered Prayer") return "No answered prayer requests are waiting here yet.";
      if (view.prayerFilter === "Follow-Up Needed") return "No prayer requests need a follow-up right now.";
      if (view.prayerFilter === "Prayer Walk") return "No prayer requests are ready for Prayer Walk right now.";
      return "No active prayer requests yet. Add one from Quick Grab, a meeting note, or a person profile.";
    }

    function renderPrayerCard(prayer) {
      const person = personById(prayer.relatedPersonId);
      const sensitive = prayer.sensitivityLevel === "Sensitive";
      const expanded = view.expandedPrayerIds.includes(prayer.id);
      return `
        <article class="item compact focus-card ${prayer.status === "Follow-Up Needed" ? "important" : ""}">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(person ? person.name : "Unlinked person")}</div>
              <div class="meta">Added ${dateLabel(prayer.dateAdded)}${prayer.followUpDate ? " - Follow up " + dateLabel(prayer.followUpDate) : ""}</div>
            </div>
            <span class="pill ${prayer.status === "Follow-Up Needed" ? "gold" : prayer.status === "Answered" ? "green" : prayer.status === "Archived" ? "gray" : "violet"}">${escapeHtml(prayer.status)}</span>
          </div>
          <p class="item-preview">${escapeHtml(maskedText(sensitive, "Sensitive prayer request - tap to view.", prayer.request))}</p>
          <div class="row wrap">
            <span class="pill ${sensitive ? "rose" : "gray"}">${escapeHtml(prayer.sensitivityLevel)}</span>
            <span class="pill gray">${escapeHtml(prayer.shareableStatus)}</span>
            ${prayer.answeredNote ? `<span class="pill green">Answered note added</span>` : ""}
            ${prayer.archivedAt ? `<span class="pill gray">Archived ${dateLabel(prayer.archivedAt)}</span>` : ""}
            ${prayer.archivedFromStatus ? `<span class="pill gray">Moved from ${escapeHtml(prayer.archivedFromStatus)}</span>` : ""}
          </div>
          ${timestampLine(prayer, "Added", prayer.dateAdded)}
          <div class="next-step-line">
            <span class="pill green">Next</span>
            <strong>${escapeHtml(prayerNextStep(prayer))}</strong>
          </div>
          <div class="action-row focus-actions">
            ${renderPrayerPrimaryActions(prayer, person)}
            ${settings.showAdvancedActions ? "" : `<button class="button small" data-action="prayer-toggle-more" data-id="${prayer.id}">${expanded ? "Less" : "More"}</button>`}
            ${prayer.status !== "Archived" ? `<button class="button small" data-action="followup-draft" data-source-type="prayerRequest" data-id="${prayer.id}">Draft Follow-Up</button>` : ""}
          </div>
          <div class="action-row extra-actions ${expanded ? "is-open" : ""}">
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-note" data-id="${prayer.id}">Add Answered Note</button>` : ""}
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-follow-date" data-id="${prayer.id}">Set Follow-Up Date</button>` : ""}
            ${prayer.status !== "Archived" && prayer.status !== "Answered" ? `<button class="button small" data-action="prayer-archive" data-id="${prayer.id}">Archive</button>` : ""}
            ${settings.inlineEditing && prayer.status !== "Archived" ? `<button class="button small" data-action="edit-record-field" data-collection="prayerRequests" data-field="request" data-label="Prayer request" data-id="${prayer.id}">Edit Request</button>` : ""}
            ${person && prayer.status !== "Archived" ? `<button class="button small primary" data-action="person-open" data-id="${person.id}">Open Person Profile</button>` : ""}
          </div>
        </article>
      `;
    }

    function prayerNextStep(prayer) {
      if (prayer.status === "Archived") return "This is tucked away. Restore it if it needs attention again.";
      if (prayer.status === "Answered") return "Add a short answered note, or archive it when you are ready.";
      if (prayer.status === "Follow-Up Needed") return "Create or take the follow-up when you can.";
      return "Pray, then mark answered or set a follow-up if needed.";
    }

    function renderPrayerPrimaryActions(prayer, person) {
      if (prayer.status === "Archived") {
        return `<button class="button small" data-action="prayer-restore" data-id="${prayer.id}">Restore</button>${person ? `<button class="button small primary" data-action="person-open" data-id="${person.id}">Open Profile</button>` : ""}`;
      }
      if (prayer.status === "Answered") {
        return `<button class="button small primary" data-action="prayer-archive-answered" data-id="${prayer.id}">Archive Answered</button><button class="button small" data-action="prayer-note" data-id="${prayer.id}">Add Note</button>`;
      }
      return `<button class="button small primary" data-action="prayer-answered" data-id="${prayer.id}">Mark Answered</button><button class="button small" data-action="prayer-task" data-id="${prayer.id}">Create Follow-Up</button>`;
    }

    function renderFifteenMinutes() {
      const items = promptQuickGrabs().slice(0, 3);
      const tasks = taskDueSoon().slice(0, 3);
      return `
        ${renderTopbar("I Have 15 Minutes", "A small list for the window you actually have.")}
        <div class="grid two">
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Clear a Few Quick Grabs</h2>
            </div>
            ${items.length ? items.map(renderQuickGrabCard).join("") : emptyState("No loose reminders are asking for attention right now.")}
          </section>
          <section class="section">
            <div class="section-header">
              <h2 class="section-title">Quick Follow-Ups</h2>
            </div>
            ${tasks.length ? tasks.map(renderTaskCard).join("") : emptyState("No short follow-ups are ready right now.")}
          </section>
        </div>
      `;
    }

    function renderWeeklyReset() {
      const items = openQuickGrabs().filter(grab => ["New", "Needs Processing", "Prompt Me"].includes(grab.status));
      return `
        ${renderTopbar("Weekly Reset", "A steady review so Quick Grab stays useful instead of becoming a junk drawer.")}

          <div class="surface quick-box">
            <div>
              <h2 class="section-title">Process Quick Grabs</h2>
              <p class="page-kicker">Are there any loose reminders that need to become tasks, notes, prayer requests, or follow-ups?</p>
            </div>
            <div class="notice secure">Weekly Reset suggestions are drafts. Review before changing ministry records.</div>
            <div class="action-row" style="margin-top:14px;">
              <button class="button primary" data-action="weekly-reset-agent">Build Weekly Reset Plan</button>
            </div>
          </div>
          ${items.length ? items.map(renderQuickGrabCard).join("") : emptyState("No Quick Grabs need processing right now.")}
        </section>

                    <button class="button small" data-action="nav" data-screen="autopilot">Open Autopilot</button>

                </div>

	                ${settingToggle("calmMode", "Calm Mode", "Simplify cards and keep the first view focused.")}

	                ${settingToggle("showStartHere", "Show Start Here", "Keep the one-good-next-step panel on Today.")}
	                ${settingSelect("launchScreen", "Launch Screen", [["today", "Today"], ["quick", "Quick Grab"], ["review", "Quick Review"], ["search", "Search"], ["aiReview", "AI Review"], ["people", "People"], ["prayer", "Prayer"], ["minutes", "15 Minutes"], ["weekly", "Weekly Reset"]], "Choose what opens first on your phone.")}

	                ${settingSelect("promptMeAfterHours", "Prompt Me Timing", [["0", "Right away"], ["12", "After 12 hours"], ["24", "After 24 hours"], ["48", "After 48 hours"]], "When unsorted Quick Grabs with no reminder should reappear.")}

		                ${settingToggle("enableUrlQuickGrab", "Shared Text Quick Grab", "Capture text from iOS Shortcuts or shared URLs using quickgrab, text, or note query text.")}

	          <section class="section">

	              <div class="notice" style="margin-top:12px;">Privacy tiers: Normal, Private, Sensitive, Highly Sensitive, and Do Not Send to AI.</div>

      const iconReady = true;
      const shortcutUrl = shortcutTemplateUrl();
      const autoMemory = autoMemoryVaultState();
      return `
        ${renderTopbar("iPhone Readiness", "Final checks for Home Screen use, offline launch, and daily capture.", false)}

          </div>

          ${readinessStatus(swActive, "Offline Copy Registered", swActive ? "The app has an offline-capable service worker registration." : "After deployment, open once online so the offline cache can install.", `<button class="button small" data-action="check-update">Check Offline Cache</button>`)}

          ${readinessStatus(settings.localEncryptionEnabled, "Device Vault", settings.localEncryptionEnabled ? "Encrypted local storage is enabled." : "Turn on Device Vault in Settings before carrying sensitive notes on your phone.")}
          ${readinessStatus(settings.autoMemoryVaultEnabled && autoMemory.count > 0, "Auto Memory Vault", settings.autoMemoryVaultEnabled ? autoMemory.detail : "Turn Auto Memory Vault on in Settings so local restore points are created automatically.")}
          ${readinessStatus(!backupReminderDue(), "Backup Rhythm", backupReminderDue() ? backupStatusText() + " Export before you depend on the app daily." : backupStatusText())}

            <article class="item">
              <div class="item-title-row">
                <div>
                  <div class="item-title">${escapeHtml(a.name)} / ${escapeHtml(b.name)}</div>
                  <div class="meta">Possible duplicate based on name similarity.</div>

                <span class="pill gold">Check</span>

    function renderAutoMemorySheet(sheet) {
      const kind = sheet.kind || "list";
      const snapshot = sheet.snapshotId ? findAutoMemorySnapshot(sheet.snapshotId) : null;
      const vault = loadAutoMemoryVault();
      const snapshots = vault.snapshots || [];
      const snapshotCard = item => `
        <article class="item compact">
          <div class="item-title-row">
            <div>
              <div class="item-title">${escapeHtml(item.label || "Auto save")}</div>
              <div class="meta">${escapeHtml(dateTimeLabel(item.savedAt))} - ${escapeHtml(item.summary || "No summary available.")}</div>

            <span class="pill green">Local</span>

            <button class="button small primary" data-action="auto-memory-restore" data-id="${escapeHtml(item.id)}">Restore</button>
            <button class="button small danger" data-action="auto-memory-delete" data-id="${escapeHtml(item.id)}">Delete</button>
          </div>
        </article>
      `;
      const titles = {
        list: "Auto Memory Vault",
        restore: "Restore Local Memory",
        delete: "Delete Restore Point",
        clear: "Clear Restore Points"
      };
      const helpers = {
        list: "Local restore points are created automatically after saved changes.",
        restore: "Replace current app data with this local restore point.",
        delete: "Remove this one local restore point.",
        clear: "Remove every local restore point kept by Auto Memory Vault."
      };
      const fields = {
        list: `
          <div class="notice">Auto Memory is ${settings.autoMemoryVaultEnabled ? "on" : "off"}. These restore points are local to this browser and are not cloud sync.</div>
          ${snapshots.length ? snapshots.map(snapshotCard).join("") : emptyState("No restore points yet. The next saved change will create one automatically.")}
        `,
        restore: snapshot ? `
          <div class="notice danger">This replaces current local app data, settings, edited wording, and saved drafts with the restore point from ${escapeHtml(dateTimeLabel(snapshot.savedAt))}.</div>
          <div class="notice">${escapeHtml(snapshot.summary || "No summary available.")}</div>
          ${checkbox("sheet-auto-memory-confirm", "Restore this local memory point.", false)}
        ` : emptyState("That restore point is no longer available."),
        delete: snapshot ? `
          <div class="notice danger">Delete the restore point from ${escapeHtml(dateTimeLabel(snapshot.savedAt))}. Current app data will not be changed.</div>
          <div class="notice">${escapeHtml(snapshot.summary || "No summary available.")}</div>
          ${checkbox("sheet-auto-memory-confirm", "Delete this restore point.", false)}
        ` : emptyState("That restore point is no longer available."),
        clear: `
          <div class="notice danger">This clears ${snapshots.length} local restore point${snapshots.length === 1 ? "" : "s"}. Current app data will not be changed.</div>
          ${checkbox("sheet-auto-memory-confirm", "Clear all Auto Memory restore points.", false)}
        `
      };
      const primaryLabel = kind === "restore" ? "Restore" : kind === "delete" ? "Delete" : kind === "clear" ? "Clear All" : "Save Restore Point";
      const primaryClass = kind === "restore" || kind === "delete" || kind === "clear" ? "danger" : "primary";
      const primaryAction = kind === "list" ? "auto-memory-now" : "auto-memory-sheet-save";
      return `
        <div class="sheet-backdrop" data-action="sheet-close">
          <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="auto-memory-sheet-title" data-sheet-panel>
            <div class="sheet-head">
              <div>
                <h2 id="auto-memory-sheet-title">${escapeHtml(titles[kind] || "Auto Memory Vault")}</h2>
                <p class="page-kicker">${escapeHtml(helpers[kind] || "Review local restore points.")}</p>
              </div>
              <button class="button small" data-action="sheet-close" aria-label="Close">Close</button>
            </div>
            <div class="sheet-form">
              ${fields[kind] || fields.list}
            </div>
            <div class="sheet-actions">
              <button class="button" data-action="${kind === "list" ? "sheet-close" : "auto-memory-open"}">${kind === "list" ? "Close" : "Back"}</button>
              ${kind === "list" && snapshots.length ? `<button class="button danger" data-action="auto-memory-clear">Clear All</button>` : ""}
              ${kind === "list" && !settings.autoMemoryVaultEnabled ? "" : `<button class="button ${primaryClass}" data-action="${primaryAction}" data-kind="${escapeHtml(kind)}" data-id="${escapeHtml(sheet.snapshotId || "")}">${primaryLabel}</button>`}
            </div>
          </section>
        </div>
      `;

    function renderAiActionEditSheet(sheet) {
      const proposal = aiProposalById(sheet?.proposalId);
      const action = proposal?.proposedActions?.[Number(sheet?.actionIndex)];
      if (!proposal || !action || !aiProposalCanExecute(proposal)) return "";
      const fields = aiActionEditableFields(action);
      if (!fields.length) return "";
      const controls = fields.map(spec => {
        const id = `sheet-ai-action-${spec.field}`;
        const value = escapeHtml(spec.value || "");
        const control = spec.kind === "textarea"
          ? `<textarea class="textarea small" id="${id}">${value}</textarea>`
          : `<input class="input" id="${id}" type="${spec.kind === "date" ? "date" : "text"}" value="${value}">`;
        return sheetField(spec.label, control);
      }).join("");
      return `
        <div class="sheet-backdrop" data-action="sheet-close">
          <section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="ai-action-edit-title" data-sheet-panel>
            <div class="sheet-head">
              <div>

      const selected = validation.selected || [];
      const sourceQuickGrab = validation.sourceQuickGrab;

        <div class="sheet-backdrop" data-action="sheet-close">

              <div>
                <h2 id="ai-action-confirm-title">Save Selected AI Actions?</h2>

              <button class="button small" data-action="sheet-close" aria-label="Close">Close</button>

              </div>

              ${sourceQuickGrab ? checkbox("sheet-ai-action-convert-quickgrab", "Mark the original Quick Grab Converted after saving these actions.", true) : ""}

    function renderSheet() {
      if (!view.sheet) return "";
      if (view.sheet.type === "profile-action") return renderProfileActionSheet(view.sheet);
      if (view.sheet.type === "prayer-action") return renderPrayerActionSheet(view.sheet);
      if (view.sheet.type === "data-safety") return renderDataSafetySheet(view.sheet);
      if (view.sheet.type === "auto-memory") return renderAutoMemorySheet(view.sheet);
      if (view.sheet.type === "security") return renderSecuritySheet(view.sheet);
      if (view.sheet.type === "merge-person") return renderMergePersonSheet(view.sheet);
      if (view.sheet.type === "edit-field") return renderEditFieldSheet(view.sheet);
      if (view.sheet.type === "ai-action-edit") return renderAiActionEditSheet(view.sheet);
      if (view.sheet.type === "create-person") return renderCreatePersonSheet();
      if (view.sheet.type === "donor-update-builder") return renderDonorUpdateBuilderSheet(view.sheet);
      if (view.sheet.type === "ai-gate") return renderAiGateSheet(view.sheet);
      if (view.sheet.type === "ai-action-confirm") return renderAiActionConfirmSheet(view.sheet);
      return "";
    }

    function bindScreen() {
      document.querySelectorAll("[data-action]").forEach(el => {
        el.addEventListener("click", handleAction);
      });
      document.querySelectorAll("[data-setting-toggle]").forEach(input => {
        input.addEventListener("change", event => {
          updateSetting(event.target.dataset.settingToggle, event.target.checked);
        });
      });
      document.querySelectorAll("[data-setting-select]").forEach(select => {
        select.addEventListener("change", event => {
          updateSetting(event.target.dataset.settingSelect, event.target.value);
        });
      });
      document.querySelectorAll("[data-copy-key]").forEach(el => {
        el.addEventListener("click", event => {
          event.preventDefault();
          event.stopPropagation();
          editCopyText(el.dataset.copyKey, el.dataset.copyFallback || el.textContent.trim());
        });
      });
      document.querySelectorAll("[data-ai-action-select]").forEach(input => {
        input.addEventListener("change", event => {
          persistAiActionSelection(
            event.target.dataset.aiActionSelect,
            event.target.dataset.actionId,
            event.target.checked
          );
        });
      });
      restoreAutosaveDraft();
      document.querySelectorAll("input, textarea, select").forEach(el => {
        if (!isAutosaveField(el)) return;
        el.addEventListener("input", scheduleAutosave);
        el.addEventListener("change", scheduleAutosave);
      });
      document.querySelectorAll("#quick-tags .chip").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          button.classList.toggle("active");
          scheduleAutosave();
        });
      });
      document.querySelectorAll("#urgency-tags .chip").forEach(button => {
        button.addEventListener("click", event => {
          event.preventDefault();
          document.querySelectorAll("#urgency-tags .chip").forEach(item => item.classList.remove("active"));
          button.classList.add("active");
          scheduleAutosave();
        });
      });
      const peopleSearch = document.getElementById("people-search");
      if (peopleSearch) {
        peopleSearch.addEventListener("input", event => {
          view.search = event.target.value;
          saveCurrentDraftNow();
          render();
        });
      }
      const globalSearch = document.getElementById("global-search");
      if (globalSearch) {
        globalSearch.addEventListener("input", event => {
          view.globalSearch = event.target.value;
          saveCurrentDraftNow();
          render();
        });
        if (document.activeElement !== globalSearch) globalSearch.focus();
      }
      const personSelect = document.getElementById("person-select");
      if (personSelect) {
        personSelect.addEventListener("change", updateNewPersonFields);
        updateNewPersonFields();
      }
      const newPerson = document.getElementById("new-person-name");
      if (newPerson) {
        newPerson.addEventListener("input", updateDuplicateWarning);
        updateDuplicateWarning();
      }
      const quickText = document.getElementById("quick-text");
      if (quickText) {
        view.quickGrabDraftText = quickText.value;
        quickText.addEventListener("input", event => {
          view.quickGrabDraftText = event.target.value;
        });
      }
      const profilePhotoInput = document.getElementById("profile-photo-input");
      if (profilePhotoInput) {
        profilePhotoInput.addEventListener("change", event => {
          handleProfilePhotoUpload(event.target);
        });
      }
      const pinInput = document.getElementById("pin-input");
      if (pinInput) {
        pinInput.focus();
        pinInput.addEventListener("keydown", event => {
          if (event.key === "Enter") unlockApp();
        });
      }
      const vaultInput = document.getElementById("vault-passphrase");
      if (vaultInput) {
        vaultInput.focus();
        vaultInput.addEventListener("keydown", event => {
          if (event.key === "Enter") unlockVault();
        });
      }
      const sheetFirstField = document.querySelector("[data-sheet-panel] textarea, [data-sheet-panel] input, [data-sheet-panel] select");
      if (sheetFirstField && typeof sheetFirstField.focus === "function") sheetFirstField.focus();
      const sheetPersonName = document.getElementById("sheet-person-name");
      if (sheetPersonName) {
        sheetPersonName.addEventListener("input", updateCreatePersonDuplicateWarning);
        updateCreatePersonDuplicateWarning();
      }
    }

    function openProfileActionSheet(kind, personId) {
      if (!personById(personId)) return;
      view.sheet = { type: "profile-action", kind, personId };
      render();
    }

    function openPrayerActionSheet(kind, prayerId) {

      if (!db.prayerRequests.some(item => item.id === prayerId)) return;
      view.sheet = { type: "prayer-action", kind, prayerId };

      if (!["encrypted-export", "import", "reset-demo"].includes(kind)) return;
      view.sheet = { type: "data-safety", kind };
      render();

    function openAutoMemorySheet(kind = "list", snapshotId = "") {
      if (!["list", "restore", "delete", "clear"].includes(kind)) return;
      view.sheet = { type: "auto-memory", kind, snapshotId };
      render();

    function openSecuritySheet(kind) {

      view.sheet = { type: "security", kind };
      render();
    }

    function openMergePersonSheet(fromId, toId) {

      view.sheet = { type: "merge-person", fromId, toId };

      render();
    }

    function submitProfileActionSheet(kind, personId) {
      const person = personById(personId);
      if (!person) {
        closeSheet();
        return;
      }
      let message = "";
      if (kind === "note") {
        const content = document.getElementById("sheet-note-content")?.value.trim() || "";
        if (!content) {
          showToast("Add a note first.");
          return;
        }
        recordUndo("note");
        createProfileNoteRecord(personId, {
          content,
          sensitiveFlag: Boolean(document.getElementById("sheet-sensitive")?.checked)
        });
        message = "Note added.";
      }
      if (kind === "meeting") {
        const summary = document.getElementById("sheet-meeting-summary")?.value.trim() || "";
        const remember = document.getElementById("sheet-meeting-remember")?.value.trim() || "";
        if (!summary && !remember) {
          showToast("Add a meeting note first.");
          return;
        }
        recordUndo("meeting note");
        createProfileMeetingRecord(personId, {
          summary: summary || remember,
          whatToRemember: remember || summary,
          meetingDate: document.getElementById("sheet-meeting-date")?.value || todayISO(),
          meetingType: document.getElementById("sheet-meeting-type")?.value || (person.personType === "Donor" ? "Donor" : "Student"),
          sensitiveFlag: Boolean(document.getElementById("sheet-sensitive")?.checked)
        });
        message = "Meeting note added.";
      }
      if (kind === "prayer") {
        const request = document.getElementById("sheet-prayer-request")?.value.trim() || "";
        if (!request) {
          showToast("Add a prayer request first.");
          return;
        }
        const followUpDate = document.getElementById("sheet-prayer-follow-date")?.value || "";
        recordUndo("prayer request");
        createProfilePrayerRecord(personId, {
          request,
          followUpDate,
          shareableStatus: document.getElementById("sheet-prayer-shareable")?.value || settings.defaultShareableStatus,
          sensitiveFlag: Boolean(document.getElementById("sheet-sensitive")?.checked)
        });
        message = "Prayer request added.";
      }
      if (kind === "followup") {
        const title = document.getElementById("sheet-followup-title")?.value.trim() || "";
        if (!title) {
          showToast("Add a follow-up task first.");
          return;
        }
        recordUndo("follow-up task");
        createProfileFollowUpRecord(personId, {
          title,

    function aiActionSourceQuickGrabId(proposal, action = {}) {
      if (proposal?.sourceType === "quickGrab" && proposal.sourceId) return proposal.sourceId;
      return action.createdFromQuickGrabId || action.sourceQuickGrabId || "";

    function aiActionSourceQuickGrab(proposal, selected = []) {
      const sourceId = selected.map(item => aiActionSourceQuickGrabId(proposal, item.action)).find(Boolean)
        || (proposal?.sourceType === "quickGrab" ? proposal.sourceId : "");
      return sourceId ? db.quickGrabs.find(grab => grab.id === sourceId) || null : null;
    }

    function aiActionExistingPersonId(proposal, sourceQuickGrab, action = {}) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      const candidates = [
        action.relatedPersonId,
        action.personId,
        action.targetPersonId,
        result.possiblePersonId,
        sourceQuickGrab?.relatedPersonId
      ].filter(Boolean);
      return candidates.find(id => personById(id)) || "";
    }

    function aiActionPersonName(proposal, sourceQuickGrab, action = {}) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      return String(action.name || action.personName || result.possiblePersonName || sourceQuickGrab?.detectedPersonName || "").trim();
    }

    function aiBestDetectedPersonName(proposal, sourceQuickGrab, selected = []) {
      const result = proposal?.result && typeof proposal.result === "object" ? proposal.result : {};
      const candidates = [
        result.possiblePersonName,
        sourceQuickGrab?.detectedPersonName,
        proposal?.detectedPersonName,
        proposal?.title,
        proposal?.summary,
        sourceQuickGrab?.rawContent,
        ...selected.flatMap(item => [item.action?.name, item.action?.personName, item.action?.title, item.action?.label, item.action?.summary])
      ];
      for (const candidate of candidates) {
        const text = String(candidate || "").replace(/[“”"'.:,;!?()[\]{}]/g, " ").replace(/\s+/g, " ").trim();
        if (!text) continue;
        if (/^[A-Z][A-Za-z-]{1,}(?:\s+[A-Z][A-Za-z-]{1,}){0,2}$/.test(text)) return text;
        const match = text.match(/\b(?:with|for|about|text|call|email|meet|meeting with|check in with|follow up with|pray for)\s+([A-Z][A-Za-z-]{1,}(?:\s+[A-Z][A-Za-z-]{1,})?)\b/);
        if (match) return match[1].trim();
      }
      return "";
    }

      const newPersonName = document.getElementById("ai-confirm-new-person-name")?.value.trim() || "";

      if (selected) return { mode: "existing", existingPersonId: selected };
      return { mode: "", existingPersonId: "", newPersonName };
