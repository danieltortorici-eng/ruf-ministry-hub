<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RUF Ministry Hub</title>
  <link rel="canonical" href="./ruf-ministry-hub">
  <script>
    const legacyCaptureQueryKeys = [
      "quickgrab",
      "text",
      "note",
      "quickgrabCategory",
      "category",
      "tag",
      "tags",
      "quickgrabUrgency",
      "urgency"
    ];
    const redirectParams = new URLSearchParams(window.location.search);
    legacyCaptureQueryKeys.forEach(key => redirectParams.delete(key));
    const redirectSearch = redirectParams.toString();
    window.location.replace("./ruf-ministry-hub" + (redirectSearch ? "?" + redirectSearch : "") + window.location.hash);
  </script>
</head>
<body>
  <p><a href="./ruf-ministry-hub">Open RUF Ministry Hub</a></p>
</body>
</html>
